name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node — vitest + TS/Python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python — pytest, generator diff-check, lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev,figures]"
      - run: pytest
      - name: Redraw the figures and fail if a committed SVG differs
        run: python scripts/gen_figures.py --check
      - name: Regenerate equation artefacts and fail on any diff
        run: |
          python scripts/gen_equations.py
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: python scripts/mathlint.py
      - run: python scripts/modulelint.py
      - run: python scripts/privacy_scan.py
      - run: python scripts/refcheck.py
      - run: python scripts/resources_check.py

  spice:
    name: Simulator — cross-checked against ngspice
    # 24.04's ngspice (42) is the one the fixture was made with
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install ngspice (its XSPICE code models come with it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ngspice
          ngspice --version | head -3
      - name: Run every case again and compare with the committed fixture
        run: python3 scripts/spice_crosscheck.py --check

  refs-online:
    name: References — DOIs checked against Crossref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev]"
      - name: TEMPORARY - candidate pages for Dowell 1966 and Basso 2014 (removed in the next commit)
        run: |
          for d in 10.1036/9780071823463 10.1036/0071823468 10.1049/piee.1966.0236; do
            echo "== crossref $d"
            curl -sS -m 60 -A "switching-converter-study-linkcheck/1.0" "https://api.crossref.org/works/$d" | python -c "import json,sys; m=json.load(sys.stdin)['message']; print(m.get('title'), m.get('type'), m.get('publisher'), m.get('ISBN'), (m.get('resource') or {}).get('primary'))" || true
            echo "== doi.org $d"
            curl -sS -m 60 -o /dev/null -D - "https://doi.org/$d" | grep -iE '^(HTTP|location)' || true
          done
          echo "== cdx accessengineering prefix, HTTP 200"
          curl -sS -m 90 "https://web.archive.org/cdx/search/cdx?url=www.accessengineeringlibrary.com/content/book/9780071823463&matchType=prefix&filter=statuscode:200&output=json&fl=timestamp,original&limit=-8" || true
          echo
          echo "== cdx mhprofessional product.php for the ISBN"
          curl -sS -m 90 "https://web.archive.org/cdx/search/cdx?url=mhprofessional.com/product.php&matchType=prefix&filter=original:.*0071823468.*&output=json&fl=timestamp,original,statuscode&limit=-8" || true
          echo
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          import resources_check as rc
          from concurrent.futures import ThreadPoolExecutor
          B, D = "Switch-Mode Power Supplies", "Effects of eddy currents in transformer windings"
          cands = [
              ("dowell iet old", "https://digital-library.theiet.org/content/journals/10.1049/piee.1966.0236", D),
              ("dowell doi", "https://doi.org/10.1049/piee.1966.0236", D),
              ("basso mhp a", "https://www.mheducation.com/highered/mhp/product/switch-mode-power-supplies-second-edition-spice-simulations-practical-designs.html", B),
              ("basso mhp b", "https://www.mheducation.com/highered/mhp/product/switch-mode-power-supplies-second-edition-spice-simulations-and-practical-designs.html", B),
              ("basso mhp c", "https://www.mheducation.com/highered/mhp/product/switch-mode-power-supplies-second-edition.html", B),
              ("basso mhprof php", "http://www.mhprofessional.com/product.php?isbn=0071823468", B),
              ("basso mhprof a", "https://www.mhprofessional.com/9780071823463-usa-switch-mode-power-supplies-second-edition-spice-simulations-and-practical-designs-group", B),
              ("basso mhprof b", "https://www.mhprofessional.com/switch-mode-power-supplies-second-edition-spice-simulations-and-practical-designs-9780071823463-usa", B),
              ("basso doi", "https://doi.org/10.1036/9780071823463", B),
              ("basso apple", "https://books.apple.com/us/book/switch-mode-power-supplies-second-edition/id853966605", B),
              ("basso oreilly", "https://www.oreilly.com/library/view/switch-mode-power-supplies/9780071823463/", B),
              ("basso gbooks", "https://books.google.com/books?vid=ISBN9780071823463", B),
          ]
          ts = [{"src": k, "url": u, "expect": e, "kind": "html", "quotes": []} for k, u, e in cands]
          with ThreadPoolExecutor(max_workers=6) as pool:
              for t, (s, d) in zip(ts, pool.map(rc.check_online, ts)):
                  print(f"{s:14s} {t['src']:18s} {t['url']}\n      {d[:700]}", flush=True)
          EOF
      - run: python scripts/refcheck.py --online

  urls-online:
    name: Resources — every URL opened and title-matched
    runs-on: ubuntu-latest
    # a host that turns the runner away costs minutes of retries and archive lookups (six URLs run at a time)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev]"
      - run: python scripts/resources_check.py --online

  site:
    name: Site — strict KaTeX build + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Every internal #fragment link lands on an element id
        run: python3 scripts/anchorcheck.py dist
      - name: Keyboard focus order of the tool pages (headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          node scripts/keyboard_check.mjs
      - name: The operating-mode drawing's real text boxes (headless Chromium)
        run: node scripts/seq_check.mjs
      - name: Mirror dist/ under the Pages base path for link checking
        run: |
          rm -rf _linkcheck
          mkdir -p _linkcheck
          cp -r dist _linkcheck/switching_converter_study
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/_linkcheck
            _linkcheck
          fail: true
