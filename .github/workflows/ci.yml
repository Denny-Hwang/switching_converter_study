name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node — vitest + TS/Python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python — pytest, generator diff-check, lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev]"
      - run: pytest
      - name: Regenerate equation artefacts and fail on any diff
        run: |
          python scripts/gen_equations.py
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: python scripts/mathlint.py
      - run: python scripts/modulelint.py
      - run: python scripts/privacy_scan.py
      - run: python scripts/refcheck.py
      - run: python scripts/resources_check.py

  refs-online:
    name: References — DOIs checked against Crossref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev]"
      - run: python scripts/refcheck.py --online

  urls-online:
    name: Resources — every URL opened and title-matched
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev]"
      - run: python scripts/resources_check.py --online

  site:
    name: Site — strict KaTeX build + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Every internal #fragment link lands on an element id
        run: python3 scripts/anchorcheck.py dist
      - name: Keyboard focus order of the tool pages (headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          node scripts/keyboard_check.mjs
      - name: Mirror dist/ under the Pages base path for link checking
        run: |
          rm -rf _linkcheck
          mkdir -p _linkcheck
          cp -r dist _linkcheck/switching_converter_study
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/_linkcheck
            _linkcheck
          fail: true
