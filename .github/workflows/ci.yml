name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node — vitest + TS/Python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python — pytest, generator diff-check, lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev,figures]"
      - run: pytest
      - name: Redraw the figures and fail if a committed SVG differs
        run: python scripts/gen_figures.py --check
      - name: Regenerate equation artefacts and fail on any diff
        run: |
          python scripts/gen_equations.py
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: python scripts/mathlint.py
      - run: python scripts/modulelint.py
      - run: python scripts/privacy_scan.py
      - run: python scripts/refcheck.py
      - run: python scripts/resources_check.py

  spice:
    name: Simulator — cross-checked against ngspice
    # 24.04's ngspice (42) is the one the fixture was made with
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install ngspice (its XSPICE code models come with it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ngspice
          ngspice --version | head -3
      - name: Run every case again and compare with the committed fixture
        run: python3 scripts/spice_crosscheck.py --check

  refs-online:
    name: References — DOIs checked against Crossref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev]"
      - name: TEMPORARY - archive captures of candidate URLs for Dowell 1966 and Basso 2014 (removed in the next commit)
        run: |
          q() { echo "== $1"; curl -sS -m 90 "https://web.archive.org/cdx/search/cdx?$1&output=json&fl=timestamp,original,statuscode,mimetype&limit=-4" || true; echo; sleep 3; }
          q "url=ieeexplore.ieee.org/document/5247417"
          q "url=ieeexplore.ieee.org/document/5247417/"
          q "url=digital-library.theiet.org/doi/10.1049/piee.1966.0236"
          q "url=digital-library.theiet.org/doi/abs/10.1049/piee.1966.0236"
          q "url=digital-library.theiet.org/content/journals/10.1049/piee.1966.0236"
          q "url=www.accessengineeringlibrary.com/content/book/9780071823463"
          q "url=mhprofessional.com&matchType=domain&filter=original:.*9780071823463.*"
          q "url=mheducation.com&matchType=domain&filter=original:.*9780071823463.*"
          q "url=openlibrary.org/isbn/9780071823463"
          curl -sS -m 30 -o /dev/null -w "openlibrary live: %{http_code} %{url_effective}\n" -L "https://openlibrary.org/isbn/9780071823463" || true
      - run: python scripts/refcheck.py --online

  urls-online:
    name: Resources — every URL opened and title-matched
    runs-on: ubuntu-latest
    # a host that turns the runner away costs minutes of retries and archive lookups (six URLs run at a time)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev]"
      - run: python scripts/resources_check.py --online

  site:
    name: Site — strict KaTeX build + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Every internal #fragment link lands on an element id
        run: python3 scripts/anchorcheck.py dist
      - name: Keyboard focus order of the tool pages (headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          node scripts/keyboard_check.mjs
      - name: The operating-mode drawing's real text boxes (headless Chromium)
        run: node scripts/seq_check.mjs
      - name: Mirror dist/ under the Pages base path for link checking
        run: |
          rm -rf _linkcheck
          mkdir -p _linkcheck
          cp -r dist _linkcheck/switching_converter_study
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/_linkcheck
            _linkcheck
          fail: true
