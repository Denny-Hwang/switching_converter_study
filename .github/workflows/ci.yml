name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node — vitest + TS/Python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python — pytest, generator diff-check, lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev,figures]"
      - run: pytest
      - name: Redraw the figures and fail if a committed SVG differs
        run: python scripts/gen_figures.py --check
      - name: Regenerate equation artefacts and fail on any diff
        run: |
          python scripts/gen_equations.py
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: python scripts/mathlint.py
      - run: python scripts/modulelint.py
      - run: python scripts/privacy_scan.py
      - run: python scripts/refcheck.py
      - run: python scripts/resources_check.py
      - name: The CircuitJS1 circuits (sim/falstad) - current, and wired as the SPICE netlists
        run: python scripts/falstad_library.py --check

  spice:
    name: Simulator — cross-checked against ngspice
    # 24.04's ngspice (42) is the one the fixture and sim/results.json were made with
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install ngspice (its XSPICE code models come with it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ngspice
          ngspice --version | head -3
      - run: pip install -e "python[figures]"
      - name: Run every case again and compare with the committed fixture
        run: python scripts/spice_crosscheck.py --check
      - name: The SPICE library (sim/) - schematics against netlists, ngspice against results.json and the equations
        run: python scripts/sim_library.py --check

  refs-online:
    name: References — DOIs checked against Crossref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev]"
      - run: python scripts/refcheck.py --online

  urls-online:
    name: Resources — every URL opened and title-matched
    runs-on: ubuntu-latest
    # a host that turns the runner away costs minutes of retries and archive lookups (six URLs run at a time)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python[dev]"
      - run: python scripts/resources_check.py --online

  falstad:
    name: Falstad — the circuits run in CircuitJS1 on falstad.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Open every share link, run it and compare its last periods with the ideal equations
        run: node scripts/falstad_check.mjs

  site:
    name: Site — strict KaTeX build + link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Every internal #fragment link lands on an element id
        run: python3 scripts/anchorcheck.py dist
      - name: Keyboard focus order of the tool pages (headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          node scripts/keyboard_check.mjs
      - name: The operating-mode drawing's real text boxes (headless Chromium)
        run: node scripts/seq_check.mjs
      - name: Mirror dist/ under the Pages base path for link checking
        run: |
          rm -rf _linkcheck
          mkdir -p _linkcheck
          cp -r dist _linkcheck/switching_converter_study
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/_linkcheck
            _linkcheck
          fail: true
