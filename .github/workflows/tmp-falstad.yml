name: TEMPORARY - CircuitJS1's own converter examples and JS interface (removed before the pull request merges)
on:
  push:
    branches: [claude/blissful-einstein-r71bmd]
    paths: ['.github/workflows/tmp-falstad.yml']
permissions:
  contents: read
jobs:
  falstad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: The example list
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for u in https://www.falstad.com/circuit/setuplist.txt https://www.falstad.com/circuit/circuitjs1/setuplist.txt https://www.falstad.com/circuit/war/setuplist.txt; do
            code=$(curl -sSL -A "$UA" -o list.txt -w "%{http_code}" "$u"); echo "$code $u"; if [ "$code" = 200 ]; then cp list.txt setuplist.txt; fi
          done
          wc -l setuplist.txt || true
          grep -n -i -E "buck|boost|flyback|forward|convert|smps|switch|regul|step|dc-dc|chopper|induct|transformer|mosfet|pwm|supply" setuplist.txt | head -80 || true
      - run: npm ci
      - run: npx playwright install --with-deps chromium >/dev/null
      - name: CircuitJS1 in headless Chromium - its interface and the converter examples as it exports them
        run: |
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright';
          import { readFileSync, existsSync } from 'node:fs';
          const list = existsSync('setuplist.txt') ? readFileSync('setuplist.txt', 'utf8') : '';
          const files = [...new Set(list.split('\n').filter((l) => /buck|boost|flyback|forward|step-?down|step-?up|switching|smps|regulator|dc-dc|chopper|transformer/i.test(l)).map((l) => l.trim().split(/\s+/)[0]).filter((f) => f.endsWith('.txt')))].slice(0, 12);
          console.log('files:', files);
          const browser = await chromium.launch();
          const page = await browser.newPage();
          page.on('console', (m) => { if (m.type() === 'error') console.log('console error:', m.text().slice(0, 200)); });
          for (const f of files.length ? files : ['']) {
            const url = 'https://www.falstad.com/circuit/circuitjs.html' + (f ? `?startCircuit=${f}` : '');
            await page.goto(url, { waitUntil: 'load', timeout: 60000 });
            await page.waitForFunction(() => window.CircuitJS1 !== undefined, null, { timeout: 60000 });
            await page.waitForTimeout(3000);
            const info = await page.evaluate(() => {
              const s = window.CircuitJS1;
              const keys = Object.keys(s);
              const text = typeof s.exportCircuit === 'function' ? s.exportCircuit() : '(no exportCircuit)';
              const elms = s.getElements().map((e) => `${e.getType()} posts=${e.getPostCount()}`);
              return { keys, text, elms, t: s.getTime() };
            });
            console.log(`===== ${f || '(default circuit)'} time=${info.t}`);
            console.log('interface:', info.keys.join(' '));
            console.log('elements:', info.elms.join(' | '));
            console.log(info.text);
          }
          await browser.close();
          JS
          node probe.mjs
