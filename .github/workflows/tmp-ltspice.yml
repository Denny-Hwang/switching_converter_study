name: TEMPORARY - LTspice on the library's schematics (removed before the pull request merges)
on:
  push:
    branches: [claude/blissful-einstein-r71bmd]
permissions:
  contents: read
jobs:
  ltspice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install wine, LTspice and spicelib
        run: |
          curl -sSL --retry 3 -A "Mozilla/5.0 (X11; Linux x86_64)" -o lt.msi https://ltspice.analog.com/software/LTspice64.msi
          sha256sum lt.msi
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 wine xvfb xdotool >/dev/null 2>&1 || sudo apt-get install -y -qq wine xvfb xdotool
          pip install -q spicelib==1.6.3 PyYAML==6.0.3
          export WINEDEBUG=-all
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 2
          DISPLAY=:99 wine msiexec /i lt.msi /qn; echo "msiexec exit $?"
      - name: Where LTspice keeps its answer to the usage-data question
        run: |
          sudo apt-get install -y -qq msitools binutils >/dev/null
          mkdir -p lt && (cd lt && msiextract ../lt.msi >/dev/null)
          X="lt/APPDIR:./LTspice.exe"
          echo "== 16-bit strings"; strings -e l "$X" | grep -n -i -E "usage|telemetr|anonym|consent|analytic" | head -40
          echo "== 8-bit strings"; strings "$X" | grep -n -i -E "usagedata|telemetr|anonym|consent" | head -40
      - name: Netlist and simulate every schematic with LTspice
        run: |
          export WINEDEBUG=-all DISPLAY=:99
          pgrep Xvfb >/dev/null || (Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &) ; sleep 1
          EXE="$HOME/.wine/drive_c/Program Files/ADI/LTspice/LTspice.exe"
          # LTspice asks once whether to share usage data. There is no window manager, so give the
          # dialog the input focus itself, then decline: Escape, else Alt+N
          ( n=0; while true; do
              for w in $(xdotool search --name "Share LTspice Usage" 2>/dev/null); do
                n=$((n+1))
                echo "dialog $w (try $n): $(xdotool getwindowgeometry $w 2>/dev/null | tr '\n' ' ')"
                [ $n -eq 1 ] && (import -window root "$GITHUB_WORKSPACE/first-dialog.png" 2>/dev/null || true)
                xdotool windowfocus --sync $w 2>/dev/null || true
                if [ $n -le 2 ]; then xdotool key --clearmodifiers Escape; else xdotool key --clearmodifiers alt+n; fi
              done
              sleep 2
            done ) &
          mkdir -p work && cp sim/ltspice/*/*.asc work/
          cd work
          for f in *.asc; do
            # an uncompressed waveform file for the comparison (not in the committed schematic)
            printf 'TEXT -32 2000 Left 2 !.options plotwinsize=0\n' >> "$f"
            timeout 180 wine "$EXE" -netlist "$f" || echo "netlist $f: exit $?"
            timeout 900 wine "$EXE" -b "$f" || echo "batch $f: exit $?"
          done
          ls -la
          for f in *.net; do echo "===== $f"; tr -d '\r' < "$f"; done
          for f in *.log; do echo "===== $f"; tr -d '\r\000' < "$f" | head -40; done
          for f in $(find "$HOME/.wine/drive_c/users" -iname "*.ini" 2>/dev/null | head -4); do echo "===== $f"; tr -d '\r' < "$f" | head -80; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ltspice-dialog
          path: first-dialog.png
          if-no-files-found: ignore
      - name: Compare LTspice with the ngspice netlists and results.json
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from spicelib import RawRead
          res = json.loads(Path("sim/results.json").read_text())
          worst = 0.0
          for cid, rec in res["cases"].items():
              topo = rec["topology"]
              cir = Path(f"sim/ngspice/{topo}/{cid}.cir").read_text()
              want = sorted(l.split(";")[0].strip() for l in cir.splitlines() if re.match(r"^[VSDLCRK]\w*\s", l))
              net = Path(f"work/{cid}.net")
              if net.exists():
                  got = sorted(l.strip() for l in net.read_text(errors="replace").splitlines() if re.match(r"^[VSDLCRK]\w*\s", l))
                  print(f"{cid}: LTspice's netlist {'matches' if got == want else 'DIFFERS FROM'} the .cir's parts")
                  if got != want:
                      print("   only LTspice:", sorted(set(got) - set(want)))
                      print("   only .cir:  ", sorted(set(want) - set(got)))
              else:
                  print(f"{cid}: no .net")
              raw = Path(f"work/{cid}.raw")
              if not raw.exists():
                  print(f"{cid}: no .raw"); continue
              r = RawRead(str(raw))
              t = [abs(x) for x in r.get_trace("time").get_wave()]
              names = {n.lower(): n for n in r.get_trace_names()}
              fs = rec["params"]["fs"]; cyc = rec["cycles"]; Ts = 1 / fs
              t0, t1 = (cyc - 1) * Ts, cyc * Ts
              def trace(expr):
                  total = None
                  for term in expr.split("+"):
                      k, name = (1.0, term)
                      if "*" in term:
                          a, name = term.split("*"); k = float(a)
                      w = r.get_trace(names[name.lower()]).get_wave()
                      total = [k * x for x in w] if total is None else [s + k * x for s, x in zip(total, w)]
                  return total
              idx = [i for i, x in enumerate(t) if t0 <= x <= t1]
              for q, meta in rec["quantities"].items():
                  y = trace(meta["ltspice"])
                  tt = [t[i] for i in idx]; yy = [y[i] for i in idx]
                  avg = sum((yy[i] + yy[i + 1]) / 2 * (tt[i + 1] - tt[i]) for i in range(len(tt) - 1)) / (tt[-1] - tt[0])
                  lt = {"avg": avg, "max": max(yy), "min": min(yy)}
                  scale = max(abs(rec["values"][f"{q}_max"]), abs(rec["values"][f"{q}_min"]), 1e-12)
                  for fn, v in lt.items():
                      ng = rec["values"][f"{q}_{fn}"]
                      rel = abs(v - ng) / scale
                      worst = max(worst, rel)
                      print(f"   {cid:14s} {q:8s} {fn}: LTspice {v:11.5g}  ngspice {ng:11.5g}  diff {rel:.3%} of {scale:.4g}")
          print(f"largest difference: {worst:.3%} of the quantity's scale")
          PY
