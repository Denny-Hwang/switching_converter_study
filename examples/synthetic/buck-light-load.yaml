synthetic: true
label: "Buck example at light load"
label_ko: "경부하 벅 예제"
params:
  V_g: 24
  D: 0.5
  f_s: 1.0e5
  L: 1.0e-4
  R: 100
  C: 1.0e-5
steps:
  - def.Ts
  - K.def
  - Kcrit.buck
  - L.crit
  - {eq: buck.ccm.M, as: M_ccm}
  - {eq: buck.dcm.M, as: M_dcm}
  - {eq: buck.dcm.D2, bind: {M: M_dcm}}
  - {eq: def.V, bind: {M: M_dcm}, as: V_dcm}
checks:
  - {when: "K > K_crit", then: {en: "CCM", ko: "CCM"}, else: {en: "DCM", ko: "DCM"}}
