synthetic: true
label: "Flyback example in CCM, ideal diode"
label_ko: "CCM 플라이백 예제, 이상적 다이오드"
params:
  V_g: 48
  n: 0.25
  D: 0.4
  f_s: 1.0e5
  L_M: 2.0e-4
  R: 5
  V_D: 0
  C: 1.0e-4
steps:
  - def.Ts
  - flyback.ccm.M
  - def.V
  - {eq: K.def, bind: {L: L_M}}
  - Kcrit.flyback
  - L.crit
  - flyback.Vds_off
  - flyback.diode.VR
  - util.buckboost
checks:
  - {when: "K > K_crit", then: {en: "CCM", ko: "CCM"}, else: {en: "DCM", ko: "DCM"}}
