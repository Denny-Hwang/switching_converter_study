synthetic: true
label: "Forward converter example"
label_ko: "포워드 컨버터 예제"
params:
  V_g: 48
  n: 0.5
  n_r: 1
  D: 0.4
  f_s: 1.0e5
  L: 1.0e-4
  R: 5
  C: 1.0e-4
  L_M: 1.0e-3
steps:
  - def.Ts
  - forward.reset.Dmax
  - forward.ccm.M
  - def.V
  - forward.Vds
  - forward.ripple.iL
  - buck.IL
