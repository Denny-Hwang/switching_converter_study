synthetic: true
label: "Piezoelectric interfaces example"
label_ko: "압전 인터페이스 예제"
# The source of piezo-source.yaml behind three interfaces: a full-wave bridge onto V_DC (the standard
# interface), SECE, and parallel SSHI with an inversion that keeps 80 % of the voltage.
params:
  I_p: 1.0e-4
  omega: 1000
  C_0: 5.0e-8
  V_DC: 1.5
  gamma: 0.8
steps:
  - piezo.Vp
  - {eq: piezo.P_std, as: P_std}
  - piezo.P_std_max
  - {eq: piezo.P_sece, as: P_sece}
  - piezo.P_sshi_max
checks:
  - {when: "V_DC < V_p", then: {en: "the bridge conducts", ko: "브리지가 도통함"}, else: {en: "the bridge never conducts", ko: "브리지가 도통하지 않음"}}
