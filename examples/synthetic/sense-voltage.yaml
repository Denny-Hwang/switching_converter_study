synthetic: true
label: "Synthetic sense chain with a fixed-gain voltage-output amplifier and a Kelvin-connected shunt (round numbers, not a real design)"
label_ko: "고정 이득 전압 출력형 증폭기와 켈빈 연결 션트를 쓰는 합성 센스 체인 (단순한 어림수이며 실제 설계가 아님)"
# SenseChain preset: I_SENSE is the largest current; the shunt is Kelvin-connected (R_pad = 0).
params:
  I_SENSE: 5
  I_min: 0.5
  R_SENSE: 0.005
  R_pad: 0
  G_sense: 100
  V_REF: 0
  V_OS: 2.0e-5
  V_OUTmin: 0.01
  V_OUTmax: 3.2
  V_FS: 3.3
  f_samp: 2.0e4
  R_f: 100
  C_f: 1.0e-6
  eps_max: 0.01
steps:
  - sense.burden
  - sense.voltage_out_monitor
  - sense.reading
  - {eq: sense.voltage_out_monitor, bind: {I_SENSE: I_meas}, as: V_OUThi}
  - sense.offset_current
  - {eq: sense.rel_error, bind: {I_SENSE: I_min}}
  - rc.fc
  - adc.nyquist
  - {eq: rc.gain, bind: {f: f_N}}
checks:
  - {when: "eps_I <= eps_max", then: {en: "At I_min the reading meets the error target", ko: "I_min에서 측정값이 오차 목표를 만족함"}, else: {en: "At I_min the reading misses the error target", ko: "I_min에서 측정값이 오차 목표를 넘음"}}
  - {when: "f_c < f_N", then: {en: "The filter's corner lies below the Nyquist frequency", ko: "필터의 차단 주파수가 나이퀴스트 주파수보다 낮음"}, else: {en: "The filter's corner is not below the Nyquist frequency", ko: "필터의 차단 주파수가 나이퀴스트 주파수보다 낮지 않음"}}
