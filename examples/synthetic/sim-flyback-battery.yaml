synthetic: true
label: "Example flyback charging a battery in DCM"
label_ko: "DCM으로 배터리를 충전하는 플라이백 예제"
# In DCM the magnetizing inductance stores the same energy every period,
# whatever the battery's voltage: the battery (and the diode) take the power
# the converter draws.
params:
  V_g: 48
  n: 0.25
  D: 0.3
  f_s: 1.0e5
  L_M: 2.0e-5
  V_D: 0.5
  C: 1.0e-4
  V_b: 12
  R_b: 0.05
steps:
  - def.Ts
  - flyback.Ipk.dcm
  - dcm.P_in
