synthetic: true
label: "Example linear source feeding a fixed-duty-ratio DCM flyback"
label_ko: "고정 듀티비 DCM 플라이백에 연결된 선형 전원 예제"
# Source-matcher preset: the flyback of flyback-source.yaml at a lower source amplitude,
# where it is a loss-free resistor matched to the source (R_in = R_s).
params:
  V_oc: 150
  R_s: 1.0e4
  L_M: 2.0e-2
  f_s: 1.0e4
  D: 0.2
  V: 5
  V_D: 0.5
  n: 0.1
  V_rating: 400
  C_bus: 1.0e-5
steps:
  - lfr.R_in
  - lfr.Vg
  - lfr.eta
  - src.Pmax
  - flyback.V_crit
  - flyback.Vds_off
checks:
  - {when: "V_g < V_gcrit", then: {en: "DCM: the flyback is a loss-free resistor", ko: "DCM: 플라이백은 무손실 저항"}, else: {en: "CCM: the flyback holds its input at V_g,crit", ko: "CCM: 플라이백이 입력을 V_g,crit에 묶음"}}
