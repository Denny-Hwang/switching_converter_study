  E_lk: {latex: "E_\\mathrm{lk}", unit: "J", desc: "energy stored in the leakage inductance at turn-off", meaning: "leakage energy per turn-off", meaning_ko: "턴오프마다의 누설 에너지", range: [1.0e-9, 1.0e-2], scale: log}
  P_lk: {latex: "P_\\mathrm{lk}", unit: "W", desc: "leakage energy per cycle times switching frequency", meaning: "leakage energy times f_s", meaning_ko: "누설 에너지 × 스위칭 주파수"}
  V_OR: {latex: "V_\\mathrm{OR}", unit: "V", desc: "output voltage reflected to the primary while the output diode conducts", meaning: "output voltage reflected to the primary", meaning_ko: "1차로 반사된 출력 전압(reflected voltage)", range: [1, 400], scale: log}
