  C_snub: {latex: "C_\\mathrm{snub}", unit: "F", desc: "capacitance of an RC snubber", meaning: "snubber capacitance", meaning_ko: "스너버 커패시턴스", range: [1.0e-12, 1.0e-7], scale: log}
  zeta: {latex: "\\zeta", unit: "1", desc: "damping factor of the parasitic inductance, the snubber resistor and the snubber capacitor in series (AN11160's definition)", meaning: "damping factor", meaning_ko: "감쇠 계수(damping factor)", range: [0.1, 2]}
  V_snub: {latex: "V_\\mathrm{snub}", unit: "V", desc: "voltage the snubbed node swings through at each switching edge", meaning: "voltage swing at each edge", meaning_ko: "스위칭 에지마다의 전압 변화폭", range: [1, 1000], scale: log}
  L_app: {latex: "L_\\mathrm{app}", unit: "H", desc: "inductance an impedance meter reads (the reactance over ω)", meaning: "inductance the meter reads", meaning_ko: "측정기가 읽는 인덕턴스"}
  V_ratio: {latex: "V_2/V_1", unit: "1", desc: "ratio of the open secondary's voltage to the voltage applied to the primary", meaning: "open-circuit voltage ratio", meaning_ko: "개방 전압비(open-circuit voltage ratio)"}
  I_ring: {latex: "I_\\mathrm{ring}", unit: "A", desc: "current in the parasitic inductance when the ring starts (for a diode, its peak reverse-recovery current; I_RM in AN11160)", meaning: "current when the ring starts", meaning_ko: "링잉이 시작될 때의 전류", range: [0.01, 100], scale: log}
  P_Rsnub: {latex: "P_{R,\\mathrm{snub}}", unit: "W", desc: "power dissipated in the snubber resistor", meaning: "dissipation in the snubber resistor", meaning_ko: "스너버 저항의 소산 전력"}
  # --- 06-bench: layout, gate drive, probes, protection ---------------------------------
  L_loop: {latex: "L_\\mathrm{loop}", unit: "H", desc: "inductance of the loop a switched current flows around (traces, vias, component leads)", meaning: "loop inductance", meaning_ko: "루프 인덕턴스(loop inductance)", range: [1.0e-10, 1.0e-7], scale: log}
  Delta_I: {latex: "\\Delta I", unit: "A", desc: "change of the current in the loop over a switching edge", meaning: "current change over the edge", meaning_ko: "에지 동안의 전류 변화", range: [0.1, 100], scale: log}
  t_edge: {latex: "t_\\mathrm{edge}", unit: "s", desc: "duration of the current's switching edge (its rise or fall)", meaning: "edge duration", meaning_ko: "에지 지속 시간", range: [1.0e-9, 1.0e-6], scale: log}
  V_spike: {latex: "V_\\mathrm{spike}", unit: "V", desc: "voltage the loop inductance develops during the edge", meaning: "voltage across the loop inductance", meaning_ko: "루프 인덕턴스에 걸리는 전압"}
  Q_boot: {latex: "Q_\\mathrm{boot}", unit: "C", desc: "charge the bootstrap capacitor supplies while the high-side switch is on: the gate charge, and the leakage and quiescent currents times the on-time", meaning: "charge drawn from the bootstrap capacitor", meaning_ko: "부트스트랩 커패시터에서 빠져나가는 전하", range: [1.0e-9, 1.0e-6], scale: log}
  Delta_V_boot: {latex: "\\Delta V_\\mathrm{boot}", unit: "V", desc: "droop allowed across the bootstrap capacitor while it supplies that charge", meaning: "allowed bootstrap droop", meaning_ko: "허용하는 부트스트랩 전압 강하", range: [0.05, 2], scale: log}
  C_boot: {latex: "C_\\mathrm{boot}", unit: "F", desc: "bootstrap capacitance", meaning: "bootstrap capacitance", meaning_ko: "부트스트랩 커패시턴스"}
  BW: {latex: "f_\\mathrm{BW}", unit: "Hz", desc: "-3 dB bandwidth of a measurement system (probe and oscilloscope)", meaning: "-3 dB bandwidth", meaning_ko: "-3 dB 대역폭(bandwidth)", range: [1.0e6, 1.0e10], scale: log}
  t_rise: {latex: "t_\\mathrm{rise}", unit: "s", desc: "10-90 % rise time of a step response", meaning: "10-90 % rise time", meaning_ko: "10-90 % 상승 시간(rise time)"}
  R_ser: {latex: "R_\\mathrm{ser}", unit: "Ω", desc: "total resistance in series with a charging capacitor: the source's, the wiring's and the capacitor's ESR", meaning: "series resistance of the charging path", meaning_ko: "충전 경로의 직렬 저항", range: [1.0e-3, 100], scale: log}
  C_in: {latex: "C_\\mathrm{in}", unit: "F", desc: "input capacitance charged when the supply is switched on", meaning: "input capacitance", meaning_ko: "입력 커패시턴스", range: [1.0e-7, 1.0e-2], scale: log}
  I_inrush: {latex: "I_\\mathrm{inrush}", unit: "A", desc: "peak of the inrush current", meaning: "peak inrush current", meaning_ko: "돌입 전류(inrush) 최댓값"}
  I_ramp: {latex: "I_\\mathrm{ramp}", unit: "A", desc: "current into a capacitor whose voltage is ramped linearly", meaning: "current of a controlled ramp", meaning_ko: "램프 제어 시 전류"}
  L_gnd: {latex: "L_\\mathrm{gnd}", unit: "H", desc: "inductance of the loop a probe's tip and ground lead form", meaning: "probe ground-loop inductance", meaning_ko: "프로브 접지 루프 인덕턴스", range: [1.0e-9, 1.0e-6], scale: log}
  C_probe: {latex: "C_\\mathrm{probe}", unit: "F", desc: "a probe's input capacitance at its tip", meaning: "probe input capacitance", meaning_ko: "프로브 입력 커패시턴스", range: [1.0e-12, 1.0e-10], scale: log}
  f_probe: {latex: "f_\\mathrm{probe}", unit: "Hz", desc: "ringing frequency of a probe's ground loop with its input capacitance", meaning: "probe ringing frequency", meaning_ko: "프로브 링잉 주파수"}
  t_ramp: {latex: "t_\\mathrm{ramp}", unit: "s", desc: "time a controlled voltage takes to ramp linearly from zero to its final value", meaning: "ramp time", meaning_ko: "램프 시간(ramp time)", range: [1.0e-5, 1.0e-1], scale: log}
  I2t: {latex: "I^2 t", unit: "A²s", desc: "joule integral of a current pulse: the integral of the current squared over the pulse", meaning: "joule integral of the pulse", meaning_ko: "펄스의 줄 적분(I²t)"}
  V_pl: {latex: "V_\\mathrm{pl}", unit: "V", desc: "gate-source voltage on the Miller plateau, read from the gate-charge curve at the operating drain current", meaning: "Miller plateau voltage", meaning_ko: "밀러 플래토(Miller plateau) 전압", range: [2, 8]}
  R_G: {latex: "R_G", unit: "Ω", desc: "total resistance of the gate loop: the driver's output, the external resistor and the device's internal gate resistance", meaning: "gate-loop resistance", meaning_ko: "게이트 루프 저항", range: [0.5, 50], scale: log}
  I_G: {latex: "I_G", unit: "A", desc: "gate current while the gate voltage sits on the plateau", meaning: "gate current on the plateau", meaning_ko: "플래토 동안의 게이트 전류", range: [0.01, 10], scale: log}
  Q_GD: {latex: "Q_\\mathrm{GD}", unit: "C", desc: "gate-drain charge: the charge the gate takes along the plateau of the gate-charge curve", meaning: "gate-drain (Miller) charge", meaning_ko: "게이트-드레인(밀러) 전하", range: [1.0e-10, 1.0e-7], scale: log}
  t_pl: {latex: "t_\\mathrm{pl}", unit: "s", desc: "time the gate spends on the plateau, while the drain voltage makes its transition", meaning: "time on the plateau", meaning_ko: "플래토에 머무는 시간"}
  T_J: {latex: "T_J", unit: "°C", desc: "junction temperature of a semiconductor", meaning: "junction temperature", meaning_ko: "접합 온도(junction temperature)"}
  T_A: {latex: "T_A", unit: "°C", desc: "ambient temperature", meaning: "ambient temperature", meaning_ko: "주위 온도(ambient temperature)", range: [-40, 85]}
  T_T: {latex: "T_T", unit: "°C", desc: "temperature measured at the top of the package", meaning: "package-top temperature", meaning_ko: "패키지 윗면 온도", range: [-40, 150]}
  P_D: {latex: "P_D", unit: "W", desc: "power the device dissipates", meaning: "dissipated power", meaning_ko: "소산 전력", range: [0.01, 100], scale: log}
  theta_JC: {latex: "\\theta_\\mathrm{JC}", unit: "K/W", desc: "junction-to-case thermal resistance", meaning: "junction-to-case thermal resistance", meaning_ko: "접합-케이스 열저항", range: [0.1, 10], scale: log}
  theta_CS: {latex: "\\theta_\\mathrm{CS}", unit: "K/W", desc: "case-to-heat-sink thermal resistance (the interface: pad, grease, insulator)", meaning: "case-to-sink thermal resistance", meaning_ko: "케이스-방열판 열저항", range: [0.05, 5], scale: log}
  theta_SA: {latex: "\\theta_\\mathrm{SA}", unit: "K/W", desc: "heat-sink-to-ambient thermal resistance", meaning: "sink-to-ambient thermal resistance", meaning_ko: "방열판-주위 열저항", range: [0.5, 100], scale: log}
  Psi_JT: {latex: "\\Psi_\\mathrm{JT}", unit: "K/W", desc: "junction-to-top characterization parameter: the junction's rise above the package top per watt of the device's power", meaning: "junction-to-top characterization parameter", meaning_ko: "접합-윗면 특성 파라미터", range: [0.1, 20], scale: log}

  # --- piezoelectric source and harvesting envelopes (07-harvesting) --------
  I_p: {latex: "I_p", unit: "A", desc: "amplitude of the current a vibrating piezoelectric element drives: its force factor times the velocity amplitude", meaning: "piezoelectric current amplitude", meaning_ko: "압전 전류 진폭", range: [1.0e-6, 1.0e-2], scale: log}
  C_0: {latex: "C_0", unit: "F", desc: "clamped capacitance of a piezoelectric element", meaning: "clamped capacitance", meaning_ko: "클램프 커패시턴스(clamped capacitance)", range: [1.0e-10, 1.0e-6], scale: log}
  omega: {latex: "\\omega", unit: "rad/s", desc: "angular frequency of a sinusoidal vibration", meaning: "vibration angular frequency", meaning_ko: "진동 각주파수", range: [10, 1.0e4], scale: log}
  V_p: {latex: "V_p", unit: "V", desc: "open-circuit voltage amplitude of a vibrating piezoelectric element: I_p/(omega C_0)", meaning: "open-circuit voltage amplitude", meaning_ko: "개방 전압 진폭", range: [0.1, 1000], scale: log}
  V_DC: {latex: "V_\\mathrm{DC}", unit: "V", desc: "DC voltage behind a full-wave bridge rectifier", meaning: "rectified DC voltage", meaning_ko: "정류된 직류 전압", range: [0.1, 1000], scale: log}
  gamma: {latex: "\\gamma", unit: "1", desc: "fraction of its voltage a synchronized-switch inversion keeps: the element goes from V to -gamma V", meaning: "inversion coefficient", meaning_ko: "반전 계수(inversion coefficient)", range: [0, 0.95]}
  V_ocpk: {latex: "\\hat{V}_\\mathrm{oc}", unit: "V", desc: "peak of a source's open-circuit voltage envelope", meaning: "peak open-circuit voltage", meaning_ko: "개방 전압의 최댓값", range: [1, 1000], scale: log}
  T_env: {latex: "T_\\mathrm{env}", unit: "s", desc: "duration of one half-wave of a source's open-circuit voltage envelope: the period of the rectified sine it repeats", meaning: "envelope half-wave", meaning_ko: "포락선 반파의 길이"}
  P_avg: {latex: "\\bar{P}", unit: "W", desc: "power averaged over a period of the source's envelope", meaning: "power averaged over the envelope", meaning_ko: "포락선 주기에 걸친 평균 전력", range: [1.0e-6, 100], scale: log}
  P_std_max: {latex: "P_\\mathrm{std,max}", unit: "W", desc: "largest power a full-wave bridge onto a DC voltage takes from a vibrating piezoelectric element, at the best DC voltage", meaning: "largest power of the standard interface", meaning_ko: "표준 인터페이스의 최대 전력"}
  P_sshi_max: {latex: "P_\\mathrm{SSHI,max}", unit: "W", desc: "largest power parallel SSHI takes from a vibrating piezoelectric element, at the best DC voltage", meaning: "largest power of parallel SSHI", meaning_ko: "병렬 SSHI의 최대 전력"}
  # --- 05-simulation (Phase 5c): stepping a circuit in time, settling, rounding
  tau: {latex: "\\tau", unit: "s", desc: "time constant of a decaying mode: R C for a capacitor, L/R for an inductor", meaning: "time constant", meaning_ko: "시정수(time constant)", range: [1.0e-10, 1.0e-3], scale: log}
  Delta_t: {latex: "\\Delta t", unit: "s", desc: "time step of a numerical integration", meaning: "time step", meaning_ko: "시간 간격(time step)", range: [1.0e-10, 1.0e-3], scale: log}
  v_0: {latex: "v_0", unit: "V", desc: "capacitor voltage at the start of a time step", meaning: "voltage at the start of the step", meaning_ko: "스텝을 시작할 때의 전압", range: [-100, 100]}
  v_inf: {latex: "v_\\infty", unit: "V", desc: "voltage the capacitor would settle to if the step's conditions lasted", meaning: "voltage it tends to", meaning_ko: "수렴하려는 전압", range: [-100, 100]}
  v_1: {latex: "v_1", unit: "V", desc: "capacitor voltage at the end of the time step", meaning: "voltage after the step", meaning_ko: "스텝이 끝날 때의 전압"}
  g_FE: {latex: "g_\\mathrm{FE}", unit: "1", desc: "factor by which the forward Euler rule multiplies a decaying mode's deviation in each step", meaning: "forward Euler's factor per step", meaning_ko: "전진 오일러의 스텝당 배율"}
  g_TR: {latex: "g_\\mathrm{TR}", unit: "1", desc: "factor by which the trapezoidal rule multiplies a decaying mode's deviation in each step", meaning: "trapezoidal rule's factor per step", meaning_ko: "사다리꼴 규칙의 스텝당 배율"}
  g_BE: {latex: "g_\\mathrm{BE}", unit: "1", desc: "factor by which the backward Euler rule (Gear's method of order one) multiplies a decaying mode's deviation in each step", meaning: "backward Euler's factor per step", meaning_ko: "후진 오일러의 스텝당 배율"}
  I_os: {latex: "I_\\mathrm{os}", unit: "A", desc: "current that has gone past zero through a diode when the diode turns off, and that the next step must bring back to zero", meaning: "current past zero", meaning_ko: "0을 지나친 전류", range: [1.0e-4, 10], scale: log}
  v_jump: {latex: "v_\\mathrm{jump}", unit: "V", desc: "voltage a backward Euler step puts across an inductor whose current it brings from I_os back to zero", meaning: "one-step voltage jump", meaning_ko: "한 스텝 전압 점프"}
  tau_env: {latex: "\\tau_\\mathrm{env}", unit: "s", desc: "time constant of the envelope of the output filter's ring", meaning: "envelope time constant", meaning_ko: "포락선 시정수", range: [1.0e-6, 1.0], scale: log}
  eps_r: {latex: "\\varepsilon_r", unit: "1", desc: "fraction of the start-up error still left when the measurement starts", meaning: "start-up error left (fraction)", meaning_ko: "남은 시작 오차의 비율", range: [1.0e-9, 0.1], scale: log}
  N_set: {latex: "N_\\mathrm{set}", unit: "1", desc: "switching periods until the start-up error has fallen to the fraction eps_r", meaning: "periods to settle", meaning_ko: "정착까지의 주기 수"}
  x_val: {latex: "x", unit: "1", desc: "a computed value (a quantity with a unit is divided by that unit first)", meaning: "value under test", meaning_ko: "검사할 값", range: [-1000, 1000]}
  x_ref: {latex: "x_\\mathrm{ref}", unit: "1", desc: "the reference value the computed one is compared with", meaning: "reference value", meaning_ko: "기준값", range: [1.0e-3, 1000], scale: log}
  delta_rel: {latex: "\\delta", unit: "1", desc: "relative difference of a value from its reference", meaning: "relative difference", meaning_ko: "상대 차이"}
  u_r: {latex: "u", unit: "1", desc: "unit roundoff: the largest relative error of rounding a real number to the nearest number of the format", meaning: "unit roundoff", meaning_ko: "단위 반올림 오차(unit roundoff)"}
  beta_b: {latex: "\\beta", unit: "1", desc: "base of a floating-point format (2 for binary)", meaning: "base (2 for binary)", meaning_ko: "밑(이진수는 2)", range: [2, 16]}
  p_prec: {latex: "p", unit: "1", desc: "precision of a floating-point format: digits of its significand in base beta (53 for binary64)", meaning: "precision (significand digits)", meaning_ko: "정밀도(가수의 자릿수)", range: [8, 113]}

# Human-readable labels for the `assumptions` tags (shown in the <Eq> expander).
assumption_labels:
  ideal: {en: "ideal (lossless) switches and passive components", ko: "이상적(무손실) 스위치와 수동 소자"}
  ccm: {en: "continuous conduction mode (CCM)", ko: "연속 전도 모드(CCM)"}
  dcm: {en: "discontinuous conduction mode (DCM)", ko: "불연속 전도 모드(DCM)"}
  bcm: {en: "at the CCM/DCM boundary", ko: "CCM/DCM 경계"}
  steady_state: {en: "periodic steady state", ko: "주기적 정상상태"}
  small_ripple: {en: "small-ripple approximation", ko: "소리플 근사(small-ripple approximation)"}
  resistive_load: {en: "resistive load R", ko: "저항성 부하 R"}
  fixed_output: {en: "output held at a fixed voltage V (battery or regulated bus)", ko: "출력이 고정 전압 V로 유지됨(배터리 또는 정전압 버스)"}
  diode_drop: {en: "output diode modelled as a constant forward drop V_D", ko: "출력 다이오드를 일정한 순방향 전압 V_D로 모델링"}
  definition: {en: "definition", ko: "정의"}
  linear_source: {en: "linear (Thevenin) source V_oc behind R_s", ko: "선형(테브난) 전원: R_s 뒤의 V_oc"}
  rint_battery: {en: "battery modelled as its open-circuit voltage behind an internal resistance (Rint model)", ko: "배터리를 내부 저항 뒤의 개방 전압으로 모델링(Rint 모델)"}
  lossless_converter: {en: "lossless converter (input power equals output power)", ko: "무손실 컨버터(입력 전력 = 출력 전력)"}
  no_fringing: {en: "no fringing flux at the gap", ko: "공극의 프린징(fringing) 자속 무시"}
  linear_magnetics: {en: "linear (unsaturated) magnetic material", ko: "선형(비포화) 자성 재료"}
  uniform_flux: {en: "flux density uniform over A_e", ko: "A_e 전체에서 균일한 자속 밀도"}
  uniform_flux_volume: {en: "flux density uniform over the effective volume V_e", ko: "유효 부피 V_e 전체에서 균일한 자속 밀도"}
  sinusoidal_excitation: {en: "sinusoidal excitation (empirical fit)", ko: "정현파 여자(경험적 피팅)"}
  full_discharge: {en: "the capacitance is fully discharged at every turn-on", ko: "매 턴온마다 커패시턴스가 완전히 방전됨"}
  energy_lost: {en: "all of the stored energy is dissipated every cycle", ko: "저장 에너지가 매 주기 전부 소산됨"}
  lossless_lc: {en: "undamped L-C resonance", ko: "감쇠 없는 L-C 공진"}
  ideal_amplifier: {en: "ideal amplifier (no offset, gain error or output headroom limit)", ko: "이상적 증폭기(오프셋·이득 오차·출력 헤드룸 제한 없음)"}
  small_signal: {en: "small-signal (linearised) model around a CCM operating point", ko: "CCM 동작점 주변의 소신호(선형화) 모델"}
  sawtooth_pwm: {en: "trailing-edge PWM with a ramp from 0 to V_M", ko: "0에서 V_M까지 증가하는 램프를 쓰는 후단 에지(trailing-edge) PWM"}
  real_loop_gain: {en: "loop gain treated as a real magnitude (valid well below crossover)", ko: "루프 이득을 실수 크기로 취급(크로스오버보다 충분히 낮은 주파수에서 유효)"}
  inductor_resistance: {en: "inductor winding resistance R_L; all other components ideal", ko: "인덕터 권선 저항 R_L 외 나머지 소자는 이상적"}
  capacitor_takes_ripple: {en: "the whole inductor ripple current flows into the output capacitor; the load draws only dc", ko: "인덕터 리플 전류 전체가 출력 커패시터로 흐르고 부하는 직류만 받음"}
  small_ripple_currents: {en: "rms currents computed with small ripple (flat-topped current pulses)", ko: "소리플 근사로 계산한 실효 전류(윗면이 평평한 전류 펄스)"}
  constant_excitation: {en: "constant voltage (inductor) or current (capacitor) during the interval t", ko: "구간 t 동안 전압(인덕터) 또는 전류(커패시터)가 일정함"}
  piezo_source: {en: "piezoelectric element as a current source I_p sin(ωt) in parallel with its clamped capacitance C_0; the vibration's amplitude does not depend on the electrical load (weak coupling)", ko: "압전 소자를 클램프 커패시턴스 C_0와 병렬인 전류원 I_p sin(ωt)로 모델링; 진동 진폭은 전기적 부하와 무관(약결합)"}
  ideal_bridge: {en: "ideal full-wave bridge rectifier onto a constant DC voltage", ko: "일정한 직류 전압에 연결된 이상적 전파 브리지 정류기"}
  slow_envelope: {en: "envelope slow against the bus time constant, and the converter a loss-free resistor (DCM) throughout", ko: "포락선이 버스 시정수보다 충분히 느리고, 컨버터가 내내 무손실 저항(DCM)으로 동작"}
  sinusoidal_steady_state: {en: "sinusoidal steady state (phasor analysis)", ko: "정현파 정상상태(페이저 해석)"}
  first_order_rc: {en: "first-order R-C low-pass filter with no load on its output", ko: "출력에 부하가 없는 1차 R-C 저역통과 필터"}
  rectangular_pulse: {en: "ideal rectangular pulse train between 0 and V_pk with duty ratio D", ko: "0과 V_pk 사이를 오가는 듀티비 D의 이상적인 직사각형 펄스열"}
  uniform_field: {en: "ungapped core with the field intensity uniform along the path l_e", ko: "공극이 없는 코어에서 자로 l_e를 따라 자계 세기가 균일함"}
  ideal_transformer: {en: "ideal transformer: perfect coupling, no magnetizing current, no losses", ko: "이상적 변압기: 완전 결합, 자화 전류 없음, 손실 없음"}
  constant_clamp: {en: "the clamp holds a constant voltage while it conducts, so the leakage current falls linearly to zero", ko: "클램프가 도통하는 동안 일정한 전압을 유지하므로 누설 전류가 직선적으로 0까지 감소함"}
  rcd_small_ripple: {en: "RCD clamp: the capacitor's voltage ripple is small and its resistor dissipates the clamp energy", ko: "RCD 클램프: 커패시터의 전압 리플이 작고 저항이 클램프 에너지를 소산함"}
  tvs_linear: {en: "TVS modelled by its breakdown voltage and a constant dynamic resistance", ko: "TVS를 항복 전압과 일정한 동저항으로 모델링"}
  open_load: {en: "fixed duty ratio, no regulation, load removed", ko: "고정 듀티비, 레귤레이션 없음, 부하 제거"}
  offset_only: {en: "the amplifier's input offset voltage is its only error (no gain error, no bias current)", ko: "증폭기의 입력 오프셋 전압만 오차로 봄(이득 오차, 바이어스 전류 없음)"}
  no_kelvin: {en: "a two-terminal shunt whose sense connections share the pads and solder joints with the load current (no Kelvin connection)", ko: "센스 연결이 부하 전류와 같은 패드와 납땜을 공유하는 2단자 션트(켈빈 연결 없음)"}
  uniform_sampling: {en: "uniform sampling at a fixed rate", ko: "일정한 속도의 균일 샘플링"}
  linear_shunt: {en: "the shunt is a linear resistor: its resistance does not change with the current", ko: "션트는 선형 저항: 저항값이 전류에 따라 변하지 않음"}
  good_conductor: {en: "a good conductor carrying a sinusoidal current (displacement current neglected)", ko: "정현파 전류가 흐르는 양도체(변위 전류 무시)"}
  uniform_dc_current: {en: "a dc current spread uniformly over the conductor's cross-section", ko: "도체 단면 전체에 고르게 흐르는 직류 전류"}
  window_field: {en: "one-dimensional field in the winding window: the MMF changes only across the layers, and the field runs along the winding breadth", ko: "권선 창 안의 1차원 자계: 기자력은 층을 가로지르는 방향으로만 변하고, 자계는 권선 폭 방향으로 향함"}
  dowell_layers: {en: "foil layers spanning the winding breadth, a sinusoidal current, and a one-dimensional field in the window", ko: "권선 폭 전체에 걸친 박판(foil) 층, 정현파 전류, 권선 창 안의 1차원 자계"}
  linear_temperature: {en: "resistance linear in temperature near 20 °C", ko: "20 °C 부근에서 온도에 선형인 저항"}
  square_equivalent: {en: "each round conductor replaced by a square conductor of the same area, the layer by a foil of that thickness", ko: "둥근 도체를 같은 면적의 정사각형 도체로, 층을 그 두께의 박판(foil)으로 대치"}
  fixed_clamp: {en: "a clamp whose voltage does not depend on the power it absorbs (a TVS or Zener clamp)", ko: "흡수하는 전력에 따라 전압이 변하지 않는 클램프(TVS 또는 제너 클램프)"}
  thin_layers: {en: "layers thin compared with the skin depth (φ up to about 1): the leading terms of Dowell's factor", ko: "표피 깊이에 비해 얇은 층(φ가 약 1 이하): Dowell 계수의 앞쪽 항"}
  layer_resistance: {en: "the layers' breadth and turns fixed, so a layer's dc resistance is inversely proportional to its thickness", ko: "층의 폭과 턴 수가 고정되어 층의 직류 저항이 두께에 반비례함"}
  coupled_windings: {en: "two linearly coupled windings without resistance", ko: "저항이 없는, 선형으로 결합된 두 권선"}
  t_model: {en: "transformer modelled by its magnetizing inductance and one leakage inductance per winding (T model), referred to the primary", ko: "변압기를 자화 인덕턴스와 권선마다 하나의 누설 인덕턴스로 모델링(T 모델), 1차 기준"}
  unchanged_inductance: {en: "the added capacitor does not change the inductance that rings", ko: "추가한 커패시터가 링잉하는 인덕턴스를 바꾸지 않음"}
  snubber_full_swing: {en: "the snubber capacitor charges through its resistor to V at one edge and discharges through it at the other, once per switching period", ko: "스너버 커패시터가 한 에지에서 저항을 통해 V까지 충전되고 다른 에지에서 저항을 통해 방전됨(스위칭 주기마다 한 번)"}
  snubber_charging_edge: {en: "the edge that charges the snubber capacitor, once per switching period: the node steps by V_snub while the parasitic inductance carries I_ring; the node's own capacitance is left out (AN11160)", ko: "스위칭 주기마다 한 번 스너버 커패시터를 충전하는 에지: 기생 인덕턴스에 I_ring이 흐르는 동안 노드 전압이 V_snub만큼 바뀜; 노드 자체의 커패시턴스는 무시함(AN11160)"}
  linear_edge: {en: "the current changes linearly over the edge", ko: "에지 동안 전류가 직선적으로 변함"}
  bootstrap_no_recharge: {en: "the bootstrap capacitor alone supplies the charge while the high-side switch is on; it recharges only while the low side conducts", ko: "하이사이드 스위치가 켜져 있는 동안 부트스트랩 커패시터만 전하를 공급하고, 로우사이드가 도통할 때만 재충전됨"}
  first_order_response: {en: "single-pole (first-order) response to a step", ko: "계단 입력에 대한 단일 극점(1차) 응답"}
  rc_step: {en: "an empty capacitor charged from a voltage step through a constant series resistance; the wiring's inductance negligible (its time constant, L over the series resistance, far shorter than the R-C one)", ko: "빈 커패시터가 일정한 직렬 저항을 통해 전압 계단으로 충전됨. 배선 인덕턴스는 무시함(그 시정수, 곧 L을 직렬 저항으로 나눈 값이 R-C 시정수보다 훨씬 짧음)"}
  linear_ramp: {en: "an empty capacitor whose voltage is ramped linearly from zero to its final value", ko: "빈 커패시터의 전압을 0에서 최종값까지 선형으로 올림"}
  series_ramp: {en: "the ramp is set by an element in series with a fixed supply V_g (a load switch or a hot-swap switch)", ko: "고정 전원 V_g와 직렬인 소자(부하 스위치, 핫스왑 스위치)가 램프를 만듦"}
  gate_plateau: {en: "the gate voltage stays at the plateau voltage while the drain voltage makes its transition; the driver switches between V_GS and 0 behind the gate-loop resistance", ko: "드레인 전압이 전이하는 동안 게이트 전압이 플래토 전압에 머묾; 드라이버는 게이트 루프 저항 뒤에서 V_GS와 0 사이를 스위칭함"}
  series_heat_path: {en: "steady state; all of the device's power flows through each part of the path in turn: junction to case, case to heat sink, heat sink to ambient", ko: "정상상태; 소자의 전력 전부가 경로의 각 부분(접합→케이스, 케이스→방열판, 방열판→주위)을 차례로 지나감"}
  characterization_parameter: {en: "the device is mounted and cooled as it was characterized (on a board, without a heat sink on the package); the parameter is not a thermal resistance: only part of the power flows through the package top", ko: "소자가 특성화할 때와 같이 실장·냉각됨(기판 위, 패키지에 방열판 없음). 이 파라미터는 열저항이 아님: 전력의 일부만 패키지 윗면을 지남"}
  constant_over_step: {en: "the circuit is linear and its sources stay constant during the step", ko: "스텝 동안 회로가 선형이고 전원이 일정함"}
  test_equation: {en: "one decaying mode on its own: its rate of change is minus its deviation over tau (the test equation)", ko: "홀로 감쇠하는 모드 하나: 변화율이 편차를 tau로 나눈 값의 음수임(시험 방정식)"}
  fixed_step: {en: "the same time step every step", ko: "매 스텝 같은 시간 간격"}
  backward_euler_step: {en: "backward Euler: the inductor's voltage at the end of the step is its inductance times the change of its current over the step", ko: "후진 오일러: 스텝 끝의 인덕터 전압이 인덕턴스와 스텝 동안의 전류 변화를 곱해 스텝으로 나눈 값임"}
  current_blocked: {en: "the current's path opens within the step, and nothing else (a body diode, a snubber, a node capacitance) takes the current", ko: "스텝 안에서 전류 경로가 열리고, 다른 것(바디 다이오드, 스너버, 노드 커패시턴스)이 전류를 받지 않음"}
  underdamped_filter: {en: "the output filter rings: its quality factor Q is above 1/2", ko: "출력 필터가 진동함: Q가 1/2보다 큼"}
  open_loop: {en: "fixed duty ratio, no feedback loop (open loop)", ko: "고정 듀티비, 피드백 루프 없음(개루프)"}
  slowest_mode: {en: "the start-up error decays with a single time constant, the slowest mode's", ko: "시작 오차가 가장 느린 모드의 시정수 하나로 감소함"}
  round_to_nearest: {en: "rounding to the nearest number of the format, IEEE 754's default", ko: "형식에서 가장 가까운 수로 반올림(IEEE 754의 기본값)"}

equations:
  # =========================================================================
  # CCM conversion ratios (volt-second balance)
  # =========================================================================
  - id: buck.ccm.M
    title: "Buck conversion ratio, CCM"
    title_ko: "벅(buck) 변환비, CCM"
    lhs: M
    expr: "D"
    symbols: {D: "duty ratio"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    convention: "$M = V/V_g$"
    convention_ko: "$M = V/V_g$"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/ccm_ratios.py
    tests:
      - {inputs: {D: 0.5}, expect: 0.5}
      - {inputs: {D: 0.25}, expect: 0.25}

  - id: boost.ccm.M
    title: "Boost conversion ratio, CCM"
    title_ko: "부스트(boost) 변환비, CCM"
    lhs: M
    expr: "1/(1 - D)"
    symbols: {D: "duty ratio"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    convention: "$M = V/V_g$"
    convention_ko: "$M = V/V_g$"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/ccm_ratios.py
    tests:
      - {inputs: {D: 0.5}, expect: 2.0}
      - {inputs: {D: 0.75}, expect: 4.0}

  - id: buckboost.ccm.M
    title: "Buck-boost conversion ratio, CCM"
    title_ko: "벅-부스트(buck-boost) 변환비, CCM"
    lhs: M
    expr: "-D/(1 - D)"
    symbols: {D: "duty ratio"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    convention: "$M = V/V_g$; the output is inverted, so $M < 0$"
    convention_ko: "$M = V/V_g$; 출력 극성이 반전되므로 $M < 0$"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/ccm_ratios.py
    tests:
      - {inputs: {D: 0.5}, expect: -1.0}
      - {inputs: {D: 0.75}, expect: -3.0}

  - id: flyback.ccm.M
    title: "Flyback conversion ratio, CCM"
    title_ko: "플라이백(flyback) 변환비, CCM"
    lhs: M
    expr: "n*D/(1 - D)"
    symbols: {n: "turns ratio N_s/N_p", D: "duty ratio"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    convention: "$M = V/V_g$; 1:n transformer with $n = N_s/N_p$"
    convention_ko: "$M = V/V_g$; 1:n 변압기, $n = N_s/N_p$"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/ccm_ratios.py
    tests:
      - {inputs: {n: 0.5, D: 0.5}, expect: 0.5}
      - {inputs: {n: 2.0, D: 0.25}, expect: 0.6666666666666666}

  - id: forward.ccm.M
    title: "Forward conversion ratio, CCM"
    title_ko: "포워드(forward) 변환비, CCM"
    lhs: M
    expr: "n*D"
    symbols: {n: "turns ratio N_s/N_p", D: "duty ratio"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    convention: "$M = V/V_g$; $n = N_s/N_p$; valid only while $D \\le D_\\mathrm{max}$ (reset limit)"
    convention_ko: "$M = V/V_g$; $n = N_s/N_p$; 리셋 한계 $D \\le D_\\mathrm{max}$ 안에서만 성립"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/ccm_ratios.py
    tests:
      - {inputs: {n: 0.5, D: 0.4}, expect: 0.2}
      - {inputs: {n: 2.0, D: 0.3}, expect: 0.6}

  - id: forward.reset.Dmax
    title: "Forward converter: maximum duty ratio set by transformer reset"
    title_ko: "포워드 컨버터: 변압기 리셋이 정하는 최대 듀티비"
    lhs: D_max
    expr: "1/(1 + n_r)"
    symbols: {n_r: "reset-winding to primary turns ratio N_r/N_p"}
    assumptions: [ideal, steady_state]
    convention: "reset winding with $N_r$ turns returns the magnetizing energy to $V_g$; $n_r = 1$ gives $D_\\mathrm{max} = 0.5$"
    convention_ko: "$N_r$ 턴의 리셋 권선이 자화 에너지를 $V_g$로 돌려보냄; $n_r = 1$이면 $D_\\mathrm{max} = 0.5$"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/ccm_ratios.py
    tests:
      - {inputs: {n_r: 1.0}, expect: 0.5}
      - {inputs: {n_r: 0.5}, expect: 0.6666666666666666}

  # =========================================================================
  # Ripple
  # =========================================================================
  - id: buck.ripple.iL
    title: "Buck inductor current ripple (half peak-to-peak), CCM"
    title_ko: "벅 인덕터 전류 리플(피크-피크의 절반), CCM"
    lhs: Delta_i_L
    expr: "(V_g - V)*D*T_s/(2*L)"
    symbols: {V_g: "input voltage", V: "output voltage", D: "duty ratio", T_s: "switching period", L: "filter inductance"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    convention: "$\\Delta i_L$ is HALF the peak-to-peak ripple (Erickson)"
    convention_ko: "$\\Delta i_L$은 피크-피크 리플의 절반(Erickson 규약)"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/ccm_ratios.py
    tests:
      - {inputs: {V_g: 10.0, V: 5.0, D: 0.5, T_s: 1.0e-5, L: 1.0e-4}, expect: 0.125}

  - id: buck.ripple.iL_pp
    title: "Buck inductor current ripple, peak-to-peak, CCM"
    title_ko: "벅 인덕터 전류 리플(피크-피크), CCM"
    lhs: Delta_i_pp
    expr: "(V_g - V)*D/(L*f_s)"
    symbols: {V_g: "input voltage", V: "output voltage", D: "duty ratio", L: "filter inductance", f_s: "switching frequency"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    convention: "peak-to-peak; twice the Erickson $\\Delta i_L$"
    convention_ko: "피크-피크 값; Erickson의 $\\Delta i_L$의 두 배"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/ccm_ratios.py
    tests:
      - {inputs: {V_g: 10.0, V: 5.0, D: 0.5, L: 1.0e-4, f_s: 1.0e5}, expect: 0.25}

  # =========================================================================
  # CCM/DCM boundary
  # =========================================================================
  - id: K.def
    title: "Dimensionless inductor parameter K"
    title_ko: "무차원 인덕터 파라미터 K"
    lhs: K
    expr: "2*L/(R*T_s)"
    symbols: {L: "inductance (L_M for a flyback)", R: "load resistance", T_s: "switching period"}
    assumptions: [definition]
    convention: "the converter operates in CCM when $K > K_\\mathrm{crit}(D)$"
    convention_ko: "$K > K_\\mathrm{crit}(D)$이면 CCM으로 동작"
    cite: {key: erickson2020, where: "Ch. 5 (The Discontinuous Conduction Mode)"}
    tests:
      - {inputs: {L: 1.0e-4, R: 10.0, T_s: 1.0e-5}, expect: 2.0}

  - id: Kcrit.buck
    title: "Critical K of the buck converter"
    title_ko: "벅 컨버터의 임계 K"
    lhs: K_crit
    expr: "1 - D"
    symbols: {D: "duty ratio"}
    assumptions: [ideal, bcm, steady_state, small_ripple, resistive_load]
    cite: {key: erickson2020, where: "Ch. 5 (The Discontinuous Conduction Mode)"}
    derived_by: python/pe_core/derive/dcm.py
    tests:
      - {inputs: {D: 0.5}, expect: 0.5}
      - {inputs: {D: 0.2}, expect: 0.8}

  - id: Kcrit.boost
    title: "Critical K of the boost converter"
    title_ko: "부스트 컨버터의 임계 K"
    lhs: K_crit
    expr: "D*(1 - D)**2"
    symbols: {D: "duty ratio"}
    assumptions: [ideal, bcm, steady_state, small_ripple, resistive_load]
    notes: "maximum $4/27$ at $D = 1/3$"
    notes_ko: "$D = 1/3$에서 최댓값 $4/27$"
    cite: {key: erickson2020, where: "Ch. 5 (The Discontinuous Conduction Mode)"}
    derived_by: python/pe_core/derive/dcm.py
    tests:
      - {inputs: {D: 0.5}, expect: 0.125}
      - {inputs: {D: 0.3333333333333333}, expect: 0.14814814814814814}

  - id: Kcrit.buckboost
    title: "Critical K of the buck-boost converter"
    title_ko: "벅-부스트 컨버터의 임계 K"
    lhs: K_crit
    expr: "(1 - D)**2"
    symbols: {D: "duty ratio"}
    assumptions: [ideal, bcm, steady_state, small_ripple, resistive_load]
    cite: {key: erickson2020, where: "Ch. 5 (The Discontinuous Conduction Mode)"}
    derived_by: python/pe_core/derive/dcm.py
    tests:
      - {inputs: {D: 0.5}, expect: 0.25}
      - {inputs: {D: 0.2}, expect: 0.64}

  - id: Kcrit.flyback
    title: "Critical K of the flyback converter"
    title_ko: "플라이백 컨버터의 임계 K"
    lhs: K_crit
    expr: "(1 - D)**2/n**2"
    symbols: {D: "duty ratio", n: "turns ratio N_s/N_p"}
    assumptions: [ideal, bcm, steady_state, small_ripple, resistive_load]
    convention: "$K = 2L_M/(R T_s)$ with $L_M$ referred to the primary and the actual (secondary-side) load $R$; 1:n, $n = N_s/N_p$"
    convention_ko: "$K = 2L_M/(R T_s)$, $L_M$은 1차측 환산값, $R$은 실제(2차측) 부하; 1:n, $n = N_s/N_p$"
    cite: {key: erickson2020, where: "Ch. 5–6 (DCM; flyback as an isolated buck-boost)"}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {D: 0.5, n: 0.5}, expect: 1.0}
      - {inputs: {D: 0.2, n: 2.0}, expect: 0.16}

  - id: L.crit
    title: "Critical inductance at the CCM/DCM boundary"
    title_ko: "CCM/DCM 경계의 임계 인덕턴스"
    lhs: L_crit
    expr: "K_crit*R*T_s/2"
    symbols: {K_crit: "critical K of the topology at the operating duty ratio", R: "load resistance", T_s: "switching period"}
    assumptions: [ideal, bcm, steady_state, small_ripple, resistive_load]
    notes: "the converter stays in CCM for $L > L_\\mathrm{crit}$; check the largest $R$ (lightest load) and the duty ratio that maximises $K_\\mathrm{crit}$ over the input range"
    notes_ko: "$L > L_\\mathrm{crit}$이면 CCM을 유지한다; 가장 큰 $R$(가장 가벼운 부하)과 입력 범위에서 $K_\\mathrm{crit}$을 최대로 만드는 듀티비에서 확인한다"
    cite: {key: erickson2020, where: "Ch. 5 (The Discontinuous Conduction Mode)"}
    derived_by: python/pe_core/derive/dcm.py
    tests:
      - {inputs: {K_crit: 0.5, R: 10.0, T_s: 1.0e-5}, expect: 2.5e-5}
      - {inputs: {K_crit: 0.125, R: 20.0, T_s: 1.0e-5}, expect: 1.25e-5}

  # =========================================================================
  # DCM conversion ratios
  # =========================================================================
  - id: buck.dcm.M
    title: "Buck conversion ratio, DCM"
    title_ko: "벅 변환비, DCM"
    lhs: M
    expr: "2/(1 + sqrt(1 + 4*K/D**2))"
    symbols: {K: "2L/(R T_s)", D: "duty ratio"}
    assumptions: [ideal, dcm, steady_state, small_ripple, resistive_load]
    convention: "$M = V/V_g$; valid for $K < K_\\mathrm{crit} = 1 - D$"
    convention_ko: "$M = V/V_g$; $K < K_\\mathrm{crit} = 1 - D$에서 성립"
    cite: {key: erickson2020, where: "Ch. 5 (The Discontinuous Conduction Mode)"}
    derived_by: python/pe_core/derive/dcm.py
    tests:
      - {inputs: {K: 0.1875, D: 0.5}, expect: 0.6666666666666666}
      - {inputs: {K: 0.5, D: 0.5}, expect: 0.5}

  - id: boost.dcm.M
    title: "Boost conversion ratio, DCM"
    title_ko: "부스트 변환비, DCM"
    lhs: M
    expr: "(1 + sqrt(1 + 4*D**2/K))/2"
    symbols: {D: "duty ratio", K: "2L/(R T_s)"}
    assumptions: [ideal, dcm, steady_state, small_ripple, resistive_load]
    convention: "$M = V/V_g$; valid for $K < K_\\mathrm{crit} = D(1 - D)^2$"
    convention_ko: "$M = V/V_g$; $K < K_\\mathrm{crit} = D(1 - D)^2$에서 성립"
    cite: {key: erickson2020, where: "Ch. 5 (The Discontinuous Conduction Mode)"}
    derived_by: python/pe_core/derive/dcm.py
    tests:
      - {inputs: {D: 0.5, K: 0.125}, expect: 2.0}
      - {inputs: {D: 0.5, K: 0.041666666666666664}, expect: 3.0}

  - id: buckboost.dcm.M
    title: "Buck-boost conversion ratio, DCM"
    title_ko: "벅-부스트 변환비, DCM"
    lhs: M
    expr: "-D/sqrt(K)"
    symbols: {D: "duty ratio", K: "2L/(R T_s)"}
    assumptions: [ideal, dcm, steady_state, small_ripple, resistive_load]
    convention: "$M = V/V_g < 0$ (inverting); valid for $K < K_\\mathrm{crit} = (1 - D)^2$"
    convention_ko: "$M = V/V_g < 0$(반전); $K < K_\\mathrm{crit} = (1 - D)^2$에서 성립"
    cite: {key: erickson2020, where: "Ch. 5 (The Discontinuous Conduction Mode)"}
    derived_by: python/pe_core/derive/dcm.py
    tests:
      - {inputs: {D: 0.5, K: 0.25}, expect: -1.0}
      - {inputs: {D: 0.3, K: 0.01}, expect: -3.0}

  - id: flyback.dcm.M
    title: "Flyback conversion ratio, DCM"
    title_ko: "플라이백 변환비, DCM"
    lhs: M
    expr: "D/sqrt(K)"
    symbols: {D: "duty ratio", K: "2 L_M/(R T_s)"}
    assumptions: [ideal, dcm, steady_state, small_ripple, resistive_load]
    convention: "1:n transformer, $n = N_s/N_p$; $K$ uses $L_M$ (primary-referred) and the actual load $R$"
    convention_ko: "1:n 변압기, $n = N_s/N_p$; $K$는 $L_M$(1차측 환산)과 실제 부하 $R$로 계산"
    notes: "independent of $n$: the turns ratio only enters $K_\\mathrm{crit}$ and the stresses"
    notes_ko: "$n$과 무관: 권선비는 $K_\\mathrm{crit}$와 스트레스에만 들어감"
    cite: {key: erickson2020, where: "Ch. 5–6 (DCM; flyback as an isolated buck-boost)"}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {D: 0.3, K: 0.09}, expect: 1.0}
      - {inputs: {D: 0.3, K: 0.01}, expect: 3.0}

  # =========================================================================
  # DCM power, loss-free resistor, flyback boundary and stresses
  # =========================================================================
  - id: dcm.P_in
    title: "Power drawn by a DCM buck-boost or flyback"
    title_ko: "DCM 벅-부스트/플라이백이 끌어오는 전력"
    lhs: P
    expr: "V_g**2*D**2/(2*L_M*f_s)"
    symbols: {V_g: "input voltage", D: "duty ratio", L_M: "(magnetizing) inductance", f_s: "switching frequency"}
    assumptions: [ideal, dcm, steady_state]
    notes: "the energy $\\tfrac12 L_M I_\\mathrm{pk}^2$ is stored once per cycle, independent of the load"
    notes_ko: "부하와 무관하게 매 주기 $\\tfrac12 L_M I_\\mathrm{pk}^2$의 에너지를 저장"
    cite:
      - {key: erickson2020, where: "Ch. 15 (AC and DC Equivalent Circuit Modeling of the Discontinuous Conduction Mode)"}
      - {key: singer1990}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {V_g: 10.0, D: 0.5, L_M: 1.0e-4, f_s: 1.0e5}, expect: 1.25}

  - id: lfr.R_in
    title: "Input resistance of a DCM buck-boost or flyback (loss-free resistor)"
    title_ko: "DCM 벅-부스트/플라이백의 입력 저항(무손실 저항, LFR)"
    lhs: R_in
    expr: "2*L_M*f_s/D**2"
    symbols: {L_M: "(magnetizing) inductance", f_s: "switching frequency", D: "duty ratio"}
    assumptions: [ideal, dcm, steady_state]
    notes: "the average input current is proportional to $V_g$; the power is passed on, not dissipated"
    notes_ko: "평균 입력 전류가 $V_g$에 비례; 전력은 소산되지 않고 출력으로 전달됨"
    cite:
      - {key: singer1990}
      - {key: erickson2020, where: "Ch. 15 (AC and DC Equivalent Circuit Modeling of the Discontinuous Conduction Mode)"}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {L_M: 1.0e-4, f_s: 1.0e5, D: 0.5}, expect: 80.0}

  - id: flyback.V_crit
    title: "Flyback: input voltage at the CCM/DCM boundary (fixed D, fixed output)"
    title_ko: "플라이백: CCM/DCM 경계의 입력 전압(고정 D, 고정 출력)"
    lhs: V_gcrit
    expr: "(V + V_D)*(1 - D)/(n*D)"
    symbols: {V: "output voltage", V_D: "output-diode drop", D: "duty ratio", n: "turns ratio N_s/N_p"}
    assumptions: [ideal, bcm, steady_state, fixed_output, diode_drop]
    notes: "below $V_{g,\\mathrm{crit}}$ the converter is in DCM; a source-driven bus that rises to $V_{g,\\mathrm{crit}}$ is pinned there by CCM volt-second balance"
    notes_ko: "$V_{g,\\mathrm{crit}}$ 아래에서는 DCM; 전원 구동 버스가 $V_{g,\\mathrm{crit}}$에 도달하면 CCM 전압-초 평형에 의해 그 값에 고정됨"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits); derived here by volt-second balance"}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {V: 4.0, V_D: 1.0, D: 0.5, n: 0.5}, expect: 10.0}

  - id: flyback.Vds_off
    title: "Flyback switch voltage while off (without the leakage spike)"
    title_ko: "플라이백 스위치 오프 전압(누설 스파이크 제외)"
    lhs: V_DS
    expr: "V_g + (V + V_D)/n"
    symbols: {V_g: "input voltage", V: "output voltage", V_D: "output-diode drop", n: "turns ratio N_s/N_p"}
    assumptions: [ideal, steady_state, diode_drop]
    notes: "the leakage-inductance spike adds on top; see $E_\\mathrm{lk}$"
    notes_ko: "누설 인덕턴스 스파이크가 여기에 더해짐; $E_\\mathrm{lk}$ 참고"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {V_g: 10.0, V: 4.0, V_D: 1.0, n: 0.5}, expect: 20.0}

  - id: flyback.Vds_clamped
    title: "Flyback switch voltage with the input pinned at the boundary"
    title_ko: "입력이 경계 전압에 고정된 플라이백의 스위치 전압"
    lhs: V_DS
    expr: "(V + V_D)/(n*D)"
    symbols: {V: "output voltage", V_D: "output-diode drop", n: "turns ratio N_s/N_p", D: "duty ratio"}
    assumptions: [ideal, bcm, steady_state, fixed_output, diode_drop]
    convention: "evaluated at $V_g = V_{g,\\mathrm{crit}}$"
    convention_ko: "$V_g = V_{g,\\mathrm{crit}}$에서 계산"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits); derived here"}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {V: 4.0, V_D: 1.0, n: 0.5, D: 0.5}, expect: 20.0}

  - id: flyback.diode.VR
    title: "Flyback output-diode reverse voltage"
    title_ko: "플라이백 출력 다이오드 역전압"
    lhs: V_R
    expr: "V + n*V_g"
    symbols: {V: "output voltage", n: "turns ratio N_s/N_p", V_g: "input voltage"}
    assumptions: [ideal, steady_state]
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {V: 5.0, n: 0.5, V_g: 10.0}, expect: 10.0}

  - id: flyback.IM
    title: "Flyback magnetizing current (referred to the primary), CCM"
    title_ko: "플라이백 자화 전류(1차 측 환산), CCM"
    lhs: I_M
    expr: "n*V/((1 - D)*R)"
    symbols: {n: "turns ratio N_s/N_p", V: "output voltage", D: "duty ratio", R: "load resistance"}
    assumptions: [ideal, ccm, steady_state, small_ripple, resistive_load]
    convention: "1:n transformer, $n = N_s/N_p$; the secondary carries $I_M/n$ while the diode conducts"
    convention_ko: "1:n 변압기, $n = N_s/N_p$; 다이오드가 도통하는 동안 2차 측에는 $I_M/n$이 흐른다"
    notes: "with $n = 1$ this is the buck-boost's inductor current"
    notes_ko: "$n = 1$이면 벅-부스트의 인덕터 전류와 같다"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits); derived here by charge balance"}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {n: 0.25, V: 5.0, D: 0.5, R: 5.0}, expect: 0.5}

  - id: flyback.ripple.iM
    title: "Flyback magnetizing current ripple, CCM"
    title_ko: "플라이백 자화 전류 리플, CCM"
    lhs: Delta_i_M
    expr: "V_g*D*T_s/(2*L_M)"
    symbols: {V_g: "input voltage", D: "duty ratio", T_s: "switching period", L_M: "magnetizing inductance referred to the primary"}
    assumptions: [ideal, ccm, steady_state]
    convention: "$\\Delta i_M$ is HALF the peak-to-peak ripple (Erickson)"
    convention_ko: "$\\Delta i_M$은 피크-피크 리플의 절반(Erickson)"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits); derived here by volt-seconds on L_M"}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {V_g: 48.0, D: 0.5, T_s: 1.0e-5, L_M: 2.0e-4}, expect: 0.6}

  - id: flyback.ripple.v
    title: "Flyback output voltage ripple, CCM"
    title_ko: "플라이백 출력 전압 리플, CCM"
    lhs: Delta_v
    expr: "V*D*T_s/(2*R*C)"
    symbols: {V: "output voltage", D: "duty ratio", T_s: "switching period", R: "load resistance", C: "output capacitance"}
    assumptions: [ideal, ccm, steady_state, small_ripple, resistive_load]
    convention: "$\\Delta v$ is HALF the peak-to-peak ripple (Erickson)"
    convention_ko: "$\\Delta v$는 피크-피크 리플의 절반(Erickson)"
    notes: "while the switch is on the diode is off and the capacitor alone supplies the load, as in the buck-boost"
    notes_ko: "스위치가 켜져 있는 동안 다이오드는 꺼져 있어 벅-부스트와 마찬가지로 커패시터 혼자 부하를 공급한다"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits); derived here by charge balance"}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {V: 5.0, D: 0.5, T_s: 1.0e-5, R: 5.0, C: 1.0e-4}, expect: 0.025}

  - id: flyback.Ipk.dcm
    title: "Flyback peak magnetizing current, DCM"
    title_ko: "플라이백 피크 자화 전류, DCM"
    lhs: I_pk
    expr: "V_g*D/(L_M*f_s)"
    symbols: {V_g: "input voltage", D: "duty ratio", L_M: "magnetizing inductance", f_s: "switching frequency"}
    assumptions: [ideal, dcm, steady_state]
    notes: "in DCM the magnetizing current starts every cycle from zero"
    notes_ko: "DCM에서는 자화 전류가 매 주기 0에서 시작"
    cite: {key: erickson2020, where: "Ch. 5 (The Discontinuous Conduction Mode)"}
    derived_by: python/pe_core/derive/flyback.py
    tests:
      - {inputs: {V_g: 10.0, D: 0.5, L_M: 1.0e-4, f_s: 1.0e5}, expect: 0.5}

  # =========================================================================
  # Stored energy, ringing and losses
  # =========================================================================
  - id: flyback.leak.E
    title: "Energy stored in the leakage inductance at turn-off"
    title_ko: "턴오프 시 누설 인덕턴스에 저장된 에너지"
    lhs: E_lk
    expr: "L_lk*I_pk**2/2"
    symbols: {L_lk: "leakage inductance (primary-referred)", I_pk: "primary current at turn-off"}
    assumptions: [linear_magnetics]
    notes: "this energy cannot reach the secondary; a clamp or snubber must absorb it"
    notes_ko: "이 에너지는 2차측으로 전달되지 못하므로 클램프나 스너버가 흡수해야 함"
    cite: {key: erickson2020, where: "Ch. 4 (Switch Realization: losses from energy stored in leakage and stray inductances)"}
    derived_by: python/pe_core/derive/energy.py
    tests:
      - {inputs: {L_lk: 1.0e-6, I_pk: 2.0}, expect: 2.0e-6}

  - id: flyback.leak.P
    title: "Leakage-energy power"
    title_ko: "누설 에너지에 의한 전력"
    lhs: P_lk
    expr: "E_lk*f_s"
    symbols: {E_lk: "leakage energy per cycle", f_s: "switching frequency"}
    assumptions: [steady_state, energy_lost]
    notes: "a lower bound for the loss of a dissipative clamp, which also absorbs energy from the reflected voltage and so dissipates more; a clamp that returns the energy to the input or the output processes this power instead of dissipating it"
    notes_ko: "소산형 클램프 손실의 하한이다. 소산형 클램프는 반사 전압의 에너지도 흡수하므로 더 많이 소산한다. 에너지를 입력이나 출력으로 되돌리는 클램프는 이 전력을 소산하지 않고 처리한다"
    cite: {key: erickson2020, where: "Ch. 4 (Switch Realization)"}
    derived_by: python/pe_core/derive/energy.py
    tests:
      - {inputs: {E_lk: 2.0e-6, f_s: 1.0e5}, expect: 0.2}

  - id: flyback.V_OR
    title: "Flyback: output voltage reflected to the primary"
    title_ko: "플라이백: 1차 측으로 반사된 출력 전압"
    lhs: V_OR
    expr: "(V + V_D)/n"
    symbols: {V: "output voltage", V_D: "output-diode drop", n: "turns ratio N_s/N_p"}
    assumptions: [ideal, diode_drop]
    notes: "the primary winding voltage while the output diode conducts; the switch then blocks $V_g$ plus this voltage"
    notes_ko: "출력 다이오드가 도통하는 동안의 1차 권선 전압; 이때 스위치는 $V_g$에 이 전압을 더한 값을 차단한다"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits: the flyback's transformer model); derived here"}
    derived_by: python/pe_core/derive/clamp.py
    tests:
      - {inputs: {V: 12.0, V_D: 0.5, n: 0.25}, expect: 50.0}

  - id: clamp.Vds
    title: "Flyback: switch voltage while the primary clamp conducts"
    title_ko: "플라이백: 1차 측 클램프가 도통하는 동안의 스위치 전압"
    lhs: V_DS
    expr: "V_g + V_clamp"
    symbols: {V_g: "input voltage", V_clamp: "clamp voltage"}
    assumptions: [ideal]
    notes: "after turn-off the leakage inductance drives the drain above $V_g + V_\\mathrm{OR}$ until the clamp conducts and holds it at $V_g + V_\\mathrm{clamp}$"
    notes_ko: "턴오프 후 누설 인덕턴스가 드레인을 $V_g + V_\\mathrm{OR}$ 위로 밀어 올리고, 클램프가 도통하면 $V_g + V_\\mathrm{clamp}$에 묶인다"
    cite: {key: ti_ssztcv6, where: "the leakage inductance drives the drain above the reflected output voltage; the clamp limits it"}
    derived_by: python/pe_core/derive/clamp.py
    tests:
      - {inputs: {V_g: 48.0, V_clamp: 75.0}, expect: 123.0}

  - id: clamp.t_reset
    title: "Time the leakage current takes to fall to zero in a flyback's primary clamp"
    title_ko: "플라이백 1차 측 클램프에서 누설 전류가 0으로 떨어지는 시간"
    lhs: t_r
    expr: "L_lk*I_pk/(V_clamp - V_OR)"
    symbols: {L_lk: "leakage inductance", I_pk: "peak primary current at turn-off", V_clamp: "clamp voltage", V_OR: "reflected output voltage"}
    assumptions: [constant_clamp]
    constraints: ["V_clamp > V_OR"]
    notes: "the leakage inductance sees $V_\\mathrm{clamp} - V_\\mathrm{OR}$ while the clamp conducts; the closer the clamp voltage is to $V_\\mathrm{OR}$, the longer the reset, which must fit in the off-time"
    notes_ko: "클램프가 도통하는 동안 누설 인덕턴스에는 $V_\\mathrm{clamp} - V_\\mathrm{OR}$가 걸린다; 클램프 전압이 $V_\\mathrm{OR}$에 가까울수록 리셋이 길어지며, 이 시간은 오프 시간 안에 들어가야 한다"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis); derived here"}
    derived_by: python/pe_core/derive/clamp.py
    tests:
      - {inputs: {L_lk: 2.0e-6, I_pk: 2.0, V_clamp: 75.0, V_OR: 50.0}, expect: 1.6e-7}

  - id: clamp.P
    title: "Power dissipated in a flyback's primary clamp"
    title_ko: "플라이백 1차 측 클램프의 소산 전력"
    lhs: P_clamp
    expr: "L_lk*I_pk**2*f_s*V_clamp/(2*(V_clamp - V_OR))"
    symbols: {L_lk: "leakage inductance", I_pk: "peak primary current at turn-off", f_s: "switching frequency", V_clamp: "clamp voltage", V_OR: "reflected output voltage"}
    assumptions: [constant_clamp, steady_state]
    constraints: ["V_clamp > V_OR"]
    notes: "the leakage energy per cycle times $V_\\mathrm{clamp}/(V_\\mathrm{clamp} - V_\\mathrm{OR})$: while the leakage current falls, the reflected voltage keeps driving energy into the clamp, the more so the closer the clamp voltage is to $V_\\mathrm{OR}$"
    notes_ko: "주기당 누설 에너지에 $V_\\mathrm{clamp}/(V_\\mathrm{clamp} - V_\\mathrm{OR})$를 곱한 값: 누설 전류가 감소하는 동안에도 반사 전압이 클램프로 에너지를 계속 밀어 넣으며, 클램프 전압이 $V_\\mathrm{OR}$에 가까울수록 더 많이 밀어 넣는다"
    cite: {key: ti_ssztcv6, where: "clamp dissipation against the ratio of the clamp voltage to the reflected voltage; derived here"}
    derived_by: python/pe_core/derive/clamp.py
    tests:
      - {inputs: {L_lk: 2.0e-6, I_pk: 2.0, f_s: 1.0e5, V_clamp: 75.0, V_OR: 50.0}, expect: 1.2}

  - id: clamp.rcd.V
    title: "Clamp voltage of an RCD clamp set by its resistor"
    title_ko: "저항이 정하는 RCD 클램프 전압"
    lhs: V_clamp
    expr: "(V_OR + sqrt(V_OR**2 + 2*R_clamp*L_lk*I_pk**2*f_s))/2"
    symbols: {V_OR: "reflected output voltage", R_clamp: "clamp resistor", L_lk: "leakage inductance", I_pk: "peak primary current at turn-off", f_s: "switching frequency"}
    assumptions: [constant_clamp, rcd_small_ripple, steady_state]
    notes: "the resistor dissipates the clamp power, $V_\\mathrm{clamp}^2/R_\\mathrm{clamp}$; a larger resistor gives a higher clamp voltage and a lower dissipation"
    notes_ko: "저항이 클램프 전력 $V_\\mathrm{clamp}^2/R_\\mathrm{clamp}$를 소산한다; 저항이 클수록 클램프 전압은 높아지고 소산 전력은 줄어든다"
    cite: {key: ti_ssztcv6, where: "RCD clamp: the trade-off between the clamp voltage and its losses; derived here"}
    derived_by: python/pe_core/derive/clamp.py
    tests:
      - {inputs: {V_OR: 50.0, R_clamp: 4687.5, L_lk: 2.0e-6, I_pk: 2.0, f_s: 1.0e5}, expect: 75.0}

  - id: tvs.R_D
    title: "Dynamic resistance of a TVS from its datasheet"
    title_ko: "데이터시트로부터 구한 TVS의 동저항"
    lhs: R_D
    expr: "(V_CL - V_BR)/I_PP"
    symbols: {V_CL: "clamping voltage at I_PP", V_BR: "breakdown voltage", I_PP: "peak pulse current"}
    assumptions: [tvs_linear]
    constraints: ["V_CL > V_BR"]
    notes: "the resistance that, in series with the breakdown voltage, gives the datasheet's clamping voltage at its peak pulse current; it applies to the datasheet's pulse, since the dynamic resistance depends on the pulse duration"
    notes_ko: "항복 전압과 직렬로 두었을 때 데이터시트의 피크 펄스 전류에서의 클램핑 전압을 주는 저항; 동저항은 펄스 폭에 따라 달라지므로 데이터시트의 그 펄스에 해당한다"
    cite: {key: st_an316, where: "clamping voltage = breakdown voltage + dynamic resistance x peak current, solved for the dynamic resistance at the datasheet's clamping voltage and peak pulse current"}
    tests:
      - {inputs: {V_CL: 90.0, V_BR: 60.0, I_PP: 10.0}, expect: 3.0}

  - id: tvs.V_clamp
    title: "Clamping voltage of a TVS at a given current"
    title_ko: "주어진 전류에서 TVS의 클램핑 전압"
    lhs: V_clamp
    expr: "V_BR + R_D*I_pk"
    symbols: {V_BR: "breakdown voltage", R_D: "dynamic resistance", I_pk: "peak current through the TVS"}
    assumptions: [tvs_linear]
    notes: "a TVS clamps above its breakdown voltage: judge it by its clamping voltage at the actual peak current"
    notes_ko: "TVS는 항복 전압보다 높은 전압에서 클램프한다: 실제 피크 전류에서의 클램핑 전압으로 판단해야 한다"
    cite: {key: st_an316, where: "clamping voltage from the breakdown voltage and the dynamic resistance"}
    tests:
      - {inputs: {V_BR: 60.0, R_D: 2.0, I_pk: 3.0}, expect: 66.0}

  - id: flyback.V_ceiling
    title: "Flyback: open-load output voltage limited by the primary clamp"
    title_ko: "플라이백: 1차 측 클램프가 제한하는 무부하 출력 전압"
    lhs: V_omax
    expr: "n*V_clamp - V_D"
    symbols: {n: "turns ratio N_s/N_p", V_clamp: "clamp voltage", V_D: "output-diode drop"}
    assumptions: [ideal, diode_drop, open_load, fixed_clamp]
    notes: "without a load and without regulation the output charges until its reflected voltage reaches the clamp voltage; from then on the clamp takes all of the input power, which it must be rated for. An RCD clamp's voltage rises with that power (the resistor must dissipate it), so this bound does not hold for it"
    notes_ko: "부하와 레귤레이션이 없으면 출력은 반사 전압이 클램프 전압에 도달할 때까지 충전되고, 그 뒤에는 클램프가 입력 전력을 모두 가져가므로 클램프는 그 전력을 견뎌야 한다. RCD 클램프의 전압은 그 전력에 따라 올라가므로(저항이 그 전력을 소산해야 함) 이 한계가 성립하지 않는다"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits: the flyback's transformer model); derived here"}
    derived_by: python/pe_core/derive/clamp.py
    tests:
      - {inputs: {n: 0.25, V_clamp: 100.0, V_D: 0.5}, expect: 24.5}

  - id: snub.C_par
    title: "Parasitic capacitance from two ringing frequencies"
    title_ko: "두 링잉 주파수로 구한 기생 커패시턴스"
    lhs: C_par
    expr: "C_add/((f_r0/f_r1)**2 - 1)"
    symbols: {C_add: "known capacitance added across the ringing node", f_r0: "ringing frequency without it", f_r1: "ringing frequency with it"}
    assumptions: [lossless_lc, unchanged_inductance]
    constraints: ["f_r0 > f_r1"]
    notes: "an added capacitance comparable to $C_\\mathrm{par}$ lowers the frequency clearly (adding three times $C_\\mathrm{par}$ halves it); a much smaller one changes it too little to measure"
    notes_ko: "$C_\\mathrm{par}$와 비슷한 크기의 커패시턴스를 더하면 주파수가 분명히 내려간다($C_\\mathrm{par}$의 세 배를 더하면 절반). 훨씬 작은 값은 측정할 수 있을 만큼 바꾸지 못한다"
    cite: {key: nexperia_an11160, where: "Sec. 3 (Determining C_LK and L_LK): the ringing frequency before and after a known capacitor is added; derived here"}
    derived_by: python/pe_core/derive/snubbers.py
    tests:
      - {inputs: {C_add: 1.5e-10, f_r0: 2.0e7, f_r1: 1.0e7}, expect: 5.0e-11}
      # AN11160's own example (Sec. 3): 1 nF added, 91.74 MHz and 61.3 MHz, which it rounds to 807 pF
      - {inputs: {C_add: 1.0e-9, f_r0: 9.174e7, f_r1: 6.13e7}, expect: 8.066243792901876e-10}

  - id: snub.L_par
    title: "Parasitic inductance of a ringing node"
    title_ko: "링잉 노드의 기생 인덕턴스"
    lhs: L_par
    expr: "1/(4*pi**2*f_r0**2*C_par)"
    symbols: {f_r0: "ringing frequency", C_par: "parasitic capacitance of the node"}
    assumptions: [lossless_lc]
    cite: {key: nexperia_an11160, where: "Sec. 3 (Determining C_LK and L_LK): the inductance from the ringing frequency and the capacitance; derived here"}
    derived_by: python/pe_core/derive/snubbers.py
    tests:
      - {inputs: {f_r0: 2.0e7, C_par: 5.0e-11}, expect: 1.2665147955292222e-06}
      # AN11160's own example (Sec. 3): 91.74 MHz and 807 pF give 3.73 nH
      - {inputs: {f_r0: 9.174e7, C_par: 8.07e-10}, expect: 3.729488368105348e-09}

  - id: snub.R
    title: "RC snubber resistance for a damping factor"
    title_ko: "감쇠 계수로 정한 RC 스너버 저항"
    lhs: R_snub
    expr: "2*zeta*sqrt(L_par/C_snub)"
    symbols: {zeta: "damping factor", L_par: "parasitic (ringing) inductance", C_snub: "snubber capacitance"}
    assumptions: [lossless_lc]
    notes: "AN11160 takes the damping factor of the parasitic inductance, the resistor and the snubber capacitor in series, and sets it between 0.5 and 1 for the least peak voltage: the resistor lies between $\\sqrt{L_\\mathrm{par}/C_\\mathrm{snub}}$ and twice that, and the best value in that range is found by trials. The node's own capacitance is left out of this damping factor"
    notes_ko: "AN11160은 기생 인덕턴스, 저항, 스너버 커패시터를 직렬로 본 감쇠 계수를 쓰며, 피크 전압이 가장 낮도록 이를 0.5에서 1 사이로 잡는다. 저항은 $\\sqrt{L_\\mathrm{par}/C_\\mathrm{snub}}$와 그 두 배 사이에 있고, 그 범위에서 가장 좋은 값은 몇 번 시험해 찾는다. 노드 자체의 커패시턴스는 이 감쇠 계수에 들어가지 않는다"
    cite: {key: nexperia_an11160, where: "Sec. 2 (Designing the snubber - theory): the damping factor and the range of the snubber resistor; Sec. 4: the best value by trials"}
    derived_by: python/pe_core/derive/snubbers.py
    tests:
      - {inputs: {zeta: 0.75, L_par: 1.2665147955292222e-06, C_snub: 1.0e-10}, expect: 168.80930927945738}
      - {inputs: {zeta: 0.5, L_par: 1.0e-8, C_snub: 1.0e-9}, expect: 3.1622776601683795}

  - id: snub.P
    title: "Loss an RC snubber adds"
    title_ko: "RC 스너버가 더하는 손실"
    lhs: P
    expr: "C_snub*V_snub**2*f_s"
    symbols: {C_snub: "snubber capacitance", V_snub: "voltage the node swings through at each edge", f_s: "switching frequency"}
    assumptions: [snubber_full_swing]
    notes: "charging the snubber capacitor through its resistor loses as much energy as it stores, ½ C V², and the next edge discharges it, through the resistor and the switch that turns on, losing the stored energy: C V² per period, whatever the resistance. The parasitic inductance's energy is lost with or without a snubber. A larger snubber capacitor lowers the peak voltage the best resistor can reach, and loses more"
    notes_ko: "저항을 통해 스너버 커패시터를 충전하면 저장되는 만큼(½ C V²)의 에너지를 잃고, 다음 에지에서 저항과 켜지는 스위치를 통해 방전하면서 저장된 에너지를 잃는다. 저항값과 무관하게 한 주기에 C V²이다. 기생 인덕턴스의 에너지는 스너버가 있든 없든 잃는다. 스너버 커패시터가 클수록 가장 좋은 저항으로 얻을 수 있는 피크 전압은 낮아지지만 손실은 커진다"
    cite:
      - {key: nexperia_an11160, where: "Sec. 2 (Designing the snubber - theory): the average power loss due to the snubber; derived here"}
      - {key: erickson2020, where: "Ch. 4 (Switch Realization: the energy of a capacitance charged at each switching edge is dissipated)"}
    derived_by: python/pe_core/derive/snubbers.py
    tests:
      - {inputs: {C_snub: 2.2e-10, V_snub: 100.0, f_s: 1.0e5}, expect: 0.22}

  - id: snub.P_R
    title: "Dissipation in an RC snubber's resistor"
    title_ko: "RC 스너버 저항의 소산 전력"
    lhs: P_Rsnub
    expr: "f_s*(C_snub*V_snub**2 + L_par*I_ring**2)/2"
    symbols: {f_s: "switching frequency", C_snub: "snubber capacitance", V_snub: "voltage the node steps by at the edge", L_par: "parasitic (ringing) inductance", I_ring: "current in it when the ring starts"}
    assumptions: [snubber_charging_edge]
    notes: "AN11160 rates the resistor from this edge: the resistor takes as much energy as the capacitor stores and the parasitic inductance's energy. That can exceed the loss the snubber adds (`snub.P`), which leaves out the inductance's energy because it is lost with or without a snubber. Where the switch that turns on discharges the capacitor through the resistor, that edge heats the resistor too, with up to the capacitor's stored energy, and its rating must allow for it"
    notes_ko: "AN11160은 이 에지로 저항의 정격을 정한다. 저항은 커패시터가 저장하는 만큼의 에너지와 기생 인덕턴스의 에너지를 받는다. 이 값은 스너버가 더하는 손실(`snub.P`)보다 클 수 있다. 그 손실은 인덕턴스의 에너지를 빼는데, 그 에너지는 스너버가 있든 없든 잃기 때문이다. 켜지는 스위치가 저항을 통해 커패시터를 방전하는 회로에서는 그 에지도 저항을 가열하며(최대 커패시터에 저장된 에너지만큼), 정격에 이를 넣어야 한다"
    cite: {key: nexperia_an11160, where: "Sec. 4 (Designing the snubber - in practice): the power dissipation in the snubber resistor; Sec. 2: the energy lost in the resistor at turn-off; derived here"}
    derived_by: python/pe_core/derive/snubbers.py
    tests:
      - {inputs: {f_s: 1.0e5, C_snub: 1.0e-10, V_snub: 100.0, L_par: 1.0e-6, I_ring: 1.0}, expect: 0.1}
      # AN11160's own example (Sec. 4): 300 kHz, 1.6 nF, 20 V, 3.73 nH and 3.64 A, about 103 mW (its worked line prints the inductance as 3.37 nH; the rounded result is the same)
      - {inputs: {f_s: 3.0e5, C_snub: 1.6e-9, V_snub: 20.0, L_par: 3.73e-9, I_ring: 3.64}, expect: 0.103413151200}

  - id: dcm.ring.f
    title: "Ringing frequency of the switch node in the DCM idle interval"
    title_ko: "DCM 휴지 구간의 스위치 노드 링잉 주파수"
    lhs: f_ring
    expr: "1/(2*pi*sqrt(L_M*C_node))"
    symbols: {L_M: "(magnetizing) inductance", C_node: "total switch-node capacitance"}
    assumptions: [lossless_lc]
    notes: "after the diode current reaches zero, $L_M$ rings with the switch-node capacitance"
    notes_ko: "다이오드 전류가 0이 된 뒤 $L_M$이 스위치 노드 커패시턴스와 공진함"
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions: resonant frequency of an L-C pair)"}
    derived_by: python/pe_core/derive/energy.py
    tests:
      - {inputs: {L_M: 1.0e-4, C_node: 1.0e-10}, expect: 1591549.4309189534}

  - id: loss.cond
    title: "Conduction loss in a resistance"
    title_ko: "저항의 도통 손실"
    lhs: P
    expr: "I_rms**2*R_x"
    symbols: {I_rms: "rms current", R_x: "resistance carrying the current"}
    assumptions: [steady_state]
    cite: {key: erickson2020, where: "Ch. 3 (Steady-State Equivalent Circuit Modeling, Losses, and Efficiency)"}
    derived_by: python/pe_core/derive/energy.py
    tests:
      - {inputs: {I_rms: 2.0, R_x: 0.05}, expect: 0.2}

  - id: loss.sw.cap
    title: "Capacitive turn-on loss"
    title_ko: "용량성 턴온 손실"
    lhs: P
    expr: "C_node*V_sw**2*f_s/2"
    symbols: {C_node: "switch-node capacitance", V_sw: "voltage at turn-on", f_s: "switching frequency"}
    assumptions: [steady_state, full_discharge, energy_lost]
    cite: {key: erickson2020, where: "Ch. 4 (Switch Realization)"}
    derived_by: python/pe_core/derive/energy.py
    tests:
      - {inputs: {C_node: 1.0e-10, V_sw: 100.0, f_s: 1.0e5}, expect: 0.05}

  - id: loss.gate
    title: "Gate-drive power"
    title_ko: "게이트 구동 전력"
    lhs: P
    expr: "Q_g*V_GS*f_s"
    symbols: {Q_g: "total gate charge at V_GS", V_GS: "gate-drive voltage", f_s: "switching frequency"}
    assumptions: [steady_state]
    notes: "dissipated in the driver and gate resistances, not in the power switch channel"
    notes_ko: "전력 스위치 채널이 아니라 드라이버와 게이트 저항에서 소산됨"
    cite: {key: balogh2018}
    derived_by: python/pe_core/derive/energy.py
    tests:
      - {inputs: {Q_g: 2.0e-8, V_GS: 10.0, f_s: 1.0e5}, expect: 0.02}

  - id: loss.diode
    title: "Diode conduction loss"
    title_ko: "다이오드 도통 손실"
    lhs: P
    expr: "V_F*I_avg + r_d*I_rms**2"
    symbols: {V_F: "forward-voltage intercept", I_avg: "average diode current", r_d: "dynamic resistance", I_rms: "rms diode current"}
    assumptions: [steady_state]
    cite: {key: erickson2020, where: "Ch. 3 (Steady-State Equivalent Circuit Modeling, Losses, and Efficiency)"}
    derived_by: python/pe_core/derive/energy.py
    tests:
      - {inputs: {V_F: 0.7, I_avg: 1.0, r_d: 0.1, I_rms: 2.0}, expect: 1.1}

  - id: loss.steinmetz
    title: "Core loss per unit volume (Steinmetz form)"
    title_ko: "단위 체적당 코어 손실(스타인메츠 식)"
    lhs: P_v
    expr: "k*f**alpha*B_ac**beta"
    symbols: {k: "coefficient", f: "frequency", alpha: "frequency exponent", B_ac: "peak AC flux density", beta: "flux exponent"}
    assumptions: [sinusoidal_excitation]
    convention: "$B_\\mathrm{ac}$ is the peak AC amplitude, half the peak-to-peak swing $\\Delta B$; $k$, $\\alpha$, $\\beta$ are fitted per material and valid only over the fitted range"
    convention_ko: "$B_\\mathrm{ac}$는 피크 교류 진폭(피크-피크 $\\Delta B$의 절반); $k$, $\\alpha$, $\\beta$는 재료별 피팅값이며 피팅 범위 안에서만 유효"
    notes: "Steinmetz's original law gives loss per cycle proportional to $B^{1.6}$; the frequency term is the empirical extension used with ferrite data"
    notes_ko: "스타인메츠의 원래 법칙은 주기당 손실이 $B^{1.6}$에 비례; 주파수 항은 페라이트 데이터에 쓰이는 경험적 확장"
    cite:
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: core loss)"}
      - {key: steinmetz1984}
    tests:
      - {inputs: {k: 1.0, f: 1.0e5, alpha: 1.5, B_ac: 0.1, beta: 2.5}, expect: 100000.0}
      - {inputs: {k: 2.0, f: 2.0e4, alpha: 1.2, B_ac: 0.2, beta: 2.6}, expect: 4415.1349166758855}

  - id: loss.core
    title: "Core loss of a core"
    title_ko: "코어 전체의 코어 손실"
    lhs: P
    expr: "P_v*V_e"
    symbols: {P_v: "core loss per unit volume", V_e: "effective core volume"}
    assumptions: [uniform_flux_volume]
    notes: "the flux density is taken as uniform over the effective volume $V_e = A_e l_e$"
    notes_ko: "자속 밀도가 유효 부피 $V_e = A_e l_e$ 전체에서 균일하다고 본다"
    cite: {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: core loss)"}
    tests:
      - {inputs: {P_v: 1.0e5, V_e: 3.0e-6}, expect: 0.3}

  # =========================================================================
  # Magnetics
  # =========================================================================
  - id: mag.L_from_AL
    title: "Inductance from the inductance factor"
    title_ko: "인덕턴스 계수로부터 인덕턴스"
    lhs: L
    expr: "A_L*N**2"
    symbols: {A_L: "inductance factor", N: "number of turns"}
    assumptions: [linear_magnetics]
    cite:
      - {key: dixon2001}
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory)"}
    derived_by: python/pe_core/derive/magnetics.py
    tests:
      - {inputs: {A_L: 1.0e-7, N: 10.0}, expect: 1.0e-5}

  - id: mag.AL_gap
    title: "Inductance factor of a gapped core"
    title_ko: "공극이 있는 코어의 인덕턴스 계수"
    lhs: A_L
    relation: approx
    expr: "mu_0*A_e/(l_g + l_e/mu_i)"
    symbols: {mu_0: "permeability of free space", A_e: "effective area", l_g: "gap length", l_e: "effective path length", mu_i: "initial relative permeability"}
    assumptions: [linear_magnetics, no_fringing, uniform_flux]
    notes: "fringing makes the real $A_L$ larger than this estimate; use the manufacturer's $A_L$ for a specified gap"
    notes_ko: "프린징 때문에 실제 $A_L$은 이 추정보다 큼; 공극이 지정된 코어는 제조사 $A_L$ 사용"
    cite:
      - {key: dixon2001}
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: magnetic circuits)"}
    derived_by: python/pe_core/derive/magnetics.py
    tests:
      - {inputs: {A_e: 1.0e-4, l_g: 1.0e-3, l_e: 0.05, mu_i: 2000.0}, expect: 1.225987377010651e-07}
      - {inputs: {A_e: 5.0e-5, l_g: 5.0e-4, l_e: 0.04, mu_i: 1000.0}, expect: 1.1635528346628865e-07}

  - id: mag.B_pk
    title: "Peak flux density from inductance and peak current"
    title_ko: "인덕턴스와 피크 전류로부터 피크 자속 밀도"
    lhs: B_pk
    expr: "L*I_pk/(N*A_e)"
    symbols: {L: "inductance", I_pk: "peak current", N: "number of turns", A_e: "effective area"}
    assumptions: [linear_magnetics, uniform_flux]
    cite:
      - {key: dixon2001}
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory)"}
    derived_by: python/pe_core/derive/magnetics.py
    tests:
      - {inputs: {L: 1.0e-4, I_pk: 2.0, N: 20.0, A_e: 1.0e-4}, expect: 0.1}

  - id: mag.B_ac
    title: "AC flux-density amplitude from the current ripple"
    title_ko: "전류 리플로부터 교류 자속 밀도 진폭"
    lhs: B_ac
    expr: "L*Delta_i_L/(N*A_e)"
    symbols: {L: "inductance", Delta_i_L: "current ripple, half of peak-to-peak", N: "number of turns", A_e: "effective area"}
    assumptions: [linear_magnetics, uniform_flux]
    convention: "$\\Delta i_L$ is half the peak-to-peak ripple (Erickson), so $B_\\mathrm{ac}$ is half the peak-to-peak swing $\\Delta B$: the amplitude that core-loss data take"
    convention_ko: "$\\Delta i_L$은 피크-피크 리플의 절반(Erickson)이므로 $B_\\mathrm{ac}$는 피크-피크 변화폭 $\\Delta B$의 절반, 곧 코어 손실 데이터가 쓰는 진폭이다"
    notes: "the flux density follows the current, so the ripple alone sets its swing, the quantity core-loss data are given for; the dc current sets where the swing lies, and with it the margin to saturation ($B_\\mathrm{pk}$)"
    notes_ko: "자속 밀도는 전류를 따르므로 변화폭은 리플만으로 정해지며, 코어 손실 데이터는 이 변화폭에 대해 주어진다; 직류 전류는 변화폭의 위치와 그에 따른 포화까지의 여유($B_\\mathrm{pk}$)를 정한다"
    cite: {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory); derived here"}
    derived_by: python/pe_core/derive/magnetics.py
    tests:
      - {inputs: {L: 1.0e-4, Delta_i_L: 0.2, N: 20.0, A_e: 5.25e-5}, expect: 0.019047619047619049}

  - id: mag.dB_faraday
    title: "Flux-density swing from Faraday's law"
    title_ko: "패러데이 법칙으로 구한 자속 밀도 변화폭"
    lhs: Delta_B
    expr: "V_w*t_on/(N*A_e)"
    symbols: {V_w: "winding voltage during t_on", t_on: "on-time", N: "number of turns", A_e: "effective area"}
    assumptions: [uniform_flux]
    convention: "$\\Delta B$ is the peak-to-peak swing; the AC amplitude used in core-loss formulas is $\\Delta B/2$"
    convention_ko: "$\\Delta B$는 피크-피크 변화폭; 코어 손실식의 교류 진폭은 $\\Delta B/2$"
    cite:
      - {key: dixon2001}
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory)"}
    derived_by: python/pe_core/derive/magnetics.py
    tests:
      - {inputs: {V_w: 10.0, t_on: 5.0e-6, N: 20.0, A_e: 1.0e-4}, expect: 0.025}

  - id: mag.N_Bmax
    title: "Fewest turns that keep the peak flux density at a limit"
    title_ko: "피크 자속 밀도를 한계 이하로 유지하는 최소 턴 수"
    lhs: N
    expr: "L*I_pk/(B_max*A_e)"
    symbols: {L: "inductance", I_pk: "peak current", B_max: "largest flux density allowed", A_e: "effective area"}
    assumptions: [linear_magnetics, uniform_flux]
    notes: "more turns lower the peak flux density at the same inductance and current, but lengthen the winding and raise its resistance"
    notes_ko: "같은 인덕턴스와 전류에서 턴 수를 늘리면 피크 자속 밀도가 낮아지지만, 권선이 길어져 저항이 커진다"
    cite: {key: erickson2020, where: "Ch. 11 (Inductor Design); derived here"}
    derived_by: python/pe_core/derive/magnetics.py
    tests:
      - {inputs: {L: 1.0e-4, I_pk: 2.0, B_max: 0.25, A_e: 5.0e-5}, expect: 16.0}

  - id: mag.gap_length
    title: "Air-gap length that gives an inductance with N turns"
    title_ko: "N 턴으로 인덕턴스를 얻는 공극 길이"
    lhs: l_g
    relation: approx
    expr: "mu_0*A_e*N**2/L - l_e/mu_i"
    symbols: {mu_0: "permeability of free space", A_e: "effective area", N: "number of turns", L: "inductance", l_e: "effective path length", mu_i: "initial relative permeability"}
    assumptions: [linear_magnetics, no_fringing, uniform_flux]
    notes: "a negative result means the ungapped core already gives less than this inductance with N turns: more turns are needed; fringing lets a real gap be somewhat longer than this estimate"
    notes_ko: "결과가 음수이면 공극 없는 코어로도 N 턴에서 이 인덕턴스보다 작다는 뜻이므로 턴 수를 늘려야 한다; 프린징 때문에 실제 공극은 이 추정보다 조금 길어도 된다"
    cite: {key: erickson2020, where: "Ch. 11 (Inductor Design); derived here"}
    derived_by: python/pe_core/derive/magnetics.py
    tests:
      - {inputs: {A_e: 5.0e-5, N: 16.0, L: 1.0e-4, l_e: 0.05, mu_i: 2000.0}, expect: 1.358495438638e-4}

  - id: mag.Kg_req
    title: "Core geometrical constant an inductor needs"
    title_ko: "인덕터에 필요한 코어 기하 상수"
    lhs: K_g
    expr: "rho_w*L**2*I_pk**2/(B_max**2*R_dcmax*K_u)"
    symbols: {rho_w: "resistivity of the winding conductor", L: "inductance", I_pk: "peak winding current", B_max: "largest flux density allowed", R_dcmax: "largest winding resistance allowed (the copper-loss budget)", K_u: "window utilization that can be wound"}
    ranges: {K_u: [0.1, 0.7]}
    assumptions: [linear_magnetics, uniform_flux, uniform_dc_current]
    notes: "the specification's side of the four constraints (flux density, inductance, window, resistance) with the turns and the wire eliminated; any core whose own $K_g$ is at least this large can meet them, and its gap then sets the inductance. SI units, m⁵ (tables often give cm⁵: 1 m⁵ = 10¹⁰ cm⁵)"
    notes_ko: "네 가지 제약(자속 밀도, 인덕턴스, 창, 저항)에서 턴 수와 선재를 소거하고 남은 사양 쪽 값이다. 코어 자체의 $K_g$가 이 값 이상인 코어는 모든 제약을 만족할 수 있으며, 인덕턴스는 공극으로 맞춘다. SI 단위 m⁵(표는 흔히 cm⁵로 준다: 1 m⁵ = 10¹⁰ cm⁵)"
    cite: {key: erickson2020, where: "Ch. 11 (Inductor Design: the core geometrical constant K_g); derived here"}
    derived_by: python/pe_core/derive/magnetics.py
    tests:
      - {inputs: {rho_w: 1.7241e-8, L: 1.0e-4, I_pk: 5.0, B_max: 0.3, R_dcmax: 0.03, K_u: 0.4}, expect: 3.990972222222222e-12}
      - {inputs: {rho_w: 2.0e-8, L: 1.0e-3, I_pk: 1.0, B_max: 0.25, R_dcmax: 0.1, K_u: 0.5}, expect: 6.4e-12}

  - id: mag.Kg_core
    title: "Core geometrical constant of a core"
    title_ko: "코어의 기하 상수"
    lhs: K_g
    expr: "A_e**2*W_A/MLT"
    symbols: {A_e: "effective core area", W_A: "winding window area", MLT: "mean length per turn"}
    assumptions: [definition]
    notes: "the core's side: it grows as the fifth power of the core's linear size, so a core with twice the $K_g$ is only about 15 % larger in each dimension"
    notes_ko: "코어 쪽 값이다. 코어 선형 크기의 5제곱으로 커지므로, $K_g$가 두 배인 코어는 각 치수가 약 15 %만 크다"
    cite: {key: erickson2020, where: "Ch. 11 (Inductor Design: the core geometrical constant K_g)"}
    tests:
      - {inputs: {A_e: 5.25e-5, W_A: 6.1e-5, MLT: 0.05}, expect: 3.362625e-12}
      - {inputs: {A_e: 7.6e-5, W_A: 9.7e-5, MLT: 0.0528}, expect: 1.061121212121212e-11}

  - id: wind.fill
    title: "Window utilization of a winding"
    title_ko: "권선의 창 이용률"
    lhs: K_u
    expr: "N*A_w/W_A"
    symbols: {N: "number of turns", A_w: "bare conductor area of one turn", W_A: "window area available to the winding"}
    assumptions: [definition]
    notes: "insulation, the bobbin and the gaps between round wires leave only part of the window to copper; a design keeps K_u below what it can wind"
    notes_ko: "절연, 보빈, 둥근 선 사이의 틈 때문에 창의 일부만 구리가 차지한다; 설계는 K_u를 실제로 감을 수 있는 값 아래로 유지한다"
    cite: {key: erickson2020, where: "Ch. 11 (Inductor Design)"}
    tests:
      - {inputs: {N: 16.0, A_w: 1.0e-6, W_A: 6.1e-5}, expect: 0.26229508196721313}

  - id: wind.dcr
    title: "DC resistance of a winding"
    title_ko: "권선의 직류 저항"
    lhs: R_dc
    expr: "rho_w*N*MLT/A_w"
    symbols: {rho_w: "resistivity of the conductor", N: "number of turns", MLT: "mean length per turn", A_w: "bare conductor area of one turn"}
    assumptions: [uniform_dc_current]
    notes: "the winding is a conductor $N \\cdot \\mathrm{MLT}$ long; the resistivity of copper rises with temperature"
    notes_ko: "권선은 길이 $N \\cdot \\mathrm{MLT}$인 도체이다; 구리의 저항률은 온도와 함께 커진다"
    cite: {key: erickson2020, where: "Ch. 11 (Inductor Design); derived here"}
    derived_by: python/pe_core/derive/windings.py
    tests:
      - {inputs: {rho_w: 1.7241e-8, N: 16.0, MLT: 0.05, A_w: 1.0e-6}, expect: 0.0137928}

  - id: wind.skin_depth
    title: "Skin depth of a conductor"
    title_ko: "도체의 표피 깊이"
    lhs: delta_s
    expr: "sqrt(rho_w/(pi*mu_0*f))"
    symbols: {rho_w: "resistivity of the conductor", mu_0: "permeability of free space (a non-magnetic conductor)", f: "frequency"}
    assumptions: [good_conductor]
    notes: "the current density falls by a factor $e$ for every skin depth into the conductor; conductors much thicker than $\\delta$ carry the current in a surface layer"
    notes_ko: "전류 밀도는 도체 안으로 표피 깊이 하나만큼 들어갈 때마다 $e$배 줄어든다; $\\delta$보다 훨씬 두꺼운 도체에서는 전류가 표면층으로만 흐른다"
    cite: {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: eddy currents in winding conductors); derived here"}
    derived_by: python/pe_core/derive/windings.py
    tests:
      - {inputs: {rho_w: 1.7241e-8, f: 1.0e5}, expect: 2.0897837969378229e-4}
      - {inputs: {rho_w: 1.7241e-8, f: 1.0e6}, expect: 6.6084766156383301e-5}

  - id: wind.dowell
    title: "AC resistance factor of a foil winding (Dowell)"
    title_ko: "박판 권선의 교류 저항 계수 (Dowell)"
    lhs: F_R
    expr: "phi_l*((sinh(2*phi_l) + sin(2*phi_l))/(cosh(2*phi_l) - cos(2*phi_l)) + 2*(M_l**2 - 1)/3*(sinh(phi_l) - sin(phi_l))/(cosh(phi_l) + cos(phi_l)))"
    symbols: {phi_l: "layer thickness over skin depth", M_l: "number of layers from zero MMF to its peak"}
    assumptions: [dowell_layers]
    notes: "the first term is the skin effect in each layer, the second the proximity effect of the layers' fields on each other, growing as $M_\\ell^2$; with $\\varphi$ well below 1 the factor tends to 1"
    notes_ko: "첫째 항은 각 층의 표피 효과, 둘째 항은 층들의 자계가 서로에게 주는 근접 효과로 $M_\\ell^2$에 따라 커진다; $\\varphi$가 1보다 충분히 작으면 계수는 1에 가까워진다"
    cite:
      - {key: dowell1966}
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: eddy currents in winding conductors)"}
    tests:
      - {inputs: {phi_l: 1.0, M_l: 1.0}, expect: 1.0856357047503276}
      - {inputs: {phi_l: 1.0, M_l: 3.0}, expect: 1.9399646964915157}
      - {inputs: {phi_l: 0.5, M_l: 2.0}, expect: 1.0263231266309407}

  - id: wind.phi_foil
    title: "Foil thickness in skin depths"
    title_ko: "표피 깊이로 잰 박판 두께"
    lhs: phi_l
    expr: "h_l/delta_s"
    symbols: {h_l: "foil (layer) thickness", delta_s: "skin depth at the frequency of the current"}
    assumptions: [definition]
    notes: "for round wire, `wind.phi_round` gives the equivalent foil's $\\varphi$"
    notes_ko: "둥근 선에서는 `wind.phi_round`가 등가 박판의 $\\varphi$를 준다"
    cite: {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: eddy currents in winding conductors)"}
    tests:
      - {inputs: {h_l: 3.0e-4, delta_s: 2.0897837969378229e-4}, expect: 1.4355552016413966}

  - id: wind.dowell_low
    title: "AC resistance factor of thin layers (Dowell's series)"
    title_ko: "얇은 층의 교류 저항 계수 (Dowell 식의 급수)"
    lhs: F_R
    relation: approx
    expr: "1 + (5*M_l**2 - 1)*phi_l**4/45"
    symbols: {phi_l: "layer thickness over skin depth", M_l: "number of layers from zero MMF to its peak"}
    assumptions: [dowell_layers, thin_layers]
    notes: "the first terms of Dowell's factor in powers of $\\varphi$: the excess loss grows as $\\varphi^4$ and, through the proximity effect, as $M_\\ell^2$. For $\\varphi \\le 1$ it lies above the exact factor by at most about 4 %"
    notes_ko: "Dowell 계수를 $\\varphi$의 거듭제곱으로 전개한 첫 항들이다. 초과 손실은 $\\varphi^4$에 비례하고, 근접 효과 때문에 $M_\\ell^2$에 비례해 커진다. $\\varphi \\le 1$에서는 정확한 계수보다 최대 약 4 % 크다"
    cite:
      - {key: dowell1966, where: "the one-dimensional model of foil layers whose factor this series expands"}
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: eddy currents in winding conductors); derived here as the series of Dowell's factor"}
    derived_by: python/pe_core/derive/windings.py
    tests:
      - {inputs: {phi_l: 0.5, M_l: 2.0}, expect: 1.0263888888888888}
      - {inputs: {phi_l: 1.0, M_l: 3.0}, expect: 1.9777777777777779}

  - id: wind.loss_rel
    title: "Loss of a winding layer at a given frequency, against its thickness"
    title_ko: "주파수가 정해졌을 때 권선 층 두께에 따른 손실"
    lhs: P_rel
    expr: "F_R/phi_l"
    symbols: {F_R: "ac resistance factor", phi_l: "layer thickness over skin depth"}
    ranges: {F_R: [1, 100]}
    assumptions: [dowell_layers, layer_resistance]
    notes: "the loss relative to that of a layer one skin depth thick carrying the same current as dc: a thicker layer lowers the dc resistance ($1/\\varphi$) and raises $F_R$"
    notes_ko: "같은 전류가 직류로 흐르는 두께 한 표피 깊이 층의 손실에 대한 비이다. 층이 두꺼우면 직류 저항($1/\\varphi$)은 줄고 $F_R$는 커진다"
    cite:
      - {key: dowell1966}
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: eddy currents in winding conductors); derived here"}
    derived_by: python/pe_core/derive/windings.py
    tests:
      - {inputs: {F_R: 1.3333333333333333, phi_l: 0.7641166194509462}, expect: 1.7449343456125794}
      - {inputs: {F_R: 3.1875334226106182, phi_l: 1.2521493198384908}, expect: 2.5456496059286}

  - id: wind.phi_opt
    title: "Layer thickness of least loss"
    title_ko: "손실이 가장 작은 층 두께"
    lhs: phi_opt
    relation: approx
    expr: "(15/(5*M_l**2 - 1))**(1/4)"
    symbols: {M_l: "number of layers from zero MMF to its peak"}
    assumptions: [dowell_layers, thin_layers, layer_resistance]
    notes: "at a given frequency a thicker layer has less dc resistance but a larger $F_R$; their product, the loss, is least at this thickness, where $F_R = 4/3$. The more layers, the thinner the best layer. From the series of Dowell's factor: within 2 % of the exact optimum for two or more layers; for one layer the exact optimum is $\\varphi = \\pi/2$"
    notes_ko: "주파수가 같을 때 층이 두꺼우면 직류 저항은 작아지지만 $F_R$가 커진다. 둘의 곱인 손실은 이 두께에서 가장 작고, 이때 $F_R = 4/3$이다. 층이 많을수록 최적 층은 얇다. Dowell 계수의 급수에서 나온 값으로, 층이 두 개 이상이면 정확한 최적값과 2 % 이내로 맞고, 층이 하나이면 정확한 최적값은 $\\varphi = \\pi/2$이다"
    cite:
      - {key: dowell1966}
      - {key: hurley2000, where: "the optimum layer thickness, for any periodic current waveform; derived here for a sinusoidal current"}
    derived_by: python/pe_core/derive/windings.py
    tests:
      - {inputs: {M_l: 2.0}, expect: 0.9426151476815119}
      - {inputs: {M_l: 3.0}, expect: 0.7641166194509462}

  - id: xfmr.leakage.ps
    title: "Leakage inductance of a primary-secondary winding arrangement"
    title_ko: "1차-2차 권선 배치의 누설 인덕턴스"
    lhs: L_lk
    expr: "mu_0*N**2*MLT*(h_p/3 + h_g + h_s/3)/b_w"
    symbols: {mu_0: "permeability of free space", N: "primary turns", MLT: "mean length per turn", h_p: "primary height", h_g: "spacing between the windings", h_s: "secondary height", b_w: "winding breadth"}
    assumptions: [window_field]
    notes: "referred to the primary; each winding counts with a third of its height and the spacing in full, and a broad, low window gives the least leakage"
    notes_ko: "1차 측으로 환산한 값; 각 권선은 높이의 1/3이, 권선 사이 간격은 전부가 들어가며, 폭이 넓고 높이가 낮은 창일수록 누설이 작다"
    cite: {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: leakage flux in windings, MMF diagrams); derived here"}
    derived_by: python/pe_core/derive/windings.py
    tests:
      - {inputs: {N: 20.0, MLT: 0.05, h_p: 1.0e-3, h_g: 2.0e-4, h_s: 1.0e-3, b_w: 0.02}, expect: 1.0890854532445e-6}

  - id: xfmr.leakage.psp
    title: "Leakage inductance with the primary split around the secondary (P-S-P)"
    title_ko: "1차 권선을 2차 권선 양쪽으로 나눈 배치(P-S-P)의 누설 인덕턴스"
    lhs: L_lk
    expr: "mu_0*N**2*MLT*(h_p/3 + 2*h_g + h_s/3)/(4*b_w)"
    symbols: {mu_0: "permeability of free space", N: "primary turns", MLT: "mean length per turn", h_p: "total primary height (both halves)", h_g: "spacing at each of the two interfaces", h_s: "secondary height", b_w: "winding breadth"}
    assumptions: [window_field]
    notes: "splitting the primary halves the peak MMF, so the stored energy, and with it the leakage, falls to about a quarter"
    notes_ko: "1차 권선을 나누면 최대 기자력이 절반이 되므로 저장 에너지와 누설이 약 1/4로 줄어든다"
    cite: {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: interleaving the windings); derived here"}
    derived_by: python/pe_core/derive/windings.py
    tests:
      - {inputs: {N: 20.0, MLT: 0.05, h_p: 1.0e-3, h_g: 2.0e-4, h_s: 1.0e-3, b_w: 0.02}, expect: 3.3510321638291e-7}

  - id: xfmr.k
    title: "Coupling coefficient of two windings"
    title_ko: "두 권선의 결합 계수"
    lhs: k_c
    expr: "L_12/sqrt(L_11*L_22)"
    symbols: {L_12: "mutual inductance", L_11: "inductance of winding 1 with winding 2 open", L_22: "inductance of winding 2 with winding 1 open"}
    assumptions: [definition]
    notes: "1 for perfect coupling; the leakage inductances make it smaller"
    notes_ko: "완전 결합이면 1이고, 누설 인덕턴스가 있으면 1보다 작다"
    cite:
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: the transformer model; coupled inductors)"}
      - {key: alexander2017, where: "Ch. 13 (Magnetically Coupled Circuits)"}
    tests:
      - {inputs: {L_12: 1.0e-4, L_11: 4.04e-4, L_22: 2.525e-5}, expect: 0.9900990099009901}

  - id: xfmr.L_sc
    title: "Inductance of a winding with the other winding shorted"
    title_ko: "다른 권선을 단락했을 때 한 권선의 인덕턴스"
    lhs: L_sc
    expr: "L_11*(1 - k_c**2)"
    symbols: {L_11: "inductance of winding 1 with winding 2 open", k_c: "coupling coefficient"}
    assumptions: [coupled_windings]
    notes: "the short holds the second winding's voltage, the rate of change of its flux linkage, at zero, so its current cancels most of the flux the two windings share; what is left is mainly the two windings' leakage (`xfmr.L_sc_T`): 1 − k² is small for a well-coupled transformer"
    notes_ko: "단락하면 둘째 권선의 전압, 즉 쇄교 자속의 변화율이 0으로 묶이므로 그 전류가 두 권선이 공유하는 자속의 대부분을 상쇄한다. 남는 것은 주로 두 권선의 누설이다(`xfmr.L_sc_T`). 결합이 좋은 변압기에서는 1 − k²가 작다"
    cite:
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: the transformer model; coupled inductors); derived here"}
      - {key: alexander2017, where: "Ch. 13 (Magnetically Coupled Circuits)"}
    derived_by: python/pe_core/derive/windings.py
    tests:
      - {inputs: {L_11: 1.0e-3, k_c: 0.99}, expect: 1.99e-5}
      - {inputs: {L_11: 4.04e-4, k_c: 0.9900990099009901}, expect: 7.96039603960396e-6}

  - id: xfmr.L_sc_T
    title: "Short-circuit inductance in the transformer model"
    title_ko: "변압기 모델에서 본 단락 인덕턴스"
    lhs: L_sc
    expr: "L_l1 + L_l2p*L_M/(L_l2p + L_M)"
    symbols: {L_l1: "primary leakage inductance", L_l2p: "secondary leakage inductance referred to the primary", L_M: "magnetizing inductance referred to the primary"}
    assumptions: [coupled_windings, t_model]
    notes: "with $L_M$ much larger than the leakage inductances, $L_\\mathrm{sc} \\approx L_{\\ell 1} + L_{\\ell 2}'$: the short-circuit test measures the total leakage referred to the primary, not how it divides between the windings"
    notes_ko: "$L_M$가 누설 인덕턴스보다 훨씬 크면 $L_\\mathrm{sc} \\approx L_{\\ell 1} + L_{\\ell 2}'$이다. 단락 시험은 1차 기준으로 환산한 전체 누설을 잴 뿐, 그것이 두 권선에 어떻게 나뉘는지는 알려 주지 않는다"
    cite: {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: the transformer model with magnetizing and leakage inductances); derived here"}
    derived_by: python/pe_core/derive/windings.py
    tests:
      - {inputs: {L_l1: 4.0e-6, L_l2p: 4.0e-6, L_M: 4.0e-4}, expect: 7.96039603960396e-6}

  - id: xfmr.V_oc
    title: "Open-circuit voltage ratio of a transformer"
    title_ko: "변압기의 개방 전압비"
    lhs: V_ratio
    expr: "n*L_M/(L_l1 + L_M)"
    symbols: {n: "turns ratio N_s/N_p", L_M: "magnetizing inductance referred to the primary", L_l1: "primary leakage inductance"}
    assumptions: [coupled_windings, t_model]
    notes: "the primary's leakage and the magnetizing inductance divide the applied voltage, so the ratio reads below the turns ratio by about $L_{\\ell 1}/L_M$ (1 % for a leakage of 1 % of $L_M$). Driven from the secondary, $V_1/V_2$ reads below $1/n$ by about the secondary's leakage over $L_M$, both referred to the primary. A driven winding whose resistance is not small against its reactance lowers the ratio further"
    notes_ko: "1차 누설 인덕턴스와 자화 인덕턴스가 인가 전압을 나누어 가지므로, 전압비는 권선비보다 약 $L_{\\ell 1}/L_M$만큼 낮게 읽힌다(누설이 $L_M$의 1 %이면 1 %). 2차 쪽에서 구동하면 $V_1/V_2$가 $1/n$보다 약 2차 누설을 $L_M$으로 나눈 비율만큼(둘 다 1차 기준) 낮게 읽힌다. 구동하는 권선의 저항이 그 리액턴스에 비해 작지 않으면 전압비는 더 낮아진다"
    cite: {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: the transformer model with magnetizing and leakage inductances); derived here"}
    derived_by: python/pe_core/derive/windings.py
    tests:
      - {inputs: {n: 0.25, L_M: 4.0e-4, L_l1: 4.0e-6}, expect: 0.24752475247524752}
      - {inputs: {n: 2.0, L_M: 1.0e-3, L_l1: 1.0e-5}, expect: 1.9801980198019802}

  - id: wind.rho_T
    title: "Resistivity of a conductor at its temperature"
    title_ko: "온도에 따른 도체의 저항률"
    lhs: rho_w
    expr: "rho_20*(1 + alpha_20*(T_w - 20))"
    symbols: {rho_20: "resistivity at 20 °C", alpha_20: "temperature coefficient at 20 °C", T_w: "conductor temperature (°C)"}
    assumptions: [linear_temperature]
    notes: "for annealed copper $\\rho_{20} = 1.7241 \\times 10^{-8}\\,\\Omega\\,\\mathrm{m}$ and $\\alpha_{20} = 0.00393$ per kelvin; a winding at 100 °C has about 31 % more resistance than at 20 °C"
    notes_ko: "풀림 구리는 $\\rho_{20} = 1.7241 \\times 10^{-8}\\,\\Omega\\,\\mathrm{m}$, $\\alpha_{20} = 0.00393$ (켈빈당); 100 °C의 권선은 20 °C일 때보다 저항이 약 31 % 크다"
    cite: {key: nbs_hb100}
    tests:
      - {inputs: {rho_20: 1.7241e-8, alpha_20: 0.00393, T_w: 100.0}, expect: 2.26615704e-8}
      - {inputs: {rho_20: 1.7241e-8, alpha_20: 0.00393, T_w: 20.0}, expect: 1.7241e-8}

  - id: wind.round_area
    title: "Copper area of one turn of round strands"
    title_ko: "둥근 소선으로 감은 1턴의 구리 단면적"
    lhs: A_w
    expr: "k_s*pi*d_w**2/4"
    symbols: {k_s: "strands in parallel", d_w: "bare diameter of one strand"}
    assumptions: [definition]
    notes: "the bare diameter, without the insulation; wire tables give both"
    notes_ko: "절연을 뺀 나선 지름; 전선 표에는 두 지름이 모두 나온다"
    cite: {key: nbs_hb100}
    tests:
      - {inputs: {k_s: 1.0, d_w: 5.0e-4}, expect: 1.96349540849362077e-7}
      - {inputs: {k_s: 3.0, d_w: 3.0e-4}, expect: 2.12057504117311044e-7}

  - id: wind.porosity
    title: "Porosity of a layer of round conductors"
    title_ko: "둥근 도체 층의 점유율(porosity)"
    lhs: eta_p
    expr: "N_l*k_s*sqrt(pi/4)*d_w/b_w"
    symbols: {N_l: "turns in the layer", k_s: "strands in parallel", d_w: "bare diameter of one strand", b_w: "winding breadth"}
    assumptions: [square_equivalent]
    notes: "a square of side $\\sqrt{\\pi/4}\\,d_w$ has the strand's area; a layer whose squares fill the whole breadth has porosity 1, and a value above 1 means the turns do not fit in the layer"
    notes_ko: "한 변이 $\\sqrt{\\pi/4}\\,d_w$인 정사각형이 소선과 같은 면적이다; 정사각형들이 폭 전체를 채우면 점유율은 1이며, 1보다 크면 그 턴들이 한 층에 들어가지 않는다"
    cite:
      - {key: dowell1966}
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: foil windings and layers)"}
    tests:
      - {inputs: {N_l: 20.0, k_s: 1.0, d_w: 5.0e-4, b_w: 0.0125}, expect: 0.708981540362206411}
      - {inputs: {N_l: 12.0, k_s: 2.0, d_w: 3.0e-4, b_w: 0.02}, expect: 0.319041693162992885}

  - id: wind.phi_round
    title: "Dowell's layer thickness for round conductors"
    title_ko: "둥근 도체에 대한 Dowell의 층 두께 변수"
    lhs: phi_l
    expr: "sqrt(eta_p)*sqrt(pi/4)*d_w/delta_s"
    symbols: {eta_p: "porosity of the layer", d_w: "bare diameter of one strand", delta_s: "skin depth"}
    assumptions: [square_equivalent]
    notes: "the equivalent foil is $\\sqrt{\\pi/4}\\,d_w$ thick; its gaps lower its effective conductivity by the porosity, which enters as $\\sqrt{\\eta}$"
    notes_ko: "등가 박판의 두께는 $\\sqrt{\\pi/4}\\,d_w$이다; 도체 사이의 틈은 유효 전도율을 점유율만큼 낮추며, 이는 $\\sqrt{\\eta}$로 들어간다"
    cite:
      - {key: dowell1966}
      - {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory: foil windings and layers)"}
    tests:
      - {inputs: {eta_p: 0.7, d_w: 5.0e-4, delta_s: 2.0897837969378229e-4}, expect: 1.77403673062017143}
      - {inputs: {eta_p: 1.0, d_w: 1.0e-3, delta_s: 6.6084766156383301e-5}, expect: 13.4104571597573101}

  # =========================================================================
  # Sources, extraction, sensing
  # =========================================================================
  - id: src.Pmax
    title: "Maximum power from a linear source"
    title_ko: "선형 전원의 최대 전력"
    lhs: P_max
    expr: "V_oc**2/(4*R_s)"
    symbols: {V_oc: "open-circuit voltage", R_s: "source resistance"}
    assumptions: [linear_source]
    notes: "delivered into a matched load $R_L = R_s$"
    notes_ko: "정합 부하 $R_L = R_s$에 전달될 때"
    cite: {key: alexander2017, where: "Sec. 4.8 (Maximum Power Transfer)"}
    derived_by: python/pe_core/derive/harvesting.py
    tests:
      - {inputs: {V_oc: 10.0, R_s: 25.0}, expect: 1.0}

  - id: src.cv_power
    title: "Power from a linear source into a constant-voltage sink"
    title_ko: "선형 전원에서 정전압 싱크로 들어가는 전력"
    lhs: P
    expr: "V_c*(V_oc - V_c)/R_s"
    symbols: {V_c: "sink voltage", V_oc: "open-circuit voltage", R_s: "source resistance"}
    assumptions: [linear_source]
    notes: "the source current $(V_\\mathrm{oc} - V_c)/R_s$ times the sink voltage; negative when $V_c > V_\\mathrm{oc}$, when the sink returns energy to the source"
    notes_ko: "전원 전류 $(V_\\mathrm{oc} - V_c)/R_s$에 싱크 전압을 곱한 값; $V_c > V_\\mathrm{oc}$이면 음수이며 싱크가 전원으로 에너지를 되돌려 보냄"
    cite: {key: alexander2017, where: "Sec. 4.8 (Maximum Power Transfer); derived here"}
    derived_by: python/pe_core/derive/harvesting.py
    tests:
      - {inputs: {V_c: 5.0, V_oc: 10.0, R_s: 25.0}, expect: 1.0}
      - {inputs: {V_c: 5.0, V_oc: 2.5, R_s: 25.0}, expect: -0.5}

  - id: src.cv_extraction
    title: "Extraction fraction of a constant-voltage sink"
    title_ko: "정전압 싱크의 추출 비율"
    lhs: eta_ext
    expr: "4*V_c*(V_oc - V_c)/V_oc**2"
    symbols: {V_c: "sink voltage", V_oc: "open-circuit voltage"}
    assumptions: [linear_source]
    constraints: ["V_c < V_oc"]
    notes: "power into the sink as a fraction of $P_\\mathrm{max}$; equals 1 only at $V_c = V_\\mathrm{oc}/2$"
    notes_ko: "싱크로 들어가는 전력의 $P_\\mathrm{max}$ 대비 비율; $V_c = V_\\mathrm{oc}/2$에서만 1"
    cite: {key: alexander2017, where: "Sec. 4.8 (Maximum Power Transfer); derived here"}
    derived_by: python/pe_core/derive/harvesting.py
    tests:
      - {inputs: {V_c: 5.0, V_oc: 10.0}, expect: 1.0}
      - {inputs: {V_c: 2.5, V_oc: 10.0}, expect: 0.75}

  - id: lfr.Vg
    title: "Bus voltage of a loss-free resistor fed by a linear source"
    title_ko: "선형 전원에 연결된 무손실 저항의 버스 전압"
    lhs: V_g
    expr: "V_oc*R_in/(R_s + R_in)"
    symbols: {V_oc: "open-circuit voltage", R_s: "source resistance", R_in: "loss-free input resistance"}
    assumptions: [linear_source, dcm, steady_state]
    notes: "a converter whose input is a resistance divides the source voltage with the source resistance"
    notes_ko: "입력이 저항으로 보이는 컨버터는 전원 전압을 전원 저항과 분압한다"
    cite: {key: alexander2017, where: "Sec. 4.8 (Maximum Power Transfer); derived here"}
    derived_by: python/pe_core/derive/harvesting.py
    tests:
      - {inputs: {V_oc: 10.0, R_s: 100.0, R_in: 100.0}, expect: 5.0}
      - {inputs: {V_oc: 12.0, R_s: 100.0, R_in: 300.0}, expect: 9.0}

  - id: lfr.eta
    title: "Extraction fraction of a loss-free resistor"
    title_ko: "무손실 저항의 추출 비율"
    lhs: eta_ext
    expr: "4*R_s*R_in/(R_s + R_in)**2"
    symbols: {R_s: "source resistance", R_in: "loss-free input resistance"}
    assumptions: [linear_source, dcm, steady_state]
    notes: "power into the loss-free resistor as a fraction of $P_\\mathrm{max}$; independent of the source amplitude, and 1 when $R_\\mathrm{in} = R_s$"
    notes_ko: "무손실 저항으로 들어가는 전력의 $P_\\mathrm{max}$ 대비 비율; 전원 진폭과 무관하며 $R_\\mathrm{in} = R_s$일 때 1"
    cite: {key: alexander2017, where: "Sec. 4.8 (Maximum Power Transfer); derived here"}
    derived_by: python/pe_core/derive/harvesting.py
    tests:
      - {inputs: {R_s: 100.0, R_in: 100.0}, expect: 1.0}
      - {inputs: {R_s: 100.0, R_in: 300.0}, expect: 0.75}

  - id: lfr.Vg_power
    title: "Input voltage at which a loss-free resistor draws a given power"
    title_ko: "무손실 저항이 주어진 전력을 끌어오는 입력 전압"
    lhs: V_g
    expr: "sqrt(P*R_in)"
    symbols: {P: "power drawn", R_in: "loss-free input resistance"}
    assumptions: [ideal, dcm, steady_state]
    notes: "more power through the same input resistance needs a higher input voltage, which the switch must also block"
    notes_ko: "같은 입력 저항으로 더 많은 전력을 끌어오려면 입력 전압이 높아야 하며, 스위치도 그만큼 높은 전압을 차단해야 한다"
    cite:
      - {key: erickson2020, where: "Ch. 15 (AC and DC Equivalent Circuit Modeling of the Discontinuous Conduction Mode); derived here"}
      - {key: singer1990}
    derived_by: python/pe_core/derive/harvesting.py
    tests:
      - {inputs: {P: 0.5, R_in: 200.0}, expect: 10.0}

  - id: lfr.L_M
    title: "Magnetizing inductance of a DCM flyback that presents a given input resistance"
    title_ko: "주어진 입력 저항을 보이는 DCM 플라이백의 자화 인덕턴스"
    lhs: L_M
    expr: "R_in*D**2/(2*f_s)"
    symbols: {R_in: "loss-free input resistance wanted", D: "duty ratio", f_s: "switching frequency"}
    assumptions: [ideal, dcm, steady_state]
    notes: "the loss-free resistor $R_\\mathrm{in} = 2 L_M f_s / D^2$ solved for $L_M$; to match a linear source, $R_\\mathrm{in} = R_s$"
    notes_ko: "무손실 저항 $R_\\mathrm{in} = 2 L_M f_s / D^2$를 $L_M$에 대해 푼 식; 선형 전원에 정합하려면 $R_\\mathrm{in} = R_s$"
    cite:
      - {key: erickson2020, where: "Ch. 15 (AC and DC Equivalent Circuit Modeling of the Discontinuous Conduction Mode); derived here"}
      - {key: singer1990}
    derived_by: python/pe_core/derive/harvesting.py
    tests:
      - {inputs: {R_in: 1.0e4, D: 0.2, f_s: 1.0e4}, expect: 0.02}

  - id: lfr.P_env
    title: "Average power a loss-free resistor takes from a source whose open-circuit voltage follows a sinusoidal envelope"
    title_ko: "개방 전압이 사인파 포락선을 따르는 전원에서 무손실 저항이 받는 평균 전력"
    lhs: P_avg
    expr: "eta_ext*V_ocpk**2/(8*R_s)"
    symbols: {eta_ext: "extraction fraction of the loss-free resistor", V_ocpk: "peak of the open-circuit voltage", R_s: "source resistance"}
    assumptions: [linear_source, slow_envelope]
    ranges: {eta_ext: [0.05, 1.0]}
    notes: "the power $\\eta_\\mathrm{ext} V_\\mathrm{oc}^2/(4 R_s)$ follows the square of the envelope, and the square of a sine (or of a rectified sine) averages to half its peak's"
    notes_ko: "전력 $\\eta_\\mathrm{ext} V_\\mathrm{oc}^2/(4 R_s)$는 포락선의 제곱을 따르며, 사인(또는 정류된 사인)의 제곱은 평균이 최댓값 제곱의 절반이다"
    cite: {key: alexander2017, where: "Sec. 4.8 (Maximum Power Transfer) and Ch. 11 (AC Power Analysis); derived here"}
    derived_by: python/pe_core/derive/harvesting.py
    tests:
      - {inputs: {eta_ext: 1.0, V_ocpk: 1000.0, R_s: 1.0e6}, expect: 0.125}
      - {inputs: {eta_ext: 0.75, V_ocpk: 100.0, R_s: 1.0e4}, expect: 0.09375}

  - id: piezo.Vp
    title: "Open-circuit voltage amplitude of a vibrating piezoelectric element"
    title_ko: "진동하는 압전 소자의 개방 전압 진폭"
    lhs: V_p
    expr: "I_p/(omega*C_0)"
    symbols: {I_p: "current amplitude", omega: "vibration angular frequency", C_0: "clamped capacitance"}
    assumptions: [piezo_source]
    notes: "with nothing connected, the whole current charges and discharges $C_0$"
    notes_ko: "아무것도 연결하지 않으면 전류 전부가 $C_0$를 충방전한다"
    cite: {key: guyomar2005, where: "the element's electromechanical model; derived here"}
    derived_by: python/pe_core/derive/piezo.py
    tests:
      - {inputs: {I_p: 1.0e-4, omega: 1000.0, C_0: 5.0e-8}, expect: 2.0}

  - id: piezo.R_opt
    title: "Resistive load that takes the most power from a vibrating piezoelectric element"
    title_ko: "진동하는 압전 소자에서 가장 많은 전력을 받는 저항 부하"
    lhs: R
    expr: "1/(omega*C_0)"
    symbols: {omega: "vibration angular frequency", C_0: "clamped capacitance"}
    assumptions: [piezo_source]
    notes: "the reactance of the clamped capacitance at the vibration's frequency"
    notes_ko: "진동 주파수에서 클램프 커패시턴스의 리액턴스"
    cite: {key: guyomar2005, where: "the element's electromechanical model; derived here"}
    derived_by: python/pe_core/derive/piezo.py
    tests:
      - {inputs: {omega: 1000.0, C_0: 5.0e-8}, expect: 20000.0}

  - id: piezo.P_R
    title: "Power into the best resistive load"
    title_ko: "최적 저항 부하로 들어가는 전력"
    lhs: P
    expr: "I_p**2/(4*omega*C_0)"
    symbols: {I_p: "current amplitude", omega: "vibration angular frequency", C_0: "clamped capacitance"}
    assumptions: [piezo_source]
    notes: "a resistor $R$ across the element takes $I_p^2 R/(2(1 + (\\omega R C_0)^2))$, largest at $R = 1/(\\omega C_0)$"
    notes_ko: "소자 양단의 저항 $R$은 $I_p^2 R/(2(1 + (\\omega R C_0)^2))$를 받으며, $R = 1/(\\omega C_0)$에서 최대이다"
    cite: {key: guyomar2005, where: "the element's electromechanical model; derived here"}
    derived_by: python/pe_core/derive/piezo.py
    tests:
      - {inputs: {I_p: 1.0e-4, omega: 1000.0, C_0: 5.0e-8}, expect: 5.0e-5}

  - id: piezo.P_std
    title: "Power through a full-wave bridge onto a DC voltage (the standard interface)"
    title_ko: "전파 브리지를 거쳐 직류 전압으로 들어가는 전력(표준 인터페이스)"
    lhs: P
    expr: "2*V_DC*(I_p - omega*C_0*V_DC)/pi"
    symbols: {V_DC: "rectified DC voltage", I_p: "current amplitude", omega: "vibration angular frequency", C_0: "clamped capacitance"}
    assumptions: [piezo_source, ideal_bridge]
    constraints: ["V_DC < I_p/(omega*C_0)"]
    notes: "each half period the element's voltage swings from $-V_\\mathrm{DC}$ to $V_\\mathrm{DC}$ before the bridge conducts, which takes $2 C_0 V_\\mathrm{DC}$ of the $2 I_p/\\omega$ the source drives; from $V_\\mathrm{DC} = V_p$ on the bridge never conducts"
    notes_ko: "반주기마다 소자 전압이 $-V_\\mathrm{DC}$에서 $V_\\mathrm{DC}$까지 바뀐 뒤에야 브리지가 도통하며, 이 변화가 전원이 흘리는 $2 I_p/\\omega$ 가운데 $2 C_0 V_\\mathrm{DC}$를 가져간다; $V_\\mathrm{DC} = V_p$부터는 브리지가 도통하지 않는다"
    cite:
      - {key: guyomar2005, where: "the standard technique; derived here"}
      - {key: lefeuvre2006}
    derived_by: python/pe_core/derive/piezo.py
    tests:
      - {inputs: {V_DC: 1.0, I_p: 1.0e-4, omega: 1000.0, C_0: 5.0e-8}, expect: 3.18309886183791e-5}

  - id: piezo.P_std_max
    title: "Largest power of the standard interface"
    title_ko: "표준 인터페이스의 최대 전력"
    lhs: P_std_max
    expr: "I_p**2/(2*pi*omega*C_0)"
    symbols: {I_p: "current amplitude", omega: "vibration angular frequency", C_0: "clamped capacitance"}
    assumptions: [piezo_source, ideal_bridge]
    notes: "at $V_\\mathrm{DC} = V_p/2$, half the open-circuit amplitude"
    notes_ko: "$V_\\mathrm{DC} = V_p/2$, 즉 개방 전압 진폭의 절반에서"
    cite:
      - {key: guyomar2005, where: "the standard technique; derived here"}
      - {key: lefeuvre2006}
    derived_by: python/pe_core/derive/piezo.py
    tests:
      - {inputs: {I_p: 1.0e-4, omega: 1000.0, C_0: 5.0e-8}, expect: 3.18309886183791e-5}

  - id: piezo.P_sece
    title: "Power of synchronous electric charge extraction (SECE)"
    title_ko: "동기 전하 추출(SECE)의 전력"
    lhs: P
    expr: "2*I_p**2/(pi*omega*C_0)"
    symbols: {I_p: "current amplitude", omega: "vibration angular frequency", C_0: "clamped capacitance"}
    assumptions: [piezo_source, ideal]
    notes: "the element is left open and its whole charge is taken at each extremum of its voltage, $\\tfrac12 C_0 (2 V_p)^2$ twice a period whatever the load: four times the standard interface's largest power"
    notes_ko: "소자를 개방해 두고 전압이 극값일 때마다 전하 전부를 꺼내므로, 부하와 관계없이 한 주기에 두 번 $\\tfrac12 C_0 (2 V_p)^2$를 얻는다: 표준 인터페이스 최대 전력의 네 배"
    cite:
      - {key: lefeuvre2005, where: "derived here"}
      - {key: lefeuvre2006}
    derived_by: python/pe_core/derive/piezo.py
    tests:
      - {inputs: {I_p: 1.0e-4, omega: 1000.0, C_0: 5.0e-8}, expect: 1.27323954473516e-4}

  - id: piezo.P_sshi
    title: "Power of parallel synchronized switch harvesting on inductor (SSHI)"
    title_ko: "병렬 인덕터 동기 스위치 하베스팅(SSHI)의 전력"
    lhs: P
    expr: "2*V_DC*(I_p - omega*C_0*V_DC*(1 - gamma)/2)/pi"
    symbols: {V_DC: "rectified DC voltage", I_p: "current amplitude", omega: "vibration angular frequency", C_0: "clamped capacitance", gamma: "inversion coefficient"}
    assumptions: [piezo_source, ideal_bridge]
    constraints: ["V_DC*(1 - gamma) < 2*I_p/(omega*C_0)"]
    notes: "at each extremum of the displacement a switch and an inductor invert the element's voltage from $V_\\mathrm{DC}$ to $-\\gamma V_\\mathrm{DC}$, so the swing to the other rail takes only $(1 - \\gamma) C_0 V_\\mathrm{DC}$"
    notes_ko: "변위가 극값일 때마다 스위치와 인덕터가 소자 전압을 $V_\\mathrm{DC}$에서 $-\\gamma V_\\mathrm{DC}$로 반전시키므로, 반대쪽 레일까지의 변화에는 $(1 - \\gamma) C_0 V_\\mathrm{DC}$만 든다"
    cite:
      - {key: guyomar2005, where: "derived here"}
      - {key: lefeuvre2006}
    derived_by: python/pe_core/derive/piezo.py
    tests:
      - {inputs: {V_DC: 5.0, I_p: 1.0e-4, omega: 1000.0, C_0: 5.0e-8, gamma: 0.8}, expect: 2.38732414637843e-4}

  - id: piezo.P_sshi_max
    title: "Largest power of parallel SSHI"
    title_ko: "병렬 SSHI의 최대 전력"
    lhs: P_sshi_max
    expr: "I_p**2/(pi*omega*C_0*(1 - gamma))"
    symbols: {I_p: "current amplitude", omega: "vibration angular frequency", C_0: "clamped capacitance", gamma: "inversion coefficient"}
    assumptions: [piezo_source, ideal_bridge]
    notes: "at $V_\\mathrm{DC} = V_p/(1 - \\gamma)$: $2/(1 - \\gamma)$ times the standard interface's largest power"
    notes_ko: "$V_\\mathrm{DC} = V_p/(1 - \\gamma)$에서: 표준 인터페이스 최대 전력의 $2/(1 - \\gamma)$배"
    cite:
      - {key: guyomar2005, where: "derived here"}
      - {key: lefeuvre2006}
    derived_by: python/pe_core/derive/piezo.py
    tests:
      - {inputs: {I_p: 1.0e-4, omega: 1000.0, C_0: 5.0e-8, gamma: 0.8}, expect: 3.18309886183791e-4}

  - id: sense.current_out_monitor
    title: "Output of a current-output high-side current-sense amplifier"
    title_ko: "전류 출력형 하이사이드 전류 센스 증폭기의 출력"
    lhs: V_OUT
    expr: "I_SENSE*R_SENSE*R_OUT/R_IN"
    symbols: {I_SENSE: "sensed current", R_SENSE: "sense resistor", R_OUT: "output resistor", R_IN: "gain-setting input resistor"}
    assumptions: [ideal_amplifier]
    notes: "the amplifier forces $I_\\mathrm{SENSE} R_\\mathrm{SENSE}$ across $R_\\mathrm{IN}$ and sends that current through $R_\\mathrm{OUT}$; the output headroom limit is set by the supply, not by the gain"
    notes_ko: "증폭기가 $I_\\mathrm{SENSE} R_\\mathrm{SENSE}$를 $R_\\mathrm{IN}$ 양단에 걸고 그 전류를 $R_\\mathrm{OUT}$으로 흘림; 출력 헤드룸 한계는 이득이 아니라 전원 전압이 정함"
    cite: {key: adi_ltc6101}
    derived_by: python/pe_core/derive/sensing.py
    tests:
      - {inputs: {I_SENSE: 2.0, R_SENSE: 0.01, R_OUT: 1.0e4, R_IN: 100.0}, expect: 2.0}

  - id: sense.burden
    title: "Voltage across a current-sense resistor"
    title_ko: "전류 센스 저항 양단 전압"
    lhs: V_SENSE
    expr: "I_SENSE*R_SENSE"
    symbols: {I_SENSE: "sensed current", R_SENSE: "sense resistor"}
    assumptions: [linear_shunt]
    notes: "the signal the amplifier sees, and the burden: the voltage the shunt takes from the circuit it measures; the shunt dissipates the current times this voltage"
    notes_ko: "증폭기가 보는 신호이자, 션트가 측정 대상 회로에서 빼앗는 전압(부담 전압); 션트는 전류와 이 전압의 곱만큼 소산한다"
    cite: {key: alexander2017, where: "Ch. 2 (Basic Laws: Ohm's law)"}
    derived_by: python/pe_core/derive/sensing.py
    tests:
      - {inputs: {I_SENSE: 2.0, R_SENSE: 0.01}, expect: 0.02}

  - id: sense.voltage_out_monitor
    title: "Output of a fixed-gain voltage-output current-sense amplifier"
    title_ko: "고정 이득 전압 출력형 전류 센스 증폭기의 출력"
    lhs: V_OUT
    expr: "G_sense*I_SENSE*R_SENSE + V_REF"
    symbols: {G_sense: "fixed voltage gain", I_SENSE: "sensed current", R_SENSE: "sense resistor", V_REF: "voltage on the REF pin"}
    assumptions: [ideal_amplifier]
    notes: "the amplifier multiplies the sense voltage by its gain and adds the REF voltage, so a current of either sign swings the output either side of $V_\\mathrm{REF}$; the output cannot quite reach the supply rails"
    notes_ko: "증폭기가 센스 전압에 이득을 곱하고 REF 전압을 더하므로, 전류의 부호에 따라 출력이 $V_\\mathrm{REF}$ 위아래로 움직인다; 출력은 전원 레일까지 완전히 올라가지 못한다"
    cite: {key: ti_ina181, where: "Equation 1, from its definitions of the load current, the sense resistor, the gain and the REF voltage"}
    derived_by: python/pe_core/derive/sensing.py
    tests:
      - {inputs: {G_sense: 50.0, I_SENSE: 2.0, R_SENSE: 0.01, V_REF: 0.0}, expect: 1.0}
      - {inputs: {G_sense: 20.0, I_SENSE: 1.0, R_SENSE: 0.01, V_REF: 1.5}, expect: 1.7}

  - id: sense.offset_current
    title: "Current equivalent to a sense amplifier's input offset voltage"
    title_ko: "센스 증폭기의 입력 오프셋 전압에 해당하는 전류"
    lhs: I_OSeq
    expr: "V_OS/R_SENSE"
    symbols: {V_OS: "input offset voltage", R_SENSE: "sense resistor"}
    assumptions: [offset_only]
    notes: "the offset adds directly to the sense voltage, so the output reads it as this current: the error floor at small currents; a larger sense resistor lowers it"
    notes_ko: "오프셋이 센스 전압에 그대로 더해지므로 출력은 이를 이 전류로 읽는다: 작은 전류에서의 오차 하한; 센스 저항이 클수록 작아진다"
    cite:
      - {key: adi_ltc6101, where: "Applications Information: output error due to the amplifier's DC offset voltage"}
      - {key: ti_ina181, where: "selecting the current-sense resistor"}
    derived_by: python/pe_core/derive/sensing.py
    tests:
      - {inputs: {V_OS: 1.0e-4, R_SENSE: 0.01}, expect: 0.01}

  - id: sense.pad_error
    title: "Gain error from pad and solder resistance in a shunt's sense path"
    title_ko: "션트 센스 경로의 패드와 납땜 저항에 의한 이득 오차"
    lhs: eps_pad
    expr: "R_pad/R_SENSE"
    symbols: {R_pad: "pad and solder resistance in the sense path", R_SENSE: "sense resistor"}
    assumptions: [no_kelvin]
    notes: "the sense connections see the current through $R_\\mathrm{SENSE} + R_\\mathrm{pad}$, so the reading is high by this fraction, which grows as the shunt's value falls; a Kelvin connection takes $R_\\mathrm{pad}$ out of the sense path"
    notes_ko: "센스 연결이 $R_\\mathrm{SENSE} + R_\\mathrm{pad}$에 흐르는 전류를 보므로 측정값이 이 비율만큼 크게 나오며, 션트 값이 작을수록 커진다; 켈빈 연결은 $R_\\mathrm{pad}$를 센스 경로에서 뺀다"
    cite:
      - {key: osullivan2012, where: "solder resistance of milliohm shunts; Kelvin and split-pad sensing; derived here"}
      - {key: adi_ltc6101, where: "Kelvin connection of the inputs to the sense resistor"}
    derived_by: python/pe_core/derive/sensing.py
    tests:
      - {inputs: {R_pad: 5.0e-4, R_SENSE: 0.005}, expect: 0.1}

  - id: sense.reading
    title: "Current a shunt reading indicates, with the pad resistance and the offset"
    title_ko: "패드 저항과 오프셋을 포함한 션트 측정값이 나타내는 전류"
    lhs: I_meas
    expr: "I_SENSE*(R_SENSE + R_pad)/R_SENSE + V_OS/R_SENSE"
    symbols: {I_SENSE: "true current", R_SENSE: "sense resistor", R_pad: "pad and solder resistance in the sense path (0 with a Kelvin connection)", V_OS: "input offset voltage, with its sign"}
    assumptions: [offset_only]
    notes: "the amplifier sees $I_\\mathrm{SENSE} (R_\\mathrm{SENSE} + R_\\mathrm{pad}) + V_\\mathrm{OS}$ and treats it as $I_\\mathrm{meas} R_\\mathrm{SENSE}$, so its output is the output equation taken at $I_\\mathrm{meas}$; with the offset's sign that raises it, this bounds the output from above, with the other sign from below"
    notes_ko: "증폭기는 $I_\\mathrm{SENSE} (R_\\mathrm{SENSE} + R_\\mathrm{pad}) + V_\\mathrm{OS}$를 보고 이를 $I_\\mathrm{meas} R_\\mathrm{SENSE}$로 취급하므로, 출력은 $I_\\mathrm{meas}$에서의 출력 식이다; 출력을 높이는 부호의 오프셋이면 출력의 상한을, 반대 부호면 하한을 준다"
    cite:
      - {key: adi_ltc6101, where: "Applications Information: output error due to the amplifier's DC offset voltage; derived here"}
      - {key: osullivan2012, where: "solder resistance of milliohm shunts"}
    derived_by: python/pe_core/derive/sensing.py
    tests:
      - {inputs: {I_SENSE: 2.0, R_SENSE: 0.01, R_pad: 5.0e-4, V_OS: 1.0e-4}, expect: 2.11}
      - {inputs: {I_SENSE: 2.0, R_SENSE: 0.01, R_pad: 5.0e-4, V_OS: -1.0e-4}, expect: 2.09}
      - {inputs: {I_SENSE: 5.0, R_SENSE: 0.005, R_pad: 0.0, V_OS: 2.0e-5}, expect: 5.004}

  - id: sense.rel_error
    title: "Relative error of a shunt reading from the offset and the pad resistance"
    title_ko: "오프셋과 패드 저항에 의한 션트 측정값의 상대 오차"
    lhs: eps_I
    expr: "V_OS/(I_SENSE*R_SENSE) + R_pad/R_SENSE"
    symbols: {V_OS: "input offset voltage", I_SENSE: "sensed current", R_SENSE: "sense resistor", R_pad: "pad and solder resistance in the sense path (0 with a Kelvin connection)"}
    assumptions: [offset_only]
    notes: "the two errors add exactly: the offset's share falls in inverse proportion to the current, so it sets the error at the smallest current, while the pad's share is the same at every current"
    notes_ko: "두 오차는 정확히 더해진다: 오프셋에 의한 몫은 전류에 반비례하여 줄어 가장 작은 전류에서의 오차를 정하고, 패드에 의한 몫은 모든 전류에서 같다"
    cite:
      - {key: adi_ltc6101, where: "Applications Information: output error due to the amplifier's DC offset voltage; derived here"}
      - {key: osullivan2012, where: "solder resistance of milliohm shunts"}
    derived_by: python/pe_core/derive/sensing.py
    tests:
      - {inputs: {V_OS: 1.0e-4, I_SENSE: 0.2, R_SENSE: 0.01, R_pad: 5.0e-4}, expect: 0.1}
      - {inputs: {V_OS: 2.0e-5, I_SENSE: 0.5, R_SENSE: 0.005, R_pad: 0.0}, expect: 0.008}

  - id: sense.filter_R
    title: "Resistance an R-C filter's capacitor sees behind a current-output sense amplifier"
    title_ko: "전류 출력형 센스 증폭기 뒤 R-C 필터의 커패시터가 보는 저항"
    lhs: R_filt
    expr: "R_OUT + R_f"
    symbols: {R_OUT: "output resistor", R_f: "series resistor of the R-C filter"}
    assumptions: [ideal_amplifier, first_order_rc]
    notes: "the amplifier's output is a current source loaded by $R_\\mathrm{OUT}$; its Thevenin equivalent puts $R_\\mathrm{OUT}$ in series with $R_f$, so the capacitor sees both and the corner frequency is lower than $R_f C_f$ alone gives; with no load on the filter the dc output stays $I_\\mathrm{OUT} R_\\mathrm{OUT}$"
    notes_ko: "증폭기 출력은 $R_\\mathrm{OUT}$이 부하로 걸린 전류원이다; 테브난 등가로 바꾸면 $R_\\mathrm{OUT}$이 $R_f$와 직렬이 되므로 커패시터는 둘을 함께 보며, 차단 주파수는 $R_f C_f$만으로 계산한 값보다 낮다; 필터에 부하가 없으면 직류 출력은 그대로 $I_\\mathrm{OUT} R_\\mathrm{OUT}$이다"
    cite: {key: alexander2017, where: "Ch. 4 (Circuit Theorems: Thevenin's and Norton's theorems); derived here"}
    derived_by: python/pe_core/derive/sensing.py
    tests:
      - {inputs: {R_OUT: 1.0e4, R_f: 1.0e3}, expect: 1.1e4}
      - {inputs: {R_OUT: 1.0e4, R_f: 0.0}, expect: 1.0e4}

  - id: adc.nyquist
    title: "Nyquist frequency of a sampled signal"
    title_ko: "샘플링된 신호의 나이퀴스트 주파수"
    lhs: f_N
    expr: "f_samp/2"
    symbols: {f_samp: "sampling rate"}
    assumptions: [uniform_sampling, definition]
    notes: "the Nyquist bandwidth runs from dc to $f_N$; any component above it aliases back into that band, so an anti-aliasing filter removes it before the ADC"
    notes_ko: "나이퀴스트 대역폭은 직류부터 $f_N$까지이다; 그보다 높은 성분은 이 대역으로 되접혀 들어오므로(에일리어싱) ADC 앞의 안티에일리어싱 필터가 제거한다"
    cite: {key: kester_mt002}
    tests:
      - {inputs: {f_samp: 1.0e4}, expect: 5000.0}

  # =========================================================================
  # Definitions used to chain worked examples (02-theory)
  # =========================================================================
  - id: def.Ts
    title: "Switching period"
    title_ko: "스위칭 주기"
    lhs: T_s
    expr: "1/f_s"
    symbols: {f_s: "switching frequency"}
    assumptions: [definition]
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    tests:
      - {inputs: {f_s: 1.0e5}, expect: 1.0e-5}

  - id: def.V
    title: "Output voltage from the conversion ratio"
    title_ko: "변환비로부터 출력 전압"
    lhs: V
    expr: "M*V_g"
    symbols: {M: "conversion ratio", V_g: "input voltage"}
    ranges: {M: [0.05, 20]}
    assumptions: [definition]
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    tests:
      - {inputs: {M: 0.5, V_g: 24.0}, expect: 12.0}

  # =========================================================================
  # Averaging and balance (02-theory)
  # =========================================================================
  - id: sw.v_avg
    title: "DC component of the switch-node voltage (buck)"
    title_ko: "스위치 노드 전압의 직류 성분(벅)"
    lhs: v_s_avg
    expr: "D*V_g"
    symbols: {D: "duty ratio", V_g: "input voltage"}
    assumptions: [ideal, steady_state]
    notes: "the switch node sits at $V_g$ for $D T_s$ and at $0$ for the rest of the period; the LC filter passes this average"
    notes_ko: "스위치 노드는 $D T_s$ 동안 $V_g$, 나머지 구간에는 $0$; LC 필터는 이 평균값을 통과시킨다"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/averaging.py
    tests:
      - {inputs: {D: 0.5, V_g: 24.0}, expect: 12.0}

  - id: vsb.v_off
    title: "Volt-second balance: inductor voltage during the off-interval"
    title_ko: "전압-초 평형: 오프 구간의 인덕터 전압"
    lhs: v_Loff
    expr: "-D*v_Lon/(1 - D)"
    symbols: {D: "duty ratio", v_Lon: "inductor voltage during the on-interval"}
    assumptions: [steady_state, small_ripple]
    notes: "two-interval form of $\\langle v_L \\rangle = 0$"
    notes_ko: "$\\langle v_L \\rangle = 0$의 두 구간 형태"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/averaging.py
    tests:
      - {inputs: {D: 0.25, v_Lon: 12.0}, expect: -4.0}

  - id: vsb.drift
    title: "Change of the inductor current over one period"
    title_ko: "한 주기 동안의 인덕터 전류 변화"
    lhs: Delta_i
    expr: "v_L_avg*T_s/L"
    symbols: {v_L_avg: "average inductor voltage over the period", T_s: "switching period", L: "inductance"}
    assumptions: [linear_magnetics]
    notes: "zero in a periodic steady state (volt-second balance); while the average is not zero, the current changes from one period to the next, as in a start-up or after a load step"
    notes_ko: "주기적 정상상태에서는 0이다(전압-초 평형); 평균이 0이 아닌 동안에는 기동이나 부하 변화 직후처럼 전류가 주기마다 변한다"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis); derived here"}
    derived_by: python/pe_core/derive/averaging.py
    tests:
      - {inputs: {v_L_avg: 7.2, T_s: 1.0e-5, L: 1.0e-4}, expect: 0.72}

  - id: csb.i_off
    title: "Charge balance: capacitor current during the off-interval"
    title_ko: "전하 평형: 오프 구간의 커패시터 전류"
    lhs: i_Coff
    expr: "-D*i_Con/(1 - D)"
    symbols: {D: "duty ratio", i_Con: "capacitor current during the on-interval"}
    assumptions: [steady_state, small_ripple]
    notes: "two-interval form of $\\langle i_C \\rangle = 0$"
    notes_ko: "$\\langle i_C \\rangle = 0$의 두 구간 형태"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/averaging.py
    tests:
      - {inputs: {D: 0.75, i_Con: 1.0}, expect: -3.0}

  - id: buck.dcm.D2
    title: "Buck in DCM: diode-conduction interval"
    title_ko: "DCM 벅: 다이오드 도통 구간"
    lhs: D_2
    expr: "D*(1 - M)/M"
    symbols: {D: "duty ratio", M: "conversion ratio V/V_g"}
    ranges: {M: [0.05, 0.95]}
    constraints: ["D < M"]
    assumptions: [ideal, dcm, steady_state, small_ripple]
    notes: "the idle interval is $D_3 = 1 - D - D_2$; $D_2 \\le 1 - D$ holds exactly when $M \\ge D$, so a DCM buck always has $M > D$"
    notes_ko: "휴지 구간은 $D_3 = 1 - D - D_2$; $D_2 \\le 1 - D$는 $M \\ge D$일 때에만 성립하므로 DCM 벅은 언제나 $M > D$"
    cite: {key: erickson2020, where: "Ch. 5 (The Discontinuous Conduction Mode)"}
    derived_by: python/pe_core/derive/dcm.py
    tests:
      - {inputs: {D: 0.5, M: 0.625}, expect: 0.3}

  - id: boost.ccm.M_RL
    title: "Boost conversion ratio with inductor winding resistance, CCM"
    title_ko: "인덕터 권선 저항을 고려한 부스트 변환비, CCM"
    lhs: M
    expr: "(1/(1 - D))*(1/(1 + R_L/((1 - D)**2*R)))"
    symbols: {D: "duty ratio", R_L: "inductor winding resistance", R: "load resistance"}
    assumptions: [ccm, steady_state, small_ripple, inductor_resistance, resistive_load]
    notes: "the second factor collapses the ratio at high $D$: $M$ has a maximum instead of growing without bound"
    notes_ko: "두 번째 인자 때문에 높은 $D$에서 변환비가 무너진다: $M$은 무한히 커지지 않고 최댓값을 가진다"
    cite: {key: erickson2020, where: "Ch. 3 (Steady-State Equivalent Circuit Modeling, Losses, and Efficiency)"}
    derived_by: python/pe_core/derive/averaging.py
    tests:
      - {inputs: {D: 0.5, R_L: 0.2, R: 20.0}, expect: 1.923076923076923}

  - id: boost.ccm.eta_RL
    title: "Boost efficiency with inductor winding resistance, CCM"
    title_ko: "인덕터 권선 저항을 고려한 부스트 효율, CCM"
    lhs: eta
    expr: "1/(1 + R_L/((1 - D)**2*R))"
    symbols: {D: "duty ratio", R_L: "inductor winding resistance", R: "load resistance"}
    assumptions: [ccm, steady_state, small_ripple, inductor_resistance, resistive_load]
    cite: {key: erickson2020, where: "Ch. 3 (Steady-State Equivalent Circuit Modeling, Losses, and Efficiency)"}
    derived_by: python/pe_core/derive/averaging.py
    tests:
      - {inputs: {D: 0.5, R_L: 0.2, R: 20.0}, expect: 0.9615384615384615}

  # =========================================================================
  # Small-signal CCM transfer functions (02-theory)
  # =========================================================================
  - id: buck.ss.Gd0
    title: "Buck control-to-output dc gain, CCM"
    title_ko: "벅 제어-출력 직류 이득, CCM"
    lhs: G_d0
    expr: "V_g"
    symbols: {V_g: "input voltage"}
    assumptions: [ideal, ccm, small_signal, resistive_load]
    notes: "equals $\\partial V/\\partial D$ of the static characteristic"
    notes_ko: "정적 특성 곡선의 $\\partial V/\\partial D$와 같다"
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions)"}
    derived_by: python/pe_core/derive/small_signal.py
    tests:
      - {inputs: {V_g: 24.0}, expect: 24.0}

  - id: buck.ss.w0
    title: "Buck: angular frequency of the LC poles"
    title_ko: "벅: LC 극점의 각주파수"
    lhs: omega_0
    expr: "1/sqrt(L*C)"
    symbols: {L: "filter inductance", C: "filter capacitance"}
    assumptions: [ideal, ccm, small_signal, resistive_load]
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions)"}
    derived_by: python/pe_core/derive/small_signal.py
    tests:
      - {inputs: {L: 1.0e-4, C: 1.0e-5}, expect: 31622.776601683792}

  - id: buck.ss.Q
    title: "Buck: quality factor of the LC poles"
    title_ko: "벅: LC 극점의 Q"
    lhs: Q
    expr: "R*sqrt(C/L)"
    symbols: {R: "load resistance", C: "filter capacitance", L: "filter inductance"}
    assumptions: [ideal, ccm, small_signal, resistive_load]
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions)"}
    derived_by: python/pe_core/derive/small_signal.py
    tests:
      - {inputs: {R: 10.0, C: 1.0e-5, L: 1.0e-4}, expect: 3.1622776601683795}

  - id: boost.ss.Gd0
    title: "Boost control-to-output dc gain, CCM"
    title_ko: "부스트 제어-출력 직류 이득, CCM"
    lhs: G_d0
    expr: "V_g/(1 - D)**2"
    symbols: {V_g: "input voltage", D: "duty ratio"}
    assumptions: [ideal, ccm, small_signal, resistive_load]
    notes: "equals $\\partial V/\\partial D$; with $V = V_g/(1 - D)$ this is also $V/(1 - D)$"
    notes_ko: "$\\partial V/\\partial D$와 같다; $V = V_g/(1 - D)$이므로 $V/(1 - D)$로도 쓴다"
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions)"}
    derived_by: python/pe_core/derive/small_signal.py
    tests:
      - {inputs: {V_g: 12.0, D: 0.5}, expect: 48.0}

  - id: boost.ss.w0
    title: "Boost: angular frequency of the LC poles"
    title_ko: "부스트: LC 극점의 각주파수"
    lhs: omega_0
    expr: "(1 - D)/sqrt(L*C)"
    symbols: {D: "duty ratio", L: "inductance", C: "output capacitance"}
    assumptions: [ideal, ccm, small_signal, resistive_load]
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions)"}
    derived_by: python/pe_core/derive/small_signal.py
    tests:
      - {inputs: {D: 0.5, L: 1.0e-4, C: 1.0e-5}, expect: 15811.388300841896}

  - id: boost.ss.Q
    title: "Boost: quality factor of the LC poles"
    title_ko: "부스트: LC 극점의 Q"
    lhs: Q
    expr: "(1 - D)*R*sqrt(C/L)"
    symbols: {D: "duty ratio", R: "load resistance", C: "output capacitance", L: "inductance"}
    assumptions: [ideal, ccm, small_signal, resistive_load]
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions)"}
    derived_by: python/pe_core/derive/small_signal.py
    tests:
      - {inputs: {D: 0.5, R: 10.0, C: 1.0e-5, L: 1.0e-4}, expect: 1.5811388300841898}

  - id: boost.ss.wz
    title: "Boost: right-half-plane zero"
    title_ko: "부스트: 우반평면(RHP) 영점"
    lhs: omega_z
    expr: "(1 - D)**2*R/L"
    symbols: {D: "duty ratio", R: "load resistance", L: "inductance"}
    assumptions: [ideal, ccm, small_signal, resistive_load]
    notes: "moves down as the load gets heavier (smaller $R$) and as $D$ increases"
    notes_ko: "부하가 무거울수록(작은 $R$), $D$가 클수록 낮은 주파수로 내려온다"
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions)"}
    derived_by: python/pe_core/derive/small_signal.py
    tests:
      - {inputs: {D: 0.5, R: 10.0, L: 1.0e-4}, expect: 25000.0}

  - id: buckboost.ss.Gd0
    title: "Buck-boost control-to-output dc gain (magnitude), CCM"
    title_ko: "벅-부스트 제어-출력 직류 이득(크기), CCM"
    lhs: G_d0
    expr: "V_g/(1 - D)**2"
    symbols: {V_g: "input voltage", D: "duty ratio"}
    assumptions: [ideal, ccm, small_signal, resistive_load]
    notes: "magnitude of $\\partial V/\\partial D$; the inverting output makes the gain itself negative"
    notes_ko: "$\\partial V/\\partial D$의 크기; 출력이 반전되므로 이득 자체는 음수"
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions)"}
    derived_by: python/pe_core/derive/small_signal.py
    tests:
      - {inputs: {V_g: 12.0, D: 0.5}, expect: 48.0}

  - id: buckboost.ss.w0
    title: "Buck-boost: angular frequency of the LC poles"
    title_ko: "벅-부스트: LC 극점의 각주파수"
    lhs: omega_0
    expr: "(1 - D)/sqrt(L*C)"
    symbols: {D: "duty ratio", L: "inductance", C: "output capacitance"}
    assumptions: [ideal, ccm, small_signal, resistive_load]
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions)"}
    derived_by: python/pe_core/derive/small_signal.py
    tests:
      - {inputs: {D: 0.5, L: 1.0e-4, C: 1.0e-5}, expect: 15811.388300841896}

  - id: buckboost.ss.Q
    title: "Buck-boost: quality factor of the LC poles"
    title_ko: "벅-부스트: LC 극점의 Q"
    lhs: Q
    expr: "(1 - D)*R*sqrt(C/L)"
    symbols: {D: "duty ratio", R: "load resistance", C: "output capacitance", L: "inductance"}
    assumptions: [ideal, ccm, small_signal, resistive_load]
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions)"}
    derived_by: python/pe_core/derive/small_signal.py
    tests:
      - {inputs: {D: 0.5, R: 10.0, C: 1.0e-5, L: 1.0e-4}, expect: 1.5811388300841898}

  - id: buckboost.ss.wz
    title: "Buck-boost: right-half-plane zero"
    title_ko: "벅-부스트: 우반평면(RHP) 영점"
    lhs: omega_z
    expr: "(1 - D)**2*R/(D*L)"
    symbols: {D: "duty ratio", R: "load resistance", L: "inductance"}
    assumptions: [ideal, ccm, small_signal, resistive_load]
    cite: {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions)"}
    derived_by: python/pe_core/derive/small_signal.py
    tests:
      - {inputs: {D: 0.5, R: 10.0, L: 1.0e-4}, expect: 50000.0}

  # =========================================================================
  # Control basics (02-theory)
  # =========================================================================
  - id: pwm.d
    title: "Duty ratio set by a PWM comparator"
    title_ko: "PWM 비교기가 정하는 듀티비"
    lhs: D
    expr: "V_ctrl/V_M"
    symbols: {V_ctrl: "control voltage", V_M: "ramp amplitude"}
    constraints: ["V_ctrl < V_M"]
    assumptions: [sawtooth_pwm]
    notes: "so the small-signal modulator gain is $1/V_M$"
    notes_ko: "따라서 소신호 변조기 이득은 $1/V_M$"
    cite: {key: erickson2020, where: "Ch. 7 (AC Equivalent Circuit Modeling)"}
    derived_by: python/pe_core/derive/control.py
    tests:
      - {inputs: {V_ctrl: 0.5, V_M: 1.0}, expect: 0.5}

  - id: loop.T
    title: "Loop gain of a voltage-mode feedback loop"
    title_ko: "전압 모드 피드백 루프의 루프 이득"
    lhs: T_loop
    expr: "G_c*G_vd*H/V_M"
    symbols: {G_c: "compensator gain", G_vd: "control-to-output gain", H: "sensor gain", V_M: "ramp amplitude"}
    assumptions: [small_signal]
    notes: "magnitudes at one frequency; the phases add in the same way"
    notes_ko: "한 주파수에서의 크기; 위상도 같은 방식으로 더해진다"
    cite: {key: erickson2020, where: "Ch. 9 (Controller Design)"}
    derived_by: python/pe_core/derive/control.py
    tests:
      - {inputs: {G_c: 10.0, G_vd: 24.0, H: 0.2, V_M: 2.0}, expect: 24.0}

  - id: loop.suppression
    title: "Disturbance suppression by feedback"
    title_ko: "피드백에 의한 외란 억제"
    lhs: S_dist
    expr: "1/(1 + T_loop)"
    symbols: {T_loop: "loop gain magnitude"}
    assumptions: [small_signal, real_loop_gain]
    notes: "at frequencies where $T \\gg 1$ a disturbance is divided by roughly $T$"
    notes_ko: "$T \\gg 1$인 주파수에서 외란은 대략 $T$로 나누어진다"
    cite: {key: erickson2020, where: "Ch. 9 (Controller Design)"}
    derived_by: python/pe_core/derive/control.py
    tests:
      - {inputs: {T_loop: 9.0}, expect: 0.1}

  # =========================================================================
  # 03-topologies: dc currents, ripple, stresses, transistor utilization
  # =========================================================================
  - id: buck.IL
    title: "Buck dc inductor current, CCM"
    title_ko: "벅 인덕터 직류 전류, CCM"
    lhs: I_L
    expr: "V/R"
    symbols: {V: "output voltage", R: "load resistance"}
    assumptions: [ideal, ccm, steady_state, small_ripple, resistive_load]
    notes: "charge balance: the output capacitor carries no dc current, so the inductor supplies the whole load current"
    notes_ko: "전하 평형: 출력 커패시터에는 직류 전류가 흐르지 않으므로 인덕터가 부하 전류 전체를 공급한다"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {V: 12.0, R: 10.0}, expect: 1.2}

  - id: ripple.Ipk
    title: "Peak inductor current: dc value plus half the ripple"
    title_ko: "인덕터 피크 전류: 직류값 + 리플의 절반"
    lhs: I_pk
    expr: "I_L + Delta_i_L"
    symbols: {I_L: "dc inductor current", Delta_i_L: "inductor current ripple, half of peak-to-peak"}
    assumptions: [ccm, definition]
    notes: "the switch and the diode carry this peak current in turn"
    notes_ko: "스위치와 다이오드가 번갈아 이 피크 전류를 흘린다"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    tests:
      - {inputs: {I_L: 1.2, Delta_i_L: 0.3}, expect: 1.5}

  - id: buck.ripple.v
    title: "Buck output voltage ripple (half peak-to-peak), CCM"
    title_ko: "벅 출력 전압 리플(피크-피크의 절반), CCM"
    lhs: Delta_v
    expr: "Delta_i_L*T_s/(8*C)"
    symbols: {Delta_i_L: "inductor current ripple, half of peak-to-peak", T_s: "switching period", C: "output capacitance"}
    assumptions: [ideal, ccm, steady_state, capacitor_takes_ripple]
    convention: "$\\Delta v$ is HALF the peak-to-peak ripple, like $\\Delta i_L$ (Erickson)"
    convention_ko: "$\\Delta v$는 $\\Delta i_L$과 마찬가지로 피크-피크 리플의 절반(Erickson 규약)"
    notes: "ideal capacitor; a capacitor's series resistance adds a ripple term of its own"
    notes_ko: "이상적 커패시터; 커패시터의 직렬 저항은 별도의 리플 항을 더한다"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {Delta_i_L: 0.3, T_s: 1.0e-5, C: 1.0e-5}, expect: 0.0375}

  - id: boost.IL
    title: "Boost dc inductor current, CCM"
    title_ko: "부스트 인덕터 직류 전류, CCM"
    lhs: I_L
    expr: "V/((1 - D)*R)"
    symbols: {V: "output voltage", D: "duty ratio", R: "load resistance"}
    assumptions: [ideal, ccm, steady_state, small_ripple, resistive_load]
    notes: "the inductor carries the input current, larger than the load current by the factor $1/(1 - D)$"
    notes_ko: "인덕터는 입력 전류를 흘리며, 이는 부하 전류보다 $1/(1 - D)$배 크다"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {V: 24.0, D: 0.5, R: 20.0}, expect: 2.4}

  - id: boost.ripple.iL
    title: "Boost inductor current ripple (half peak-to-peak), CCM"
    title_ko: "부스트 인덕터 전류 리플(피크-피크의 절반), CCM"
    lhs: Delta_i_L
    expr: "V_g*D*T_s/(2*L)"
    symbols: {V_g: "input voltage", D: "duty ratio", T_s: "switching period", L: "inductance"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {V_g: 12.0, D: 0.5, T_s: 1.0e-5, L: 1.0e-4}, expect: 0.3}

  - id: boost.ripple.v
    title: "Boost output voltage ripple (half peak-to-peak), CCM"
    title_ko: "부스트 출력 전압 리플(피크-피크의 절반), CCM"
    lhs: Delta_v
    expr: "V*D*T_s/(2*R*C)"
    symbols: {V: "output voltage", D: "duty ratio", T_s: "switching period", R: "load resistance", C: "output capacitance"}
    assumptions: [ideal, ccm, steady_state, small_ripple, resistive_load]
    notes: "while the switch is on, the capacitor alone supplies the load"
    notes_ko: "스위치가 켜져 있는 동안에는 커패시터 혼자 부하에 전류를 공급한다"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {V: 24.0, D: 0.5, T_s: 1.0e-5, R: 20.0, C: 1.0e-5}, expect: 0.3}

  - id: buckboost.V
    title: "Buck-boost output voltage magnitude, CCM"
    title_ko: "벅-부스트 출력 전압의 크기, CCM"
    lhs: V
    expr: "D*V_g/(1 - D)"
    symbols: {D: "duty ratio", V_g: "input voltage"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    convention: "magnitude of the inverted output; $V$ is positive"
    convention_ko: "반전된 출력의 크기; $V$는 양수"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {D: 0.5, V_g: 12.0}, expect: 12.0}

  - id: buckboost.IL
    title: "Buck-boost dc inductor current, CCM"
    title_ko: "벅-부스트 인덕터 직류 전류, CCM"
    lhs: I_L
    expr: "V/((1 - D)*R)"
    symbols: {V: "output voltage magnitude", D: "duty ratio", R: "load resistance"}
    assumptions: [ideal, ccm, steady_state, small_ripple, resistive_load]
    notes: "the inductor delivers current to the output only during the off-interval"
    notes_ko: "인덕터는 오프 구간에만 출력으로 전류를 보낸다"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {V: 12.0, D: 0.5, R: 10.0}, expect: 2.4}

  - id: buckboost.ripple.iL
    title: "Buck-boost inductor current ripple (half peak-to-peak), CCM"
    title_ko: "벅-부스트 인덕터 전류 리플(피크-피크의 절반), CCM"
    lhs: Delta_i_L
    expr: "V_g*D*T_s/(2*L)"
    symbols: {V_g: "input voltage", D: "duty ratio", T_s: "switching period", L: "inductance"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {V_g: 12.0, D: 0.5, T_s: 1.0e-5, L: 1.0e-4}, expect: 0.3}

  - id: buckboost.ripple.v
    title: "Buck-boost output voltage ripple (half peak-to-peak), CCM"
    title_ko: "벅-부스트 출력 전압 리플(피크-피크의 절반), CCM"
    lhs: Delta_v
    expr: "V*D*T_s/(2*R*C)"
    symbols: {V: "output voltage magnitude", D: "duty ratio", T_s: "switching period", R: "load resistance", C: "output capacitance"}
    assumptions: [ideal, ccm, steady_state, small_ripple, resistive_load]
    notes: "while the switch is on, the capacitor alone supplies the load"
    notes_ko: "스위치가 켜져 있는 동안에는 커패시터 혼자 부하에 전류를 공급한다"
    cite: {key: erickson2020, where: "Ch. 2 (Principles of Steady-State Converter Analysis)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {V: 12.0, D: 0.5, T_s: 1.0e-5, R: 10.0, C: 1.0e-5}, expect: 0.3}

  - id: buck.Vds
    title: "Buck switch voltage while off (also the diode's blocking voltage while on)"
    title_ko: "벅 스위치의 오프 전압(온 구간 다이오드의 차단 전압과 같음)"
    lhs: V_DS
    expr: "V_g"
    symbols: {V_g: "input voltage"}
    assumptions: [ideal, ccm, steady_state]
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {V_g: 24.0}, expect: 24.0}

  - id: boost.Vds
    title: "Boost switch voltage while off (also the diode's blocking voltage while on)"
    title_ko: "부스트 스위치의 오프 전압(온 구간 다이오드의 차단 전압과 같음)"
    lhs: V_DS
    expr: "V"
    symbols: {V: "output voltage"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {V: 24.0}, expect: 24.0}

  - id: buckboost.Vds
    title: "Buck-boost switch voltage while off (also the diode's blocking voltage)"
    title_ko: "벅-부스트 스위치의 오프 전압(다이오드의 차단 전압과 같음)"
    lhs: V_DS
    expr: "V_g + V"
    symbols: {V_g: "input voltage", V: "output voltage magnitude"}
    assumptions: [ideal, ccm, steady_state, small_ripple]
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {V_g: 12.0, V: 12.0}, expect: 24.0}

  - id: forward.Vds
    title: "Forward converter switch voltage during transformer reset"
    title_ko: "포워드 컨버터: 변압기 리셋 중 스위치 전압"
    lhs: V_DS
    expr: "V_g*(1 + 1/n_r)"
    symbols: {V_g: "input voltage", n_r: "reset-winding to primary turns ratio N_r/N_p"}
    assumptions: [ideal, steady_state]
    notes: "the reset winding clamps the primary at $-V_g/n_r$; with $n_r = 1$ the switch blocks twice the input voltage"
    notes_ko: "리셋 권선이 1차 측을 $-V_g/n_r$로 클램프한다; $n_r = 1$이면 스위치는 입력 전압의 두 배를 차단한다"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {V_g: 48.0, n_r: 1.0}, expect: 96.0}

  - id: forward.ripple.iL
    title: "Forward converter output inductor ripple (half peak-to-peak), CCM"
    title_ko: "포워드 컨버터 출력 인덕터 리플(피크-피크의 절반), CCM"
    lhs: Delta_i_L
    expr: "(n*V_g - V)*D*T_s/(2*L)"
    symbols: {n: "turns ratio N_s/N_p", V_g: "input voltage", V: "output voltage", D: "duty ratio", T_s: "switching period", L: "output inductance"}
    constraints: ["V < n*V_g"]
    assumptions: [ideal, ccm, steady_state, small_ripple]
    notes: "the output stage is a buck converter fed with $n V_g$ while the switch is on"
    notes_ko: "출력단은 스위치가 켜져 있는 동안 $n V_g$를 공급받는 벅 컨버터다"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {n: 0.5, V_g: 20.0, V: 4.0, D: 0.4, T_s: 1.0e-5, L: 1.0e-4}, expect: 0.12}

  - id: util.buck
    title: "Transistor utilization of the buck converter, CCM"
    title_ko: "벅 컨버터의 트랜지스터 이용률, CCM"
    lhs: U
    expr: "sqrt(D)"
    symbols: {D: "duty ratio"}
    assumptions: [ideal, ccm, steady_state, small_ripple_currents]
    notes: "load power over the transistor's peak voltage $V_g$ times its rms current"
    notes_ko: "부하 전력을 트랜지스터의 피크 전압 $V_g$와 실효 전류의 곱으로 나눈 값"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {D: 0.25}, expect: 0.5}

  - id: util.boost
    title: "Transistor utilization of the boost converter, CCM"
    title_ko: "부스트 컨버터의 트랜지스터 이용률, CCM"
    lhs: U
    expr: "(1 - D)/sqrt(D)"
    symbols: {D: "duty ratio"}
    assumptions: [ideal, ccm, steady_state, small_ripple_currents]
    notes: "the transistor blocks $V$ and carries the inductor current during $D T_s$"
    notes_ko: "트랜지스터는 $V$를 차단하고 $D T_s$ 동안 인덕터 전류를 흘린다"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {D: 0.25}, expect: 1.5}

  - id: util.buckboost
    title: "Transistor utilization of the buck-boost and flyback converters, CCM"
    title_ko: "벅-부스트·플라이백 컨버터의 트랜지스터 이용률, CCM"
    lhs: U
    expr: "(1 - D)*sqrt(D)"
    symbols: {D: "duty ratio"}
    assumptions: [ideal, ccm, steady_state, small_ripple_currents]
    notes: "the transistor blocks $V_g + V$ (flyback: $V_g + V/n$); the turns ratio cancels, and the maximum is at $D = 1/3$"
    notes_ko: "트랜지스터는 $V_g + V$(플라이백: $V_g + V/n$)를 차단한다; 권선비는 상쇄되며, 최댓값은 $D = 1/3$에서"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {D: 0.25}, expect: 0.375}

  - id: util.forward
    title: "Transistor utilization of the forward converter with a reset winding, CCM"
    title_ko: "리셋 권선이 있는 포워드 컨버터의 트랜지스터 이용률, CCM"
    lhs: U
    expr: "sqrt(D)/(1 + 1/n_r)"
    symbols: {D: "duty ratio", n_r: "reset-winding to primary turns ratio N_r/N_p"}
    assumptions: [ideal, ccm, steady_state, small_ripple_currents]
    notes: "magnetizing current neglected; the duty ratio must stay below the reset limit"
    notes_ko: "자화 전류는 무시; 듀티비는 리셋 한계 아래로 유지되어야 한다"
    cite: {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/topologies.py
    tests:
      - {inputs: {D: 0.25, n_r: 1.0}, expect: 0.25}

  # =========================================================================
  # Refreshers: 00-foundations and 01-physics (Phase 2c)
  # =========================================================================
  - id: ind.di
    title: "Current change of an inductor under a constant voltage"
    title_ko: "일정한 전압이 걸린 인덕터의 전류 변화"
    lhs: Delta_i
    expr: "V_L*t/L"
    symbols: {V_L: "constant voltage across the inductor", t: "duration", L: "inductance"}
    assumptions: [ideal, constant_excitation]
    notes: "integrates the inductor law; the current changes linearly while the voltage is constant. This is the full change, not the half-ripple $\\Delta i_L$ of the converter pages"
    notes_ko: "인덕터 법칙을 적분한 결과이며, 전압이 일정한 동안 전류는 직선으로 변한다. 컨버터 페이지의 리플 절반 $\\Delta i_L$이 아니라 전체 변화량이다"
    cite: {key: alexander2017, where: "Ch. 6 (Capacitors and Inductors)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {V_L: 12.0, t: 5.0e-6, L: 1.0e-4}, expect: 0.6}

  - id: cap.dv
    title: "Voltage change of a capacitor under a constant current"
    title_ko: "일정한 전류가 흐르는 커패시터의 전압 변화"
    lhs: Delta_v_C
    expr: "I_C*t/C"
    symbols: {I_C: "constant current into the capacitor", t: "duration", C: "capacitance"}
    assumptions: [ideal, constant_excitation]
    notes: "integrates the capacitor law, the dual of the inductor law"
    notes_ko: "커패시터 법칙을 적분한 결과로, 인덕터 법칙의 쌍대이다"
    cite: {key: alexander2017, where: "Ch. 6 (Capacitors and Inductors)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {I_C: 1.2, t: 5.0e-6, C: 1.0e-5}, expect: 0.6}

  - id: ind.E
    title: "Energy stored in an inductor"
    title_ko: "인덕터에 저장된 에너지"
    lhs: E_L
    expr: "L*I_L**2/2"
    symbols: {L: "inductance", I_L: "inductor current"}
    assumptions: [ideal, linear_magnetics]
    cite: {key: alexander2017, where: "Ch. 6 (Capacitors and Inductors)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {L: 1.0e-4, I_L: 2.0}, expect: 2.0e-4}

  - id: cap.E
    title: "Energy stored in a capacitor"
    title_ko: "커패시터에 저장된 에너지"
    lhs: E_C
    expr: "C*V_C**2/2"
    symbols: {C: "capacitance", V_C: "capacitor voltage"}
    assumptions: [ideal]
    cite: {key: alexander2017, where: "Ch. 6 (Capacitors and Inductors)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {C: 1.0e-5, V_C: 12.0}, expect: 7.2e-4}

  - id: imp.ZL
    title: "Impedance magnitude of an inductor"
    title_ko: "인덕터 임피던스의 크기"
    lhs: Z_L
    expr: "2*pi*f*L"
    symbols: {f: "frequency", L: "inductance"}
    assumptions: [ideal, sinusoidal_steady_state]
    notes: "the impedance is $j 2\\pi f L$: its magnitude grows in proportion to the frequency and the current lags the voltage by 90°"
    notes_ko: "임피던스는 $j 2\\pi f L$이다. 크기는 주파수에 비례하여 커지고, 전류는 전압보다 90° 뒤진다"
    cite: {key: alexander2017, where: "Ch. 9 (Sinusoids and Phasors)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {f: 1.0e5, L: 1.0e-4}, expect: 62.83185307179586}

  - id: imp.ZC
    title: "Impedance magnitude of a capacitor"
    title_ko: "커패시터 임피던스의 크기"
    lhs: Z_C
    expr: "1/(2*pi*f*C)"
    symbols: {f: "frequency", C: "capacitance"}
    assumptions: [ideal, sinusoidal_steady_state]
    notes: "the impedance is $1/(j 2\\pi f C)$: its magnitude falls in inverse proportion to the frequency and the current leads the voltage by 90°"
    notes_ko: "임피던스는 $1/(j 2\\pi f C)$이다. 크기는 주파수에 반비례하여 작아지고, 전류는 전압보다 90° 앞선다"
    cite: {key: alexander2017, where: "Ch. 9 (Sinusoids and Phasors)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {f: 1.0e5, C: 1.0e-5}, expect: 0.15915494309189535}

  - id: rc.fc
    title: "Corner frequency of a first-order R-C low-pass filter"
    title_ko: "1차 R-C 저역통과 필터의 차단 주파수"
    lhs: f_c
    expr: "1/(2*pi*R_f*C_f)"
    symbols: {R_f: "filter resistance", C_f: "filter capacitance"}
    assumptions: [first_order_rc]
    notes: "at $f_c$ the output magnitude is $1/\\sqrt{2}$ of the input (the -3 dB point)"
    notes_ko: "$f_c$에서 출력 크기는 입력의 $1/\\sqrt{2}$(-3 dB 지점)이다"
    cite: {key: alexander2017, where: "Ch. 14 (Frequency Response)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {R_f: 1000.0, C_f: 1.0e-7}, expect: 1591.5494309189535}

  - id: rc.gain
    title: "Gain magnitude of a first-order low-pass filter"
    title_ko: "1차 저역통과 필터의 이득 크기"
    lhs: G_lp
    expr: "1/sqrt(1 + (f/f_c)**2)"
    symbols: {f: "frequency", f_c: "corner frequency"}
    assumptions: [first_order_rc, sinusoidal_steady_state]
    notes: "well above $f_c$ the gain falls in inverse proportion to the frequency: -20 dB per decade on a Bode plot"
    notes_ko: "$f_c$보다 충분히 높은 주파수에서 이득은 주파수에 반비례하여 줄어든다. 보드 선도에서는 디케이드당 -20 dB이다"
    cite: {key: alexander2017, where: "Ch. 14 (Frequency Response)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {f: 1000.0, f_c: 1000.0}, expect: 0.7071067811865476}
      - {inputs: {f: 1.0e4, f_c: 1000.0}, expect: 0.09950371902099892}

  - id: fourier.pulse.harm
    title: "Amplitude of the h-th harmonic of a rectangular pulse train"
    title_ko: "직사각형 펄스열의 h차 고조파 진폭"
    lhs: a_h
    expr: "2*V_pk*Abs(sin(pi*h*D))/(pi*h)"
    symbols: {V_pk: "pulse amplitude", h: "harmonic order", D: "duty ratio"}
    assumptions: [rectangular_pulse, steady_state]
    notes: "the dc component is $D V_\\mathrm{pk}$; the harmonic amplitudes fall as $1/h$ and vanish where $h D$ is an integer"
    notes_ko: "직류 성분은 $D V_\\mathrm{pk}$이다. 고조파 진폭은 $1/h$에 비례하여 줄어들며, $h D$가 정수이면 0이 된다"
    cite: {key: alexander2017, where: "Ch. 17 (The Fourier Series)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {V_pk: 12.0, h: 1.0, D: 0.5}, expect: 7.639437268410976}
      - {inputs: {V_pk: 12.0, h: 3.0, D: 0.25}, expect: 1.8006326323142129}

  - id: fourier.pulse.rms
    title: "RMS value of a rectangular pulse train"
    title_ko: "직사각형 펄스열의 실효값"
    lhs: V_rms
    expr: "V_pk*sqrt(D)"
    symbols: {V_pk: "pulse amplitude", D: "duty ratio"}
    assumptions: [rectangular_pulse]
    cite: {key: alexander2017, where: "Ch. 11 (AC Power Analysis)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {V_pk: 12.0, D: 0.25}, expect: 6.0}

  - id: passive.f_srf
    title: "Self-resonant frequency of an inductance with parallel parasitic capacitance"
    title_ko: "병렬 기생 커패시턴스가 있는 인덕턴스의 자기 공진 주파수"
    lhs: f_srf
    expr: "1/(2*pi*sqrt(L*C_p))"
    symbols: {L: "inductance", C_p: "parasitic capacitance in parallel"}
    assumptions: [lossless_lc]
    notes: "above $f_\\mathrm{srf}$ the component behaves as a capacitor; near it, an impedance measurement reads neither $L$ nor $C_p$"
    notes_ko: "$f_\\mathrm{srf}$보다 높은 주파수에서 이 부품은 커패시터처럼 동작한다. 그 근처에서 임피던스를 측정하면 $L$도 $C_p$도 얻을 수 없다"
    cite: {key: alexander2017, where: "Ch. 14 (Frequency Response)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {L: 1.0e-3, C_p: 1.0e-11}, expect: 1591549.4309189534}

  - id: meas.L_app
    title: "Inductance a meter reads below self-resonance"
    title_ko: "자기 공진 아래에서 측정기가 읽는 인덕턴스"
    lhs: L_app
    expr: "L/(1 - (f/f_srf)**2)"
    symbols: {L: "inductance", f: "test frequency", f_srf: "self-resonant frequency"}
    ranges: {f_srf: [1.0e4, 1.0e8]}
    constraints: ["f < f_srf"]
    assumptions: [lossless_lc, sinusoidal_steady_state]
    notes: "the winding's capacitance in parallel makes the reading rise with the test frequency: 1 % high at a tenth of $f_\\mathrm{srf}$, twice the inductance at 0.71 $f_\\mathrm{srf}$; above $f_\\mathrm{srf}$ the part is capacitive"
    notes_ko: "권선의 병렬 커패시턴스 때문에 측정값이 측정 주파수와 함께 커진다. $f_\\mathrm{srf}$의 1/10에서 1 % 크고, 0.71 $f_\\mathrm{srf}$에서 두 배가 된다. $f_\\mathrm{srf}$보다 높으면 부품은 용량성이다"
    cite: {key: alexander2017, where: "Ch. 9 (Sinusoids and Phasors: impedances in parallel); derived here"}
    derived_by: python/pe_core/derive/measurement.py
    tests:
      - {inputs: {L: 1.0e-3, f: 1.0e5, f_srf: 1.0e6}, expect: 0.00101010101010101}
      - {inputs: {L: 1.0e-3, f: 1.0e6, f_srf: 1125395.3951963827}, expect: 0.004752136904873465}

  - id: cap.esr.ripple
    title: "Ripple voltage across a capacitor's series resistance"
    title_ko: "커패시터 직렬 저항에 걸리는 리플 전압"
    lhs: Delta_v_esr
    expr: "R_esr*Delta_i_pp"
    symbols: {R_esr: "equivalent series resistance", Delta_i_pp: "peak-to-peak ripple current into the capacitor"}
    ranges: {Delta_i_pp: [0.001, 20]}
    assumptions: [capacitor_takes_ripple]
    notes: "peak-to-peak and in phase with the ripple current; it adds to the capacitive ripple"
    notes_ko: "피크-피크 값이며 리플 전류와 같은 위상이다. 용량성 리플에 더해진다"
    cite: {key: ti_slva630}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {R_esr: 0.05, Delta_i_pp: 0.6}, expect: 0.03}

  - id: mag.H_ampere
    title: "Field intensity in an ungapped core from Ampère's law"
    title_ko: "앙페르 법칙으로 구한 공극이 없는 코어의 자계 세기"
    lhs: H_mag
    expr: "N*I_w/l_e"
    symbols: {N: "number of turns", I_w: "winding current", l_e: "effective magnetic path length"}
    assumptions: [uniform_field]
    cite: {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {N: 20.0, I_w: 2.0, l_e: 0.04}, expect: 1000.0}

  - id: mag.B_H
    title: "Flux density in a linear magnetic material"
    title_ko: "선형 자성 재료의 자속 밀도"
    lhs: B
    expr: "mu_0*mu_r*H_mag"
    symbols: {mu_0: "permeability of free space", mu_r: "relative permeability", H_mag: "magnetic field intensity"}
    assumptions: [linear_magnetics]
    notes: "valid below saturation; a ferrite is close to linear only over part of its B-H curve"
    notes_ko: "포화 이하에서만 유효하다. 페라이트는 B-H 곡선의 일부 구간에서만 선형에 가깝다"
    cite: {key: erickson2020, where: "Ch. 10 (Basic Magnetics Theory)"}
    tests:
      - {inputs: {mu_r: 2000.0, H_mag: 100.0}, expect: 0.25132741228718347}

  - id: xfmr.V2
    title: "Ideal transformer: secondary voltage"
    title_ko: "이상적 변압기: 2차 전압"
    lhs: V_2
    expr: "n*V_1"
    symbols: {n: "turns ratio N_s/N_p", V_1: "primary voltage"}
    assumptions: [ideal_transformer]
    convention: "turns ratio 1:n with $n$ the secondary turns divided by the primary turns (site convention)"
    convention_ko: "권선비는 1:n이며 $n$은 2차 턴 수를 1차 턴 수로 나눈 값이다(사이트 규약)"
    cite:
      - {key: alexander2017, where: "Ch. 13 (Magnetically Coupled Circuits)"}
      - {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {n: 0.5, V_1: 48.0}, expect: 24.0}

  - id: xfmr.I2
    title: "Ideal transformer: secondary current"
    title_ko: "이상적 변압기: 2차 전류"
    lhs: I_2
    expr: "I_1/n"
    symbols: {I_1: "primary current", n: "turns ratio N_s/N_p"}
    assumptions: [ideal_transformer]
    convention: "turns ratio 1:n; the secondary current is taken as flowing out of the secondary's dotted terminal"
    convention_ko: "권선비는 1:n이며, 2차 전류는 2차 권선의 점 표시 단자에서 흘러나오는 방향을 양으로 한다"
    notes: "the power is conserved: the product of the secondary voltage and current equals that of the primary"
    notes_ko: "전력이 보존된다. 2차 전압과 전류의 곱은 1차 측의 곱과 같다"
    cite:
      - {key: alexander2017, where: "Ch. 13 (Magnetically Coupled Circuits)"}
      - {key: erickson2020, where: "Ch. 6 (Converter Circuits)"}
    derived_by: python/pe_core/derive/foundations.py
    tests:
      - {inputs: {I_1: 1.0, n: 0.5}, expect: 2.0}

  - id: bat.rint
    title: "Battery current in the Rint model"
    title_ko: "Rint 모델의 배터리 전류"
    lhs: I_b
    expr: "(V - V_b)/R_b"
    symbols: {V: "voltage across the battery's terminals", V_b: "open-circuit voltage", R_b: "internal resistance"}
    assumptions: [rint_battery]
    notes: "the battery charges when its terminals are above its open-circuit voltage and discharges below it; the open-circuit voltage and the resistance depend on the state of charge, the state of health and the temperature, which the simulator holds constant over the periods it computes"
    notes_ko: "단자 전압이 개방 전압보다 높으면 배터리가 충전되고 낮으면 방전된다; 개방 전압과 저항은 충전 상태, 건강 상태, 온도에 따라 달라지며, 시뮬레이터는 계산하는 주기 동안 이를 상수로 둔다"
    cite: {key: he2011, where: "Sec. 2.1 (The Rint Model)"}
    tests:
      - {inputs: {V: 14.4, V_b: 12.0, R_b: 0.5}, expect: 4.8}
      - {inputs: {V: 11.0, V_b: 12.0, R_b: 0.5}, expect: -2.0}

  # --- 06-bench ----------------------------------------------------------------------
  - id: layout.v_spike
    title: "Voltage across a loop's inductance during a switching edge"
    title_ko: "스위칭 에지 동안 루프 인덕턴스에 걸리는 전압"
    lhs: V_spike
    expr: "L_loop*Delta_I/t_edge"
    symbols: {L_loop: "loop inductance", Delta_I: "current change over the edge", t_edge: "edge duration"}
    assumptions: [linear_edge]
    notes: "for the same edge the voltage is proportional to the loop's inductance, and a faster edge raises it in proportion: 10 nH carrying 10 A that stops in 10 ns develops 10 V"
    notes_ko: "같은 에지라면 전압은 루프 인덕턴스에 비례하고, 에지가 빨라지면 그만큼 커진다. 10 A가 흐르던 10 nH 루프에서 전류가 10 ns 만에 멈추면 10 V가 생긴다"
    cite: {key: alexander2017, where: "Ch. 6 (Capacitors and Inductors); derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {L_loop: 1.0e-8, Delta_I: 10.0, t_edge: 1.0e-8}, expect: 10.0}
      - {inputs: {L_loop: 2.0e-9, Delta_I: 30.0, t_edge: 5.0e-9}, expect: 12.0}

  - id: layout.L_ring
    title: "Loop inductance from the ring after a switching edge"
    title_ko: "스위칭 에지 뒤 링잉으로 구한 루프 인덕턴스"
    lhs: L_loop
    expr: "1/(4*pi**2*f_ring**2*C_node)"
    symbols: {f_ring: "frequency of the ring after the turn-off edge", C_node: "capacitance at the switch node: the switch's and the diode's output capacitances, the probe's and the board's"}
    ranges: {f_ring: [1.0e7, 1.0e9], C_node: [1.0e-11, 1.0e-9]}
    assumptions: [lossless_lc]
    notes: "after the turn-off edge the loop's inductance rings with the switch node's capacitance; the ring's frequency, read on an oscilloscope, gives the inductance without a current probe in the loop. The ring counts every capacitance at the node, the probe's included: leaving one out overstates the inductance"
    notes_ko: "턴오프 에지 뒤에 루프 인덕턴스는 스위치 노드 커패시턴스와 링잉한다. 오실로스코프로 읽은 링잉 주파수로 루프에 전류 프로브를 넣지 않고 인덕턴스를 구한다. 링잉에는 프로브를 포함해 노드의 모든 커패시턴스가 들어가므로, 하나라도 빼면 인덕턴스를 크게 어림한다"
    cite: {key: alexander2017, where: "Ch. 14 (Frequency Response: series resonance); derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {f_ring: 1.0e8, C_node: 2.5e-10}, expect: 1.0132118364233778e-08}

  - id: boot.C
    title: "Bootstrap capacitance for an allowed droop"
    title_ko: "허용 전압 강하에 맞춘 부트스트랩 커패시턴스"
    lhs: C_boot
    expr: "Q_boot/Delta_V_boot"
    symbols: {Q_boot: "charge drawn while the high side is on", Delta_V_boot: "allowed droop"}
    assumptions: [bootstrap_no_recharge]
    notes: "the capacitor's voltage falls by the charge it supplies divided by its capacitance; halving the allowed droop doubles the capacitance needed"
    notes_ko: "커패시터 전압은 공급한 전하를 커패시턴스로 나눈 만큼 떨어진다. 허용 강하를 절반으로 줄이면 필요한 커패시턴스는 두 배가 된다"
    cite: {key: alexander2017, where: "Ch. 6 (Capacitors and Inductors); derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {Q_boot: 5.0e-8, Delta_V_boot: 0.5}, expect: 1.0e-7}

  - id: probe.t_rise
    title: "Rise time of a single-pole system"
    title_ko: "단일 극점 시스템의 상승 시간"
    lhs: t_rise
    expr: "log(9)/(2*pi*BW)"
    symbols: {BW: "-3 dB bandwidth"}
    assumptions: [first_order_response]
    notes: "ln 9/(2π) = 0.350, so a 100 MHz single-pole system shows an ideal step rising in 3.5 ns; a response of another shape has another constant"
    notes_ko: "ln 9/(2π) = 0.350이므로, 100 MHz 단일 극점 시스템은 이상적인 계단이 3.5 ns에 걸쳐 오르는 것으로 보여 준다. 응답의 모양이 다르면 상수도 달라진다"
    cite: {key: alexander2017, where: "Ch. 7 (First-Order Circuits) and Ch. 14 (Frequency Response); derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {BW: 1.0e8}, expect: 3.4969915256605984e-09}

  - id: probe.f_ring
    title: "Ringing frequency of a probe's ground loop"
    title_ko: "프로브 접지 루프의 링잉 주파수"
    lhs: f_probe
    expr: "1/(2*pi*sqrt(L_gnd*C_probe))"
    symbols: {L_gnd: "inductance of the tip-and-ground loop", C_probe: "probe input capacitance"}
    assumptions: [lossless_lc]
    notes: "the loop's inductance and the probe's input capacitance form a series L-C that every fast edge excites: a ringing of the probe, not of the circuit. A shorter ground makes the inductance smaller and the ring faster"
    notes_ko: "루프 인덕턴스와 프로브 입력 커패시턴스가 직렬 L-C를 이루어, 빠른 에지마다 여기된다. 회로가 아니라 프로브의 링잉이다. 접지를 짧게 하면 인덕턴스가 작아져 링잉 주파수가 높아진다"
    cite: {key: alexander2017, where: "Ch. 14 (Frequency Response: series resonance); derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {L_gnd: 1.0e-7, C_probe: 1.0e-11}, expect: 159154943.09189537}

  - id: inrush.I_pk
    title: "Peak inrush current into an empty capacitor"
    title_ko: "빈 커패시터로 흐르는 돌입 전류의 최댓값"
    lhs: I_inrush
    expr: "V_g/R_ser"
    symbols: {V_g: "voltage switched on", R_ser: "series resistance of the charging path"}
    assumptions: [rc_step]
    notes: "at the step the empty capacitor has no voltage across it, so the whole step falls across the series resistance, and the current then decays with the time constant $R_\\mathrm{ser} C_\\mathrm{in}$. In this R-C model the capacitance does not limit the peak; inductance in the leads slows the rise, lowers the peak (which then depends on the capacitance too) and, with little resistance, makes the capacitor's voltage overshoot the supply"
    notes_ko: "계단이 인가되는 순간 빈 커패시터 양단 전압은 0이므로 계단 전압 전체가 직렬 저항에 걸리고, 이후 전류는 시정수 $R_\\mathrm{ser} C_\\mathrm{in}$으로 감소한다. 이 R-C 모델에서는 커패시턴스가 최댓값을 제한하지 않는다. 리드의 인덕턴스는 상승을 늦추고 최댓값을 낮추며(그때는 커패시턴스도 최댓값에 영향을 준다), 저항이 작으면 커패시터 전압이 전원 전압을 넘어 오버슈트하게 만든다"
    cite: {key: alexander2017, where: "Ch. 7 (First-Order Circuits); derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {V_g: 48.0, R_ser: 0.1}, expect: 480.0}

  - id: inrush.I2t
    title: "Joule integral of the inrush pulse"
    title_ko: "돌입 전류 펄스의 줄 적분"
    lhs: I2t
    expr: "V_g**2*C_in/(2*R_ser)"
    symbols: {V_g: "voltage switched on", C_in: "input capacitance", R_ser: "series resistance of the charging path"}
    assumptions: [rc_step]
    notes: "the integral of the decaying current squared; times $R_\\mathrm{ser}$ it is the energy the resistance dissipates while the capacitor charges, $C_\\mathrm{in} V_g^2/2$, as much as the capacitor stores whatever the resistance. Inductance in the leads does not change it: the source still delivers $C_\\mathrm{in} V_g^2$ and the capacitor keeps half"
    notes_ko: "감소하는 전류의 제곱을 적분한 값이다. 여기에 $R_\\mathrm{ser}$를 곱하면 커패시터가 충전되는 동안 저항이 소산하는 에너지 $C_\\mathrm{in} V_g^2/2$가 되며, 저항값과 관계없이 커패시터에 저장되는 에너지와 같다. 리드의 인덕턴스는 이 값을 바꾸지 않는다. 전원은 여전히 $C_\\mathrm{in} V_g^2$를 내보내고 커패시터는 그 절반을 저장한다"
    cite: {key: alexander2017, where: "Ch. 7 (First-Order Circuits); derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {V_g: 48.0, C_in: 1.0e-4, R_ser: 0.1}, expect: 1.152}

  - id: inrush.I_ramp
    title: "Inrush current with a controlled voltage ramp"
    title_ko: "전압 상승을 제어할 때의 돌입 전류"
    lhs: I_ramp
    expr: "C_in*V_g/t_ramp"
    symbols: {C_in: "input capacitance", V_g: "final voltage", t_ramp: "ramp time"}
    assumptions: [linear_ramp, series_ramp]
    notes: "a capacitor's current is $C \\, dv/dt$, so a constant slope draws a constant current, inversely proportional to the ramp time. With no other resistance in the path, the element that sets the ramp in series with the supply drops $V_g - v_C$ while carrying it and dissipates $C_\\mathrm{in} V_g^2/2$ over the ramp, as much as a series resistance would from a step: the ramp lowers the current and spreads the energy over time, but does not remove it. A source that ramps its own output (a converter's soft start) has no such element: its path loses only the resistance's share, $2 R_\\mathrm{ser} C_\\mathrm{in}/t_\\mathrm{ramp}$ of the stored energy"
    notes_ko: "커패시터 전류는 $C \\, dv/dt$이므로, 기울기가 일정하면 전류도 일정하고 램프 시간에 반비례한다. 경로에 다른 저항이 없으면, 전원과 직렬로 램프를 만드는 소자는 이 전류를 흘리는 동안 $V_g - v_C$를 떠안아 램프 동안 $C_\\mathrm{in} V_g^2/2$를 소산한다. 계단 입력 때 직렬 저항이 소산하는 양과 같다. 램프는 전류를 낮추고 에너지를 시간에 걸쳐 나눌 뿐, 에너지를 없애지는 않는다. 컨버터의 소프트 스타트처럼 전원 자신이 출력을 램프로 올리면 그런 소자가 없으며, 경로는 저항의 몫, 곧 저장 에너지의 $2 R_\\mathrm{ser} C_\\mathrm{in}/t_\\mathrm{ramp}$만 잃는다"
    cite: {key: alexander2017, where: "Ch. 6 (Capacitors and Inductors); derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {C_in: 1.0e-4, V_g: 48.0, t_ramp: 4.8e-3}, expect: 1.0}

  - id: gate.I_on
    title: "Gate current on the Miller plateau at turn-on"
    title_ko: "턴온 때 밀러 플래토의 게이트 전류"
    lhs: I_G
    expr: "(V_GS - V_pl)/R_G"
    symbols: {V_GS: "driver's on voltage", V_pl: "plateau voltage", R_G: "gate-loop resistance"}
    ranges: {V_GS: [10, 20], V_pl: [2, 8]}
    assumptions: [gate_plateau]
    notes: "with the gate held at the plateau, what the driver's voltage exceeds it by drives the current through the gate loop's resistance; a plateau close to the drive voltage leaves little current, and a slow turn-on"
    notes_ko: "게이트가 플래토에 묶여 있는 동안에는 드라이버 전압이 플래토 전압을 넘는 만큼이 게이트 루프 저항에 전류를 흘린다. 플래토가 구동 전압에 가까우면 전류가 작아 턴온이 느리다"
    cite:
      - {key: balogh2018, where: "MOSFET turn-on (the Miller plateau)"}
      - {key: alexander2017, where: "Ch. 2 (Basic Laws: Ohm's law); derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {V_GS: 10.0, V_pl: 4.5, R_G: 5.0}, expect: 1.1}

  - id: gate.I_off
    title: "Gate current on the Miller plateau at turn-off"
    title_ko: "턴오프 때 밀러 플래토의 게이트 전류"
    lhs: I_G
    expr: "V_pl/R_G"
    symbols: {V_pl: "plateau voltage", R_G: "gate-loop resistance"}
    assumptions: [gate_plateau]
    notes: "the driver pulls the gate to zero, so the plateau voltage itself drives the current out; with the same gate-loop resistance at both edges and a plateau below half the drive voltage, turn-off draws less current than turn-on and takes longer (a driver that sinks more strongly than it sources, or a turn-off diode across the gate resistor, changes that)"
    notes_ko: "드라이버가 게이트를 0으로 끌어내리므로 플래토 전압 자체가 전류를 빼낸다. 두 에지에서 게이트 루프 저항이 같고 플래토가 구동 전압의 절반보다 낮으면 턴오프 전류가 턴온보다 작아 더 오래 걸린다(끌어내리는 능력이 공급 능력보다 강한 드라이버나 게이트 저항에 병렬로 넣은 턴오프 다이오드는 이를 바꾼다)"
    cite:
      - {key: balogh2018, where: "MOSFET turn-off (the Miller plateau)"}
      - {key: alexander2017, where: "Ch. 2 (Basic Laws: Ohm's law); derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {V_pl: 4.5, R_G: 5.0}, expect: 0.9}

  - id: gate.t_pl
    title: "Time on the Miller plateau"
    title_ko: "밀러 플래토에 머무는 시간"
    lhs: t_pl
    expr: "Q_GD/I_G"
    symbols: {Q_GD: "gate-drain charge", I_G: "gate current on the plateau"}
    assumptions: [gate_plateau]
    notes: "the plateau lasts while the gate delivers the gate-drain charge at a constant current, and the drain voltage makes its transition meanwhile; a larger gate current shortens it in proportion"
    notes_ko: "플래토는 게이트가 일정한 전류로 게이트-드레인 전하를 전달하는 동안 지속되며, 그동안 드레인 전압이 전이한다. 게이트 전류가 커지면 그에 비례해 짧아진다"
    cite:
      - {key: vishay_an608a, where: "Q_GD, the charge taken on the Miller plateau"}
      - {key: alexander2017, where: "Ch. 1 (Basic Concepts: charge and current); derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {Q_GD: 1.0e-8, I_G: 1.1}, expect: 9.090909090909091e-09}

  - id: therm.Tj
    title: "Junction temperature through a series thermal path"
    title_ko: "직렬 열 경로를 통한 접합 온도"
    lhs: T_J
    expr: "T_A + P_D*(theta_JC + theta_CS + theta_SA)"
    symbols: {T_A: "ambient temperature", P_D: "dissipated power", theta_JC: "junction-to-case", theta_CS: "case-to-sink", theta_SA: "sink-to-ambient"}
    assumptions: [series_heat_path]
    notes: "each part of the path raises the temperature by its thermal resistance times the power through it, and the rises add; the largest resistance in the chain takes the largest share of the junction's rise, so lowering it helps most"
    notes_ko: "경로의 각 부분은 그 열저항과 지나가는 전력의 곱만큼 온도를 올리고, 이 상승분이 더해진다. 사슬에서 가장 큰 열저항이 접합 온도 상승에서 가장 큰 몫을 차지하므로, 그것을 낮추는 것이 가장 효과적이다"
    cite: {key: ti_spra953, where: "thermal resistance as a temperature difference per watt; derived here"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {T_A: 40.0, P_D: 2.0, theta_JC: 1.5, theta_CS: 0.5, theta_SA: 20.0}, expect: 84.0}

  - id: therm.psi
    title: "Junction temperature from the package-top temperature"
    title_ko: "패키지 윗면 온도로 구한 접합 온도"
    lhs: T_J
    expr: "T_T + Psi_JT*P_D"
    symbols: {T_T: "package-top temperature", Psi_JT: "junction-to-top characterization parameter", P_D: "dissipated power"}
    assumptions: [characterization_parameter]
    notes: "only part of the power flows through the package top, so the parameter is not a true thermal resistance and is not added into a series path; it relates the measured top to the junction for the device's whole power, in the conditions it was characterized in: with a heat sink on the package it no longer applies"
    notes_ko: "전력의 일부만 패키지 윗면을 지나므로 이 파라미터는 진정한 열저항이 아니며 직렬 경로에 더하지 않는다. 측정한 윗면 온도와 접합 온도를 소자 전체 전력에 대해, 특성화한 조건에서만 이어 준다. 패키지에 방열판을 붙이면 더 이상 맞지 않는다"
    cite: {key: ti_spra953, where: "Psi_JT, the junction-to-top characterization parameter"}
    tests:
      - {inputs: {T_T: 80.0, Psi_JT: 2.0, P_D: 2.0}, expect: 84.0}

  - id: bat.v_term
    title: "Terminal voltage of a battery in the Rint model"
    title_ko: "Rint 모델에서 배터리의 단자 전압"
    lhs: V
    expr: "V_b + I_b*R_b"
    symbols: {V_b: "open-circuit voltage", I_b: "battery current, charging positive", R_b: "internal resistance"}
    assumptions: [rint_battery]
    notes: "charging lifts the terminals above the open-circuit voltage by the current times the internal resistance, and discharging pulls them below; a charger that holds the terminals at a voltage limit delivers less current when the resistance is higher"
    notes_ko: "충전하면 단자 전압이 개방 전압보다 전류와 내부 저항의 곱만큼 높아지고, 방전하면 그만큼 낮아진다. 단자를 전압 한계에 묶어 두는 충전기는 저항이 클수록 전류를 적게 흘린다"
    cite: {key: he2011, where: "Sec. 2.1 (The Rint Model)"}
    derived_by: python/pe_core/derive/bench.py
    tests:
      - {inputs: {V_b: 3.6, I_b: 2.0, R_b: 0.05}, expect: 3.7}
      - {inputs: {V_b: 3.6, I_b: -2.0, R_b: 0.05}, expect: 3.5}

  # =========================================================================
  # 05-simulation (Phase 5c): stepping a circuit in time, settling, rounding
  # =========================================================================
  - id: sim.exact_step
    title: "One exact time step of a first-order circuit"
    title_ko: "1차 회로의 정확한 시간 스텝 하나"
    lhs: v_1
    expr: "v_inf + (v_0 - v_inf)*exp(-Delta_t/tau)"
    symbols: {v_inf: "voltage it tends to", v_0: "voltage at the start of the step", Delta_t: "time step", tau: "time constant"}
    assumptions: [constant_over_step, first_order_response]
    notes: "each step multiplies the deviation from $v_\\infty$ by $e^{-\\Delta t/\\tau}$, which lies between 0 and 1 however long the step is: the step is exact, and the deviation cannot grow. An inductor's current follows the same law with the time constant L over R"
    notes_ko: "스텝마다 $v_\\infty$와의 편차에 $e^{-\\Delta t/\\tau}$를 곱한다. 이 값은 스텝이 아무리 길어도 0과 1 사이이므로, 스텝은 정확하고 편차는 커질 수 없다. 인덕터 전류도 시정수 L/R로 같은 법칙을 따른다"
    cite: {key: alexander2017, where: "Ch. 7 (First-Order Circuits: the complete response); derived here"}
    derived_by: python/pe_core/derive/numerics.py
    tests:
      - {inputs: {v_inf: 10.0, v_0: 0.0, Delta_t: 5.0e-8, tau: 1.0e-8}, expect: 9.932620530009145}
      - {inputs: {v_inf: 5.0, v_0: 12.0, Delta_t: 1.0e-6, tau: 1.0e-6}, expect: 7.575156088200096}

  - id: num.gain_fe
    title: "Forward Euler's factor per step on a decaying mode"
    title_ko: "감쇠 모드에 대한 전진 오일러의 스텝당 배율"
    lhs: g_FE
    expr: "1 - Delta_t/tau"
    symbols: {Delta_t: "time step", tau: "time constant"}
    assumptions: [test_equation, fixed_step]
    notes: "the rule takes the slope at the start of the step. Its factor stays between -1 and 1 only while the step is shorter than $2\\tau$; a longer step multiplies the deviation by more than one in size and flips its sign every step, so the solution grows without bound. The circuit's fastest time constant, such as a small node capacitance behind a small resistance, then limits the step for the whole circuit"
    notes_ko: "스텝을 시작할 때의 기울기를 쓴다. 배율은 스텝이 $2\\tau$보다 짧을 때만 -1과 1 사이에 머문다. 스텝이 더 길면 편차에 크기가 1보다 큰 값을 곱하고 매 스텝 부호를 뒤집으므로, 해가 끝없이 커진다. 그러면 작은 저항 뒤의 작은 노드 커패시턴스처럼 회로에서 가장 짧은 시정수가 회로 전체의 스텝을 제한한다"
    cite: {key: hairer1996, where: "Sec. IV.2 (Stability Analysis for Explicit RK Methods: explicit Euler); derived here"}
    derived_by: python/pe_core/derive/numerics.py
    tests:
      - {inputs: {Delta_t: 5.0e-8, tau: 1.0e-8}, expect: -4.0}
      - {inputs: {Delta_t: 1.0e-9, tau: 1.0e-8}, expect: 0.9}

  - id: num.gain_tr
    title: "Trapezoidal rule's factor per step on a decaying mode"
    title_ko: "감쇠 모드에 대한 사다리꼴 규칙의 스텝당 배율"
    lhs: g_TR
    expr: "(1 - Delta_t/(2*tau))/(1 + Delta_t/(2*tau))"
    symbols: {Delta_t: "time step", tau: "time constant"}
    assumptions: [test_equation, fixed_step]
    notes: "the rule averages the slopes at both ends of the step. Its factor stays between -1 and 1 for any step (the rule is A-stable), but a step much longer than $\\tau$ gives a factor close to -1: the mode is hardly damped and changes sign every step, a ringing from one step to the next that the circuit does not have. ngspice integrates with this rule unless told otherwise"
    notes_ko: "스텝 양 끝의 기울기를 평균한다. 배율은 스텝 길이와 관계없이 -1과 1 사이에 머물지만(A-안정), 스텝이 $\\tau$보다 훨씬 길면 배율이 -1에 가까워진다. 모드가 거의 감쇠하지 않고 매 스텝 부호를 바꾸어, 회로에는 없는 스텝 간 링잉이 생긴다. ngspice는 따로 지정하지 않으면 이 규칙으로 적분한다"
    cite:
      - {key: hairer1996, where: "Sec. IV.3 (Stability Function of Implicit RK-Methods: the trapezoidal rule is A-stable, |R| tends to 1); derived here"}
      - {key: ngspice_manual, where: ".options, transient analysis: METHOD, trapezoidal by default"}
    derived_by: python/pe_core/derive/numerics.py
    tests:
      - {inputs: {Delta_t: 2.0e-8, tau: 1.0e-9}, expect: -0.8181818181818182}
      - {inputs: {Delta_t: 1.0e-9, tau: 1.0e-9}, expect: 0.3333333333333333}

  - id: num.gain_be
    title: "Backward Euler's factor per step on a decaying mode"
    title_ko: "감쇠 모드에 대한 후진 오일러의 스텝당 배율"
    lhs: g_BE
    expr: "1/(1 + Delta_t/tau)"
    symbols: {Delta_t: "time step", tau: "time constant"}
    assumptions: [test_equation, fixed_step]
    notes: "the rule takes the slope at the end of the step. Its factor lies between 0 and 1 for any step and tends to zero as the step grows (the rule is L-stable): a mode much faster than the step is almost gone after one step, without ringing. It is the first of the backward differentiation formulas, which ngspice uses, up to the second by default, when .options method=gear asks for Gear's method"
    notes_ko: "스텝이 끝날 때의 기울기를 쓴다. 배율은 스텝 길이와 관계없이 0과 1 사이이고 스텝이 길수록 0에 가까워진다(L-안정). 스텝보다 훨씬 빠른 모드는 링잉 없이 한 스텝 뒤에 거의 사라진다. 후진 차분 공식(backward differentiation formula) 가운데 첫 번째이며, .options method=gear로 기어(Gear) 방법을 지정하면 ngspice는 이 공식들을 기본적으로 두 번째까지 쓴다"
    cite:
      - {key: hairer1996, where: "Sec. IV.3 (implicit Euler is L-stable) and Ch. V (Multistep Methods for Stiff Problems: backward differentiation formulas, the first of which is implicit Euler); derived here"}
      - {key: ngspice_manual, where: ".options, transient analysis: METHOD=gear, and MAXORD, 2 by default"}
    derived_by: python/pe_core/derive/numerics.py
    tests:
      - {inputs: {Delta_t: 2.0e-8, tau: 1.0e-9}, expect: 0.047619047619047616}
      - {inputs: {Delta_t: 1.0e-9, tau: 1.0e-9}, expect: 0.5}

  - id: sim.step_jump
    title: "Voltage of a backward Euler step that stops an inductor's current"
    title_ko: "인덕터 전류를 멈추는 후진 오일러 스텝의 전압"
    lhs: v_jump
    expr: "L*I_os/Delta_t"
    symbols: {L: "inductance", I_os: "current past zero", Delta_t: "time step"}
    assumptions: [backward_euler_step, current_blocked, fixed_step]
    notes: "a simulator with a fixed step does not stop at the instant a diode's current reaches zero, so a step can end with the current past zero. When the diode then turns off and nothing else takes the current, the next step has to bring the inductor's current from $-I_\\mathrm{os}$ back to zero, and backward Euler puts this voltage across the inductor for that step: the node the current leaves jumps by it. The circuit has no such spike, and a shorter step does not remove it: the overshoot shrinks with the step, so the jump stays about as large as the voltage the inductor had across it before the diode turned off. A path for the current, such as a body diode, a snubber or a node capacitance, removes it"
    notes_ko: "고정 스텝 시뮬레이터는 다이오드 전류가 0에 이르는 순간에 멈추지 않으므로, 전류가 0을 지나친 채로 스텝이 끝날 수 있다. 그 다음 다이오드가 꺼지고 다른 것이 전류를 받지 않으면, 다음 스텝은 인덕터 전류를 $-I_\\mathrm{os}$에서 0으로 되돌려야 하고, 후진 오일러는 그 스텝 동안 인덕터에 이 전압을 건다. 전류가 떠난 노드가 이만큼 튄다. 회로에는 이런 스파이크가 없으며, 스텝을 줄여도 사라지지 않는다. 초과 전류가 스텝과 함께 줄어들므로, 점프의 크기는 다이오드가 꺼지기 전 인덕터에 걸려 있던 전압의 크기 정도로 남는다. 바디 다이오드, 스너버, 노드 커패시턴스처럼 전류가 흐를 경로가 있으면 사라진다"
    cite:
      - {key: alexander2017, where: "Ch. 6 (Capacitors and Inductors: v = L di/dt, and the current through an inductor cannot change abruptly); derived here"}
      - {key: hairer1996, where: "Sec. IV.3 (implicit Euler takes the slope at the end of the step)"}
      - {key: circuitjs1_source, where: "Inductor.java: the backward Euler companion model, a resistance L over the time step in parallel with the previous current"}
    derived_by: python/pe_core/derive/numerics.py
    tests:
      - {inputs: {L: 1.0e-4, I_os: 3.7e-3, Delta_t: 2.0e-8}, expect: 18.5}
      - {inputs: {L: 1.0e-6, I_os: 0.1, Delta_t: 1.0e-8}, expect: 10.0}

  - id: filter.tau_env
    title: "Time constant of the envelope of an L-C filter's ring with a resistive load"
    title_ko: "저항 부하가 달린 L-C 필터 링잉의 포락선 시정수"
    lhs: tau_env
    expr: "2*R*C"
    symbols: {R: "load resistance", C: "filter capacitance"}
    assumptions: [ideal, ccm, open_loop, underdamped_filter, resistive_load]
    notes: "with ideal parts and the buck's source at rest, the filter is the inductance, the capacitance and the load in parallel: a parallel RLC circuit, whose ring decays as $e^{-t/(2RC)}$ whatever the inductance. A lighter load (a larger $R$) rings for longer. The averaged models of the boost and the buck-boost give the same decay rate, $\\omega_0/(2Q) = 1/(2RC)$. Real parts change the decay: the winding's and the switch's resistances always make the ring decay faster, the capacitor's series resistance does when Q is above 1, and the inductance then matters too. This is how an open-loop converter's output settles in CCM after a start-up or a step; a feedback loop sets its own settling, and in DCM, where the inductance carries no energy from one period to the next, the output settles near its steady state with a single time constant instead"
    notes_ko: "이상적인 부품으로 벅의 전원이 멈춘 상태에서 필터는 인덕턴스, 커패시턴스, 부하가 병렬로 연결된 병렬 RLC 회로이며, 그 링잉은 인덕턴스와 관계없이 $e^{-t/(2RC)}$로 감쇠한다. 부하가 가벼울수록(R이 클수록) 오래 울린다. 부스트와 벅-부스트의 평균화 모델도 같은 감쇠율 $\\omega_0/(2Q) = 1/(2RC)$를 준다. 실제 부품은 감쇠를 바꾼다. 권선과 스위치의 저항은 언제나 링잉을 더 빨리 줄이고, 커패시터의 직렬 저항은 Q가 1보다 클 때 그러하며, 그때는 인덕턴스도 영향을 준다. CCM에서 개루프 컨버터의 출력은 시작이나 계단 변화 뒤 이렇게 정착한다. 피드백 루프가 있으면 루프가 정착을 정하고, 인덕턴스가 주기에서 다음 주기로 에너지를 넘기지 않는 DCM에서는 출력이 정상상태 근처에서 하나의 시정수로 정착한다"
    cite:
      - {key: alexander2017, where: "Ch. 8 (Second-Order Circuits: the source-free parallel RLC circuit); derived here"}
      - {key: erickson2020, where: "Ch. 8 (Converter Transfer Functions: the boost and buck-boost resonances, whose omega_0/(2Q) is also 1/(2RC))"}
      - {key: erickson2020, where: "Ch. 15 (AC and DC Equivalent Circuit Modeling of the Discontinuous Conduction Mode: a single low-frequency pole)"}
    derived_by: python/pe_core/derive/numerics.py
    tests:
      - {inputs: {R: 10.0, C: 1.0e-5}, expect: 2.0e-4}

  - id: sim.periods_settle
    title: "Switching periods until the start-up error has decayed"
    title_ko: "시작 오차가 줄어들 때까지의 스위칭 주기 수"
    lhs: N_set
    expr: "tau_env/T_s*log(1/eps_r)"
    symbols: {tau_env: "envelope time constant", T_s: "switching period", eps_r: "start-up error left (fraction)"}
    assumptions: [slowest_mode]
    notes: "an error that decays as $e^{-t/\\tau_\\mathrm{env}}$ falls to the fraction $\\varepsilon_r$ after $\\tau_\\mathrm{env} \\ln(1/\\varepsilon_r)$, and dividing by $T_s$ counts the periods. Each factor of ten in accuracy costs $\\ln 10$, about 2.3 envelope time constants more. A transient simulation from rest must run at least this long before its last periods show the steady state"
    notes_ko: "$e^{-t/\\tau_\\mathrm{env}}$로 감쇠하는 오차는 $\\tau_\\mathrm{env} \\ln(1/\\varepsilon_r)$ 뒤에 비율 $\\varepsilon_r$까지 줄어들고, 이를 $T_s$로 나누면 주기 수가 된다. 정확도를 10배 높일 때마다 $\\ln 10$, 곧 포락선 시정수의 약 2.3배가 더 든다. 정지 상태에서 시작하는 과도 시뮬레이션은 적어도 이만큼 달려야 마지막 주기들이 정상상태를 보여 준다"
    cite: {key: alexander2017, where: "Ch. 8 (Second-Order Circuits: the natural response decays as the exponential of minus the neper frequency times t); derived here"}
    derived_by: python/pe_core/derive/numerics.py
    tests:
      - {inputs: {tau_env: 2.0e-4, T_s: 1.0e-5, eps_r: 1.0e-6}, expect: 276.3102111592855}
      - {inputs: {tau_env: 1.0e-4, T_s: 2.5e-5, eps_r: 1.0e-3}, expect: 27.631021115928547}

  - id: num.rel_diff
    title: "Relative difference of a value from its reference"
    title_ko: "기준값에 대한 값의 상대 차이"
    lhs: delta_rel
    expr: "Abs(x_val - x_ref)/Abs(x_ref)"
    symbols: {x_val: "value under test", x_ref: "reference value"}
    assumptions: [definition]
    notes: "it does not change when the quantity is scaled, as by a change of unit from volts to millivolts, so one tolerance serves every quantity (a unit whose zero moves, such as degrees Celsius against kelvins, is the exception); at a zero reference it is undefined, and near one a small absolute difference becomes a large relative one. The site asks 1e-9 of the TypeScript and Python evaluations of the same equation, and 1 % or 2 % of a simulation against its equation"
    notes_ko: "볼트를 밀리볼트로 바꾸듯 물리량의 배율을 바꿔도 달라지지 않으므로 하나의 허용오차를 모든 물리량에 쓸 수 있다(켈빈에 대한 섭씨처럼 영점이 옮겨 가는 단위는 예외). 기준값이 0이면 정의되지 않고, 0에 가까우면 작은 절대 차이가 큰 상대 차이가 된다. 이 사이트는 같은 식의 TypeScript와 Python 계산에 1e-9를, 식에 대한 시뮬레이션에 1 % 또는 2 %를 요구한다"
    cite: {key: higham2002, where: "Sec. 1.2 (Relative Error and Significant Digits)"}
    tests:
      - {inputs: {x_val: 0.4975, x_ref: 0.5}, expect: 0.005}
      - {inputs: {x_val: -3.0, x_ref: 2.0}, expect: 2.5}

  - id: num.unit_roundoff
    title: "Unit roundoff of a floating-point format"
    title_ko: "부동소수점 형식의 단위 반올림 오차"
    lhs: u_r
    expr: "beta_b**(1 - p_prec)/2"
    symbols: {beta_b: "base", p_prec: "precision (significand digits)"}
    assumptions: [round_to_nearest]
    notes: "rounding a real number to the nearest number of the format changes it by at most this fraction of itself (in the normal range). For binary64, the IEEE 754 double precision of JavaScript's numbers and Python's floats, the base is 2 and the precision 53 digits, so $u = 2^{-53} \\approx 1.1 \\times 10^{-16}$. Higham writes the precision as $t$"
    notes_ko: "실수를 형식에서 가장 가까운 수로 반올림하면 (정규 범위에서) 값이 최대 자신의 이 비율만큼 바뀐다. JavaScript의 수와 Python의 float가 쓰는 IEEE 754 배정밀도(binary64)는 밑이 2, 정밀도가 53자리이므로 $u = 2^{-53} \\approx 1.1 \\times 10^{-16}$이다. Higham은 정밀도를 $t$로 쓴다"
    cite: {key: higham2002, where: "Ch. 2 (Floating Point Arithmetic: the unit roundoff, Sec. 2.1, and its value in IEEE double precision)"}
    tests:
      - {inputs: {beta_b: 2.0, p_prec: 53.0}, expect: 1.1102230246251565e-16}
      - {inputs: {beta_b: 10.0, p_prec: 16.0}, expect: 5.0e-16}
