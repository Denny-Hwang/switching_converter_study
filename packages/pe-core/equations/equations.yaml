# packages/pe-core/equations/equations.yaml
#
# SINGLE SOURCE OF TRUTH for every equation shown on the site.
#
#   * LaTeX is GENERATED from `expr` by `python scripts/gen_equations.py`
#     into equations.generated.json. Never hand-edit the generated files.
#   * Each entry's `tests` are checked against the sympy evaluation of `expr`
#     and exported, together with seeded random vectors, to test_vectors.json.
#     The TypeScript evaluators (packages/pe-core/src/equations.ts) must
#     reproduce every vector to 1e-9 relative (vitest parity test).
#     Test inputs are synthetic round numbers chosen for easy hand checking;
#     they are not example designs.
#   * `derived_by` names a derivation module in python/pe_core/derive/ whose
#     derive() must reproduce `expr` symbolically (pytest).
#   * `cite` (one mapping or a list) keys must exist in references.bib and must
#     not be flagged VERIFY (scripts/refcheck.py). erickson2020 chapter numbers
#     are 3rd-edition numbers (see the header of references.bib).
#
# Symbol conventions are site-wide; see CLAUDE.md "Symbol conventions":
# 1:n transformers with n = N_s/N_p; L_M referred to the primary;
# K = 2L/(R T_s); Delta i_L is HALF the peak-to-peak ripple (Erickson).
# All quantities are SI. `expr` must be sympy-parsable using only names from
# `symbol_table` plus sympy built-ins (sqrt, pi, exp, ...).

schema_version: 1

# Display form, unit and random-vector range for every symbol used in any
# `expr` or `lhs`. `latex` must use only KaTeX-supported commands.
# `value_expr` marks a physical constant (substituted exactly, never an input).
symbol_table:
  # --- dimensionless ratios -------------------------------------------------
  D: {latex: "D", unit: "1", desc: "duty ratio: switch on-time divided by T_s", meaning: "duty ratio", meaning_ko: "듀티비(duty ratio)", range: [0.05, 0.95]}
  M: {latex: "M", unit: "1", desc: "conversion ratio V/V_g", meaning: "conversion ratio", meaning_ko: "변환비(conversion ratio)"}
  K: {latex: "K", unit: "1", desc: "dimensionless inductor parameter 2L/(R T_s)", meaning: "inductor parameter (CCM vs DCM)", meaning_ko: "인덕터 파라미터(CCM/DCM 판별)", range: [0.001, 10], scale: log}
  K_crit: {latex: "K_\\mathrm{crit}", unit: "1", desc: "value of K at the CCM/DCM boundary", meaning: "K at the CCM/DCM boundary", meaning_ko: "CCM/DCM 경계의 K", range: [0.001, 1], scale: log}
  n: {latex: "n", unit: "1", desc: "transformer turns ratio N_s/N_p (1:n convention)", meaning: "turns ratio, secondary/primary", meaning_ko: "권선비(turns ratio), 2차/1차", range: [0.1, 10], scale: log}
  n_r: {latex: "n_r", unit: "1", desc: "reset-winding to primary turns ratio N_r/N_p", meaning: "reset-winding turns ratio", meaning_ko: "리셋 권선비(reset-winding ratio)", range: [0.25, 4], scale: log}
  D_max: {latex: "D_\\mathrm{max}", unit: "1", desc: "maximum duty ratio", meaning: "largest duty ratio", meaning_ko: "최대 듀티비"}
  eta_ext: {latex: "\\eta_\\mathrm{ext}", unit: "1", desc: "extracted power as a fraction of the available maximum", meaning: "share of the available power extracted", meaning_ko: "가용 전력 중 추출 비율"}
  # --- voltages ------------------------------------------------------------
  V_g: {latex: "V_g", unit: "V", desc: "input (generator) voltage", meaning: "input voltage", meaning_ko: "입력 전압", range: [1, 400], scale: log}
  V: {latex: "V", unit: "V", desc: "output voltage (magnitude, where the topology inverts)", meaning: "output voltage", meaning_ko: "출력 전압", range: [1, 400], scale: log}
  V_D: {latex: "V_D", unit: "V", desc: "forward drop of the output diode", meaning: "output-diode forward drop", meaning_ko: "출력 다이오드 순방향 전압(forward drop)", range: [0.1, 1.5]}
  V_gcrit: {latex: "V_{g,\\mathrm{crit}}", unit: "V", desc: "input voltage at the CCM/DCM boundary for a fixed D and a fixed output voltage", meaning: "input voltage at the CCM/DCM boundary", meaning_ko: "CCM/DCM 경계의 입력 전압"}
  V_DS: {latex: "V_\\mathrm{DS}", unit: "V", desc: "switch drain-source voltage while the switch is off", meaning: "switch voltage while off", meaning_ko: "꺼진 스위치의 전압"}
  V_rating: {latex: "V_\\mathrm{DS,rated}", unit: "V", desc: "drain-source voltage rating of the switch (datasheet)", meaning: "switch voltage rating", meaning_ko: "스위치 정격 전압(rating)"}
  V_R: {latex: "V_R", unit: "V", desc: "reverse voltage across the output diode while the switch is on", meaning: "diode reverse voltage", meaning_ko: "다이오드 역전압(reverse voltage)"}
  V_w: {latex: "V_w", unit: "V", desc: "voltage applied across a winding during t_on", meaning: "winding voltage during t_on", meaning_ko: "온 시간 동안의 권선 전압", range: [1, 400], scale: log}
  V_sw: {latex: "V_\\mathrm{sw}", unit: "V", desc: "voltage across C_node when the switch turns on", meaning: "switch-node voltage at turn-on", meaning_ko: "턴온 순간의 스위치 노드 전압", range: [1, 800], scale: log}
  V_GS: {latex: "V_\\mathrm{GS}", unit: "V", desc: "gate-drive voltage amplitude", meaning: "gate-drive voltage", meaning_ko: "게이트 구동 전압", range: [3, 20]}
  V_F: {latex: "V_F", unit: "V", desc: "diode forward-voltage intercept", meaning: "diode forward voltage", meaning_ko: "다이오드 순방향 전압(forward voltage)", range: [0.2, 1.5]}
  V_oc: {latex: "V_\\mathrm{oc}", unit: "V", desc: "open-circuit (Thevenin) voltage of a linear source", meaning: "source open-circuit voltage", meaning_ko: "전원 개방 전압(open-circuit voltage)", range: [0.1, 1000], scale: log}
  V_c: {latex: "V_c", unit: "V", desc: "voltage held by a constant-voltage sink", meaning: "sink voltage", meaning_ko: "정전압 싱크 전압", range: [0.01, 1000], scale: log}
  V_OUT: {latex: "V_\\mathrm{OUT}", unit: "V", desc: "output voltage of a current-sense amplifier (across R_OUT for a current-output one)", meaning: "sense-amplifier output", meaning_ko: "센스 증폭기 출력 전압"}
  V_SENSE: {latex: "V_\\mathrm{SENSE}", unit: "V", desc: "voltage across the sense resistor: the signal, and the burden on the measured circuit", meaning: "voltage across the shunt", meaning_ko: "션트 양단 전압", range: [1.0e-4, 1], scale: log}
  G_sense: {latex: "G", unit: "1", desc: "fixed voltage gain of a voltage-output current-sense amplifier (V/V)", meaning: "amplifier gain", meaning_ko: "증폭기 이득(gain)", range: [1, 1000], scale: log}
  V_REF: {latex: "V_\\mathrm{REF}", unit: "V", desc: "voltage on the REF pin of a voltage-output current-sense amplifier: its output at zero current", meaning: "REF-pin voltage", meaning_ko: "REF 핀 전압", range: [0, 5]}
  V_OS: {latex: "V_\\mathrm{OS}", unit: "V", sign: real, desc: "input offset voltage of a sense amplifier, with its sign (data sheets give its largest magnitude)", meaning: "amplifier input offset", meaning_ko: "증폭기 입력 오프셋 전압", range: [1.0e-6, 1.0e-2], scale: log}
  I_OSeq: {latex: "I_\\mathrm{OS,eq}", unit: "A", desc: "offset-equivalent current: the sensed current whose sense voltage equals the amplifier's offset voltage", meaning: "offset-equivalent current", meaning_ko: "오프셋 등가 전류"}
  R_pad: {latex: "R_\\mathrm{pad}", unit: "Ω", desc: "pad and solder resistance in the sense path of a shunt without a Kelvin connection", meaning: "pad and solder resistance", meaning_ko: "패드·납땜 저항", range: [1.0e-5, 1.0e-2], scale: log}
  eps_pad: {latex: "\\varepsilon_\\mathrm{pad}", unit: "1", desc: "relative gain error from pad and solder resistance in the sense path", meaning: "error from pad resistance", meaning_ko: "패드 저항에 의한 오차"}
  f_samp: {latex: "f_\\mathrm{samp}", unit: "Hz", desc: "sampling rate of an ADC", meaning: "ADC sampling rate", meaning_ko: "ADC 샘플링 속도(sampling rate)", range: [1, 1.0e9], scale: log}
  f_N: {latex: "f_N", unit: "Hz", desc: "Nyquist frequency: half the sampling rate, the upper edge of the Nyquist bandwidth", meaning: "Nyquist frequency", meaning_ko: "나이퀴스트 주파수(Nyquist frequency)"}
  I_min: {latex: "I_\\mathrm{min}", unit: "A", desc: "smallest current a sense chain must resolve", meaning: "smallest current to measure", meaning_ko: "측정할 최소 전류"}
  V_OUTmax: {latex: "V_\\mathrm{OUT,max}", unit: "V", desc: "largest output voltage a sense amplifier delivers at its supply (data sheet)", meaning: "amplifier's largest output", meaning_ko: "증폭기 최대 출력"}
  V_FS: {latex: "V_\\mathrm{FS}", unit: "V", desc: "full-scale input voltage of an ADC", meaning: "ADC full-scale input", meaning_ko: "ADC 풀스케일 입력"}
  eps_max: {latex: "\\varepsilon_\\mathrm{max}", unit: "1", desc: "largest acceptable relative error", meaning: "relative error target (0.01 = 1 %)", meaning_ko: "상대 오차 목표(0.01 = 1 %)"}
  V_OUTmin: {latex: "V_\\mathrm{OUT,min}", unit: "V", desc: "lowest output voltage a sense amplifier reaches: its swing to ground (data sheet)", meaning: "amplifier's lowest output", meaning_ko: "증폭기 최저 출력"}
  eps_I: {latex: "\\varepsilon_I", unit: "1", desc: "relative error of a current reading", meaning: "relative error of the reading", meaning_ko: "측정값의 상대 오차"}
  I_meas: {latex: "I_\\mathrm{meas}", unit: "A", sign: real, desc: "current a shunt reading indicates: the true current seen through the pad resistance and the amplifier's offset", meaning: "current the reading indicates", meaning_ko: "측정값이 가리키는 전류"}
  V_OUThi: {latex: "V_\\mathrm{OUT,hi}", unit: "V", desc: "highest output of a sense amplifier at a current: with the pad resistance, and the offset at the sign that raises the output", meaning: "highest output (worst case)", meaning_ko: "최대 출력(최악 조건)"}
  R_filt: {latex: "R_\\mathrm{filt}", unit: "Ω", desc: "resistance an R-C filter's capacitor sees: the Thevenin resistance of the source plus the filter's series resistor", meaning: "resistance the filter capacitor sees", meaning_ko: "필터 커패시터가 보는 저항"}
