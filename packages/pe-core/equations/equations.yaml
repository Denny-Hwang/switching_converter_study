  V_clamp: {latex: "V_\\mathrm{clamp}", unit: "V", desc: "voltage across the primary clamp while it conducts (the switch then sees V_g + V_clamp)", meaning: "clamp voltage", meaning_ko: "클램프 전압", range: [1, 600], scale: log}
