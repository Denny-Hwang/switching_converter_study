  V_BR: {latex: "V_\\mathrm{BR}", unit: "V", desc: "breakdown voltage of a TVS", meaning: "TVS breakdown voltage", meaning_ko: "TVS 항복 전압(breakdown voltage)", range: [1, 600], scale: log}
