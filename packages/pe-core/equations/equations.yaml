  R_OUT: {latex: "R_\\mathrm{OUT}", unit: "Ω", desc: "output resistor of a current-output sense amplifier", meaning: "output resistor", meaning_ko: "출력 저항", range: [1.0e3, 1.0e6], scale: log}
