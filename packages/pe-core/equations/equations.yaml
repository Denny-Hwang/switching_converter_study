  Delta_i_L: {latex: "\\Delta i_L", unit: "A", desc: "inductor current ripple, HALF of peak-to-peak (Erickson convention)", meaning: "inductor ripple, half peak-to-peak", meaning_ko: "인덕터 전류 리플, 피크-피크의 절반", range: [0.001, 10], scale: log}
  Delta_i_pp: {latex: "\\Delta i_{L,\\mathrm{pp}}", unit: "A", desc: "inductor current ripple, peak-to-peak", meaning: "inductor ripple, peak-to-peak", meaning_ko: "인덕터 전류 리플, 피크-피크"}
