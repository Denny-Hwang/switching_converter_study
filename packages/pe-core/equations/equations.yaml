  I_M: {latex: "I_M", unit: "A", desc: "dc (average) magnetizing current referred to the primary", meaning: "dc magnetizing current", meaning_ko: "자화 직류 전류(magnetizing current)", range: [0.001, 100], scale: log}
  Delta_i_M: {latex: "\\Delta i_M", unit: "A", desc: "magnetizing current ripple, HALF of peak-to-peak (Erickson convention)", meaning: "magnetizing ripple, half peak-to-peak", meaning_ko: "자화 전류 리플, 피크-피크의 절반", range: [0.001, 10], scale: log}
  Delta_v: {latex: "\\Delta v", unit: "V", desc: "output voltage ripple, HALF of peak-to-peak (Erickson convention)", meaning: "output ripple, half peak-to-peak", meaning_ko: "출력 전압 리플, 피크-피크의 절반"}
