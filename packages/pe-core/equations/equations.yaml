  R_x: {latex: "R_x", unit: "Ω", desc: "resistance carrying the current (R_DS(on), winding DCR, ESR, ...)", meaning: "resistance carrying the current", meaning_ko: "전류가 흐르는 저항", range: [0.001, 10], scale: log}
  r_d: {latex: "r_d", unit: "Ω", desc: "diode dynamic (slope) resistance", meaning: "diode dynamic resistance", meaning_ko: "다이오드 동저항(dynamic resistance)", range: [0.001, 1], scale: log}
  R_s: {latex: "R_s", unit: "Ω", desc: "source (Thevenin) resistance", meaning: "source resistance", meaning_ko: "전원 내부 저항(source resistance)", range: [1, 1.0e7], scale: log}
