  i_Coff: {latex: "i_{C,\\mathrm{off}}", unit: "A", desc: "capacitor current during the off-interval", meaning: "capacitor current, switch off", meaning_ko: "커패시터 전류(스위치 오프)"}
  D_2: {latex: "D_2", unit: "1", desc: "diode-conduction interval as a fraction of T_s (DCM)", meaning: "diode-conduction fraction (DCM)", meaning_ko: "다이오드 도통 구간 비율(DCM)"}
  R_L: {latex: "R_L", unit: "Ω", desc: "inductor winding (copper) resistance", meaning: "inductor winding resistance", meaning_ko: "인덕터 권선 저항", range: [0.001, 10], scale: log}
  eta: {latex: "\\eta", unit: "1", desc: "efficiency P_out/P_in", meaning: "efficiency", meaning_ko: "효율(efficiency)"}
  C: {latex: "C", unit: "F", desc: "capacitance (the output filter capacitor in converter equations)", meaning: "capacitance (output capacitor)", meaning_ko: "커패시턴스(출력 커패시터)", range: [1.0e-7, 1.0e-2], scale: log}
  G_d0: {latex: "G_{d0}", unit: "V", desc: "dc gain of the control-to-output transfer function (magnitude)", meaning: "dc control-to-output gain", meaning_ko: "제어-출력 직류 이득"}
  omega_0: {latex: "\\omega_0", unit: "rad/s", desc: "angular resonant (corner) frequency of the LC poles", meaning: "LC corner frequency (rad/s)", meaning_ko: "LC 공진 각주파수(rad/s)"}
  Q: {latex: "Q", unit: "1", desc: "quality factor of the LC poles", meaning: "quality factor", meaning_ko: "Q 계수(quality factor)"}
  omega_z: {latex: "\\omega_z", unit: "rad/s", desc: "angular frequency of the right-half-plane zero", meaning: "RHP-zero frequency (rad/s)", meaning_ko: "우반면 영점(RHP zero) 각주파수"}
  V_ctrl: {latex: "V_\\mathrm{ctrl}", unit: "V", desc: "PWM control voltage", meaning: "PWM control voltage", meaning_ko: "PWM 제어 전압", range: [0.01, 5], scale: log}
  V_M: {latex: "V_M", unit: "V", desc: "peak-to-peak amplitude of the PWM ramp", meaning: "PWM ramp amplitude", meaning_ko: "PWM 램프 진폭", range: [0.5, 5]}
  T_loop: {latex: "T", unit: "1", desc: "loop gain magnitude", meaning: "loop gain", meaning_ko: "루프 이득(loop gain)", range: [0.01, 1.0e4], scale: log}
  G_c: {latex: "G_c", unit: "1", desc: "compensator gain magnitude", meaning: "compensator gain", meaning_ko: "보상기 이득(compensator gain)", range: [0.01, 1000], scale: log}
  G_vd: {latex: "G_{vd}", unit: "V", desc: "control-to-output gain magnitude", meaning: "control-to-output gain", meaning_ko: "제어-출력 이득", range: [0.1, 1000], scale: log}
  H: {latex: "H", unit: "1", desc: "sensor (feedback divider) gain", meaning: "sensor (divider) gain", meaning_ko: "센서(분압기) 이득", range: [0.01, 1]}
  S_dist: {latex: "S", unit: "1", desc: "fraction of an output disturbance that remains with the loop closed", meaning: "share of a disturbance that remains", meaning_ko: "남는 외란(disturbance) 비율"}
  # --- magnetics -----------------------------------------------------------
  N: {latex: "N", unit: "1", desc: "number of turns", meaning: "number of turns", meaning_ko: "턴 수", range: [1, 500], scale: log}
  A_L: {latex: "A_L", unit: "H", desc: "inductance factor: inductance per turn squared", meaning: "inductance factor (per turn squared)", meaning_ko: "인덕턴스 계수(A_L), 턴 수 제곱당", range: [1.0e-8, 1.0e-5], scale: log}
  A_e: {latex: "A_e", unit: "m²", desc: "effective core cross-section area", meaning: "effective core area", meaning_ko: "코어 유효 단면적(effective area)", range: [1.0e-6, 1.0e-3], scale: log}
  l_e: {latex: "l_e", unit: "m", desc: "effective magnetic path length of the core", meaning: "effective magnetic path length", meaning_ko: "유효 자로 길이(path length)", range: [0.005, 0.3], scale: log}
  V_e: {latex: "V_e", unit: "m³", desc: "effective core volume ($A_e l_e$)", meaning: "effective core volume", meaning_ko: "코어 유효 체적(effective volume)", range: [1.0e-7, 1.0e-4], scale: log}
  l_g: {latex: "l_g", unit: "m", desc: "total air-gap length", meaning: "air-gap length", meaning_ko: "공극(air gap) 길이", range: [1.0e-5, 5.0e-3], scale: log}
  mu_i: {latex: "\\mu_i", unit: "1", desc: "initial relative permeability of the core material", meaning: "initial relative permeability", meaning_ko: "초기 비투자율(initial permeability)", range: [100, 20000], scale: log}
  mu_0: {latex: "\\mu_0", unit: "H/m", desc: "permeability of free space, 4π·10⁻⁷ H/m", meaning: "permeability of free space", meaning_ko: "진공 투자율(permeability of free space)", value_expr: "4*pi/10**7"}
  B_pk: {latex: "B_\\mathrm{pk}", unit: "T", desc: "peak flux density", meaning: "peak flux density", meaning_ko: "피크 자속 밀도(flux density)"}
  Delta_B: {latex: "\\Delta B", unit: "T", desc: "flux-density swing, peak-to-peak", meaning: "flux-density swing, peak-to-peak", meaning_ko: "자속 밀도 변화폭, 피크-피크"}
  B_ac: {latex: "B_\\mathrm{ac}", unit: "T", desc: "peak AC flux-density amplitude (half the peak-to-peak swing)", meaning: "ac flux-density amplitude", meaning_ko: "교류 자속 밀도 진폭", range: [0.01, 0.3], scale: log}
  P_v: {latex: "P_v", unit: "W/m³", desc: "core loss per unit volume", meaning: "core loss per volume", meaning_ko: "단위 체적당 코어 손실(core loss)", range: [1.0e3, 1.0e6], scale: log}
  k: {latex: "k", unit: "W/m³", desc: "Steinmetz coefficient (with f in Hz and B in T)", meaning: "Steinmetz coefficient", meaning_ko: "스타인메츠 계수(Steinmetz coefficient)", range: [0.1, 100], scale: log}
  f: {latex: "f", unit: "Hz", desc: "excitation frequency", meaning: "frequency", meaning_ko: "주파수", range: [1.0e3, 1.0e6], scale: log}
  alpha: {latex: "\\alpha", unit: "1", desc: "Steinmetz frequency exponent", meaning: "Steinmetz frequency exponent", meaning_ko: "스타인메츠 주파수 지수", range: [1, 2]}
  beta: {latex: "\\beta", unit: "1", desc: "Steinmetz flux-density exponent", meaning: "Steinmetz flux-density exponent", meaning_ko: "스타인메츠 자속 밀도 지수", range: [2, 3]}
  # --- refreshers (00-foundations, 01-physics) ----------------------------------
  t: {latex: "t", unit: "s", desc: "duration of a constant excitation", meaning: "duration", meaning_ko: "지속 시간", range: [1.0e-7, 1.0e-3], scale: log}
  V_L: {latex: "V_L", unit: "V", desc: "constant voltage across an inductor", meaning: "inductor voltage", meaning_ko: "인덕터 전압", range: [0.1, 400], scale: log}
  I_C: {latex: "I_C", unit: "A", desc: "constant current into a capacitor", meaning: "capacitor current", meaning_ko: "커패시터 전류", range: [0.001, 100], scale: log}
  V_C: {latex: "V_C", unit: "V", desc: "capacitor voltage", meaning: "capacitor voltage", meaning_ko: "커패시터 전압", range: [0.1, 400], scale: log}
  Delta_i: {latex: "\\Delta i", unit: "A", desc: "change of inductor current during t (the full change, not a half-ripple)", meaning: "change of inductor current", meaning_ko: "인덕터 전류 변화량"}
  Delta_v_C: {latex: "\\Delta v_C", unit: "V", desc: "change of capacitor voltage during t", meaning: "change of capacitor voltage", meaning_ko: "커패시터 전압 변화량"}
  E_L: {latex: "E_L", unit: "J", desc: "energy stored in an inductor", meaning: "energy in the inductor", meaning_ko: "인덕터에 저장된 에너지"}
  E_C: {latex: "E_C", unit: "J", desc: "energy stored in a capacitor", meaning: "energy in the capacitor", meaning_ko: "커패시터에 저장된 에너지"}
  Z_L: {latex: "|Z_L|", unit: "Ω", desc: "impedance magnitude of an inductor", meaning: "inductor impedance", meaning_ko: "인덕터 임피던스"}
  Z_C: {latex: "|Z_C|", unit: "Ω", desc: "impedance magnitude of a capacitor", meaning: "capacitor impedance", meaning_ko: "커패시터 임피던스"}
  R_f: {latex: "R_f", unit: "Ω", desc: "resistance of an R-C filter", meaning: "filter resistor", meaning_ko: "필터 저항", range: [1, 1.0e6], scale: log}
  C_f: {latex: "C_f", unit: "F", desc: "capacitance of an R-C filter", meaning: "filter capacitor", meaning_ko: "필터 커패시터", range: [1.0e-12, 1.0e-3], scale: log}
  f_c: {latex: "f_c", unit: "Hz", desc: "corner (-3 dB) frequency", meaning: "corner (-3 dB) frequency", meaning_ko: "차단 주파수(corner frequency, -3 dB)", range: [1, 1.0e7], scale: log}
  G_lp: {latex: "|G|", unit: "1", desc: "magnitude of a first-order low-pass transfer function", meaning: "low-pass gain", meaning_ko: "저역 통과(low-pass) 이득"}
  h: {latex: "h", unit: "1", desc: "harmonic order (1, 2, 3, ...)", meaning: "harmonic order", meaning_ko: "고조파 차수(harmonic order)", range: [1, 20]}
  V_pk: {latex: "V_\\mathrm{pk}", unit: "V", desc: "amplitude of a rectangular pulse train", meaning: "pulse amplitude", meaning_ko: "펄스 진폭", range: [0.1, 400], scale: log}
  a_h: {latex: "a_h", unit: "V", desc: "amplitude of the h-th harmonic", meaning: "amplitude of harmonic h", meaning_ko: "h차 고조파 진폭"}
  V_rms: {latex: "V_\\mathrm{rms}", unit: "V", desc: "rms value of a voltage waveform", meaning: "rms voltage", meaning_ko: "실효 전압(rms)"}
  C_p: {latex: "C_p", unit: "F", desc: "parasitic (winding) capacitance in parallel with an inductance", meaning: "parasitic winding capacitance", meaning_ko: "권선 기생 커패시턴스(parasitic capacitance)", range: [1.0e-12, 1.0e-8], scale: log}
  f_srf: {latex: "f_\\mathrm{srf}", unit: "Hz", desc: "self-resonant frequency", meaning: "self-resonant frequency", meaning_ko: "자기 공진 주파수(self-resonant frequency)"}
  R_esr: {latex: "R_\\mathrm{ESR}", unit: "Ω", desc: "equivalent series resistance of a capacitor", meaning: "equivalent series resistance", meaning_ko: "등가 직렬 저항(ESR)", range: [1.0e-4, 1], scale: log}
  Delta_v_esr: {latex: "\\Delta v_\\mathrm{ESR}", unit: "V", desc: "ripple voltage across the ESR, peak-to-peak", meaning: "ESR ripple, peak-to-peak", meaning_ko: "ESR 리플, 피크-피크"}
  I_w: {latex: "I_w", unit: "A", desc: "current in a winding", meaning: "winding current", meaning_ko: "권선 전류", range: [0.001, 100], scale: log}
  H_mag: {latex: "H", unit: "A/m", desc: "magnetic field intensity", meaning: "magnetic field intensity", meaning_ko: "자계 세기(field intensity)", range: [1, 1.0e5], scale: log}
  mu_r: {latex: "\\mu_r", unit: "1", desc: "relative permeability", meaning: "relative permeability", meaning_ko: "비투자율(relative permeability)", range: [1, 20000], scale: log}
  B: {latex: "B", unit: "T", desc: "magnetic flux density", meaning: "magnetic flux density", meaning_ko: "자속 밀도(flux density)"}
  V_1: {latex: "V_1", unit: "V", desc: "primary winding voltage", meaning: "primary voltage", meaning_ko: "1차 전압", range: [1, 400], scale: log}
