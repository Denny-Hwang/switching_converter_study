  I_pk: {latex: "I_\\mathrm{pk}", unit: "A", desc: "peak current", meaning: "peak current", meaning_ko: "피크 전류", range: [0.001, 100], scale: log}
  I_rms: {latex: "I_\\mathrm{rms}", unit: "A", desc: "rms current", meaning: "rms current", meaning_ko: "실효 전류(rms)", range: [0.001, 50], scale: log}
  I_avg: {latex: "I_\\mathrm{avg}", unit: "A", desc: "average current", meaning: "average current", meaning_ko: "평균 전류", range: [0.001, 50], scale: log}
  I_SENSE: {latex: "I_\\mathrm{SENSE}", unit: "A", desc: "current through the sense resistor", meaning: "current through the shunt", meaning_ko: "션트에 흐르는 전류", range: [0.001, 100], scale: log}
  # --- passive components and parasitics ----------------------------------
  L: {latex: "L", unit: "H", desc: "inductance", meaning: "inductance", meaning_ko: "인덕턴스", range: [1.0e-6, 1.0e-2], scale: log}
  L_crit: {latex: "L_\\mathrm{crit}", unit: "H", desc: "critical inductance at the CCM/DCM boundary", meaning: "critical inductance (CCM/DCM boundary)", meaning_ko: "임계 인덕턴스(CCM/DCM 경계)"}
  L_M: {latex: "L_M", unit: "H", desc: "magnetizing inductance referred to the primary", meaning: "magnetizing inductance (primary)", meaning_ko: "자화 인덕턴스(magnetizing inductance), 1차 기준", range: [1.0e-6, 1.0e-1], scale: log}
  L_lk: {latex: "L_\\mathrm{lk}", unit: "H", desc: "leakage inductance referred to the primary", meaning: "leakage inductance (primary)", meaning_ko: "누설 인덕턴스(leakage inductance), 1차 기준", range: [1.0e-8, 1.0e-4], scale: log}
