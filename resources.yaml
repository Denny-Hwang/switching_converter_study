# resources.yaml -- external learning resources ("Go deeper" lists and the
# 10-resources pages). CLAUDE.md rule 7: a resource is added only with a URL
# that was opened and matched by title, and carries `retrieved: YYYY-MM-DD`.
#
# How entries are verified (docs/ADR/0002-reference-verification.md):
#   * two independent web-search reviews saw the URL with a matching title;
#   * CI (scripts/resources_check.py --online) opens every URL and requires the
#     page title to contain `title_match`; for urlkind: pdf, the PDF's own
#     title or the text of its first two pages must contain it.
# Link specific items (a chapter, a course, an app note); link a channel only
# when a specific video cannot be verified.
#
# Fields: id, type (book|chapter|course|lecture|video|channel|app-note|
# datasheet|tool|paper), title, author, url, tags, level (intro|intermediate|
# advanced), language (en|ko), retrieved, why, why_ko, title_match,
# urlkind (html|pdf|login; default html), cite (optional references.bib key).

resources:
