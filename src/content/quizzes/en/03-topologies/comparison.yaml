# Quiz for 03-topologies/comparison. Numbers are synthetic exercise values.
numbers: synthetic
questions:
  - q: 'An application needs $5\,\mathrm{V}$ from an input that varies between $3\,\mathrm{V}$ and $9\,\mathrm{V}$, without isolation. Which single basic converter can do it?'
    options:
      - 'The buck'
      - 'The boost'
      - 'The buck-boost (accepting an inverted output)'
      - 'None of the basic converters'
    answer: 2
    explain: 'The output must be above the input at low line and below it at high line; only the buck-boost steps both up and down, at the price of an inverted output.'
  - q: 'What is the transistor utilization of an ideal CCM buck at $D = 0.25$?'
    options:
      - '0.25'
      - '0.5'
      - '0.75'
      - '1'
    answer: 1
    explain: 'For the buck the utilization is $\sqrt{D}$: the transistor blocks $V_g$, carries the load current as a pulse of duty ratio $D$, and the load power is $D V_g I$.'
  - q: 'At which duty ratio is the utilization of the buck-boost and the flyback largest?'
    options:
      - '$D = 1/4$'
      - '$D = 1/3$'
      - '$D = 1/2$'
      - '$D = 2/3$'
    answer: 1
    explain: 'The utilization is $(1 - D)\sqrt{D}$; its derivative vanishes where $1 - 3D$ is zero.'
  - q: 'Which of these converters has a right-half-plane zero in its control-to-output transfer function in CCM?'
    options:
      - 'The buck'
      - 'The forward converter'
      - 'The flyback'
      - 'None of them'
    answer: 2
    explain: 'The flyback, like the boost and the buck-boost, delivers energy to the output only during the off-interval; the buck and the forward converter feed the output through an L-C filter while the switch is on.'
  - q: 'Why does the transistor utilization of the flyback not depend on its turns ratio?'
    options:
      - 'Because the transformer stores no energy'
      - 'Because at a given duty ratio the transistor sees the same peak voltage and the same rms current whatever $n$ is; the turns ratio only scales the output voltage and current'
      - 'Because the flyback always runs at $D = 1/3$'
      - 'Because the leakage inductance cancels the turns ratio'
    answer: 1
    explain: 'In CCM the transistor blocks $V_g + V/n$, which equals $V_g/(1 - D)$, and for a given load power its current does not depend on $n$ either; the turns ratio changes only the output side.'
  - q: 'Which converter delivers a continuous current to its output capacitor and draws a pulsed current from its input?'
    options:
      - 'The buck'
      - 'The boost'
      - 'The buck-boost'
      - 'The flyback'
    answer: 0
    explain: 'The buck''s inductor sits between the switch node and the output, so the output sees the continuous inductor current, while the input sees it only while the switch is on.'
