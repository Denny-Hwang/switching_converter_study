# Quiz for 04-magnetics/snubbers-clamps. Numbers are synthetic exercise values.
numbers: synthetic
questions:
  - q: 'A node rings at 20 MHz, and at 10 MHz with $150\,\mathrm{pF}$ added across it. What is its own capacitance?'
    options:
      - '$150\,\mathrm{pF}$'
      - '$50\,\mathrm{pF}$'
      - '$75\,\mathrm{pF}$'
      - '$37.5\,\mathrm{pF}$'
    answer: 1
    explain: 'Halving the frequency needs four times the capacitance, so the added 150 pF is three times the node''s own.'
  - q: 'How does AN11160 choose an RC snubber''s resistor?'
    options:
      - 'As small as possible'
      - 'As large as possible'
      - 'For a damping factor between 0.5 and 1 of the parasitic inductance, the resistor and the snubber capacitor in series, then by trying a few values'
      - 'Equal to the load resistance'
    answer: 2
    explain: 'A damping factor between 0.5 and 1 gives the least peak voltage; the best value in that range is found by trials.'
  - q: 'An RC snubber of $220\,\mathrm{pF}$ sees a 100 V swing at each edge, at 100 kHz. What loss does it add?'
    options:
      - '$0.22\,\mathrm{W}$'
      - '$0.11\,\mathrm{W}$'
      - '$22\,\mathrm{mW}$'
      - '$2.2\,\mathrm{W}$'
    answer: 0
    explain: 'Charging and discharging the snubber capacitor each lose half of C V squared: C V squared per period, times the frequency.'
  - q: 'How does the snubber resistor''s value change the snubber''s loss?'
    options:
      - 'A larger resistor lowers it'
      - 'It does not: the capacitor, the voltage swing and the frequency set it'
      - 'A smaller resistor lowers it'
      - 'The loss is in the capacitor, not the resistor'
    answer: 1
    explain: 'Charging a capacitor through a resistor loses half of C V squared whatever the resistance, and the next edge loses the stored half.'
  - q: 'What snubber capacitor does AN11160 take as a starting point?'
    options:
      - 'A tenth of the node''s own capacitance'
      - 'A hundred times the node''s own capacitance'
      - 'One to two times the node''s own capacitance'
      - 'As large as the output capacitor'
    answer: 2
    explain: 'A compromise: a larger capacitor lowers the peak voltage the best resistor can reach, but the loss grows with it.'
  - q: 'In the TVS model, a TVS with a 150 V breakdown voltage and a dynamic resistance of $0.5\,\Omega$ carries 10 A. What does it clamp at?'
    options:
      - '$155\,\mathrm{V}$'
      - '$150\,\mathrm{V}$'
      - '$145\,\mathrm{V}$'
      - '$160\,\mathrm{V}$'
    answer: 0
    explain: 'The breakdown voltage plus the dynamic resistance times the current: 150 V plus 5 V.'
  - q: 'What happens to a flyback clamp''s loss if its voltage is set just above the reflected voltage?'
    options:
      - 'It falls to the leakage energy per period'
      - 'It rises far above the leakage energy per period'
      - 'It becomes zero'
      - 'It does not change'
    answer: 1
    explain: 'The leakage current then takes long to reset, and the clamp keeps drawing energy from the transformer meanwhile.'
  - q: 'At the edge that charges the snubber capacitor, AN11160 has the resistor take as much energy as the capacitor stores. What else does it count in the resistor''s rating?'
    options:
      - 'The load''s power'
      - 'Nothing else'
      - 'The parasitic inductance''s energy when the ring starts'
      - 'The gate-drive energy'
    answer: 2
    explain: 'The energy in the parasitic inductance when the ring starts goes into the resistor as well, so the resistor can dissipate more than the loss the snubber adds.'
