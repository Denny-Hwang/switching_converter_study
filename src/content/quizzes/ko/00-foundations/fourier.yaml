# 00-foundations/fourier 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '펄스열이 $D = 0.3$으로 $0$과 $10\,\mathrm{V}$ 사이를 스위칭합니다. 직류 성분은 얼마입니까?'
    options:
      - '$0.3\,\mathrm{V}$'
      - '$3\,\mathrm{V}$'
      - '$5\,\mathrm{V}$'
      - '$7\,\mathrm{V}$'
    answer: 1
    explain: '직류 성분은 평균값, 즉 펄스 높이에 펄스가 지속되는 시간이 주기에서 차지하는 비율을 곱한 값입니다.'
  - q: '$D = 0.25$에서 $0$과 $10\,\mathrm{V}$ 사이를 오가는 펄스열의 실효값은 얼마입니까?'
    options:
      - '$2.5\,\mathrm{V}$'
      - '$5\,\mathrm{V}$'
      - '$7.07\,\mathrm{V}$'
      - '$10\,\mathrm{V}$'
    answer: 1
    explain: '제곱의 평균은 $0.25 \times 100\,\mathrm{V^2}$이고, 그 제곱근은 평균값의 두 배인 $5\,\mathrm{V}$입니다.'
  - q: '$D = 0.5$에서 직사각형 펄스열의 어떤 고조파가 없습니까?'
    options:
      - '없음'
      - '홀수 고조파'
      - '짝수 고조파'
      - '3차보다 높은 모든 고조파'
    answer: 2
    explain: '$h D$가 정수이면 그 고조파는 사라지며, $D = 0.5$에서는 모든 짝수 $h$가 이에 해당합니다.'
  - q: '진폭이 0이 되는 곳을 제외하면, 직사각형 펄스열의 고조파 진폭은 고조파 차수 $h$에 따라 어떻게 줄어듭니까?'
    options:
      - '$1/h$에 비례하여'
      - '$1/h^2$에 비례하여'
      - '지수적으로'
      - '줄어들지 않음'
    answer: 0
    explain: '진폭은 $2 V_\mathrm{pk} |\sin(\pi h D)|/(\pi h)$이며, 포락선은 $1/h$에 비례하여 줄어듭니다.'
  - q: '$D = 0.5$에서 $0$과 $12\,\mathrm{V}$ 사이를 오가는 펄스열의 기본파 진폭은 얼마입니까?'
    options:
      - '$6\,\mathrm{V}$'
      - '$7.64\,\mathrm{V}$'
      - '$12\,\mathrm{V}$'
      - '$3.82\,\mathrm{V}$'
    answer: 1
    explain: '$h = 1$, $D = 0.5$이면 사인 항은 1이므로 진폭은 $2 \times 12/\pi$입니다.'
  - q: '벅 컨버터의 출력이 스위치 노드 전압의 평균값과 같은 이유는 무엇입니까?'
    options:
      - 'L-C 필터가 직류 성분은 통과시키고, 스위칭 주파수에 있는 가장 낮은 고조파부터 모든 고조파를 크게 감쇠시키기 때문'
      - '스위치 노드 전압에 고조파가 없기 때문'
      - '다이오드가 고조파를 제거하기 때문'
      - '부하 저항이 전압을 평균하기 때문'
    answer: 0
    explain: '출력에는 직류 성분과 고조파의 작은 잔여분, 즉 리플이 남습니다.'
