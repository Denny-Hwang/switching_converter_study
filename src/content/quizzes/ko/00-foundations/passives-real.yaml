# 00-foundations/passives-real 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '저항이 $50\,\mathrm{m}\Omega$인 권선에 실효값 $3\,\mathrm{A}$의 전류가 흐릅니다. 이 권선의 도통 손실은 얼마입니까?'
    options:
      - '$0.15\,\mathrm{W}$'
      - '$0.3\,\mathrm{W}$'
      - '$0.45\,\mathrm{W}$'
      - '$1.5\,\mathrm{W}$'
    answer: 2
    explain: '손실은 실효 전류의 제곱에 저항을 곱한 값, 즉 $9 \times 0.05$입니다.'
  - q: '$1\,\mathrm{mH}$ 인덕터에 $10\,\mathrm{pF}$의 기생 커패시턴스가 있습니다. 이 인덕터의 자기 공진 주파수는 얼마입니까?'
    options:
      - '$159\,\mathrm{kHz}$'
      - '$1.59\,\mathrm{MHz}$'
      - '$15.9\,\mathrm{MHz}$'
      - '$50\,\mathrm{kHz}$'
    answer: 1
    explain: '인덕턴스와 커패시턴스의 곱은 $10^{-14}\,\mathrm{s^2}$이고, 그 제곱근은 $0.1\,\mu\mathrm{s}$이며, $1/(2\pi \times 0.1\,\mu\mathrm{s})$의 값은 약 $1.59\,\mathrm{MHz}$입니다.'
  - q: '자기 공진 주파수보다 높은 주파수에서 인덕터는 어떻게 동작합니까?'
    options:
      - '더 큰 인덕터처럼'
      - '커패시터처럼'
      - '모든 주파수에서 단락 회로처럼'
      - '순수한 저항처럼'
    answer: 1
    explain: '공진보다 높은 주파수에서는 병렬 커패시턴스의 어드미턴스가 인덕턴스의 어드미턴스보다 크므로, 임피던스는 용량성입니다.'
  - q: '벅의 출력 커패시터에 $20\,\mathrm{m}\Omega$의 직렬 저항이 있고, 피크-피크 $1\,\mathrm{A}$의 리플 전류가 흐릅니다. 직렬 저항이 더하는 리플은 얼마입니까?'
    options:
      - '피크-피크 $2\,\mathrm{mV}$'
      - '피크-피크 $10\,\mathrm{mV}$'
      - '피크-피크 $20\,\mathrm{mV}$'
      - '피크-피크 $40\,\mathrm{mV}$'
    answer: 2
    explain: '저항 양단의 전압은 저항에 흐르는 전류를 따르므로, 그 피크-피크 값은 저항에 피크-피크 전류를 곱한 값입니다.'
  - q: '평균이 같은 두 전류가 있습니다. 하나는 일정한 전류이고, 다른 하나는 $D = 0.25$인 펄스열입니다. 같은 저항에서 두 전류의 손실은 어떻게 비교됩니까?'
    options:
      - '같음'
      - '펄스열이 두 배의 손실을 냄'
      - '펄스열이 네 배의 손실을 냄'
      - '일정한 전류의 손실이 더 큼'
    answer: 2
    explain: '평균이 같으면 펄스의 높이는 네 배이므로, 그 실효값은 평균의 두 배이고, 실효값의 제곱에 비례하는 손실은 네 배가 됩니다.'
  - q: '임피던스 분석기로 인덕터의 자기 공진 주파수를 어떻게 찾을 수 있습니까?'
    options:
      - '임피던스 크기가 가장 작은 곳'
      - '임피던스의 위상이 0을 지나는 곳'
      - '인덕턴스 측정값이 가장 큰 곳'
      - '분석기의 기본 측정 주파수에서'
    answer: 1
    explain: '병렬 공진에서 임피던스는 실수이므로, 임피던스가 유도성에서 용량성으로 바뀔 때 그 위상은 0을 지납니다.'
