# 00-foundations/phasors-laplace 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '$1\,\mathrm{MHz}$에서 $10\,\mu\mathrm{H}$ 인덕터의 임피던스 크기는 얼마입니까?'
    options:
      - '$6.28\,\Omega$'
      - '$62.8\,\Omega$'
      - '$628\,\Omega$'
      - '$0.0159\,\Omega$'
    answer: 1
    explain: '크기는 $2\pi f L$, 즉 $2\pi \times 10^6 \times 10^{-5}$입니다.'
  - q: '주파수를 두 배로 높입니다. 커패시터의 임피던스 크기는 어떻게 됩니까?'
    options:
      - '두 배가 됨'
      - '절반이 됨'
      - '변하지 않음'
      - '4분의 1로 줄어듦'
    answer: 1
    explain: '커패시터의 임피던스 크기는 주파수에 반비례합니다.'
  - q: 'R-C 저역통과 필터가 $10\,\mathrm{k}\Omega$ 저항과 $1\,\mathrm{nF}$ 커패시터로 이루어져 있습니다. 차단 주파수는 얼마입니까?'
    options:
      - '$1.59\,\mathrm{kHz}$'
      - '$15.9\,\mathrm{kHz}$'
      - '$159\,\mathrm{kHz}$'
      - '$100\,\mathrm{kHz}$'
    answer: 1
    explain: '차단 주파수는 $1/(2\pi R C)$이며, $R C$는 $10\,\mu\mathrm{s}$입니다.'
  - q: '1차 저역통과 필터의 차단 주파수에서 이득은 얼마입니까?'
    options:
      - '1'
      - '$1/\sqrt{2}$, 약 -3 dB'
      - '1/2, 약 -6 dB'
      - '0'
    answer: 1
    explain: '차단 주파수에서는 분모의 실수부와 허수부가 같으므로 크기는 $1/\sqrt{2}$입니다.'
  - q: '1차 저역통과 필터는 차단 주파수보다 한 디케이드 높은 주파수의 정현파를 대략 얼마나 감쇠시킵니까?'
    options:
      - '2분의 1로'
      - '약 10분의 1로(-20 dB)'
      - '100분의 1로(-40 dB)'
      - '전혀 감쇠시키지 않음'
    answer: 1
    explain: '이득은 $1/\sqrt{1 + 100}$, 즉 약 $0.0995$이며, 기울기는 디케이드당 -20 dB입니다.'
  - q: '벅 컨버터의 L-C 필터가 스위치 노드 전압의 직류 성분은 통과시키고 스위칭 리플은 통과시키지 않는 이유는 무엇입니까?'
    options:
      - '인덕터의 임피던스는 직류에서 0이고 스위칭 주파수에서 크며, 커패시터의 임피던스는 그 반대이기 때문'
      - '커패시터가 직류를 차단하기 때문'
      - '인덕터가 모든 주파수에서 단락 회로이기 때문'
      - '스위치 노드 전압에 고조파가 없기 때문'
    answer: 0
    explain: '직류에서 인덕터는 단락 회로, 커패시터는 개방 회로입니다. 스위칭 주파수에서는 인덕터의 임피던스가 크고 커패시터의 임피던스가 작으므로, 리플은 분압되어 작아집니다.'
