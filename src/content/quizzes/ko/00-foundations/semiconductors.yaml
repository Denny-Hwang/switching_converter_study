# 00-foundations/semiconductors 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '$200\,\mathrm{kHz}$로 스위칭하는 트랜지스터가 켜질 때마다 스위치 노드에 있는 $100\,\mathrm{pF}$의 커패시턴스를 $48\,\mathrm{V}$에서 방전시킵니다. 용량성 턴온 손실은 얼마입니까?'
    options:
      - '$11.5\,\mathrm{mW}$'
      - '$23\,\mathrm{mW}$'
      - '$46\,\mathrm{mW}$'
      - '$2.3\,\mathrm{mW}$'
    answer: 1
    explain: '저장 에너지는 커패시턴스에 전압의 제곱을 곱한 값의 절반인 약 $115\,\mathrm{nJ}$이며, 이 에너지가 초당 $2 \times 10^5$번 손실됩니다.'
  - q: '총 게이트 전하가 $30\,\mathrm{nC}$인 MOSFET을 $100\,\mathrm{kHz}$에서 $12\,\mathrm{V}$로 구동합니다. 게이트 구동 전력은 얼마입니까?'
    options:
      - '$3.6\,\mathrm{mW}$'
      - '$18\,\mathrm{mW}$'
      - '$36\,\mathrm{mW}$'
      - '$360\,\mathrm{mW}$'
    answer: 2
    explain: '게이트 전하에 구동 전압을 곱한 값이 주기당 에너지인 $360\,\mathrm{nJ}$이며, 이 에너지가 초당 $10^5$번 소모됩니다.'
  - q: '스위칭 주파수를 두 배로 높입니다. 용량성 턴온 손실과 게이트 구동 전력은 어떻게 됩니까?'
    options:
      - '둘 다 두 배가 됨'
      - '둘 다 변하지 않음'
      - '전자는 두 배가 되고 후자는 변하지 않음'
      - '둘 다 네 배가 됨'
    answer: 0
    explain: '각각은 주기마다 한 번 손실되는 고정된 에너지이므로, 둘 다 스위칭 주파수에 비례합니다.'
  - q: '게이트 구동 전력은 어디에서 소산됩니까?'
    options:
      - 'MOSFET의 채널에서'
      - '드라이버와 게이트 저항에서'
      - '부하에서'
      - '어디에서도 소산되지 않음: 게이트 전하가 회수됨'
    answer: 1
    explain: '게이트 전하는 게이트로 들어갈 때와 나올 때 드라이버와 게이트 저항을 거쳐 흐르며, 이들이 그 에너지를 열로 바꿉니다.'
  - q: '순방향 전압이 $0.5\,\mathrm{V}$이고 기울기 저항이 $20\,\mathrm{m}\Omega$인 다이오드에 평균 $2\,\mathrm{A}$, 실효값 $2.5\,\mathrm{A}$의 전류가 흐릅니다. 이 다이오드의 도통 손실은 얼마입니까?'
    options:
      - '$1\,\mathrm{W}$'
      - '$1.125\,\mathrm{W}$'
      - '$1.25\,\mathrm{W}$'
      - '$0.125\,\mathrm{W}$'
    answer: 1
    explain: '순방향 전압에 평균 전류를 곱하면 $1\,\mathrm{W}$이고, 기울기 저항에 실효 전류의 제곱을 곱한 값이 $0.125\,\mathrm{W}$를 더합니다.'
  - q: '저전압 컨버터에서 출력 다이오드를 동기 정류기로 대체하는 경우가 많은 이유는 무엇입니까?'
    options:
      - '다이오드는 낮은 전압을 차단할 수 없기 때문'
      - '다이오드의 고정된 순방향 전압이 낮은 출력 전압에서 큰 비율을 차지하므로 효율을 크게 떨어뜨리기 때문'
      - '동기 정류기에는 게이트 구동이 필요 없기 때문'
      - '다이오드는 어떤 전압에서든 너무 느리게 스위칭하기 때문'
    answer: 1
    explain: '순방향 전압은 부하와 관계없이 출력 경로에서 일정한 전압을 가져갑니다. 켜져 있는 트랜지스터에서는 온 저항에 전류를 곱한 만큼의 전압 강하만 생깁니다.'
