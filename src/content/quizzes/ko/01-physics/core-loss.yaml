# 01-physics/core-loss 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '코어 손실을 이루는 두 가지 메커니즘은 무엇입니까?'
    options:
      - '히스테리시스와 와전류'
      - '권선 저항과 표피 효과'
      - '누설 인덕턴스와 프린징'
      - '포화와 프린징'
    answer: 0
    explain: '히스테리시스로 인해 매 주기 B-H 루프로 둘러싸인 에너지가 손실되고, 와전류는 코어 재료의 저항에서 전력을 소산합니다.'
  - q: '고정된 주파수에서 코어의 자속 진폭을 절반으로 줄입니다. 스타인메츠 지수가 $\beta = 2.5$일 때, 코어 손실은 대략 몇 분의 1로 줄어듭니까?'
    options:
      - '2'
      - '2.5'
      - '5.7'
      - '32'
    answer: 2
    explain: '손실은 진폭의 $\beta$ 제곱에 비례하므로 $2^{2.5}$분의 1, 즉 약 5.7분의 1로 줄어듭니다.'
  - q: '어떤 변압기의 자속 밀도 변화폭은 피크-피크 $0.2\,\mathrm{T}$입니다. 스타인메츠 식에 $B_\mathrm{ac}$로 넣는 값은 무엇입니까?'
    options:
      - '$0.05\,\mathrm{T}$'
      - '$0.1\,\mathrm{T}$'
      - '$0.2\,\mathrm{T}$'
      - '$0.4\,\mathrm{T}$'
    answer: 1
    explain: '$B_\mathrm{ac}$는 피크 교류 진폭으로, 피크-피크 변화폭의 절반입니다.'
  - q: '컨버터의 구형파에 대해 스타인메츠 식이 추정값에 그치는 이유는 무엇입니까?'
    options:
      - '계수가 제한된 범위에서 정현파 여자에 대해 피팅되었기 때문입니다'
      - '주파수를 무시하기 때문입니다'
      - '공심 인덕터에만 적용되기 때문입니다'
      - '코어 손실이 아니라 권선 손실을 주기 때문입니다'
    answer: 0
    explain: '계수는 정현파 자속으로 측정한 결과에서 얻은 것입니다. 다른 파형과 피팅 범위를 벗어난 조건에서는 손실이 달라집니다.'
  - q: '높은 스위칭 주파수에서 변압기의 자속 변화폭을 제한하는 것은 대개 무엇입니까?'
    options:
      - '포화'
      - '코어 손실'
      - '권선 커패시턴스'
      - '없음'
    answer: 1
    explain: '코어 손실을 허용 가능한 수준으로 유지하는 변화폭은 대개 포화 자속 밀도보다 훨씬 낮습니다.'
  - q: '어떤 코어 재료의 손실이 동작점에서 $10^5\,\mathrm{W/m^3}$입니다. 체적이 $2\,\mathrm{cm^3}$인 코어의 손실은 얼마입니까?'
    options:
      - '$0.02\,\mathrm{W}$'
      - '$0.2\,\mathrm{W}$'
      - '$2\,\mathrm{W}$'
      - '$20\,\mathrm{W}$'
    answer: 1
    explain: '체적은 $2 \times 10^{-6}\,\mathrm{m^3}$이며, 단위 체적당 손실에 체적을 곱하면 $0.2\,\mathrm{W}$입니다.'
