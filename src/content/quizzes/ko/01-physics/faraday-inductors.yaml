# 01-physics/faraday-inductors 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '유효 자로 길이가 $0.05\,\mathrm{m}$이고 공극이 없는 코어에 감긴 20턴 권선에 $1\,\mathrm{A}$의 전류가 흐릅니다. 코어 내부의 자계 세기는 얼마입니까?'
    options:
      - '$20\,\mathrm{A/m}$'
      - '$400\,\mathrm{A/m}$'
      - '$1000\,\mathrm{A/m}$'
      - '$4000\,\mathrm{A/m}$'
    answer: 1
    explain: '둘러싸인 전류는 $20\,\mathrm{A}$ 턴이며, 이 전류가 $0.05\,\mathrm{m}$의 경로에 걸쳐 분포합니다.'
  - q: '유효 단면적이 $1\,\mathrm{cm^2}$인 코어에 감긴 24턴 권선에 $12\,\mathrm{V}$의 일정한 전압을 $10\,\mu\mathrm{s}$ 동안 인가합니다. 자속 밀도 변화폭은 얼마입니까?'
    options:
      - '$0.005\,\mathrm{T}$'
      - '$0.05\,\mathrm{T}$'
      - '$0.5\,\mathrm{T}$'
      - '$5\,\mathrm{T}$'
    answer: 1
    explain: '전압-초($120\,\mu\mathrm{Vs}$)를 턴 수와 면적의 곱($24 \times 10^{-4}\,\mathrm{m^2}$)으로 나눈 값입니다.'
  - q: '듀티비와 전압을 그대로 둔 채 컨버터의 스위칭 주파수를 두 배로 높입니다. 이 컨버터의 변압기에서 자속 변화폭은 어떻게 됩니까?'
    options:
      - '두 배가 됩니다'
      - '절반이 됩니다'
      - '변하지 않습니다'
      - '4분의 1로 줄어듭니다'
    answer: 1
    explain: '온 시간이 절반이 되므로 주기당 전압-초가 절반이 되고, 그에 따라 자속 변화폭도 절반이 됩니다.'
  - q: '직류 자화 전류가 흐르지 않는 변압기에서 자속 변화폭을 정하는 것은 무엇입니까?'
    options:
      - '부하 전류'
      - '권선에 인가된 전압-초, 그 권선의 턴 수, 코어 단면적'
      - '코어의 투자율만'
      - '2차 전류'
    answer: 1
    explain: '패러데이 법칙은 부하와 관계없이 자속의 변화율을 권선 전압과 연결합니다.'
  - q: '주어진 코어에서 권선 전류는 그대로 두고 턴 수를 두 배로 늘립니다. 자계 세기는 어떻게 됩니까?'
    options:
      - '절반이 됩니다'
      - '변하지 않습니다'
      - '두 배가 됩니다'
      - '네 배가 됩니다'
    answer: 2
    explain: '둘러싸인 전류, 즉 턴 수와 권선 전류의 곱이 두 배가 되고, 자로 길이는 그대로입니다.'
  - q: '정상상태에서 변압기 권선 양단의 평균 전압이 0이어야 하는 이유는 무엇입니까?'
    options:
      - '출력 전압을 일정하게 유지하기 위해서'
      - '순 전압-초가 조금이라도 있으면 코어가 포화될 때까지 자속이 매 주기 커지기 때문에'
      - '권선 손실을 피하기 위해서'
      - '2차 측이 절연되어 있기 때문에'
    answer: 1
    explain: '주기당 자속 변화는 순 전압-초에 비례합니다. 순 전압-초가 0일 때만 자속이 시작 값으로 돌아옵니다.'
