# 01-physics/ferrites-bh 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '비투자율이 1000인 선형 재료에서 자계 세기가 $200\,\mathrm{A/m}$입니다. 자속 밀도는 얼마입니까?'
    options:
      - '$0.025\,\mathrm{T}$'
      - '$0.25\,\mathrm{T}$'
      - '$2.5\,\mathrm{T}$'
      - '$0.0025\,\mathrm{T}$'
    answer: 1
    explain: '자속 밀도는 $\mu_0 \mu_r H$이므로 $4\pi \times 10^{-7} \times 1000 \times 200$, 즉 약 $0.25\,\mathrm{T}$입니다.'
  - q: '유효 단면적이 $0.5\,\mathrm{cm^2}$인 코어에 10턴을 감은 $50\,\mu\mathrm{H}$ 인덕터에 $4\,\mathrm{A}$의 피크 전류가 흐릅니다. 이 인덕터의 피크 자속 밀도는 얼마입니까?'
    options:
      - '$0.04\,\mathrm{T}$'
      - '$0.2\,\mathrm{T}$'
      - '$0.4\,\mathrm{T}$'
      - '$4\,\mathrm{T}$'
    answer: 2
    explain: '쇄교 자속은 $200\,\mu\mathrm{Wb}$ 턴이며, 이를 10턴과 $5 \times 10^{-5}\,\mathrm{m^2}$로 나누면 $0.4\,\mathrm{T}$입니다.'
  - q: '코어가 포화되면 인덕터의 인덕턴스는 어떻게 됩니까?'
    options:
      - '급격히 증가합니다'
      - '급격히 감소합니다'
      - '변하지 않습니다'
      - '음수가 됩니다'
    answer: 1
    explain: '포화를 넘어서면 투자율이 진공의 투자율 쪽으로 급락하고, 인덕턴스도 함께 급락합니다.'
  - q: '인덕터의 자속 밀도를 평균 전류가 아니라 피크 전류에서 점검해야 하는 이유는 무엇입니까?'
    options:
      - '포화는 순시 자속 밀도에 의존하고, 순시 자속 밀도는 피크 전류에서 가장 크기 때문에'
      - '평균 전류는 항상 0이기 때문에'
      - '코어 손실은 피크값에만 의존하기 때문에'
      - '그럴 필요가 없습니다. 평균으로 충분합니다'
    answer: 0
    explain: '자속 밀도가 매 주기 잠깐이라도 한계를 넘으면 코어는 곧바로 포화됩니다.'
  - q: '페라이트 코어는 포화 자속 밀도가 더 낮은데도 높은 스위칭 주파수에서 사용됩니다. 그 이유는 무엇입니까?'
    options:
      - '높은 비저항이 와전류 손실을 낮게 유지합니다'
      - '절대 포화되지 않습니다'
      - '히스테리시스가 없습니다'
      - '항상 가장 저렴한 선택지입니다'
    answer: 0
    explain: '와전류는 변화하는 자속에 의해 유도됩니다. 높은 비저항은 와전류를 제한하며, 이는 주파수가 높아질수록 더 중요해집니다.'
  - q: '인덕터를 권선 창(winding window)이 더 큰 코어로 다시 만듭니다. 인덕턴스와 피크 전류는 같고 턴 수는 두 배입니다. 코어 단면적이 그대로라면 피크 자속 밀도는 어떻게 됩니까?'
    options:
      - '두 배가 됩니다'
      - '절반이 됩니다'
      - '변하지 않습니다'
      - '네 배가 됩니다'
    answer: 1
    explain: '인덕턴스와 전류가 고정되어 있으면 피크 자속 밀도는 턴 수에 반비례합니다.'
