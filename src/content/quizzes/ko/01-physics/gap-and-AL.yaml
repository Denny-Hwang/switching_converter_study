# 01-physics/gap-and-AL 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '턴 수 제곱당 $A_L = 250\,\mathrm{nH}$인 코어가 있습니다. $100\,\mu\mathrm{H}$를 얻으려면 몇 턴이 필요합니까?'
    options:
      - '4'
      - '20'
      - '40'
      - '400'
    answer: 1
    explain: '턴 수의 제곱은 인덕턴스를 $A_L$로 나눈 값인 400이며, 그 제곱근은 20입니다.'
  - q: '주어진 코어의 턴 수를 두 배로 늘립니다. 인덕턴스는 어떻게 됩니까?'
    options:
      - '두 배가 됩니다'
      - '네 배가 됩니다'
      - '변하지 않습니다'
      - '절반이 됩니다'
    answer: 1
    explain: '인덕턴스는 $A_L$에 턴 수의 제곱을 곱한 값입니다.'
  - q: '공극이 인덕턴스를 코어 재료와 거의 무관하게 만드는 이유는 무엇입니까?'
    options:
      - '공극의 자기저항이 전체에서 지배적이며, 그 자기저항은 공극 길이와 단면적에만 의존하기 때문입니다'
      - '공극이 재료의 투자율을 높이기 때문입니다'
      - '공극이 히스테리시스를 없애기 때문입니다'
      - '공극이 자로를 짧게 만들기 때문입니다'
    answer: 0
    explain: '비투자율이 크므로, 코어의 자기저항은 짧은 공극의 자기저항에 비해서도 작습니다.'
  - q: '단순한 수식과 비교할 때, 공극 주위의 프린징 자속은 실제 $A_L$을 어떻게 바꿉니까?'
    options:
      - '더 작게 만듭니다'
      - '더 크게 만듭니다'
      - '영향을 주지 않습니다'
      - '전류에 의존하게 만듭니다'
    answer: 1
    explain: '프린징은 공극의 유효 단면적을 넓혀 공극의 자기저항을 낮추고 $A_L$을 높입니다.'
  - q: '어떤 코어의 유효 단면적은 $1\,\mathrm{cm^2}$이고 총 공극 길이는 $1\,\mathrm{mm}$이며, 코어 자체의 자기저항은 무시할 수 있습니다. 프린징을 무시하면 $A_L$은 얼마입니까?'
    options:
      - '$12.6\,\mathrm{nH}$'
      - '$126\,\mathrm{nH}$'
      - '$1.26\,\mu\mathrm{H}$'
      - '$12.6\,\mu\mathrm{H}$'
    answer: 1
    explain: '$\mu_0$에 단면적을 곱하고 공극 길이로 나눈 값, 즉 $4\pi \times 10^{-7} \times 10^{-4}/10^{-3}$입니다.'
  - q: '같은 인덕턴스와 전류에서, 공극이 있는 코어를 같은 크기의 공극이 없는 코어와 비교하면 어떻습니까?'
    options:
      - '같은 인덕턴스를 얻는 데 더 많은 턴이 필요하므로, 도달하는 자속 밀도가 더 낮습니다'
      - '도달하는 자속 밀도가 더 높습니다'
      - '공극이 재료의 한계를 높이므로, 더 높은 자속 밀도에서 포화됩니다'
      - '차이가 없습니다'
    answer: 0
    explain: '피크 자속 밀도는 인덕턴스와 전류의 곱을 턴 수와 단면적으로 나눈 값입니다. 공극은 재료의 한계를 바꾸지 않지만, 턴 수가 많아지면 자속 밀도가 낮아집니다.'
