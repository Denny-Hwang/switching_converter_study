# 01-physics/transformers-coupled 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '권선비가 1:n이고 $n = 0.2$인 이상적 변압기의 1차 측 양단 전압이 $50\,\mathrm{V}$입니다. 2차 전압은 얼마입니까?'
    options:
      - '$2.5\,\mathrm{V}$'
      - '$10\,\mathrm{V}$'
      - '$50\,\mathrm{V}$'
      - '$250\,\mathrm{V}$'
    answer: 1
    explain: '2차 전압은 1차 전압의 $n$배입니다.'
  - q: '같은 변압기의 2차 측이 $5\,\mathrm{A}$의 전류를 공급합니다. 1차 전류는 얼마입니까?'
    options:
      - '$0.2\,\mathrm{A}$'
      - '$1\,\mathrm{A}$'
      - '$5\,\mathrm{A}$'
      - '$25\,\mathrm{A}$'
    answer: 1
    explain: '2차 전류는 1차 전류를 $n$으로 나눈 값이므로, 1차 전류는 $5\,\mathrm{A}$의 $n$배입니다. 전력은 양쪽에서 같습니다.'
  - q: '$n = 0.5$인 이상적 변압기의 2차 측에 $10\,\Omega$ 저항이 연결되어 있습니다. 1차 측에서 보이는 저항은 얼마입니까?'
    options:
      - '$2.5\,\Omega$'
      - '$5\,\Omega$'
      - '$20\,\Omega$'
      - '$40\,\Omega$'
    answer: 3
    explain: '2차 측의 임피던스는 1차 측에서 $n^2$(여기서는 $0.25$)으로 나눈 값으로 나타납니다.'
  - q: '2차 측을 개방했을 때 실제 변압기가 끌어가는 전류를 모델링하는 소자는 무엇입니까?'
    options:
      - '누설 인덕턴스'
      - '자화 인덕턴스'
      - '권선 커패시턴스'
      - '부하 저항'
    answer: 1
    explain: '투자율이 유한한 코어에 자속을 형성하려면 전류가 필요하며, 이 전류는 1차 측에 병렬로 연결된 자화 인덕턴스로 모델링합니다.'
  - q: '플라이백의 결합 인덕터는 포워드 컨버터의 변압기와 어떻게 다릅니까?'
    options:
      - '2차 권선이 없습니다'
      - '두 권선이 모두 도통하는 동안 에너지를 통과시키는 대신, 자화 인덕턴스에 에너지를 저장했다가 나중에 방출합니다'
      - '코어가 필요 없습니다'
      - '누설 인덕턴스가 없습니다'
    answer: 1
    explain: '플라이백에서는 1차 권선과 2차 권선이 번갈아 도통하며, 그 사이에 에너지는 자화 인덕턴스에 머물러 있습니다.'
  - q: '이 사이트에서 사용하는 1:n 규약에서 $n$은 무엇입니까?'
    options:
      - '1차 턴 수를 2차 턴 수로 나눈 값'
      - '2차 턴 수를 1차 턴 수로 나눈 값'
      - '전체 턴 수'
      - '권선 저항의 비'
    answer: 1
    explain: '이 사이트는 Erickson의 규약을 따릅니다. 권선비는 1:n이며, $n$은 2차 턴 수를 1차 턴 수로 나눈 값입니다.'
