# 02-theory/averaged-models 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: 'CCM으로 동작하는 컨버터의 평균 직류 모델에서 스위치 네트워크는 무엇이 됩니까?'
    options:
      - '부하 저항과 같은 저항'
      - '변환비를 권선비로 갖는 이상적인 직류 변압기'
      - '단락 회로'
      - '인덕터 전류와 같은 전류원'
    answer: 1
    explain: '한 주기에 걸쳐 평균하면 스위치는 직류에서도 동작하는 이상적인 변압기처럼, 전압에는 $M(D)$를, 전류에는 그 역수를 곱하면서 입력에서 출력으로 전력을 손실 없이 전달합니다.'
  - q: '인덕터 권선 저항이 있는 부스트 컨버터에서 $D$가 1에 가까워지면 변환비는 어떻게 됩니까?'
    options:
      - '이상적인 경우처럼 한없이 커집니다'
      - '일정한 값으로 수렴합니다'
      - '최댓값에 도달한 뒤 0을 향해 감소합니다'
      - '진동합니다'
    answer: 2
    explain: '이상적인 변환비에 $D$가 1에 가까워질수록 0으로 떨어지는 인자가 곱해집니다. 인덕터 전류가 매우 빠르게 증가하여 권선 저항의 손실이 추가 입력 전력을 모두 차지하기 때문입니다.'
  - q: '부스트 컨버터가 $D = 0.5$에서 동작하며 $R_L = 0.1\,\Omega$, $R = 10\,\Omega$입니다. 손실이 $R_L$에서만 생긴다면 효율은 얼마입니까?'
    options:
      - '약 99 %'
      - '약 96 %'
      - '약 90 %'
      - '약 80 %'
    answer: 1
    explain: '$R_L$은 $(1 - D)^2 R$, 즉 $10\,\Omega$의 4분의 1과 비교됩니다. 효율은 $1/(1 + 0.1/2.5)$, 즉 약 0.96입니다.'
  - q: '부스트에서 듀티비가 높을 때 같은 권선 저항이 효율을 더 많이 떨어뜨리는 이유는 무엇입니까?'
    options:
      - '권선이 가열되어 저항이 커지기 때문입니다'
      - '스위칭 주파수가 높아지기 때문입니다'
      - '권선 저항이 인덕터 쪽으로 환산한 부하 저항 $(1 - D)^2 R$과 비교되는데, 이 값은 $D$가 커질수록 작아지기 때문입니다'
      - '출력 전압이 낮아지기 때문입니다'
    answer: 2
    explain: '직류 변압기를 거치면 부하는 인덕터 쪽에서 $(1 - D)^2 R$로 보이며, 이 저항은 $R_L$과 직렬입니다. 효율은 전력 중 이 환산 저항에 도달하는 비율입니다.'
  - q: 'DCM에서 벅-부스트 컨버터의 입력 포트는 한 주기에 걸쳐 평균하면 어떻게 동작합니까?'
    options:
      - '흡수한 전력을 소모하지 않고 출력으로 전달하는 저항처럼'
      - '정전류 싱크처럼'
      - '정전압원처럼'
      - '개방 회로처럼'
    answer: 0
    explain: '매 주기가 전류 0에서 시작하므로 평균 입력 전류는 입력 전압에 비례합니다. 즉 저항입니다. 에너지는 인덕터에 저장되었다가 소모되지 않고 출력으로 전달되므로 무손실 저항입니다.'
  - q: '$L_M = 50\,\mu\mathrm{H}$, $f_s = 100\,\mathrm{kHz}$, $D = 0.5$인 DCM 벅-부스트가 있습니다. 입력 저항은 얼마입니까?'
    options:
      - '$20\,\Omega$'
      - '$40\,\Omega$'
      - '$80\,\Omega$'
      - '$160\,\Omega$'
    answer: 1
    explain: '입력 저항은 $2 L_M f_s/D^2$입니다. $50\,\mu\mathrm{H}$와 $100\,\mathrm{kHz}$를 곱한 값의 두 배는 $10\,\Omega$이며, 이를 0.25로 나눕니다.'
