# 02-theory/ccm-dcm 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '다이오드 정류기를 사용하는 벅 컨버터는 경부하에서 왜 DCM으로 들어갑니까?'
    options:
      - '경부하에서는 스위칭 주파수가 낮아집니다'
      - '인덕터 직류 전류는 줄어드는데 리플은 그대로이므로, 전류가 0에 도달하고 다이오드는 전류를 음의 방향으로 흘릴 수 없습니다'
      - '듀티비가 0.5보다 커집니다'
      - '출력 커패시터가 완전히 방전됩니다'
    answer: 1
    explain: 'CCM에서 리플은 부하가 아니라 인가되는 전압과 $L$, $T_s$에만 의존합니다. 직류 전류가 리플의 절반보다 작아지면 아래쪽 피크는 음의 값이 되겠지만, 다이오드가 역방향 전류를 막으므로 전류는 주기의 나머지 동안 0에 머뭅니다.'
  - q: 'DCM에서는 CCM 해석에 쓰는 가정 가운데 어느 것을 인덕터 전류에 대해 버려야 합니까?'
    options:
      - '전압-초 평형'
      - '전하 평형'
      - '소리플 근사'
      - '주기적 정상상태'
    answer: 2
    explain: 'DCM에서는 리플이 전류 자체만큼 크므로 인덕터 전류를 그 직류값으로 대체할 수 없습니다. 회로가 여전히 주기적 정상상태에 있으므로 평형 조건은 그대로 성립합니다.'
  - q: 'DCM으로 동작하는 개루프 벅 컨버터의 부하 저항을 키웁니다. 듀티비가 고정되어 있을 때 출력 전압은 어떻게 됩니까?'
    options:
      - '입력 전압을 향해 올라갑니다'
      - '$D V_g$에 머뭅니다'
      - '0을 향해 떨어집니다'
      - '스위칭 주파수로 진동합니다'
    answer: 0
    explain: '$R$을 키우면 $K$가 작아지며, $K$가 0으로 갈수록 DCM 변환비는 1을 향해 커집니다. 변환비가 $D$만으로 정해지는 것은 CCM에서뿐입니다.'
  - q: '벅 컨버터가 $D = 0.5$로 동작하는데, 출력을 측정하니 입력의 $0.7$배입니다. 무엇을 결론지을 수 있습니까?'
    options:
      - '컨버터가 CCM으로 동작하며 인덕터에 손실이 있습니다'
      - '듀티비 측정이 잘못되었습니다'
      - '컨버터가 DCM으로 동작합니다'
      - '컨버터가 CCM으로 동작하며 무부하 상태입니다'
    answer: 2
    explain: 'CCM에서 이상적인 벅의 변환비는 정확히 $D$이며, 손실은 변환비를 낮출 뿐입니다. 변환비가 $D$보다 크다는 것은 인덕터 전류가 0에 도달한다는 뜻입니다. 즉 컨버터는 $M > D$인 DCM으로 동작합니다.'
  - q: 'DCM 컨버터에서 휴지 구간 동안 스위치 노드에 나타나는 링잉의 원인은 무엇입니까?'
    options:
      - '스위치가 턴온될 때 다이오드의 역회복'
      - '인덕터 전류가 0에 도달한 뒤 인덕터가 스위치 노드의 커패시턴스와 공진하는 현상'
      - '출력 커패시터와 그 ESR의 공진'
      - '제어 루프에서 오는 노이즈'
    answer: 1
    explain: '스위치와 다이오드가 모두 꺼져 있으면 인덕터와 스위치 노드 커패시턴스가 약하게 감쇠되는 L-C 회로를 이루며, 이 회로는 공진 주파수 $1/(2\pi\sqrt{L C})$로 링잉합니다.'
  - q: '벅 컨버터의 다이오드를 주 스위치와 상보적으로 구동되는 트랜지스터로 바꿉니다. 경부하에서는 어떻게 됩니까?'
    options:
      - '컨버터가 더 일찍 DCM에 들어갑니다'
      - '컨버터는 CCM을 유지하며, 인덕터 전류는 주기의 일부 동안 단순히 음의 값이 됩니다'
      - '출력 전압이 입력 전압을 향해 올라갑니다'
      - '스위칭 주파수가 절반이 됩니다'
    answer: 1
    explain: 'DCM은 다이오드가 역방향으로 도통할 수 없기 때문에 생깁니다. 동기 정류기는 양방향으로 도통하므로 전류는 멈추는 대신 방향이 바뀌고, CCM 관계식이 계속 성립합니다.'
