# 02-theory/control-basics 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: 'PWM 변조기가 피크 진폭 $2\,\mathrm{V}$의 톱니파를 사용합니다. 제어 전압이 $0.6\,\mathrm{V}$이면 듀티비는 얼마입니까?'
    options:
      - '0.12'
      - '0.3'
      - '0.6'
      - '3.3'
    answer: 1
    explain: '램프가 제어 전압보다 낮은 동안 스위치가 켜져 있으므로, 듀티비는 제어 전압을 램프 진폭으로 나눈 값입니다.'
  - q: '어떤 주파수에서 전압 모드 루프의 값이 $G_c = 5$, $G_{vd} = 12\,\mathrm{V}$, $H = 0.25$, $V_M = 1.5\,\mathrm{V}$입니다. 그 주파수에서 루프 이득의 크기는 얼마입니까?'
    options:
      - '2.5'
      - '10'
      - '40'
      - '60'
    answer: 1
    explain: '루프를 따라 크기가 곱해지고, 변조기는 $1/V_M$을 기여합니다. 즉 5에 12와 0.25를 곱한 뒤 1.5로 나눈 값입니다.'
  - q: '직류에서 루프 이득이 19로 측정되었습니다. 느린 입력 전압 외란은 출력에서 몇 배로 줄어듭니까?'
    options:
      - '19'
      - '20'
      - '1/19'
      - '1/20'
    answer: 3
    explain: '외란은 $1 + T$, 즉 20으로 나누어집니다. 따라서 피드백이 없을 때 영향의 20분의 1로 출력에 도달합니다.'
  - q: '크로스오버 주파수보다 훨씬 높은 주파수에서 피드백은 외란을 얼마나 억제합니까?'
    options:
      - '루프 이득이 1보다 훨씬 작으므로 거의 억제하지 못합니다'
      - '직류 루프 이득만큼 억제합니다'
      - '위상 여유만큼 억제합니다'
      - '완전히 억제합니다'
    answer: 0
    explain: '루프 이득의 크기가 1보다 훨씬 작은 곳에서는 $1 + T$가 1에 가까우므로, 외란은 피드백이 없는 것처럼 그대로 통과합니다.'
  - q: '어떤 루프의 위상 여유가 작습니다. 크로스오버 주파수 부근의 외란은 어떻게 됩니까?'
    options:
      - '더 강하게 억제됩니다'
      - '영향을 받지 않습니다'
      - '$1 + T$의 크기가 1보다 작아지므로 증폭될 수 있습니다'
      - '스위칭 주파수로 옮겨 갑니다'
    answer: 2
    explain: '크로스오버 부근에서는 루프 이득의 크기가 약 1이고, 위상이 $-180^\circ$에 가까우면 복소 합 $1 + T$가 작아지므로 이 값으로 나누면 외란이 증폭됩니다.'
  - q: 'PWM 램프 진폭을 입력 전압에 비례하여 바꾸면 벅의 루프 이득이 입력 전압 범위 전체에서 일정하게 유지되는 이유는 무엇입니까?'
    options:
      - '듀티비를 일정하게 유지하기 때문입니다'
      - '벅의 제어-출력 이득은 입력 전압에 비례하고, 램프 진폭이 그 이득을 나누기 때문입니다'
      - '스위칭 주파수를 바꾸기 때문입니다'
      - '우반평면 영점을 제거하기 때문입니다'
    answer: 1
    explain: '벅의 직류 이득 $G_{d0}$는 $V_g$와 같고, 변조기는 $1/V_M$을 기여합니다. $V_M$이 $V_g$에 비례하면 두 값의 곱과 그에 따른 루프 이득은 더 이상 $V_g$에 의존하지 않습니다.'
