# 02-theory/k-parameter 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '$L = 50\,\mu\mathrm{H}$, $R = 5\,\Omega$, $T_s = 10\,\mu\mathrm{s}$인 컨버터가 있습니다. $K$는 얼마입니까?'
    options:
      - '0.5'
      - '1'
      - '2'
      - '4'
    answer: 2
    explain: '$K$는 $2L/(R T_s)$입니다. $50\,\mu\mathrm{H}$의 두 배는 $100\,\mu\mathrm{H}$이고 $R T_s$는 $50\,\mu\mathrm{s}\cdot\Omega$이므로, 그 비는 2입니다.'
  - q: '벅 컨버터가 $D = 0.4$, $K = 0.5$에서 동작합니다. 동작 모드는 무엇입니까?'
    options:
      - 'CCM'
      - 'DCM'
      - '정확히 경계에 있음'
      - '입력 전압을 모르면 판정할 수 없음'
    answer: 1
    explain: '벅에서 $K_\mathrm{crit}$은 $1 - D$이며, 여기서는 0.6입니다. $K$가 이보다 작으므로 인덕터 전류가 0에 도달합니다. 즉 DCM입니다.'
  - q: '컨버터를 DCM 쪽으로 이동시키는 변화는 어느 것입니까?'
    options:
      - '더 큰 인덕턴스'
      - '더 높은 스위칭 주파수'
      - '더 무거운 부하(더 작은 $R$)'
      - '더 가벼운 부하(더 큰 $R$)'
    answer: 3
    explain: '$R$이 커지면 $K$가 작아집니다. 더 큰 인덕턴스, 더 높은 스위칭 주파수, 더 무거운 부하는 모두 $K$를 키워 컨버터를 CCM 쪽으로 이동시킵니다.'
  - q: '부스트 컨버터의 임계값 $K_\mathrm{crit}$은 어느 듀티비에서 가장 큽니까?'
    options:
      - '$D$가 0에 가까워질 때'
      - '$D = 1/3$'
      - '$D = 0.5$'
      - '$D$가 1에 가까워질 때'
    answer: 1
    explain: '부스트의 값 $D(1 - D)^2$은 양 끝에서 0입니다. 그 도함수 $(1 - D)(1 - 3D)$는 $D = 1/3$에서 0이 되며, 이때 값은 $4/27$입니다.'
  - q: '부하가 $R = 20\,\Omega$까지 가벼워져도 벅 컨버터가 CCM을 유지해야 합니다. 이 부하에서 $K_\mathrm{crit}$은 0.5이고, $T_s = 10\,\mu\mathrm{s}$입니다. 이를 만족하는 가장 작은 인덕턴스는 얼마입니까?'
    options:
      - '$25\,\mu\mathrm{H}$'
      - '$50\,\mu\mathrm{H}$'
      - '$100\,\mu\mathrm{H}$'
      - '$200\,\mu\mathrm{H}$'
    answer: 1
    explain: '임계 인덕턴스는 $K_\mathrm{crit} R T_s/2$입니다. 0.5와 $200\,\mu\mathrm{s}\cdot\Omega$의 곱의 절반, 즉 $50\,\mu\mathrm{H}$입니다.'
  - q: '벅 컨버터가 일정 범위의 입력 전압으로부터 고정된 출력 전압을 레귤레이션합니다. 어느 입력 전압에서 경부하 시 DCM에 들어갈 가능성이 가장 큽니까?'
    options:
      - '가장 낮은 입력 전압'
      - '가장 높은 입력 전압'
      - '범위의 중간'
      - '입력 전압과 무관함'
    answer: 1
    explain: '입력 전압이 높을수록 필요한 듀티비는 작아지고, 벅의 값 $1 - D$는 $D$가 작아질수록 커지므로 더 큰 $K$에서 경계에 도달합니다.'
