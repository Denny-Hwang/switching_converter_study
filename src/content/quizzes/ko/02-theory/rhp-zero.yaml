# 02-theory/rhp-zero 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '듀티비를 계단 형태로 증가시킨 직후 부스트 컨버터의 출력 전압이 잠깐 떨어집니다. 그 이유는 무엇입니까?'
    options:
      - '인덕터가 포화됩니다'
      - '인덕터 전류가 아직 증가하지 않은 상태에서 다이오드가 이제 각 주기의 더 짧은 시간 동안만 도통합니다'
      - '출력 커패시터가 스위치로 방전됩니다'
      - '제어 루프가 불안정합니다'
    answer: 1
    explain: '에너지는 다이오드가 도통하는 동안에만 출력에 도달합니다. 온 구간이 길어지면 다이오드 도통 구간은 즉시 짧아지지만 인덕터 전류가 증가하는 데는 시간이 걸리므로, 평균 다이오드 전류가 먼저 감소합니다.'
  - q: '우반평면(RHP) 영점은 보드 선도에 어떤 영향을 줍니까?'
    options:
      - '크기는 극점처럼 감소하고 위상은 영점처럼 앞섭니다'
      - '크기는 영점처럼 증가하지만 위상은 극점처럼 지연됩니다'
      - '크기만 바꿉니다'
      - '위상만 바꿉니다'
    answer: 1
    explain: '$1 - s/\omega_z$의 크기는 $1 + s/\omega_z$의 크기와 똑같이 주파수에 따라 증가하지만, 위상은 $+90^\circ$가 아니라 $-90^\circ$ 쪽으로 향합니다.'
  - q: '부스트 컨버터가 $D = 0.5$에서 동작하며 $R = 10\,\Omega$, $L = 100\,\mu\mathrm{H}$입니다. RHP 영점은 어디에 있습니까?'
    options:
      - '$12.5\,\mathrm{krad/s}$'
      - '$25\,\mathrm{krad/s}$'
      - '$50\,\mathrm{krad/s}$'
      - '$100\,\mathrm{krad/s}$'
    answer: 1
    explain: '영점은 $(1 - D)^2 R/L$에 있습니다. 즉 $10\,\Omega$의 4분의 1을 $100\,\mu\mathrm{H}$로 나눈 값입니다.'
  - q: '부스트 컨버터의 RHP 영점은 어떤 조건에서 가장 낮은 주파수에 놓입니까?'
    options:
      - '경부하와 낮은 듀티비'
      - '중부하와 높은 듀티비'
      - '경부하와 높은 듀티비'
      - '동작점에 따라 달라지지 않습니다'
    answer: 1
    explain: '영점은 $(1 - D)^2 R$에 비례합니다. 작은 부하 저항(중부하)과 큰 듀티비(낮은 입력 전압)는 모두 영점을 낮춥니다.'
  - q: 'RHP 영점을 보상기로 상쇄할 수 없는 이유는 무엇입니까?'
    options:
      - '상쇄하려면 우반평면에 극점이 필요한데, 그 극점은 불안정합니다'
      - '보상기는 극점을 포함할 수 없습니다'
      - '영점이 스위칭 주파수보다 높습니다'
      - '좌반평면 영점으로 상쇄할 수 있습니다'
    answer: 0
    explain: '상쇄란 영점과 같은 위치에 극점을 두는 것입니다. 우반평면 영점이라면 그 극점은 불안정하므로, 크로스오버 주파수를 영점보다 충분히 낮게 유지하는 방법으로 영점을 감수해야 합니다.'
  - q: '$L$과 $C$가 같을 때, $D = 0.5$에서 동작하는 CCM 부스트의 이중 극점 주파수는 벅과 비교해 어떻습니까?'
    options:
      - '같습니다'
      - '두 배 높습니다'
      - '절반입니다'
      - '4배 낮습니다'
    answer: 2
    explain: '부스트의 $\omega_0$는 $(1 - D)/\sqrt{LC}$로, 벅의 값에 $1 - D$를 곱한 것입니다. 평균 모델에서 인덕턴스가 $L/(1 - D)^2$의 형태로 나타나기 때문입니다.'
