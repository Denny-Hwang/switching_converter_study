# 02-theory/small-signal 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '전달함수로 피드백 루프를 설계하기 전에 컨버터의 평균 모델을 선형화해야 하는 이유는 무엇입니까?'
    options:
      - '듀티비가 전압과 전류에 곱해져 평균 모델이 비선형이 되기 때문입니다'
      - '스위치가 이상적이기 때문입니다'
      - '인덕터 전류가 불연속이기 때문입니다'
      - '스위칭 주파수가 너무 높기 때문입니다'
    answer: 0
    explain: '전달함수는 선형 시스템을 기술합니다. 듀티비와 입력 전압의 곱 같은 항은 비선형입니다. 각 물리량을 직류 값과 작은 변동의 합으로 쓰고 변동끼리의 곱을 버리면 동작점 주위의 선형 모델을 얻습니다.'
  - q: '입력이 $24\,\mathrm{V}$인 이상적인 CCM 벅 컨버터에서 제어-출력 직류 이득 $G_{d0}$의 값은 얼마입니까?'
    options:
      - '$12\,\mathrm{V}$'
      - '$24\,\mathrm{V}$'
      - '$48\,\mathrm{V}$'
      - '부하에 따라 달라집니다'
    answer: 1
    explain: '정적 특성 곡선은 $D V_g$이고, $D$에 대한 그 기울기는 $V_g$입니다. 이 이득의 단위는 듀티비 단위당 볼트이며, 이상적인 모델에서는 부하와 무관합니다.'
  - q: '$L = 100\,\mu\mathrm{H}$, $C = 100\,\mu\mathrm{F}$인 벅 필터가 있습니다. $\omega_0$의 값은 얼마입니까?'
    options:
      - '$1\,\mathrm{krad/s}$'
      - '$10\,\mathrm{krad/s}$'
      - '$100\,\mathrm{krad/s}$'
      - '$1\,\mathrm{Mrad/s}$'
    answer: 1
    explain: '곱 $L C$는 $10^{-8}\,\mathrm{s}^2$이고 그 제곱근은 $10^{-4}\,\mathrm{s}$이므로, $\omega_0$의 값은 $10^{4}\,\mathrm{rad/s}$입니다.'
  - q: '벅 컨버터의 부하 저항이 두 배가 됩니다. 제어-출력 극점의 $Q$는 어떻게 됩니까?'
    options:
      - '절반이 됩니다'
      - '변하지 않습니다'
      - '두 배가 됩니다'
      - '네 배가 됩니다'
    answer: 2
    explain: '$Q$는 $R\sqrt{C/L}$이며 $R$에 비례합니다. 부하가 가벼울수록 L-C 공진이 덜 감쇠되므로 피크가 커집니다.'
  - q: '공진 각주파수 $\omega_0$에서 2차 제어-출력 응답의 크기는 얼마입니까?'
    options:
      - '직류 이득과 같습니다'
      - '직류 이득의 $Q$배입니다'
      - '직류 이득을 $Q$로 나눈 값입니다'
      - '0입니다'
    answer: 1
    explain: '$\omega_0$에서는 분모의 상수항과 $s^2$ 항이 상쇄되어 $j/Q$가 남습니다. 크기는 직류 이득의 $Q$배이고 위상은 $-90^\circ$입니다.'
  - q: '소신호 모델은 어떤 섭동에 대해 유효합니까?'
    options:
      - '모든 크기, 모든 주파수에서'
      - '직류 값보다 훨씬 작은 변동, 스위칭 주파수보다 훨씬 낮은 주파수에서'
      - '스위칭 주파수에서만'
      - 'DCM에서만'
    answer: 1
    explain: '선형화하려면 변동이 작아야 하고, 평균화하려면 관심 주파수가 스위칭 주파수보다 훨씬 낮아야 합니다.'
