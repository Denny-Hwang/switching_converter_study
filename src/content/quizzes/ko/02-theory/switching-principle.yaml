# 02-theory/switching-principle 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '이상적인 스위치는 완전히 켜져 있거나 완전히 꺼져 있습니다. 이 스위치가 소모하는 전력은 얼마입니까?'
    options:
      - '꺼져 있는 동안에만 0'
      - '켜져 있는 동안 입력 전압과 부하 전류의 곱'
      - '전압과 전류 중 하나가 0이므로 두 상태 모두에서 0'
      - '듀티비에 따라 다름'
    answer: 2
    explain: '전력은 전압과 전류의 곱입니다. 켜져 있는 이상적인 스위치에는 양단 전압이 없고, 꺼져 있는 이상적인 스위치에는 전류가 흐르지 않으므로 두 상태 모두에서 곱은 0입니다.'
  - q: '스위치 노드가 $12\,\mathrm{V}$와 $0\,\mathrm{V}$ 사이를 오가며, $D = 0.25$입니다. 직류 성분은 얼마입니까?'
    options:
      - '$3\,\mathrm{V}$'
      - '$6\,\mathrm{V}$'
      - '$9\,\mathrm{V}$'
      - '$12\,\mathrm{V}$'
    answer: 0
    explain: '직류 성분은 한 주기에 걸친 평균, 즉 하이 레벨에 주기 중 그 레벨에 머무는 비율을 곱한 값이므로 $12\,\mathrm{V}$의 4분의 1입니다.'
  - q: '출력 L-C 필터의 차단 주파수가 스위칭 주파수보다 훨씬 낮아야 하는 이유는 무엇입니까?'
    options:
      - '인덕터 전류가 절대 0에 도달하지 않도록 하기 위해'
      - '필터가 직류 성분은 통과시키고 스위칭 고조파는 감쇠시키도록 하기 위해'
      - '듀티비를 부하와 무관하게 만들기 위해'
      - '스위치의 도통 손실을 줄이기 위해'
    answer: 1
    explain: '스위치 노드 파형은 직류 성분에 $f_s$의 배수 주파수에 있는 고조파가 더해진 것입니다. 차단 주파수가 $f_s$보다 훨씬 낮은 저역통과 필터는 직류 성분은 유지하고 고조파는 크게 감쇠시킵니다.'
  - q: '소리플 근사는 무엇을 가정합니까?'
    options:
      - '인덕터 전류 리플이 0임'
      - '듀티비가 작음'
      - '스위칭 주파수가 필터 차단 주파수보다 낮음'
      - '출력 전압처럼 거의 일정한 양에 실린 스위칭 리플이, 그 양을 직류값으로 대체할 수 있을 만큼 작음'
    answer: 3
    explain: '다른 양, 예를 들어 인덕터 양단 전압을 계산하는 동안 리플이 작은 파형을 그 직류값으로 대체합니다. 계산하려는 리플 자체에는 절대 적용하지 않습니다. 인덕터 전류 리플은 이 근사가 일정하게 만든 기울기로부터 나옵니다.'
  - q: 'CCM으로 동작하는 벅 컨버터의 듀티비가 고정되어 있습니다. 스위칭 주파수를 두 배로 높입니다. 직류 출력 전압은 어떻게 됩니까?'
    options:
      - '두 배가 됨'
      - '절반이 됨'
      - '변하지 않음'
      - '0으로 떨어짐'
    answer: 2
    explain: 'CCM에서 직류 출력은 스위치 노드의 직류 성분인 $D V_g$와 같으며, 이는 $f_s$에 의존하지 않습니다. $f_s$를 두 배로 하면 주기와 전류 리플이 절반이 되며, 평균은 절반이 되지 않습니다.'
  - q: '입력 전압이 출력 전압보다 훨씬 높을 때 선형 레귤레이터가 전력을 낭비하는 이유는 무엇입니까?'
    options:
      - '너무 느리게 스위칭하기 때문'
      - '패스 트랜지스터가 입출력 전압 차만큼 전압을 강하시키면서 부하 전류 전체를 흘리기 때문'
      - '출력 커패시터에 직렬 저항이 있기 때문'
      - '듀티비가 제한되어 있기 때문'
    answer: 1
    explain: '패스 트랜지스터는 부하와 직렬로 연결되어 있으므로 부하 전류를 흘리면서 그 전압 차만큼 전압을 강하시키며, 이 둘의 곱이 열로 소모됩니다.'
