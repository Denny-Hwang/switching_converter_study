# 02-theory/volt-second-charge-balance 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '주기적 정상상태에서 한 주기에 걸친 인덕터 전압의 평균이 0인 이유는 무엇입니까?'
    options:
      - '인덕터에 저항이 없기 때문'
      - '인덕터 전류가 각 주기를 시작한 값으로 끝나므로, 한 주기에 걸친 $v_L$의 적분이 0이기 때문'
      - '스위치가 이상적이기 때문'
      - '출력 커패시터가 크기 때문'
    answer: 1
    explain: '한 주기에 걸친 인덕터 전압의 적분은 $L$에 그 주기 동안의 인덕터 전류 변화를 곱한 값과 같습니다. 주기적 정상상태에서는 전류가 시작 값으로 돌아오므로 적분과 평균이 모두 0입니다. 이상화 가정은 필요하지 않습니다.'
  - q: '인덕터에 온 구간 동안 $+10\,\mathrm{V}$가 걸리고, $D = 0.2$입니다. 정상상태에서 오프 구간 동안에는 어떤 전압이 걸려야 합니까?'
    options:
      - '$-10\,\mathrm{V}$'
      - '$-2.5\,\mathrm{V}$'
      - '$+2.5\,\mathrm{V}$'
      - '$-40\,\mathrm{V}$'
    answer: 1
    explain: '양의 전압-초, 즉 $10\,\mathrm{V}$가 $0.2\,T_s$ 동안 걸린 만큼을 $0.8\,T_s$의 오프 구간 동안 상쇄해야 하므로, 크기는 4분의 1이고 부호는 반대인 전압이 필요합니다.'
  - q: '컨버터의 직류 전류, 예를 들어 부스트 컨버터의 직류 인덕터 전류를 주는 조건은 무엇입니까?'
    options:
      - '인덕터 전압-초 평형'
      - '소리플 근사만'
      - '커패시터 전하 평형'
      - '스위치 주위의 키르히호프 전압 법칙'
    answer: 2
    explain: '전압-초 평형은 전압 사이의 관계를 줍니다. 출력 커패시터에 대한 전하 평형은 각 구간 동안 커패시터로 흘러드는 전류 사이의 관계를 주므로, 직류 인덕터 전류를 부하 전류로 나타내어 정합니다.'
  - q: '이상적인 CCM 부스트 컨버터가 $D = 0.75$로, $5\,\mathrm{V}$ 입력에서 동작합니다. 출력 전압은 얼마입니까?'
    options:
      - '$6.7\,\mathrm{V}$'
      - '$15\,\mathrm{V}$'
      - '$20\,\mathrm{V}$'
      - '$3.75\,\mathrm{V}$'
    answer: 2
    explain: '부스트 변환비는 $1/(1 - D)$이고 이 듀티비에서는 4이므로, 출력은 입력의 네 배입니다.'
  - q: '어떤 듀티비에서 이상적인 CCM 벅-부스트 컨버터의 출력 크기가 입력 전압보다 큽니까?'
    options:
      - '$D > 0.5$'
      - '$D < 0.5$'
      - '모든 $D$에서'
      - '어떤 $D$에서도 아님: 강압만 가능'
    answer: 0
    explain: '변환비의 크기는 $D/(1 - D)$이며, 이 값이 1을 넘는 것은 바로 $D$가 $1 - D$보다 클 때, 즉 $D > 0.5$일 때입니다.'
  - q: '부하 스텝 동안에는 한 스위칭 주기에 걸친 인덕터 전압의 평균이 0이 아닙니다. 이것은 무엇을 말해 줍니까?'
    options:
      - '컨버터가 DCM에 들어갔음'
      - '소리플 근사가 위배됨'
      - '인덕터가 포화되고 있음'
      - '인덕터 전류가 한 주기에서 다음 주기로 변하고 있음'
    answer: 3
    explain: '인덕터 전압의 평균이 0이 아니라는 것은 그 주기 동안 인덕터 전류에 순변화가 있다는 뜻입니다. 전압-초 평형은 정상상태에서만 성립하며, 과도 상태에서는 바로 이 불평형이 전류를 새 값으로 옮겨 갑니다.'
