# 03-topologies/boost 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: 'CCM으로 동작하는 이상적인 부스트가 $D = 0.5$에서 $12\,\Omega$ 부하에 $24\,\mathrm{V}$를 공급합니다. 인덕터 직류 전류는 얼마입니까?'
    options:
      - '$1\,\mathrm{A}$'
      - '$2\,\mathrm{A}$'
      - '$4\,\mathrm{A}$'
      - '$8\,\mathrm{A}$'
    answer: 2
    explain: '부하 전류는 $2\,\mathrm{A}$이며, 인덕터에는 입력 전류가 흐르는데 입력 전류는 부하 전류보다 $1/(1 - D)$배, 여기서는 2배 큽니다.'
  - q: '부스트 컨버터의 출력 전압 리플을 정하는 구간은 어느 것입니까?'
    options:
      - '다이오드가 커패시터를 충전하는 오프 구간'
      - '커패시터 혼자 부하에 전류를 공급하는 온 구간'
      - '두 구간 사이의 데드 타임'
      - '둘 다 아님: 리플은 인덕터 전류 리플만으로 정해짐'
    answer: 1
    explain: '스위치가 켜져 있는 동안 다이오드는 꺼져 있고 커패시터가 혼자 부하 전류 전체를 공급하므로, 커패시터 전압은 $2\Delta v$만큼 떨어집니다.'
  - q: '이상적인 부스트의 스위치가 꺼져 있는 동안 차단해야 하는 전압은 무엇입니까?'
    options:
      - '입력 전압'
      - '출력 전압'
      - '입력 전압과 출력 전압의 합'
      - '출력 전압과 입력 전압의 차'
    answer: 1
    explain: '다이오드가 도통하는 동안 스위치 노드는 출력에 연결되므로, 스위치는 $V$를 차단합니다.'
  - q: '부스트의 스위치를 계속 꺼 둡니다. 출력 전압은 얼마입니까(이상적인 다이오드)?'
    options:
      - '0'
      - '입력 전압'
      - '입력 전압의 두 배'
      - '정해지지 않음: 출력이 플로팅 상태임'
    answer: 1
    explain: '인덕터와 다이오드가 여전히 입력을 출력에 연결하므로, 정상상태에서 출력은 입력을 따라갑니다. 스위치로는 부하를 분리할 수 없습니다.'
  - q: '출력 전압과 출력 전력이 고정된 상태에서 부스트의 입력 전압을 절반으로 줄입니다. 인덕터 직류 전류는 어떻게 됩니까?'
    options:
      - '절반이 됨'
      - '변하지 않음'
      - '두 배가 됨'
      - '네 배가 됨'
    answer: 2
    explain: '인덕터에는 입력 전류가 흐르며, 이상적인 컨버터에서 출력 전력과 같은 입력 전력은 입력 전압과 입력 전류의 곱입니다.'
  - q: '같은 리플에 대해 부스트가 벅보다 큰 출력 커패시턴스를 필요로 하는 이유는 무엇입니까?'
    options:
      - '스위칭 주파수가 더 낮기 때문'
      - '커패시터가 작은 삼각파 리플만 흡수하는 대신 매 온 구간 동안 부하 전류 전체를 공급해야 하기 때문'
      - '인덕터가 더 크기 때문'
      - '출력 전압이 더 높기 때문'
    answer: 1
    explain: '벅에서는 인덕터가 출력에 연속적으로 전류를 공급합니다. 부스트에서는 다이오드 전류가 펄스 형태로 도달하며, 펄스 사이에는 커패시터 혼자 부하 전류를 감당합니다.'
