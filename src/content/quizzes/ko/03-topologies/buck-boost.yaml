# 03-topologies/buck-boost 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '이상적인 CCM 벅-부스트가 $12\,\mathrm{V}$ 입력에서 $D = 0.75$로 동작합니다. 출력 전압의 크기는 얼마입니까?'
    options:
      - '$4\,\mathrm{V}$'
      - '$9\,\mathrm{V}$'
      - '$16\,\mathrm{V}$'
      - '$36\,\mathrm{V}$'
    answer: 3
    explain: '크기는 $D V_g/(1 - D)$이며, 이 듀티비에서는 입력 전압의 세 배입니다.'
  - q: '이상적인 벅-부스트의 입력은 $12\,\mathrm{V}$, 출력은 $-24\,\mathrm{V}$입니다. 스위치가 꺼져 있는 동안 차단해야 하는 전압은 얼마입니까?'
    options:
      - '$12\,\mathrm{V}$'
      - '$24\,\mathrm{V}$'
      - '$36\,\mathrm{V}$'
      - '$48\,\mathrm{V}$'
    answer: 2
    explain: '다이오드가 도통하는 동안 스위치는 입력과 음의 출력 사이에 놓이므로, 입력 전압에 출력 전압의 크기를 더한 값을 차단합니다.'
  - q: '벅-부스트의 인덕터는 어느 구간에 출력으로 전류를 전달합니까?'
    options:
      - '스위치가 켜져 있는 동안에만'
      - '다이오드가 도통하는 동안에만'
      - '두 구간 모두'
      - 'DCM에서만'
    answer: 1
    explain: '스위치가 켜져 있는 동안 인덕터는 입력에 연결되어 있으며, 인덕터가 출력에 연결되는 것은 다이오드가 도통할 때뿐입니다.'
  - q: '벅-부스트가 $D = 0.5$로 동작하며 $6\,\Omega$ 부하에 크기가 $12\,\mathrm{V}$인 전압을 공급합니다. 인덕터 직류 전류는 얼마입니까?'
    options:
      - '$1\,\mathrm{A}$'
      - '$2\,\mathrm{A}$'
      - '$4\,\mathrm{A}$'
      - '$6\,\mathrm{A}$'
    answer: 2
    explain: '부하 전류는 $2\,\mathrm{A}$이고, 이 전류는 오프 구간 동안에만 전달되므로 인덕터 전류는 그보다 $1/(1 - D)$배 큽니다.'
  - q: '세 가지 기본 컨버터 가운데 입력과 출력 모두에 펄스 형태의 전류가 흐르는 것은 어느 것입니까?'
    options:
      - '벅'
      - '부스트'
      - '벅-부스트'
      - '어느 것도 아님'
    answer: 2
    explain: '벅은 출력 전류가, 부스트는 입력 전류가 연속적입니다. 벅-부스트는 인덕터를 입력과 출력에 번갈아 연결할 뿐입니다.'
  - q: '입력 전압과 출력 전압의 크기가 각각 같을 때, 벅-부스트의 스위치 스트레스가 벅이나 부스트보다 높은 이유는 무엇입니까?'
    options:
      - '스위치에 전류가 흐르지 않습니다'
      - '스위치가 입력 전압과 출력 전압의 크기 중 하나만이 아니라 그 합을 차단합니다'
      - '스위칭 주파수가 더 높습니다'
      - 'DCM으로만 동작합니다'
    answer: 1
    explain: '벅의 스위치는 $V_g$를, 부스트의 스위치는 $V$를 차단합니다. 벅-부스트의 스위치는 입력과 반전된 출력 사이에 놓이므로 $V_g + V$를 차단합니다.'
