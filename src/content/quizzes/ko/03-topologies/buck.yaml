# 03-topologies/buck 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: 'CCM으로 동작하는 벅 컨버터가 $2.5\,\Omega$ 부하에 $5\,\mathrm{V}$를 공급합니다. 인덕터 직류 전류는 얼마입니까?'
    options:
      - '$0.5\,\mathrm{A}$'
      - '$1\,\mathrm{A}$'
      - '$2\,\mathrm{A}$'
      - '듀티비에 따라 다름'
    answer: 2
    explain: '출력 커패시터에는 직류 전류가 흐르지 않으므로, 인덕터가 부하 전류 전체, 즉 출력 전압을 부하 저항으로 나눈 값을 공급합니다.'
  - q: '인덕터 직류 전류는 $2\,\mathrm{A}$이고 리플의 절반($\Delta i_L$)은 $0.4\,\mathrm{A}$입니다. 스위치가 흘려야 하는 피크 전류는 얼마입니까?'
    options:
      - '$2\,\mathrm{A}$'
      - '$2.2\,\mathrm{A}$'
      - '$2.4\,\mathrm{A}$'
      - '$2.8\,\mathrm{A}$'
    answer: 2
    explain: '피크값은 직류값에 피크-피크 리플의 절반을 더한 값이며, $\Delta i_L$이 이미 그 절반입니다.'
  - q: 'CCM 벅의 스위칭 주파수를 두 배로 높이고 $L$, $C$, 듀티비, 부하는 그대로 둡니다. 이상적인 출력 전압 리플은 어떻게 됩니까?'
    options:
      - '절반이 됨'
      - '4분의 1로 줄어듦'
      - '변하지 않음'
      - '두 배가 됨'
    answer: 1
    explain: '전류 리플은 $T_s$에 비례하고 전압 리플은 전류 리플과 $T_s$의 곱에 비례하므로, 전압 리플은 $T_s^2$에 비례하여 변합니다.'
  - q: '스위치가 켜져 있는 동안 이상적인 벅 컨버터의 다이오드가 차단해야 하는 전압은 무엇입니까?'
    options:
      - '출력 전압'
      - '입력 전압'
      - '입력 전압과 출력 전압의 차'
      - '입력 전압의 두 배'
    answer: 1
    explain: '스위치가 켜져 있으면 스위치 노드의 전위는 $V_g$이고 다이오드 애노드는 접지되어 있으므로, 다이오드는 $V_g$를 차단합니다.'
  - q: '출력 커패시턴스가 같을 때 벅 컨버터의 출력 리플이 부스트에 비해 작은 이유는 무엇입니까?'
    options:
      - '벅이 더 빠르게 스위칭하기 때문'
      - '벅의 출력 커패시터는 연속적인 삼각파 전류를 받는 반면, 부스트의 커패시터는 온 구간 동안 혼자 부하에 전류를 공급해야 하기 때문'
      - '벅에는 다이오드가 없기 때문'
      - '벅의 출력 전압이 더 낮기 때문'
    answer: 1
    explain: '벅에서는 인덕터가 출력에 연속적으로 전류를 공급하며 작은 삼각파 리플만 커패시터에 도달합니다. 부스트에서는 다이오드 전류가 펄스 형태이며, $D T_s$ 동안 커패시터 혼자 부하에 전류를 공급합니다.'
  - q: '벅의 커패시터에 직렬 저항이 있습니다. 측정한 출력 리플이 이상적인 식의 예측보다 큽니다. 그 이유는 무엇입니까?'
    options:
      - '직렬 저항이 그 저항에 피크-피크 리플 전류를 곱한 값과 같은 리플 전압을 더하기 때문'
      - '직렬 저항이 스위칭 주파수를 낮추기 때문'
      - '직렬 저항이 인덕터 리플을 키우기 때문'
      - '직렬 저항이 컨버터를 DCM으로 들어가게 하기 때문'
    answer: 0
    explain: '리플 전류는 커패시터와 그 직렬 저항을 통해 흐릅니다. 저항에 의한 전압 강하는 용량성 리플에 더해지며, 둘 중 더 클 수도 있습니다.'
