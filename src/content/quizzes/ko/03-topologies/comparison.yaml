# 03-topologies/comparison 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '어떤 응용에서 $3\,\mathrm{V}$와 $9\,\mathrm{V}$ 사이에서 변하는 입력으로부터 절연 없이 $5\,\mathrm{V}$를 얻어야 합니다. 이를 단독으로 해낼 수 있는 기본 컨버터는 무엇입니까?'
    options:
      - '벅'
      - '부스트'
      - '벅-부스트(반전 출력을 감수하는 경우)'
      - '기본 컨버터 중에는 없음'
    answer: 2
    explain: '출력은 입력 전압이 낮을 때는 입력보다 높아야 하고, 입력 전압이 높을 때는 입력보다 낮아야 합니다. 승압과 강압을 모두 하는 것은 벅-부스트뿐이며, 그 대가는 반전 출력입니다.'
  - q: '$D = 0.25$에서 이상적인 CCM 벅의 트랜지스터 이용률은 얼마입니까?'
    options:
      - '0.25'
      - '0.5'
      - '0.75'
      - '1'
    answer: 1
    explain: '벅의 이용률은 $\sqrt{D}$입니다. 트랜지스터는 $V_g$를 차단하고 부하 전류를 듀티비가 $D$인 펄스로 흘리며, 부하 전력은 $D V_g I$입니다.'
  - q: '벅-부스트와 플라이백의 이용률은 어느 듀티비에서 가장 큽니까?'
    options:
      - '$D = 1/4$'
      - '$D = 1/3$'
      - '$D = 1/2$'
      - '$D = 2/3$'
    answer: 1
    explain: '이용률은 $(1 - D)\sqrt{D}$이며, 그 도함수는 $1 - 3D$가 0이 되는 곳에서 0이 됩니다.'
  - q: '다음 중 CCM에서 제어-출력 전달함수에 우반평면 영점이 있는 컨버터는 무엇입니까?'
    options:
      - '벅'
      - '포워드 컨버터'
      - '플라이백'
      - '해당 없음'
    answer: 2
    explain: '플라이백은 부스트, 벅-부스트와 마찬가지로 오프 구간 동안에만 출력에 에너지를 전달합니다. 벅과 포워드 컨버터는 스위치가 켜져 있는 동안 L-C 필터를 통해 출력을 구동합니다.'
  - q: '플라이백의 트랜지스터 이용률이 권선비에 따라 달라지지 않는 이유는 무엇입니까?'
    options:
      - '변압기가 에너지를 저장하지 않기 때문'
      - '듀티비가 같으면 $n$과 관계없이 트랜지스터의 피크 전압과 실효 전류가 같고, 권선비는 출력 전압과 출력 전류만 바꾸기 때문'
      - '플라이백은 항상 $D = 1/3$에서 동작하기 때문'
      - '누설 인덕턴스가 권선비의 영향을 상쇄하기 때문'
    answer: 1
    explain: 'CCM에서 트랜지스터는 $V_g + V/n$을 차단하며, 이는 $V_g/(1 - D)$와 같습니다. 부하 전력이 주어지면 트랜지스터 전류도 $n$에 따라 달라지지 않습니다. 권선비는 출력 측만 바꿉니다.'
  - q: '출력 커패시터에 연속적인 전류를 공급하고 입력에서 펄스 형태의 전류를 끌어오는 컨버터는 무엇입니까?'
    options:
      - '벅'
      - '부스트'
      - '벅-부스트'
      - '플라이백'
    answer: 0
    explain: '벅의 인덕터는 스위치 노드와 출력 사이에 있으므로 출력에는 연속적인 인덕터 전류가 흐르고, 입력에는 스위치가 켜져 있는 동안에만 그 전류가 흐릅니다.'
