# 03-topologies/flyback 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '권선비가 1:n이고 $n = 0.5$인 이상적인 CCM 플라이백이 $24\,\mathrm{V}$ 입력에서 $D = 0.5$로 동작합니다. 출력 전압은 얼마입니까?'
    options:
      - '$6\,\mathrm{V}$'
      - '$12\,\mathrm{V}$'
      - '$24\,\mathrm{V}$'
      - '$48\,\mathrm{V}$'
    answer: 1
    explain: '변환비는 $n D/(1 - D)$, 즉 벅-부스트 변환비에 권선비를 곱한 값입니다. 여기서는 $0.5$이므로 출력은 입력의 절반입니다.'
  - q: '플라이백이 $n = 0.25$로 $48\,\mathrm{V}$ 입력에서 동작하며 출력은 $12\,\mathrm{V}$입니다(이상적인 다이오드). 누설 스파이크를 제외하면, 스위치가 꺼져 있는 동안 차단하는 전압은 얼마입니까?'
    options:
      - '$60\,\mathrm{V}$'
      - '$96\,\mathrm{V}$'
      - '$120\,\mathrm{V}$'
      - '$144\,\mathrm{V}$'
    answer: 1
    explain: '출력 전압은 $n$으로 나누어져 1차 측에 나타나며(여기서는 $48\,\mathrm{V}$), 이 전압이 입력 전압에 더해집니다.'
  - q: '같은 플라이백에서 스위치가 켜져 있는 동안 출력 다이오드가 차단하는 역전압은 얼마입니까?'
    options:
      - '$12\,\mathrm{V}$'
      - '$24\,\mathrm{V}$'
      - '$48\,\mathrm{V}$'
      - '$60\,\mathrm{V}$'
    answer: 1
    explain: '2차 측에는 $n V_g$(여기서는 $12\,\mathrm{V}$)가 걸리며, 다이오드는 출력 전압에 이 전압을 더한 값을 차단합니다.'
  - q: '$K$를 $L_M$과 실제 부하로 구성할 때, 플라이백의 DCM 변환비는 권선비에 어떻게 의존합니까?'
    options:
      - '$n$에 비례합니다'
      - '$1/n$에 비례합니다'
      - '$n$에 의존하지 않습니다'
      - '$n^2$에 비례합니다'
    answer: 2
    explain: 'DCM에서는 주기마다 $L_M$에 저장되는 에너지가 권선비와 관계없이 부하에 전달되며, 변환비는 $D/\sqrt{K}$입니다.'
  - q: '누설 인덕턴스가 $2\,\mu\mathrm{H}$인 플라이백이 $100\,\mathrm{kHz}$에서 $3\,\mathrm{A}$의 전류를 턴오프합니다. 클램프가 소모해야 하는 전력은 최소 얼마입니까?'
    options:
      - '$0.09\,\mathrm{W}$'
      - '$0.45\,\mathrm{W}$'
      - '$0.9\,\mathrm{W}$'
      - '$1.8\,\mathrm{W}$'
    answer: 2
    explain: '누설 인덕턴스에는 $L_\mathrm{lk}$에 전류의 제곱을 곱한 값의 절반, 즉 턴오프마다 $9\,\mu\mathrm{J}$의 에너지가 저장되며, 턴오프는 주기마다 한 번 일어납니다.'
  - q: '고정 듀티비 플라이백이 전류 제한 전원으로부터 배터리를 충전합니다. 전원 전압이 어느 한 값에서 더 이상 상승하지 않습니다. 그 이유는 무엇입니까?'
    options:
      - '전원이 전류 제한에 도달합니다'
      - '그 입력 전압에서 플라이백이 CCM에 들어가며, 출력과 듀티비가 고정된 상태에서 CCM 전압-초 평형은 그 입력 전압만을 허용합니다'
      - '클램프가 도통하기 시작합니다'
      - '변압기가 포화됩니다'
    answer: 1
    explain: '임계 전압보다 낮으면 플라이백은 DCM에 있으며 저항처럼 동작합니다. 임계 전압에서 CCM이 시작되고 전압-초 평형이 입력을 그 값에 묶어 둡니다. 즉 컨버터는 정전압 싱크가 됩니다.'
