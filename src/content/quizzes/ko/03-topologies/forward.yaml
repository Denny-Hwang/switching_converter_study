# 03-topologies/forward 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '$n = 0.25$인 이상적인 포워드 컨버터가 $48\,\mathrm{V}$ 입력에서 $D = 0.4$로 동작합니다. 출력 전압은 얼마입니까?'
    options:
      - '$4.8\,\mathrm{V}$'
      - '$12\,\mathrm{V}$'
      - '$19.2\,\mathrm{V}$'
      - '$8\,\mathrm{V}$'
    answer: 0
    explain: '포워드 컨버터는 $n V_g$를 공급받는 벅이므로 출력은 $n D V_g$입니다.'
  - q: '포워드 컨버터의 변압기를 매 스위칭 주기마다 리셋해야 하는 이유는 무엇입니까?'
    options:
      - '출력 커패시터를 방전시키기 위해'
      - '그렇지 않으면 코어가 포화될 때까지 자화 전류가 주기마다 커지기 때문에'
      - '출력 극성을 반전시키기 위해'
      - '누설 인덕턴스를 제한하기 위해'
    answer: 1
    explain: '자화 전류는 스위치가 켜져 있는 동안 증가합니다. 자화 인덕턴스의 전압-초 평형이 성립하려면 다음 주기 전에 자화 전류를 0으로 되돌리는 리셋 구간이 필요합니다.'
  - q: '어떤 포워드 컨버터의 1차 권선과 리셋 권선은 턴 수가 같습니다($n_r = 1$). 최대 듀티비는 얼마입니까?'
    options:
      - '0.25'
      - '0.5'
      - '0.67'
      - '1'
    answer: 1
    explain: '리셋 권선은 입력 전압을 역방향으로 인가하므로 리셋에는 온 시간과 같은 시간이 걸리며, 두 시간이 한 주기 안에 들어가야 합니다.'
  - q: '이 컨버터에 $48\,\mathrm{V}$를 공급할 때, 리셋 동안 스위치가 차단하는 전압은 얼마입니까?'
    options:
      - '$48\,\mathrm{V}$'
      - '$72\,\mathrm{V}$'
      - '$96\,\mathrm{V}$'
      - '$144\,\mathrm{V}$'
    answer: 2
    explain: '리셋 권선은 1차 권선을 $-V_g/n_r$로 클램프하고, 스위치는 $V_g$에서 이 값을 뺀 전압을 차단합니다. $n_r = 1$이면 입력 전압의 두 배입니다.'
  - q: '리셋 권선의 턴 수를 늘립니다(더 큰 $n_r$). 어떻게 됩니까?'
    options:
      - '스위치 스트레스와 최대 듀티비가 모두 높아집니다'
      - '스위치 스트레스가 낮아지고 최대 듀티비가 낮아집니다'
      - '스위치 스트레스가 높아지고 최대 듀티비가 낮아집니다'
      - '아무것도 바뀌지 않습니다'
    answer: 1
    explain: '$n_r$이 커지면 1차 권선에 걸리는 리셋 전압이 낮아져 스위치가 차단하는 전압이 줄어들지만, 리셋에 더 오랜 시간이 걸리게 되어 듀티비 한계가 낮아집니다.'
  - q: '포워드 컨버터와 플라이백 컨버터에서 변압기의 역할은 어떻게 다릅니까?'
    options:
      - '차이가 없습니다'
      - '포워드 변압기는 스위치가 켜져 있는 동안 에너지를 직접 전달하고, 플라이백의 결합 인덕터는 에너지를 저장했다가 스위치가 꺼져 있는 동안 내보냅니다'
      - '포워드 변압기는 에너지를 저장하고, 플라이백 변압기는 저장하지 않습니다'
      - '플라이백 변압기만 절연을 제공합니다'
    answer: 1
    explain: '포워드 컨버터에서는 온 구간 동안 2차 측이 도통하므로 에너지가 곧바로 전달됩니다. 플라이백에서는 오프 구간 동안 다이오드가 도통하여 $L_M$에 저장된 에너지를 전달합니다.'
