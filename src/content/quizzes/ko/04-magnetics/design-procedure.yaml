# 04-magnetics/design-procedure 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '코어 기하 상수 $K_g$는 어떤 세 가지 제약 조건을 하나로 묶습니까?'
    options:
      - '자속 밀도 한계, 창, 권선 저항'
      - '자속 밀도 한계, 공극, 창'
      - '인덕턴스, 공극, 코어 손실'
      - '포화, 코어 손실, 온도'
    answer: 0
    explain: '자속 밀도, 창, 저항 제약 조건에서 턴 수와 선재를 소거하면 $K_g$가 남습니다. 공극은 그 뒤에 고르며, 인덕턴스를 정합니다.'
  - q: '다른 조건을 모두 고정한 채 $B_\mathrm{max}$를 0.2 T에서 0.3 T로 높입니다. 필요한 $K_g$는 몇 배로 바뀝니까?'
    options:
      - '0.44: 줄어듭니다'
      - '0.67: 줄어듭니다'
      - '1.5: 커집니다'
      - '2.25: 커집니다'
    answer: 0
    explain: '필요한 $K_g$는 $B_\mathrm{max}$의 제곱에 반비례하여 줄어들며, 0.2/0.3의 제곱은 0.44입니다.'
  - q: '같은 실효 전류에서 허용하는 구리 손실을 두 배로 늘립니다. 필요한 $K_g$는 어떻게 됩니까?'
    options:
      - '절반이 됩니다'
      - '두 배가 됩니다'
      - '1/4로 줄어듭니다'
      - '변하지 않습니다'
    answer: 0
    explain: '같은 전류에서 손실이 두 배이면 권선 저항도 두 배까지 허용되며, 권선 저항은 $K_g$의 분모에 1제곱으로 들어갑니다.'
  - q: '어떤 코어의 $K_g$가 같은 모양의 다른 코어의 두 배입니다. 이 코어는 각 치수가 얼마나 더 큽니까?'
    options:
      - '약 15 %'
      - '약 26 %'
      - '약 41 %'
      - '두 배'
    answer: 0
    explain: '$K_g$는 코어 크기의 5제곱에 비례하여 커지며, 2의 5제곱근은 1.15입니다.'
  - q: '턴 수를 올림한 뒤 권선 저항을 다시 점검하는 이유는 무엇입니까?'
    options:
      - '더 많은 턴이 창을 나누어 쓰므로 턴마다 구리가 줄고 권선도 길어져, 저항이 턴 수의 제곱에 비례하여 커지기 때문입니다'
      - '올림하면 자속 밀도가 $B_\mathrm{max}$보다 낮아지기 때문입니다'
      - '올림하면 코어의 $K_g$가 바뀌기 때문입니다'
      - '공극이 더 이상 인덕턴스를 정하지 않기 때문입니다'
    answer: 0
    explain: '코어의 $K_g$는 정확한 턴 수에서의 예산을 감당합니다. 올림하거나 더 작은 단면적에서 턴 수를 구하면 저항이 늘어나며, 이는 $K_g$에 여유가 있어야만 감당할 수 있습니다.'
  - q: '포화보다 코어 손실이 자속 밀도를 제한할 가능성이 가장 큰 부품은 어느 것입니까?'
    options:
      - '매 주기 자속이 크게 변하는 플라이백 변압기나 DCM 인덕터'
      - '리플이 작은 필터 인덕터'
      - '직류만 흐르는 인덕터'
      - '상용 주파수의 초크'
    answer: 0
    explain: '코어 손실은 교류 자속에서 생깁니다. 리플이 작은 필터 인덕터에는 교류 자속이 적지만, 리플이 크면 자속이 매 주기 크게 변합니다.'
