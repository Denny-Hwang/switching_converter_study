# 04-magnetics/leakage 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '두 권선을 각각 다른 권선을 개방한 채 재면 $400\,\mu\mathrm{H}$와 $25\,\mu\mathrm{H}$이고, 상호 인덕턴스는 $99\,\mu\mathrm{H}$입니다. 결합 계수는 얼마입니까?'
    options:
      - '0.25'
      - '0.99'
      - '4'
      - '0.0099'
    answer: 1
    explain: '상호 인덕턴스를 두 인덕턴스의 곱의 제곱근으로 나눈 값, 즉 99를 100으로 나눈 값입니다.'
  - q: '2차 권선을 개방했을 때 1차 권선의 측정값은 $1\,\mathrm{mH}$이고, 결합 계수는 0.99입니다. 2차 권선을 단락하면 측정값은 얼마입니까?'
    options:
      - '$10\,\mu\mathrm{H}$'
      - '$19.9\,\mu\mathrm{H}$'
      - '$990\,\mu\mathrm{H}$'
      - '$1.99\,\mu\mathrm{H}$'
    answer: 1
    explain: '개방 상태의 인덕턴스에 1에서 결합 계수의 제곱을 뺀 값을 곱합니다. 즉 1 mH에 0.0199를 곱한 값입니다.'
  - q: '단락 시험은 무엇을 측정합니까?'
    options:
      - '1차 측으로 환산한, 1차 측과 2차 측의 누설을 합친 값'
      - '자화 인덕턴스'
      - '1차 측의 누설만'
      - '권선 커패시턴스'
    answer: 0
    explain: '자화 인덕턴스가 누설보다 훨씬 크므로, 측정값은 1차 측으로 환산한 두 누설 인덕턴스의 합과 거의 같습니다.'
  - q: '1차 권선을 2차 권선 양쪽으로 나누면(P-S-P) 누설은 대략 어떻게 바뀝니까?'
    options:
      - '약 절반으로 줄어듭니다'
      - '두 배가 됩니다'
      - '약 1/4로 줄어듭니다'
      - '전혀 바뀌지 않습니다'
    answer: 2
    explain: '창 안의 최대 기자력이 절반이 되고, 저장 에너지는 그 제곱에 비례합니다.'
  - q: '코어의 공극을 두 배로 길게 합니다. 누설 인덕턴스는 어떻게 됩니까?'
    options:
      - '절반이 됩니다'
      - '거의 변하지 않습니다. 권선의 기하 구조가 누설 인덕턴스를 정합니다'
      - '두 배가 됩니다'
      - '사라집니다'
    answer: 1
    explain: '공극은 자화 인덕턴스를 낮춥니다. 누설은 권선 사이의 자계가 정하며, 공극은 이 자계에 거의 영향을 주지 않습니다.'
  - q: '스위치가 꺼질 때 플라이백의 누설 에너지는 어디로 갑니까?'
    options:
      - '출력으로 갑니다'
      - '코어로 들어가 코어 손실로 사라집니다'
      - '매 주기 클램프나 스너버로 갑니다'
      - '누설 인덕턴스에 남아 있습니다'
    answer: 2
    explain: '누설 자속은 2차 권선과 쇄교하지 않으므로 그 에너지는 출력에 도달할 수 없습니다. 클램프나 스너버가 이 에너지를 받아야 합니다.'
