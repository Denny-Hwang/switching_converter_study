# 04-magnetics/snubbers-clamps 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '어떤 노드가 20 MHz로 링잉하고, 노드 양단에 $150\,\mathrm{pF}$의 커패시턴스를 추가하면 10 MHz로 링잉합니다. 노드 자체의 커패시턴스는 얼마입니까?'
    options:
      - '$50\,\mathrm{pF}$'
      - '$150\,\mathrm{pF}$'
      - '$75\,\mathrm{pF}$'
      - '$37.5\,\mathrm{pF}$'
    answer: 0
    explain: '주파수를 절반으로 낮추려면 커패시턴스가 네 배가 되어야 하므로, 추가한 150 pF의 커패시턴스는 노드 자체 커패시턴스의 세 배입니다.'
  - q: 'RC 스너버의 저항은 얼마여야 합니까?'
    options:
      - '링잉의 특성 임피던스, 즉 인덕턴스를 커패시턴스로 나눈 값의 제곱근'
      - '가능한 한 작은 값'
      - '가능한 한 큰 값'
      - '부하 저항'
    answer: 0
    explain: '이 값이면 링잉의 품질 계수가 약 1이 되어, 링잉은 약 한 주기 안에 사라집니다.'
  - q: '$220\,\mathrm{pF}$의 RC 스너버가 100 kHz에서 에지마다 100 V의 스윙을 겪습니다. 이 스너버가 소산하는 전력은 얼마입니까?'
    options:
      - '$0.22\,\mathrm{W}$'
      - '$0.11\,\mathrm{W}$'
      - '$22\,\mathrm{mW}$'
      - '$2.2\,\mathrm{W}$'
    answer: 0
    explain: '충전과 방전에서 각각 C V 제곱의 절반을 잃으므로 한 주기에 C V 제곱을 잃으며, 여기에 주파수를 곱합니다.'
  - q: '스너버 저항의 값은 스너버의 손실을 어떻게 바꿉니까?'
    options:
      - '바꾸지 않습니다. 손실은 커패시터, 전압 스윙, 주파수가 정합니다'
      - '저항이 클수록 손실이 줄어듭니다'
      - '저항이 작을수록 손실이 줄어듭니다'
      - '손실은 저항이 아니라 커패시터에서 생깁니다'
    answer: 0
    explain: '저항을 통해 커패시터를 충전하면 저항값과 관계없이 같은 에너지를 잃습니다.'
  - q: '스너버 커패시터가 노드 자체 커패시턴스의 몇 배여야 하는 이유는 무엇입니까?'
    options:
      - '링잉을 저항으로 전달하여 저항이 링잉을 감쇠시키도록 하기 위해'
      - '스너버의 손실을 줄이기 위해'
      - '링잉 주파수를 높이기 위해'
      - '전압으로부터 저항을 보호하기 위해'
    answer: 0
    explain: '스너버 커패시터가 작으면 저항이 링잉에서 빠집니다. 커패시터가 노드 커패시턴스의 세 배 이상이면 감쇠비는 약 0.5입니다.'
  - q: 'TVS 모델에서, 항복 전압이 150 V이고 동저항이 $0.5\,\Omega$인 TVS에 10 A가 흐릅니다. 이 TVS가 클램프하는 전압은 얼마입니까?'
    options:
      - '$155\,\mathrm{V}$'
      - '$150\,\mathrm{V}$'
      - '$145\,\mathrm{V}$'
      - '$160\,\mathrm{V}$'
    answer: 0
    explain: '항복 전압에 동저항과 전류의 곱을 더한 값, 즉 150 V에 5 V를 더한 값입니다.'
  - q: '플라이백 클램프의 전압을 반사 전압보다 조금만 높게 잡으면 클램프의 손실은 어떻게 됩니까?'
    options:
      - '주기당 누설 에너지보다 훨씬 커집니다'
      - '주기당 누설 에너지로 줄어듭니다'
      - '0이 됩니다'
      - '변하지 않습니다'
    answer: 0
    explain: '이때 누설 전류가 리셋되는 데 오래 걸리고, 그동안 클램프는 변압기에서 에너지를 계속 끌어옵니다.'
