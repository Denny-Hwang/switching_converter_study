# 04-magnetics/snubbers-clamps 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '어떤 노드가 20 MHz로 링잉하고, 노드 양단에 $150\,\mathrm{pF}$의 커패시턴스를 추가하면 10 MHz로 링잉합니다. 노드 자체의 커패시턴스는 얼마입니까?'
    options:
      - '$150\,\mathrm{pF}$'
      - '$75\,\mathrm{pF}$'
      - '$37.5\,\mathrm{pF}$'
      - '$50\,\mathrm{pF}$'
    answer: 3
    explain: '주파수를 절반으로 낮추려면 커패시턴스가 네 배가 되어야 하므로, 추가한 150 pF의 커패시턴스는 노드 자체 커패시턴스의 세 배입니다.'
  - q: 'AN11160은 RC 스너버의 저항을 어떻게 정합니까?'
    options:
      - '가능한 한 작은 값으로 정합니다'
      - '가능한 한 큰 값으로 정합니다'
      - '기생 인덕턴스, 저항, 스너버 커패시터를 직렬로 본 감쇠 계수가 0.5에서 1 사이가 되도록 정하고, 몇 가지 값을 시험합니다'
      - '부하 저항과 같게 정합니다'
    answer: 2
    explain: '감쇠 계수가 0.5에서 1 사이이면 피크 전압이 가장 낮고, 그 범위에서 가장 좋은 값은 시험해서 찾습니다.'
  - q: '$220\,\mathrm{pF}$의 RC 스너버가 100 kHz에서 에지마다 100 V의 스윙을 겪습니다. 이 스너버가 더하는 손실은 얼마입니까?'
    options:
      - '$0.22\,\mathrm{W}$'
      - '$0.11\,\mathrm{W}$'
      - '$22\,\mathrm{mW}$'
      - '$2.2\,\mathrm{W}$'
    answer: 0
    explain: '스너버 커패시터의 충전과 방전에서 각각 C V 제곱의 절반을 잃으므로 한 주기에 C V 제곱을 잃으며, 여기에 주파수를 곱합니다.'
  - q: '스너버 저항의 값은 스너버의 손실을 어떻게 바꿉니까?'
    options:
      - '저항이 클수록 손실이 줄어듭니다'
      - '바꾸지 않습니다. 손실은 커패시터, 전압 스윙, 주파수가 정합니다'
      - '저항이 작을수록 손실이 줄어듭니다'
      - '손실은 저항이 아니라 커패시터에서 생깁니다'
    answer: 1
    explain: '저항을 통해 커패시터를 충전하면 저항값과 관계없이 C V 제곱의 절반을 잃고, 다음 에지에서 저장된 절반을 잃습니다.'
  - q: 'AN11160이 출발점으로 삼는 스너버 커패시터는 얼마입니까?'
    options:
      - '노드 자체 커패시턴스의 10분의 1'
      - '노드 자체 커패시턴스의 100배'
      - '노드 자체 커패시턴스의 한 배에서 두 배'
      - '출력 커패시터만큼 큰 값'
    answer: 2
    explain: '절충입니다. 커패시터가 클수록 가장 좋은 저항으로 얻을 수 있는 피크 전압은 낮아지지만, 손실도 함께 커집니다.'
  - q: 'TVS 모델에서, 항복 전압이 150 V이고 동저항이 $0.5\,\Omega$인 TVS에 10 A가 흐릅니다. 이 TVS가 클램프하는 전압은 얼마입니까?'
    options:
      - '$155\,\mathrm{V}$'
      - '$150\,\mathrm{V}$'
      - '$145\,\mathrm{V}$'
      - '$160\,\mathrm{V}$'
    answer: 0
    explain: '항복 전압에 동저항과 전류의 곱을 더한 값, 즉 150 V에 5 V를 더한 값입니다.'
  - q: '플라이백 클램프의 전압을 반사 전압보다 조금만 높게 잡으면 클램프의 손실은 어떻게 됩니까?'
    options:
      - '주기당 누설 에너지로 줄어듭니다'
      - '주기당 누설 에너지보다 훨씬 커집니다'
      - '0이 됩니다'
      - '변하지 않습니다'
    answer: 1
    explain: '이때 누설 전류가 리셋되는 데 오래 걸리고, 그동안 클램프는 변압기에서 에너지를 계속 끌어옵니다.'
