# 04-magnetics/winding-loss 퀴즈. 수치는 합성 연습 값입니다.
numbers: synthetic
questions:
  - q: '근접 효과란 무엇입니까?'
    options:
      - '도체 하나에서 전류가 표면으로 몰리는 현상'
      - '이웃한 턴 사이의 커패시턴스'
      - '다른 층들의 자계가 한 층에 유도하는 와전류'
      - '권선 옆의 코어 손실'
    answer: 2
    explain: '권선의 각 층은 이웃한 층들의 자계 안에 놓입니다. 그 자계가 유도하는 와전류가 손실을 더하며, 이 손실은 층 수와 함께 빠르게 커집니다.'
  - q: '박판의 두께는 0.3 mm이고, 관심 있는 주파수에서 표피 깊이는 0.2 mm입니다. 표피 깊이 단위로 나타낸 박판의 두께는 얼마입니까?'
    options:
      - '1.5'
      - '0.67'
      - '0.06'
      - '3'
    answer: 0
    explain: '두께를 표피 깊이로 나눈 값, 즉 0.3/0.2입니다.'
  - q: '표피 깊이보다 얇은 층에서, 초과 교류 저항은 층 두께에 따라 어떻게 커집니까?'
    options:
      - '두께에 비례하여 커집니다'
      - '두께의 네제곱에 비례하여 커집니다'
      - '두께의 제곱에 비례하여 커집니다'
      - '커지지 않습니다'
    answer: 1
    explain: 'Dowell 계수의 급수에서 1 다음에 오는 첫 항은 $\varphi^4$에 비례합니다.'
  - q: '층이 세 개이면 손실은 표피 깊이의 약 0.76배 두께에서 가장 작습니다. 층을 그보다 두껍게 만들면 손실은 어떻게 됩니까?'
    options:
      - '커집니다. 직류 저항이 줄어드는 것보다 교류 저항 계수가 더 빠르게 커집니다'
      - '직류 저항이 줄어들므로 계속 줄어듭니다'
      - '그대로입니다'
      - '직류 손실까지 줄어듭니다'
    answer: 0
    explain: '주파수가 고정되어 있으면 손실은 $F_R/\varphi$에 비례합니다. 최적점을 지나면 $F_R$이 $\varphi$보다 빠르게 커집니다.'
  - q: '얇은 층의 급수로 볼 때, 손실이 가장 작은 두께에서 교류 저항 계수는 얼마입니까?'
    options:
      - '1'
      - '2'
      - '층 수와 함께 커집니다'
      - '층 수와 관계없이 4/3'
    answer: 3
    explain: '최적점에서는 층 수와 관계없이 4차 항이 1/3과 같습니다.'
  - q: '변압기의 권선을 인터리빙하면 근접 효과 손실이 어떻게 줄어듭니까?'
    options:
      - '턴당 평균 길이를 줄입니다'
      - '표피 깊이를 키웁니다'
      - '최대 기자력과, 기자력이 0에서 최대에 이르는 층 수를 줄입니다'
      - '직류 저항을 낮춥니다'
    answer: 2
    explain: '2차 권선을 1차 권선의 두 절반 사이에 두면 창 안의 최대 기자력이 절반이 되고, 그와 함께 근접 효과를 정하는 층 수도 절반이 됩니다.'
