# 05-simulation/falstad 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: 'CircuitJS1은 라이브러리의 회로를 시간에 따라 어떻게 진행시킵니까?'
    options:
      - 'SPICE처럼 오차 추정값으로부터 고른 스텝으로'
      - '스위칭 주기의 500분의 1인 고정 스텝 하나로. Auto-Adjust Timestep이 켜져 있을 때 수렴에 실패해야만 스텝을 절반으로 줄인다'
      - '다이오드가 꺼질 때마다 줄이는 스텝으로'
      - '스위칭 주기마다 한 스텝씩'
    answer: 1
    explain: 'CircuitJS1은 시간 간격을 고정해 둡니다. 반복 계산이 수렴하지 못할 때에만 간격을 절반으로 줄이며, 그것도 라이브러리의 회로가 꺼 둔 Auto-Adjust Timestep이 켜져 있을 때뿐입니다. 다이오드가 꺼지는 곳에서 스텝을 줄이는 장치는 없습니다.'
  - q: '100 µH 인덕터를 20 ns 스텝의 후진 오일러로 진행시킵니다. 다이오드가 꺼질 때 전류가 0을 3.7 mA 지나쳐 있고 다른 것이 이 전류를 받지 않습니다. 인덕터에 걸리는 한 스텝 점프는 얼마입니까?'
    options:
      - '0.74 V'
      - '18.5 V'
      - '37 V'
      - '185 V'
    answer: 1
    explain: '그 스텝은 전류를 0으로 되돌려야 하므로 인덕터에는 L과 전류의 곱을 스텝으로 나눈 전압이 걸립니다. 100 µH × 3.7 mA / 20 ns는 18.5 V입니다.'
  - q: '그 스파이크를 없애려고 시간 간격을 절반으로 줄입니다. 스파이크는 어떻게 됩니까?'
    options:
      - '절반이 된다'
      - '두 배가 된다'
      - '0을 지나치는 전류가 스텝과 함께 줄어들므로 크기가 거의 그대로다'
      - '사라진다'
    answer: 2
    explain: '전류가 0을 지나치는 양은 한 스텝 동안의 변화 정도라서 스텝과 함께 절반이 되고, 같은 전류라면 짧아진 스텝이 전압을 두 배로 만듭니다. 점프의 크기는 다이오드가 꺼지기 전 인덕터에 걸려 있던 전압의 크기 정도로 남습니다. 라이브러리의 DCM 벅에서는 출력 전압의 약 4분의 3에서 1.5배 사이였습니다.'
  - q: '무엇이 스파이크를 없앱니까?'
    options:
      - '더 엄격한 허용오차'
      - '바디 다이오드, 스너버, 노드 커패시턴스처럼 전류가 흐를 경로'
      - '사다리꼴 규칙'
      - '정확히 1인 결합 계수'
    answer: 1
    explain: '스파이크는 한 스텝 안에 멈춰야 하는 전류에서 생깁니다. 바디 다이오드, 스너버, 노드 커패시턴스가 있으면 전류가 계속 흐를 수 있습니다. 라이브러리의 회로는 스위치마다 바디 다이오드를 둡니다.'
  - q: '변압기의 Trapezoidal Approximation을 켜면 DCM 플라이백의 드레인이 스텝마다 기대값의 약 두 배와 0 사이를 오갑니다. 이유는 무엇입니까?'
    options:
      - '누설 인덕턴스가 스위치의 커패시턴스와 공진한다'
      - '사다리꼴 규칙이 스텝보다 훨씬 빠른 모드를 만나며, 그 모드에 대한 스텝당 배율이 -1에 가깝다'
      - '바디 다이오드가 한 스텝 걸러 도통한다'
      - '출력 커패시터의 직렬 저항'
    answer: 1
    explain: '누설 인덕턴스는 스텝보다 훨씬 빠른 모드를 만듭니다. 사다리꼴 규칙은 스텝마다 이 모드에 거의 -1을 곱하므로 모드가 감쇠하지 않고 부호만 바꿉니다. 후진 오일러의 배율은 이 모드에 대해 0에 가깝습니다.'
  - q: '라이브러리의 변압기가 결합 계수로 1이 아니라 0.99999를 쓰는 이유는 무엇입니까?'
    options:
      - '실제 변압기의 누설을 모델링하려고'
      - 'CircuitJS1은 권선 인덕턴스 행렬의 역행렬을 쓰는데 결합 계수가 1이면 이 행렬이 특이 행렬이 되고, 대화 상자도 1보다 작은 값만 받기 때문에'
      - '결합 계수가 1이면 시뮬레이션이 느려지므로'
      - '드레인의 링잉을 감쇠시키려고'
    answer: 1
    explain: '결합 계수가 1이면 인덕턴스 행렬의 행렬식 L1 L2 - M^2가 0이 되어 역행렬을 구할 수 없습니다. 0.99999가 남기는 누설은 턴오프 때 드레인에 한 스텝 동안 1 V 미만의 스파이크를 더합니다.'
