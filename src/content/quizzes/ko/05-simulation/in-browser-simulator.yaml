# 05-simulation/in-browser-simulator 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '시뮬레이터가 각 스위칭 구간을 정확히 진행시킬 수 있는 이유는 무엇입니까?'
    options:
      - '아주 작은 스텝을 써서'
      - '브라우저에서 SPICE를 실행해서'
      - '구간 안에서 회로가 일정한 전원을 가진 선형 회로라, 해가 계산할 수 있는 지수 함수여서'
      - '컨버터에는 커패시터가 없어서'
    answer: 2
    explain: '구간 안에서 모든 스위치와 다이오드는 켜져 있거나 꺼져 있으며, 회로 행렬의 지수 함수가 어떤 스텝에서도 정확한 해를 줍니다.'
  - q: '커패시터가 시정수 10 ns로 0 V에서 10 V를 향해 충전됩니다. 10 ns의 정확한 스텝 뒤에는 어디에 있습니까?'
    options:
      - '약 6.3 V'
      - '약 3.7 V'
      - '10 V'
      - '5 V'
    answer: 0
    explain: '10 V와의 편차는 시정수 하나 동안 e배 줄어듭니다. 10 V × (1 - 1/e)는 약 6.3 V입니다.'
  - q: '전진 오일러가 시정수 10 ns인 모드를 50 ns씩 진행시킵니다. 스텝마다 편차에 곱해지는 값은 얼마입니까?'
    options:
      - '약 0.007'
      - '1'
      - '-4'
      - '-1'
    answer: 2
    explain: '1에서 스텝을 시정수로 나눈 값을 빼면 1 - 5입니다. 편차는 스텝마다 네 배로 커지며 부호를 바꿉니다.'
  - q: '진동 없이 감쇠하는 모드를 전진 오일러가 키우지 않는 스텝의 한계는 얼마입니까?'
    options:
      - '시정수의 절반'
      - '시정수'
      - '어떤 스텝이든'
      - '시정수의 두 배'
    answer: 3
    explain: '배율, 곧 1에서 스텝을 시정수로 나눈 값을 뺀 것은 스텝이 시정수의 두 배 이하일 때만 크기가 1 이하입니다. 진동하는 모드에는 더 짧은 스텝이 필요합니다.'
  - q: '시뮬레이터는 주기 정상상태를 어떻게 찾습니까?'
    options:
      - '한 주기가 자기 자신으로 되돌려 보내는 주기 시작의 상태를 뉴턴법으로 푼다'
      - '정지 상태에서 아무것도 바뀌지 않을 때까지 시뮬레이션한다'
      - '평균 모델을 쓴다'
      - 'ngspice에서 읽어 온다'
    answer: 0
    explain: '정상상태는 한 주기의 시작을 다음 주기의 시작으로 보내는 사상의 고정점이며, 뉴턴법이 사상의 도함수로 이를 찾습니다.'
  - q: '전류가 0 위에 머물고 스위치 양단에 커패시턴스가 없는 벅에서는 원리적으로 뉴턴 스텝이 몇 번 필요합니까?'
    options:
      - '수백 번'
      - '한 번. 그때 주기 사상이 아핀, 곧 행렬과 상태의 곱에 상수를 더한 것이라서'
      - '포락선 시정수의 수만큼'
      - '필요 없다'
    answer: 1
    explain: '스위칭 순간도 구간의 순서도 상태에 따라 달라지지 않으며, 뉴턴법은 해가 하나뿐인 아핀 방정식을 한 번에 풉니다. 다이오드 전류가 0에 닿거나, 스위치 양단의 커패시턴스가 먼저 전압을 옮겨야 하면 순간이 상태에 따라 달라져 몇 번의 스텝이 필요합니다.'
