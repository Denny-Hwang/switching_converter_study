# 05-simulation/ltspice 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '이상적인 부품에서 벅의 출력 필터가 10 ohm 부하, 10 µF 커패시터와 함께 진동합니다. 진동 포락선의 시정수는 얼마입니까?'
    options:
      - '100 µs'
      - '200 µs'
      - '31.6 µs'
      - '인덕턴스에 따라 다르다'
    answer: 1
    explain: '포락선은 인덕턴스와 관계없이 부하 저항과 커패시턴스의 곱의 두 배로 감쇠합니다. 2 × 10 ohm × 10 µF는 200 µs입니다.'
  - q: '포락선 시정수가 스위칭 주기의 20배입니다. 정지 상태에서 시작한 실행이 시작 오차의 100분의 1만 남기려면 대략 몇 주기가 필요합니까?'
    options:
      - '20'
      - '46'
      - '92'
      - '2000'
    answer: 2
    explain: '오차는 포락선 시정수마다 e배 줄어듭니다. 100분의 1까지는 ln 100, 곧 시정수의 약 4.6배이므로 약 92주기입니다.'
  - q: '시작 오차를 100분의 1에서 1만분의 1까지 더 줄이려면 얼마가 더 듭니까?'
    options:
      - '처음 100분의 1까지 든 만큼이 한 번 더'
      - '100배'
      - '더 들지 않는다. 오차가 이미 작다'
      - '10분의 1만큼'
    answer: 0
    explain: '10배마다 드는 양, 곧 ln 10(포락선 시정수의 약 2.3배)이 같으므로, 두 자릿수를 더 줄이는 데는 처음 두 자릿수만큼이 듭니다.'
  - q: '포락선 식으로 DCM 사례를 얼마나 오래 실행해야 하는지 알 수 없는 이유는 무엇입니까?'
    options:
      - 'DCM 사례에는 정상상태가 없다'
      - 'LTspice는 DCM을 시뮬레이션할 수 없다'
      - 'DCM에서는 커패시터가 충전되지 않는다'
      - 'DCM에서는 인덕터가 한 주기에서 다음 주기로 아무것도 넘기지 않아 필터가 L-C 쌍으로 진동하지 않는다'
    answer: 3
    explain: '인덕터 전류가 매 주기 0으로 돌아가므로 포락선을 정하는 L-C 진동이 없고, 정상상태 근처에서 출력은 대신 하나의 시정수로 정착합니다.'
  - q: '라이브러리의 검사는 실행이 정착했다고 인정하기 전에 무엇을 요구합니까?'
    options:
      - '출력이 이상적인 식과 정확히 같을 것'
      - '시간 간격이 다른 두 실행이 서로 맞을 것'
      - '마지막 주기의 출력 평균이 그 앞 주기의 평균과 1만분의 1 이내로 같을 것'
      - '실행이 1000주기 동안 계속될 것'
    answer: 2
    explain: '아직 정착 중인 실행은 주기마다 바뀌므로, 검사는 마지막 두 주기의 평균을 비교합니다. 느린 진동은 주기마다 조금만 바뀌어 이 검사는 너무 짧은 실행만 잡아내므로, 라이브러리는 각 사례를 시정수의 여러 배만큼 실행합니다.'
  - q: 'DCM 플라이백 실행에서 드레인이 회로로는 불가능하게 0보다 훨씬 아래로 떨어집니다. 무엇을 먼저 확인합니까?'
    options:
      - '.options 줄: 적분법과 허용오차'
      - '권선비'
      - '부하 저항'
      - '스위칭 주파수'
    answer: 0
    explain: '기본 설정에서는 ngspice와 LTspice 모두 라이브러리의 DCM 플라이백에 이런 딥을 그립니다. 기어 방법과 더 엄격한 허용오차가 이를 없앱니다.'
