# 05-simulation/ngspice 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '넷리스트가 따로 정하지 않으면 ngspice는 어떤 적분 규칙을 씁니까?'
    options:
      - '후진 오일러'
      - '사다리꼴 규칙'
      - '전진 오일러'
      - '기어 방법'
    answer: 1
    explain: '매뉴얼은 .options method의 기본값을 사다리꼴 규칙으로 적고 있습니다. 기어 방법은 따로 지정해야 합니다.'
  - q: '시정수 1 ns인 모드를 사다리꼴 규칙으로 20 ns씩 진행시킵니다. 스텝마다 곱해지는 값은 얼마입니까?'
    options:
      - '약 0.05'
      - '약 1'
      - '약 -19'
      - '약 -0.82'
    answer: 3
    explain: '스텝의 절반을 시정수로 나누면 10이고, 배율은 (1 - 10)/(1 + 10), 곧 -9/11입니다. 모드는 크기 대부분을 유지한 채 부호를 바꿉니다.'
  - q: '그 배율은 시뮬레이션 파형에서 어떻게 보입니까?'
    options:
      - '시간 점마다 부호가 바뀌는 링잉'
      - '느린 지수 감쇠'
      - '한 번의 계단'
      - '보이지 않는다. 모드가 너무 빠르다'
    answer: 0
    explain: '-1에 가까운 배율은 모드를 거의 감쇠시키지 않고 시간 점마다 뒤집습니다. 회로가 아니라 적분 규칙의 링잉입니다.'
  - q: '같은 모드를, 기어 방법이 쓰는 후진 차분 공식의 첫 번째인 후진 오일러로 20 ns씩 진행시키면 어떻게 됩니까?'
    options:
      - '시간 점마다 링잉한다'
      - '커진다'
      - '한두 스텝 뒤에 거의 사라진다'
      - '감쇠하지 않는다'
    answer: 2
    explain: '배율은 1/(1 + 20), 약 0.05입니다. 두 스텝 뒤에는 모드의 400분의 1도 남지 않습니다.'
  - q: '기어 시뮬레이션이 감쇠가 작은 L-C 링잉을 잘못 보여 줄 수 있는 이유는 무엇입니까?'
    options:
      - '링잉을 키운다'
      - '링잉 주파수를 두 배로 만든다'
      - '인덕터를 시뮬레이션할 수 없다'
      - '스텝으로 충분히 잘게 풀지 못한 진동을 감쇠시켜, 링잉이 실제 회로보다 빨리 줄어든다'
    answer: 3
    explain: '감쇠 없는 진동에 대해 후진 오일러의 배율은 크기가 1보다 작고, 사다리꼴 규칙의 배율은 정확히 1입니다. 스텝이 짧으면 그 차이가 작아집니다.'
  - q: 'ngspice 기본 설정에서 라이브러리의 DCM 플라이백은 어떤 모습을 보였습니까?'
    options:
      - '다이오드가 도통을 멈춘 뒤 2차 전류가 스텝마다 0을 가로지르며 흔들리고, 드레인이 0보다 훨씬 아래로 떨어졌다'
      - '올바른 파형'
      - '예상보다 높은 출력 전압'
      - '아무 결과도 없음'
    answer: 0
    explain: '다이오드가 꺼질 때 남는 빠른 모드에서 사다리꼴 규칙이 링잉했습니다. 기어 방법과 상대 허용오차 1e-4가 이를 없앴습니다.'
