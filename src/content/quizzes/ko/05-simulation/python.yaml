# 05-simulation/python 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '이 사이트에 보이는 식은 어디에서 옵니까?'
    options:
      - '각 페이지에 손으로 입력한 LaTeX'
      - 'equations.yaml의 항목 하나: 기호, 테스트, 인용을 갖춘 SymPy 식'
      - 'TypeScript 엔진'
      - '퀴즈 파일'
    answer: 1
    explain: '생성기가 그 항목에서 LaTeX와 테스트 벡터를 만들고, 커밋된 파일이 생성 결과와 다르면 CI가 실패합니다.'
  - q: 'TypeScript 계산 함수를 equations.yaml에서 생성하지 않고 손으로 쓰는 이유는 무엇입니까?'
    options:
      - '한쪽의 실수가 다른 쪽으로 복사되지 않게: 독립된 두 구현이 서로 맞아야 한다'
      - 'TypeScript는 YAML을 읽을 수 없어서'
      - '페이지를 빨리 불러오려고'
      - 'SymPy는 수를 계산할 수 없어서'
    answer: 0
    explain: '생성한 코드는 원본이 틀린 곳에서도 원본과 맞아 버립니다. 독립된 구현은 스스로 테스트 벡터와 맞아야 합니다.'
  - q: '시뮬레이션한 변환비 0.495를 이상적인 0.5와 비교합니다. 상대 차이는 얼마입니까?'
    options:
      - '0.5 %'
      - '0.005 %'
      - '10 %'
      - '1 %'
    answer: 3
    explain: '차이 0.005를 기준값 0.5로 나누면 0.01, 곧 1 %입니다.'
  - q: 'binary64의 단위 반올림 오차는 약 1.1e-16입니다. 일치 검사의 허용오차가 단위 반올림 오차가 아니라 10억분의 1인 이유는 무엇입니까?'
    options:
      - 'JavaScript가 Python보다 정밀도가 낮아서'
      - '올바른 두 계산도 연산마다 다르게 반올림해 단위 반올림 오차의 몇 배만큼 다를 수 있다. 10억분의 1은 그 여유를 주면서도 실제 실수를 잡는다'
      - '식이 10억분의 1까지만 알려져 있어서'
      - 'YAML이 더 작은 수를 담을 수 없어서'
    answer: 1
    explain: '10억분의 1은 단위 반올림 오차의 수백만 배이므로 반올림 오차를 키우지 않는 계산에서 반올림은 통과하지만, 잘못된 상수나 인수는 훨씬 큽니다.'
  - q: '기준값이 0에 가까우면 상대 차이를 쓸 수 없는 이유는 무엇입니까?'
    options:
      - '0에 가까운 기준값으로 나누면 아주 작은 절대 차이도 엄청나게 커 보인다'
      - '0에는 단위가 없어서'
      - '그곳에서는 늘 0이어서'
      - '쓸 수 있다'
    answer: 0
    explain: '그곳에서는 라이브러리의 검사처럼 한 주기 동안의 최대 크기 같은 척도와 비교합니다.'
  - q: 'Python에서 0.1 + 0.1 + 0.1 == 0.3의 값은 무엇입니까?'
    options:
      - 'True'
      - '오류'
      - 'False: 합이 0.3과 다른 배정밀도 수로 반올림된다'
      - '어떤 컴퓨터에서만 True'
    answer: 2
    explain: '0.1은 이진수로 정확하지 않으며, 셋을 더해 반올림한 0.30000000000000004는 0.3 바로 옆의 배정밀도 수입니다. 허용오차 안에 드는지로 비교합니다.'
