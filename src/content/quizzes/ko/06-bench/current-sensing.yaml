# 06-bench/current-sensing 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '2 mΩ 션트에 5 A가 흐릅니다. 센스 전압은 얼마입니까?'
    options:
      - '2.5 mV'
      - '10 mV'
      - '100 mV'
      - '0.4 mV'
    answer: 1
    explain: '옴의 법칙에 따라 5 A × 2 mΩ = 10 mV입니다.'
  - q: '션트의 부담 전압(burden)은 무엇입니까?'
    options:
      - '션트의 전력 정격'
      - '증폭기의 오프셋'
      - '션트가 측정 대상 회로에서 가져가는 전압, 곧 센스 전압'
      - 'ADC의 오차'
    answer: 2
    explain: '센스 전압은 신호이면서, 측정 대상 회로가 션트 양단에서 잃는 전압입니다.'
  - q: '로우사이드 션트는 부하에 어떤 영향을 줍니까?'
    options:
      - '부하의 전원 전압을 높임'
      - '아무 영향 없음. 션트는 접지 귀환 경로에 있음'
      - '부하를 접지에서 절연함'
      - '부하의 접지를 전원 접지보다 센스 전압만큼 들어 올림'
    answer: 3
    explain: '접지 귀환 경로가 션트를 지나므로 부하의 접지가 전류에 따라 움직입니다.'
  - q: '하이사이드 센싱이 더 나은 경우는 언제입니까?'
    options:
      - '가장 낮은 비용이 가장 중요할 때'
      - '전류가 아주 작을 때'
      - '부하의 접지가 움직이면 안 될 때'
      - '없음. 로우사이드가 항상 나음'
    answer: 2
    explain: '하이사이드 센싱은 션트를 접지 귀환 경로 밖에 두는 대신, 전원 전압에서 동작하는 증폭기가 필요합니다.'
  - q: '1 mΩ 션트를 패드 너머에서 센싱하고, 패드가 0.05 mΩ를 더합니다. 측정값은 얼마나 틀립니까?'
    options:
      - '5 % 작게'
      - '모든 전류에서 5 % 크게'
      - '0.05 % 크게'
      - '전류에 따라 다름'
    answer: 1
    explain: '패드 저항을 션트 저항으로 나눈 비율이며, 모든 전류에서 같습니다.'
  - q: '켈빈 연결(Kelvin connection)은 무엇을 합니까?'
    options:
      - '션트 저항을 낮춤'
      - '증폭기의 오프셋을 상쇄함'
      - '스위칭 잡음을 거름'
      - '션트 자신의 단자에서 전압을 센싱해 패드와 납땜을 측정값에서 뺌'
    answer: 3
    explain: '별도의 센스 연결에는 전류가 거의 흐르지 않으므로, 패드 저항이 측정값에 전압을 더하지 않습니다.'
