# 06-bench/gate-drive 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '턴온 때 드레인 전압이 떨어지는 동안 게이트-소스 전압은 어떻게 됩니까?'
    options:
      - '가장 빠르게 오름'
      - '0으로 떨어짐'
      - '진동함'
      - '일정하게 머묾(밀러 플래토)'
    answer: 3
    explain: '드레인 전압이 떨어지는 동안 드라이버가 낼 수 있는 게이트 전류는 모두 게이트-드레인 커패시턴스를 방전하는 데 쓰이므로, 게이트 전압은 플래토에 머뭅니다.'
  - q: '12 V 드라이버가 전체 4 Ω의 게이트 루프를 거쳐 게이트를 구동하고, 플래토는 4 V입니다. 턴온 때 플래토에서의 게이트 전류는 얼마입니까?'
    options:
      - '3 A'
      - '2 A'
      - '1 A'
      - '4 A'
    answer: 1
    explain: '드라이버 전압에서 플래토를 뺀 8 V가 4 Ω 게이트 루프에 걸리므로 2 A입니다.'
  - q: '게이트-드레인 전하가 20 nC이고 플래토에서의 게이트 전류가 2 A입니다. 드레인 전압이 스위칭되는 데 걸리는 시간은 얼마입니까?'
    options:
      - '40 ns'
      - '1 ns'
      - '10 ns'
      - '100 ns'
    answer: 2
    explain: '플래토는 게이트-드레인 전하를 게이트 전류로 나눈 시간만큼 지속됩니다. 20 nC ÷ 2 A = 10 ns입니다.'
  - q: '게이트 루프의 저항이 두 에지에서 같고, 플래토는 3 V, 구동 전압은 10 V입니다. 어느 전이가 더 느립니까?'
    options:
      - '턴온'
      - '같은 시간이 걸림'
      - '게이트-드레인 전하에만 달려 있음'
      - '턴오프(플래토 전압이 턴온 때 남는 7 V보다 작은 전류를 흘리기 때문)'
    answer: 3
    explain: '턴온 때는 7 V가, 턴오프 때는 3 V 플래토만이 같은 저항을 거쳐 게이트 전류를 흘립니다.'
  - q: '부트스트랩 커패시터가 하이사이드가 켜져 있는 동안 40 nC를 공급하고, 전압은 0.4 V만큼 강하해도 됩니다. 필요한 최소 커패시턴스는 얼마입니까?'
    options:
      - '100 nF'
      - '16 nF'
      - '10 nF'
      - '1 uF'
    answer: 0
    explain: '전하를 허용 강하로 나눕니다. 40 nC ÷ 0.4 V = 100 nF입니다.'
  - q: '부트스트랩 커패시터가 너무 작으면 어떤 일이 생길 수 있습니까?'
    options:
      - '전압 강하 때문에 드라이버의 저전압 차단(UVLO)이 하이사이드 스위치를 끌 수 있음'
      - '로우사이드 스위치가 켜지지 못함'
      - '스위칭 주파수가 두 배가 됨'
      - '아무 일도 없음. 드라이버가 자기 전원을 조절함'
    answer: 0
    explain: '하이사이드가 켜져 있는 동안에는 커패시터 혼자 전원을 공급하므로, 커패시턴스가 작으면 전압이 드라이버의 차단 임계값 아래로 떨어집니다.'
