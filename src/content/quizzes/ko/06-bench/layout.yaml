# 06-bench/layout 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '벅 컨버터에서 에지마다 전류가 스위칭되는 루프는 무엇입니까?'
    options:
      - '인덕터와 출력 커패시터'
      - '출력 커패시터와 부하'
      - '입력 커패시터, 스위치, 다이오드(또는 두 번째 스위치)'
      - '피드백 분압기'
    answer: 2
    explain: '에지마다 스위치, 다이오드, 입력 커패시터의 전류가 인덕터 전류만큼 계단처럼 바뀌지만 인덕터 전류는 계속 흐릅니다. 전류가 스위칭되는 루프는 이 셋으로 이루어진 루프입니다.'
  - q: '5 nH 루프에서 10 A가 10 ns 만에 0이 됩니다. 루프에 생기는 전압은 얼마입니까?'
    options:
      - '5 V'
      - '0.5 V'
      - '50 V'
      - '루프와 관계없이 나노초당 500 mV'
    answer: 0
    explain: '루프 인덕턴스에 전류 변화를 곱하고 에지 시간으로 나눕니다. 5 nH × 10 A ÷ 10 ns = 5 V입니다.'
  - q: '스위치가 두 배 빨라지면 같은 루프의 전압은 어떻게 됩니까?'
    options:
      - '절반이 됨'
      - '그대로임'
      - '네 배가 됨'
      - '두 배가 됨'
    answer: 3
    explain: '전압은 루프 인덕턴스와 전류 변화의 곱을 에지 시간으로 나눈 값이므로, 에지 시간이 절반이 되면 두 배가 됩니다.'
  - q: '턴오프 때 루프 인덕턴스의 전압은 어디에 나타납니까?'
    options:
      - '부하 양단에만'
      - '스위치 양단에, 입력 전압에 더해져서'
      - '출력 커패시터 양단에'
      - '어디에도 없음. 인덕턴스는 에너지만 저장하고 전압은 만들지 않음'
    answer: 1
    explain: '루프에 키르히호프 전압 법칙을 적용하면, 전류가 줄어드는 동안 인덕턴스의 전압이 스위치 양단에서 입력 전압에 더해집니다.'
  - q: '강압 컨버터에서 스위치에 가장 가까이 두어야 하는 부품은 무엇입니까?'
    options:
      - '출력 커패시터'
      - '피드백 분압기'
      - '입력 커패시터'
      - '출력 커넥터'
    answer: 2
    explain: '전류가 스위칭되는 루프를 닫는 부품입니다. 루프가 짧을수록 인덕턴스가 작고, 에지마다 그 양단에 생기는 전압도 작습니다.'
  - q: '스위치 노드의 동박 면적이 절충의 문제인 이유는 무엇입니까?'
    options:
      - '전류를 나르고 스위치를 식혀야 하지만, 그 전압 변화가 이웃에 결합되기 때문'
      - '구리가 비싸기 때문'
      - '면적이 크면 스위칭 주파수가 낮아지기 때문'
      - '스위치 노드에는 전류가 흐르지 않기 때문'
    answer: 0
    explain: '노드에는 전류와 열을 위한 동박이 필요하고, 그 전압 변화는 부유 커패시턴스를 통해 이웃 배선에 전류를 흘립니다.'
  - q: '피드백 배선은 어떻게 배치해야 합니까?'
    options:
      - '짧게 하려고 스위치 노드 옆에'
      - '인덕터와 잡음이 많은 전력 배선에서 되도록 멀리'
      - '인덕터 아래로'
      - '상관없음. 제어기가 걸러 냄'
    answer: 1
    explain: '제어기는 배선이 가져다주는 전압을 조정하므로, 배선이 도중에 주워 온 전압은 출력에 나타납니다.'
