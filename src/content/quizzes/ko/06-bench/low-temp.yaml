# 06-bench/low-temp 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '출력 커패시터의 ESR이 0.02 ohm이고, 커패시터로 들어가는 리플 전류는 피크-피크 3 A입니다. ESR이 만드는 리플은 얼마입니까?'
    options:
      - '피크-피크 60 mV'
      - '피크-피크 6 mV'
      - '피크-피크 0.6 V'
      - '피크-피크 150 mV'
    answer: 0
    explain: 'ESR과 피크-피크 리플 전류의 곱입니다. 0.02 ohm × 3 A = 60 mV입니다.'
  - q: '같은 커패시터가 알루미늄 전해 커패시터이고, 그 데이터시트에서 ESR이 저온 한계에서 10배 넘게 커진다고 합시다. 그 온도에서 리플은 어떻게 됩니까?'
    options:
      - '60 mV 그대로임'
      - '커패시터가 차가우므로 줄어듦'
      - '10배 넘게 커져 0.6 V를 넘음'
      - '사라짐'
    answer: 2
    explain: 'ESR 리플은 ESR에 비례합니다. 상온에서 지키던 한계를 추위 속에서는 넘을 수 있습니다.'
  - q: 'X7R 같은 2종 세라믹 커패시터의 코드는 무엇을 알려 줍니까?'
    options:
      - '정격 전압에서의 커패시턴스'
      - '커패시턴스가 온도에 따라 변하는 방식(DC 전압에 대해서는 아무것도 알려 주지 않음)'
      - '커패시턴스가 변하지 않는다는 것'
      - 'ESR'
    answer: 1
    explain: '코드는 전압 계수에 대해 아무것도 말하지 않습니다. 동작 DC 전압에서의 커패시턴스를 확인합니다.'
  - q: '개방 전압이 3.6 V이고 내부 저항이 0.08 ohm인 셀을 2.5 A로 충전합니다. 단자 전압은 얼마입니까?'
    options:
      - '3.8 V'
      - '3.6 V'
      - '3.4 V'
      - '4.2 V'
    answer: 0
    explain: '충전 전류가 단자 전압을 2.5 A × 0.08 ohm = 0.2 V만큼 높이므로 3.8 V입니다.'
  - q: '충전기가 셀의 단자를 4.2 V로 묶어 두고, 셀의 개방 전압은 4.0 V입니다. 내부 저항이 0.1 ohm일 때와 0.4 ohm일 때 흐르는 전류는 각각 얼마입니까?'
    options:
      - '두 경우 모두 2 A'
      - '0.5 A와 2 A'
      - '2 A와 0.5 A'
      - '42 A와 10.5 A'
    answer: 2
    explain: '전류는 (4.2 V - 4.0 V)를 저항으로 나눈 값입니다. 같은 한계에서 저항이 클수록 전류가 작습니다.'
  - q: '방전 전류를 1 A에서 3 A로 계단처럼 바꾸자 셀의 단자 전압이 3.70 V에서 3.52 V로 떨어졌습니다. 내부 저항은 얼마입니까?'
    options:
      - '0.18 ohm'
      - '0.06 ohm'
      - '1.17 ohm'
      - '0.09 ohm'
    answer: 3
    explain: 'Rint 모델에서는 전압 변화를 전류 변화로 나눈 값이 저항입니다. 0.18 V ÷ 2 A = 0.09 ohm입니다.'
  - q: '리튬이온 셀을 충전 하한 온도보다 낮은 온도에서 충전하면 안 되는 이유는 무엇입니까?'
    options:
      - '개방 전압이 0이 되기 때문'
      - '충전기의 전압 한계가 더 이상 적용되지 않기 때문'
      - '탄소 음극이 리튬 이온을 덜 받아들이고, 탄소 표면에 금속 리튬이 석출되기 쉬워지기 때문'
      - '내부 저항이 0이 되기 때문'
    answer: 2
    explain: '추위 속에서는 탄소 음극이 리튬 이온을 덜 받아들이므로 그 표면에 금속 리튬이 석출되기 쉬워지고, 배터리의 열 안정성이 떨어집니다.'
