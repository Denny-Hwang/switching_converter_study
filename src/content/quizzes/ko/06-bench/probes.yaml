# 06-bench/probes 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '프로브의 긴 접지선이 만드는 루프는 측정된 스위칭 에지에 어떤 영향을 줍니까?'
    options:
      - '인덕턴스를 더해 과도 현상을 실제보다 크게 보이게 함'
      - '에지를 걸러 과도 현상을 작게 보이게 함'
      - '아무 영향 없음. 접지선에는 전류가 흐르지 않음'
      - '에지를 시간 축으로만 옮김'
    answer: 0
    explain: '선들이 만드는 루프의 인덕턴스는 과도 현상을 부풀리고, 프로브의 커패시턴스와 함께 에지마다 링잉합니다.'
  - q: '50 nH 접지선이 20 pF 프로브 커패시턴스와 링잉합니다. 선을 네 배 짧게(인덕턴스 1/4) 하면 링잉 주파수는 어떻게 됩니까?'
    options:
      - '네 배로 올라감'
      - '두 배로 올라감'
      - '절반으로 내려감'
      - '그대로임. 커패시턴스가 정함'
    answer: 1
    explain: '공진 주파수는 인덕턴스의 제곱근에 반비례하므로, 인덕턴스가 1/4이 되면 두 배가 됩니다.'
  - q: '대역폭이 350 MHz인 단일 극점 측정 시스템은 이상적인 계단이 얼마 만에 오르는 것으로 보여 줍니까?'
    options:
      - '약 0.35 ns'
      - '약 3.5 ns'
      - '즉시'
      - '약 1 ns'
    answer: 3
    explain: '상승 시간은 약 0.35를 대역폭으로 나눈 값입니다. 0.35 ÷ 350 MHz = 1 ns입니다.'
  - q: '같은 대역폭의 두 오실로스코프가 같은 에지를 다른 상승 시간으로 보여 줄 수 있는 이유는 무엇입니까?'
    options:
      - '대역폭과 상승 시간 사이의 상수가 각자의 주파수 응답 모양에 따라 다르기 때문'
      - '프로브 색이 다르기 때문'
      - '상승 시간은 오실로스코프와 무관하기 때문'
      - '하나가 고장 났기 때문'
    answer: 0
    explain: '같은 대역폭이라도 평탄한 응답과 가우시안 응답은 상승 시간을 다르게 잽니다.'
  - q: '출력 리플은 어떻게 재야 합니까?'
    options:
      - '멀리 닿도록 가장 긴 접지선으로'
      - '인덕터 양단에서'
      - '출력 커패시터에서 팁-배럴 방법(tip-and-barrel method)이나 아주 짧은 접지로'
      - '프로브를 전류 측정으로 설정해서'
    answer: 2
    explain: '짧은 접지는 프로브의 루프와, 그 루프가 부풀리는 과도 현상을 작게 유지합니다.'
  - q: '채널의 대역폭 제한을 리플 주파수 가까이에 두면 어떻게 됩니까?'
    options:
      - '리플이 크게 읽힘'
      - '리플 자체가 감쇠되어 작게 읽힘'
      - '아무 일도 없음. 제한은 잡음만 없앰'
      - '오실로스코프가 트리거하지 않음'
    answer: 1
    explain: '저역 통과 필터는 차단 주파수 근처와 그 위의 모든 성분을 감쇠시키며, 리플도 예외가 아닙니다.'
