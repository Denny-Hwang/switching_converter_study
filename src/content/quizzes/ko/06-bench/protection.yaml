# 06-bench/protection 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '24 V 전원을 전체 0.05 ohm을 거쳐 빈 470 uF 커패시터에 연결하며, 배선 인덕턴스는 무시할 만큼 작습니다. 최대 전류는 얼마입니까?'
    options:
      - '24 A'
      - '11.3 A'
      - '480 A'
      - '0.2 A'
    answer: 2
    explain: '계단 전압 전체가 직렬 저항에 걸립니다. 24 V를 0.05 ohm으로 나눈 값입니다.'
  - q: '커패시터를 ESR은 같고 커패시턴스가 절반인 것으로 바꿉니다. 최대 전류는 어떻게 됩니까?'
    options:
      - '그대로임'
      - '절반이 됨'
      - '두 배가 됨'
      - '0이 됨'
    answer: 0
    explain: 'R-C 모델에서는 계단 순간에 크기와 관계없이 커패시터 양단에 전압이 없으므로, 최대 전류는 직렬 저항만이 제한합니다. 시정수가 절반이 되므로 펄스는 짧아집니다.'
  - q: '첫 번째 펄스(24 V, 470 uF, 0.05 ohm)의 줄 적분은 얼마입니까?'
    options:
      - '5.41 A^2 s'
      - '1.35 A^2 s'
      - '2.71 A^2 s'
      - '0.14 A^2 s'
    answer: 2
    explain: 'V^2 C / (2 R) = 576 × 470e-6 / 0.1 = 2.71 A^2 s입니다.'
  - q: '같은 470 uF 커패시터를 선형 램프로 24 V까지 올립니다. 돌입 전류를 2 A로 하려면 램프가 얼마나 길어야 합니까?'
    options:
      - '2.82 ms'
      - '11.3 ms'
      - '0.564 ms'
      - '5.64 ms'
    answer: 3
    explain: '전류는 C V를 램프 시간으로 나눈 값이므로, 램프 시간은 C V를 전류로 나눈 값입니다. 470e-6 × 24 / 2 = 5.64 ms입니다.'
  - q: '고정된 24 V 전원과 직렬인 부하 스위치가 그 램프를 만듭니다. 계단 입력과 비교해, 커패시터가 충전되는 동안 경로가 소산하는 에너지는 얼마입니까?'
    options:
      - '없음. 느린 램프는 손실이 없음'
      - '같음. 커패시터가 저장하는 만큼이며, 이제 대부분을 부하 스위치가 소산함'
      - '절반'
      - '두 배'
    answer: 1
    explain: '어느 경우든 전원은 C V^2를 내보내고 커패시터는 C V^2/2를 저장합니다. 램프는 전류를 낮추고 손실을 시간에 걸쳐 나눌 뿐입니다.'
  - q: '주위 온도가 높아지면 퓨즈는 어떻게 됩니까?'
    options:
      - '아무 변화 없음. 퓨즈는 전류에만 좌우됨'
      - '더 큰 전류에서 끊어짐'
      - '더 오래감'
      - '더 뜨겁게 동작하고 수명이 짧아짐'
    answer: 3
    explain: '주위 온도가 높을수록 퓨즈는 더 뜨겁게 동작하고 수명이 짧아집니다.'
  - q: '12 V 배터리에 직렬로 넣은 다이오드가 부하를 역접속으로부터 보호합니다. 부하는 평균 2 A를 끌어가고 다이오드의 전압 강하는 0.7 V입니다. 저항분을 무시하면 다이오드의 손실은 얼마입니까?'
    options:
      - '없음. 배터리가 거꾸로 연결됐을 때만 동작함'
      - '1.4 W(회로가 동작하는 내내)'
      - '24 W'
      - '0.35 W'
    answer: 1
    explain: '배터리가 바르게 연결되어 있으면 다이오드는 부하 전류 전체를 흘립니다. 0.7 V × 2 A = 1.4 W입니다.'
