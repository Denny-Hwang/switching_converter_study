# 06-bench/thermal 퀴즈. 수치는 연습용 합성 값입니다.
numbers: synthetic
questions:
  - q: '소자가 25 C 공기 속에서 직렬 열저항 2, 1, 12 K/W(접합-케이스, 케이스-방열판, 방열판-공기)를 거쳐 3 W를 소산합니다. 접합 온도는 얼마입니까?'
    options:
      - '45 C'
      - '61 C'
      - '100 C'
      - '70 C'
    answer: 3
    explain: '상승분이 더해집니다. 3 W × 15 K/W = 45 K이므로, 접합은 25 C보다 45 K 높은 70 C입니다.'
  - q: '그 접합 온도를 가장 많이 낮추는 변화는 무엇입니까?'
    options:
      - '열저항이 절반인 방열판'
      - '열저항이 절반인 인터페이스'
      - '접합-케이스 열저항이 절반인 소자'
      - '셋 다 같음'
    answer: 0
    explain: '가장 큰 열저항인 방열판이 상승의 가장 큰 몫을 차지합니다. 이를 절반으로 줄이면 18 K가 내려가고, 나머지는 1.5 K와 3 K가 내려갑니다.'
  - q: '데이터시트의 접합-주위 열저항은 무엇을 나타냅니까?'
    options:
      - '어떤 기판에서든 성립하는 접합-주위 경로'
      - '패키지 자체만'
      - '측정했을 때의 기판과 공기 흐름을 포함한, 공기까지의 전체 경로'
      - '필요한 방열판'
    answer: 2
    explain: '가장 흔히 보고되는 지표이자 흔히 오용되는 지표로, 측정했을 때의 조건에 속한 값입니다.'
  - q: '방열판이 없는 소자가 1.5 W를 소산하고 패키지 윗면은 70 C이며, 데이터시트의 접합-윗면 파라미터는 4 K/W입니다. 접합 온도는 얼마입니까?'
    options:
      - '70 C'
      - '64 C'
      - '100 C'
      - '76 C'
    answer: 3
    explain: '윗면 온도에 파라미터와 전체 전력의 곱을 더합니다. 70 C + 6 K = 76 C입니다.'
  - q: '접합-윗면 파라미터를 직렬 열 경로에 더하지 않는 이유는 무엇입니까?'
    options:
      - '진정한 열저항이 아니기 때문(전력의 일부만 패키지 윗면을 지남)'
      - '항상 0이기 때문'
      - '다른 단위로 측정되기 때문'
      - '이미 방열판을 포함하기 때문'
    answer: 0
    explain: '두 온도를 전체 전력에 연결하는 값이며, 전력의 대부분은 다른 경로로 빠져나갑니다.'
  - q: '스위치의 도통 손실을 뜨거운 접합 온도에서 어림해야 하는 이유는 무엇입니까?'
    options:
      - '뜨거우면 전류가 줄기 때문'
      - '온저항이 온도에 따라 커지기 때문(배율은 데이터시트의 정규화 곡선에 나옴)'
      - '도통 손실은 온도와 무관하기 때문'
      - '게이트 전하가 커지기 때문'
    answer: 1
    explain: '상온에서 어림한 손실은 너무 작고, 늘어난 손실이 접합을 더 달굽니다.'
