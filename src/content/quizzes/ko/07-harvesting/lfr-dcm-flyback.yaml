# 07-harvesting/lfr-dcm-flyback 퀴즈. 수치는 연습용 가상 값입니다.
numbers: synthetic
questions:
  - q: '5 kHz, 듀티비 0.1의 플라이백이 DCM에서 전원 저항인 20 kohm을 보여야 합니다. 필요한 자화 인덕턴스는?'
    options:
      - '20 mH'
      - '40 mH'
      - '2 mH'
      - '200 mH'
    answer: 0
    explain: '입력 저항 곱하기 듀티비의 제곱을 스위칭 주파수의 두 배로 나눈 값: 2e4 곱하기 0.01을 1e4로 나누면 0.02 H입니다.'
  - q: '스위칭 주파수와 저항은 그대로 두고 듀티비를 0.2로 두 배로 합니다. 이제 필요한 인덕턴스는?'
    options:
      - '40 mH'
      - '10 mH'
      - '80 mH'
      - '20 mH'
    answer: 2
    explain: '인덕턴스는 듀티비의 제곱으로 커집니다: 20 mH의 네 배입니다.'
  - q: '선형 전원에 정합된 DCM 플라이백은 입력 전압을 어디에 둡니까?'
    options:
      - '전원의 개방 전압'
      - '임계 입력 전압'
      - '출력 전압 곱하기 권선비'
      - '전원 개방 전압의 절반'
    answer: 3
    explain: '입력 저항이 전원 저항과 같으므로 둘이 전원 전압을 반으로 나눕니다.'
  - q: '분압 전압이 임계 입력 전압을 넘을 만큼 전원이 커집니다. 플라이백은 어떻게 됩니까?'
    options:
      - 'CCM에 들어가고, CCM이 입력을 임계 전압에 붙잡는다'
      - 'DCM에 머물고 입력은 계속 오른다'
      - '스위칭을 멈춘다'
      - '출력 전압이 전원을 따라 오른다'
    answer: 0
    explain: '출력이 고정되어 있으면 CCM 변환비는 임계 입력 전압만 허용합니다. 버스는 거기에 묶이고, 플라이백은 정전압 싱크가 됩니다.'
  - q: '출력 5 V, 다이오드 0.5 V, 듀티비 0.2, 권선비 0.1인 플라이백의 입력이 75 V에 있습니다. 임계 입력 전압은 얼마이며, DCM입니까?'
    options:
      - '55 V, CCM'
      - '220 V, DCM'
      - '27.5 V, CCM'
      - '440 V, DCM'
    answer: 1
    explain: '5.5 V 곱하기 0.8을 (0.1 곱하기 0.2)로 나누면 220 V입니다. 입력이 그보다 낮으므로 DCM입니다.'
  - q: '누설 스파이크 전에 스위치가 차단하는 전압은?'
    options:
      - '75 V'
      - '80.5 V'
      - '130 V'
      - '550 V'
    answer: 2
    explain: '입력 전압에, 출력과 다이오드 전압을 권선비로 반사한 값을 더합니다: 75 V 더하기 5.5 V를 0.1로 나눈 값.'
  - q: '자화 인덕턴스가 10 % 작게 나왔습니다. 플라이백은 가용 전력의 대략 얼마를 잃습니까?'
    options:
      - '10 %'
      - '5 %'
      - '1 %'
      - '0.25 % 정도'
    answer: 3
    explain: '입력 저항도 10 % 작아지며, 비율의 꼭대기에서는 벗어난 비율 제곱의 4분의 1 정도만 잃습니다: 4 곱하기 0.9를 1.9의 제곱으로 나누면 0.997입니다.'
