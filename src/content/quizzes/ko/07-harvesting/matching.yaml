# 07-harvesting/matching 퀴즈. 수치는 연습용 가상 값입니다.
numbers: synthetic
questions:
  - q: '25 ohm 뒤의 10 V 선형 전원에 5 V로 유지되는 배터리를 곧바로 연결합니다. 배터리는 가용 전력의 얼마를 가져갑니까?'
    options:
      - '절반'
      - '전부'
      - '4분의 1'
      - '4분의 3'
    answer: 1
    explain: '배터리가 개방 전압의 절반에 있고, 정전압은 거기서 가용 전력 전부를 가져갑니다: 0.2 A 곱하기 5 V는 1 W이고, 가용 전력도 100을 100으로 나눈 1 W입니다.'
  - q: '같은 전원이 대신 2 V로 유지되는 배터리를 충전합니다. 가져가는 비율은?'
    options:
      - '0.2'
      - '0.8'
      - '0.64'
      - '0.36'
    answer: 2
    explain: '4 곱하기 2 곱하기 8을 10의 제곱으로 나누면 64/100입니다. 배터리는 8 V를 25 ohm으로 나눈 0.32 A를 2 V에서 받아, 가용 전력 1 W 가운데 0.64 W를 가져갑니다.'
  - q: '100 ohm의 무손실 저항인 컨버터가 같은 25 ohm 전원에서 전력을 끌어옵니다. 가져가는 비율은?'
    options:
      - '0.64'
      - '0.8'
      - '0.25'
      - '1'
    answer: 0
    explain: '4 곱하기 25 곱하기 100을 125의 제곱으로 나누면 10000/15625, 곧 0.64입니다.'
  - q: '전원의 개방 전압이 두 배가 됩니다. 무손실 저항이 가져가는 비율은 어떻게 됩니까?'
    options:
      - '두 배가 된다'
      - '절반이 된다'
      - '4분의 1이 된다'
      - '그대로다'
    answer: 3
    explain: '두 저항은 어떤 전원 전압이든 같은 비로 나눕니다. 비율은 저항에만 달려 있습니다.'
  - q: '배터리는 5 V에 머물고 10 V 전원이 20 V로 두 배가 됩니다. 이제 배터리가 가져가는 비율은?'
    options:
      - '전부'
      - '0.75'
      - '0.5'
      - '0.25'
    answer: 1
    explain: '4 곱하기 5 곱하기 15를 20의 제곱으로 나누면 300/400입니다. 비율은 배터리 전압과 전원 전압의 비로 정해지므로, 배터리 전압이 고정되어 있으면 전원 진폭이 바뀔 때마다 비율도 바뀝니다.'
  - q: '어떤 컨버터의 입력이 무손실 저항입니까?'
    options:
      - 'CCM의 벅'
      - '듀티비가 고정된 모든 컨버터'
      - '듀티비가 고정된 DCM의 벅-부스트나 플라이백'
      - '듀티비가 고정된 CCM의 부스트'
    answer: 2
    explain: '고정 듀티비의 DCM에서 벅-부스트나 플라이백은 입력 전압에 비례하는 평균 입력 전류를 끌어오고, 전력을 전달합니다.'
