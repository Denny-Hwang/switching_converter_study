# 07-harvesting/sece-sshi-mppt 퀴즈. 수치는 연습용 가상 값입니다.
numbers: synthetic
questions:
  - q: '압전 소자의 개방 전압 진폭이 2 V입니다. 전파 브리지는 어느 직류 전압에서 가장 많은 전력을 가져갑니까?'
    options:
      - '2 V'
      - '4 V'
      - '1 V'
      - '0.5 V'
    answer: 2
    explain: '표준 인터페이스는 개방 전압 진폭의 절반에서 가장 좋습니다.'
  - q: '그 브리지 뒤의 저장 소자가 2 V까지 충전되었습니다. 이제 브리지가 전달하는 전력은?'
    options:
      - '없다: 레일 사이의 변화가 전하 전부를 가져간다'
      - '최대 전력'
      - '최대 전력의 절반'
      - '최대 전력의 두 배'
    answer: 0
    explain: '개방 전압 진폭에서는 소자 전압이 반주기마다 겨우 반대쪽 레일에 닿으며, 브리지에 남는 전하가 없습니다.'
  - q: 'SECE의 전력은 표준 인터페이스의 최대 전력과 비교해 어떻습니까?'
    options:
      - '같다'
      - '두 배'
      - '절반'
      - '네 배'
    answer: 3
    explain: 'SECE는 극값마다 소자 에너지 전부를 가져갑니다: I_p 제곱의 두 배를 pi omega C_0로 나눈 값으로, 표준 인터페이스 최댓값의 네 배입니다.'
  - q: 'SECE 인터페이스 뒤의 저장 소자가 2 V에서 4 V로 충전됩니다. 수확 전력은 어떻게 됩니까?'
    options:
      - '그대로다'
      - '절반이 된다'
      - '두 배가 된다'
      - '0으로 떨어진다'
    answer: 0
    explain: 'SECE는 저장 소자의 전압에 맞서 쓰는 전하가 없으므로 전력이 그 전압과 무관합니다.'
  - q: '병렬 SSHI의 반전이 전압의 절반을 유지합니다. 최대 전력은 표준 인터페이스의 최대 전력과 비교해 어떻습니까?'
    options:
      - '두 배'
      - '네 배'
      - '열 배'
      - '같다'
    answer: 1
    explain: '2를 (1 빼기 반전 계수)로 나눈 값: 2를 0.5로 나눕니다.'
  - q: '2 V 소자에서 그 SSHI 인터페이스는 어느 직류 전압에서 가장 좋습니까?'
    options:
      - '1 V'
      - '2 V'
      - '8 V'
      - '4 V'
    answer: 3
    explain: '개방 전압 진폭을 (1 빼기 반전 계수)로 나눈 값: 2 V를 0.5로 나눕니다.'
  - q: '컨버터가 입력을 개방 전압의 고정 비율에 두어 선형 전원의 최대 전력점을 추종합니다. 그 비율은?'
    options:
      - '80 %'
      - '50 %'
      - '100 %'
      - '25 %'
    answer: 1
    explain: '선형 전원은 개방 전압의 절반인 정전압에 가장 많이 줍니다.'
  - q: '2 V 소자에서 SECE 컨버터가 견뎌야 하는 전압은?'
    options:
      - '2 V'
      - '1 V'
      - '4 V'
      - '8 V'
    answer: 2
    explain: '0부터 개방해 두면 소자 전압은 추출 전에 개방 전압 진폭의 두 배까지 오릅니다.'
