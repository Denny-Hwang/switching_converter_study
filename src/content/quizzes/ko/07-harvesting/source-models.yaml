# 07-harvesting/source-models 퀴즈. 수치는 연습용 가상 값입니다.
numbers: synthetic
questions:
  - q: '선형 전원이 50 ohm 뒤에 20 V의 개방 전압을 가집니다. 이 전원이 낼 수 있는 최대 전력은?'
    options:
      - '8 W'
      - '2 W'
      - '4 W'
      - '0.5 W'
    answer: 1
    explain: '개방 전압의 제곱을 전원 저항의 네 배로 나눈 값: 400을 200으로 나누면 2 W이며, 50 ohm 부하에서 얻습니다.'
  - q: '이 전원은 어떤 부하에 가장 큰 전력을 줍니까?'
    options:
      - '전류를 가장 많이 끌어오는 단락'
      - '전압이 가장 높은 개방'
      - '전원 저항과 같은 저항, 50 ohm'
      - '전원 저항의 두 배인 저항'
    answer: 2
    explain: '정합 부하에서는 개방 전압의 절반이 부하에, 절반이 전원 저항에 걸립니다. 단락이나 개방은 전력을 전혀 받지 못합니다.'
  - q: '압전 소자가 25 nF의 클램프 커패시턴스 옆에서 2000 rad/s로 50 uA 진폭의 전류를 흘립니다. 개방 전압 진폭은?'
    options:
      - '1 V'
      - '0.5 V'
      - '2 V'
      - '4 V'
    answer: 0
    explain: '아무것도 연결하지 않으면 전류 전부가 커패시턴스를 충방전합니다: 50e-6을 (2000 곱하기 25e-9)로 나누면 1 V입니다.'
  - q: '이 소자에서 최적 저항이 받는 전력은?'
    options:
      - '25 uW'
      - '50 uW'
      - '6.25 uW'
      - '12.5 uW'
    answer: 3
    explain: '최적 저항은 커패시턴스의 리액턴스, 1/(2000 곱하기 25e-9) = 20 kohm이고, 전류 진폭의 제곱을 omega C_0의 네 배로 나눈 만큼 받습니다: 2.5e-9를 2e-4로 나누면 12.5 uW입니다.'
  - q: '전류 진폭은 그대로이고 진동 주파수가 두 배가 됩니다. 최적 저항은 어떻게 됩니까?'
    options:
      - '두 배가 된다'
      - '절반이 된다'
      - '그대로다'
      - '4분의 1이 된다'
    answer: 1
    explain: '최적 저항은 클램프 커패시턴스의 리액턴스, 곧 1/(omega C_0)이므로 omega가 두 배가 되면 절반이 됩니다.'
  - q: '오실로스코프 프로브가 임피던스가 높은 전원의 측정값을 바꿀 수 있는 이유는?'
    options:
      - '프로브의 입력 저항과 커패시턴스가 전원과 병렬로 들어가 전류의 일부를 가져가기 때문'
      - '모든 측정값에 직류 오프셋을 더하기 때문'
      - '진동 주파수를 바꾸기 때문'
      - '바꿀 수 없다: 프로브는 전류를 끌어오지 않는다'
    answer: 0
    explain: '프로브도 부하입니다. 최적 저항이 큰 전원 앞에서는 프로브의 입력 저항과 커패시턴스를 무시할 수 없습니다.'
  - q: 'Zi 등의 성능 지수는 마찰전기 나노발전기를 평가할 때 무엇을 곱합니까?'
    options:
      - '개방 전압과 단락 전류'
      - '고정 저항에 들어가는 전력과 면적'
      - '커패시턴스와 주파수'
      - '설계가 정하는 구조 성능 지수와, 표면 전하 밀도의 제곱'
    answer: 3
    explain: '한 사이클이 낼 수 있는 에너지를 면적과 변위당으로 평가합니다. 설계 부분과, 표면 전하 밀도의 제곱인 재료 부분으로 이루어집니다.'
