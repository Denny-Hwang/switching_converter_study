# 07-harvesting/synthetic-case 퀴즈. 수치는 연습용 가상 값입니다.
numbers: synthetic
questions:
  - q: '전원의 개방 전압이 1 Mohm 뒤에서 500 V까지 오릅니다. 최댓값에서 낼 수 있는 최대 전력은?'
    options:
      - '62.5 mW'
      - '125 mW'
      - '250 mW'
      - '31.3 mW'
    answer: 0
    explain: '500 V의 제곱을 1e6 ohm의 네 배로 나눈 값: 250000을 4e6으로 나누면 62.5 mW입니다.'
  - q: '정합된 무손실 저항이, 그 값에서 최대인 느린 사인파 포락선 동안 내내 DCM에 머뭅니다. 받는 평균 전력은?'
    options:
      - '62.5 mW'
      - '31.3 mW'
      - '15.6 mW'
      - '44.2 mW'
    answer: 1
    explain: '전력은 포락선의 제곱을 따르고, 사인의 제곱은 평균이 최댓값 제곱의 절반입니다: 62.5 mW의 절반.'
  - q: '2 kHz, 듀티비 0.05의 플라이백이 1 Mohm을 보여야 합니다. 필요한 자화 인덕턴스는?'
    options:
      - '1.25 H'
      - '2.5 H'
      - '0.625 H'
      - '6.25 H'
    answer: 2
    explain: '저항 곱하기 듀티비의 제곱을 스위칭 주파수의 두 배로 나눈 값: 1e6 곱하기 0.0025를 4000으로 나눕니다.'
  - q: '진폭이 포락선을 따르는 전원에서 DCM은 어디서 확인해야 합니까?'
    options:
      - '포락선의 평균'
      - '포락선의 시작'
      - '어디서나: DCM은 전원과 무관하다'
      - '버스가 가장 높은 포락선의 최댓값'
    answer: 3
    explain: '임계 입력 전압은 고정되어 있고 버스는 최댓값에서 가장 높으므로, CCM이 처음 나타나는 곳이 거기입니다.'
  - q: '버스 커패시턴스가 1 uF이고, 전원 저항과 플라이백 입력 저항이 모두 1 Mohm입니다. 버스의 시정수는?'
    options:
      - '0.5 s'
      - '1 s'
      - '2 s'
      - '0.25 s'
    answer: 0
    explain: '커패시턴스 곱하기 두 저항의 병렬 저항: 1e-6 곱하기 0.5e6 ohm.'
  - q: '플라이백이 스위칭을 멈추고 버스에 다른 부하도 없습니다. 1 kV의 개방 전압과 1 Mohm 뒤에서 버스는 어디에 자리 잡습니까?'
    options:
      - '0: 1 Mohm은 전류를 거의 흘리지 않는다'
      - '개방 전압의 절반'
      - '개방 전압 전체, 1 kV'
      - '임계 입력 전압'
    answer: 2
    explain: '부하가 없으면 전류가 흐르지 않고 전원 저항에 전압이 걸리지 않습니다. 커패시터는 개방 전압 전체에 이르고 그 전압을 유지합니다.'
