# 09-missions/m1-derive-buck 퀴즈. 수치는 연습용으로 만든 값입니다.
numbers: synthetic
questions:
  - q: '정상상태에서 한 스위칭 주기 동안 평균한 인덕터 전압이 0인 이유는 무엇입니까?'
    options:
      - '출력 커패시터가 출력 전압을 일정하게 유지하기 때문에'
      - '인덕터 전류가 매 주기 끝에서 시작값으로 돌아오기 때문에'
      - '스위치와 다이오드가 같은 시간 동안 도통하기 때문에'
      - '입력 전압이 일정하기 때문에'
    answer: 1
    explain: '한 주기 동안 인덕터 전류의 변화는 평균 전압에 주기를 곱하고 인덕턴스로 나눈 값입니다. 주기마다 반복되는 전류는 변화가 0이므로 평균 전압도 0입니다. 이것이 전압-초 평형입니다.'
  - q: 'CCM 벅 컨버터가 48 V에서 듀티비 0.25로 동작합니다. 출력 전압은 얼마입니까?'
    options:
      - '36 V'
      - '64 V'
      - '12 V'
      - '16 V'
    answer: 2
    explain: '변환비가 듀티비이므로 0.25 × 48 V = 12 V입니다.'
  - q: '벅의 인덕터 전류가 1.0 A와 1.6 A 사이를 오갑니다. 이 사이트의 규약으로 $\Delta i_L$은 얼마입니까?'
    options:
      - '0.6 A'
      - '0.3 A'
      - '1.3 A'
      - '1.6 A'
    answer: 1
    explain: '피크-피크 리플은 0.6 A이고, $\Delta i_L$은 Erickson과 같이 그 절반인 0.3 A입니다. 평균 전류는 1.3 A입니다.'
  - q: 'CCM 벅의 인덕턴스를 두 배로 하고 나머지는 그대로 둡니다. $\Delta i_L$은 어떻게 됩니까?'
    options:
      - '절반이 됩니다'
      - '두 배가 됩니다'
      - '그대로입니다'
      - '4분의 1이 됩니다'
    answer: 0
    explain: '온 구간 동안 전류의 기울기는 인덕터 전압을 인덕턴스로 나눈 값이므로, 같은 시간 동안 오르는 양이 절반이 됩니다.'
  - q: 'equations.yaml에서 어떤 식의 테스트 하나의 기댓값만 바꾸고 식은 그대로 둡니다. 어떻게 됩니까?'
    options:
      - '사이트를 빌드할 때까지 아무 일도 없습니다'
      - 'TypeScript 테스트만 실패합니다'
      - '생성기가 거부하고, 항목과 테스트, 식이 실제로 주는 값을 밝힙니다'
      - 'mathlint가 손으로 쓴 수식이라고 보고합니다'
    answer: 2
    explain: '카탈로그를 불러올 때 모든 테스트를 식으로 계산해 보므로, 생성기와 pytest는 첫 불일치에서 멈추고 그 위치를 알려 줍니다.'
  - q: '식과 기댓값을 서로 맞도록 함께 바꿉니다. 이것을 여전히 잡아내는 검사는 무엇입니까?'
    options:
      - '없습니다. 테스트는 통과합니다'
      - '유도 테스트: sympy 유도가 equations.yaml의 식을 재현해야 합니다'
      - '개인정보 검사'
      - '링크 검사기'
    answer: 1
    explain: '테스트 값은 식을 그 자신과 비교할 뿐입니다. python/pe_core/derive/의 유도는 YAML과 독립적이고, pytest가 둘을 비교합니다.'
