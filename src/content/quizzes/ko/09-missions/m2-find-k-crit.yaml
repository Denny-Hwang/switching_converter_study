# 09-missions/m2-find-k-crit 퀴즈. 수치는 연습용으로 만든 값입니다.
numbers: synthetic
questions:
  - q: '벅이 $L$ = 50 µH, $f_s$ = 200 kHz, 부하 20 Ω으로 동작합니다. $K$는 얼마입니까?'
    options:
      - '0.5'
      - '1'
      - '2'
      - '0.25'
    answer: 1
    explain: '$K$는 $2L$을 $R T_s$로 나눈 값, 곧 $2 L f_s$를 $R$로 나눈 값입니다. 2 × 50 µH × 200 kHz = 20 Ω이고, 이를 20 Ω으로 나누면 1입니다.'
  - q: '그 벅이 $D$ = 0.75로 동작합니다. CCM입니까?'
    options:
      - '예: $K$ = 1이 $K_\mathrm{crit}$ = 0.25보다 큽니다'
      - '아니요: $K$ = 1이 $K_\mathrm{crit}$ = 1.33보다 작습니다'
      - '출력 커패시터가 클 때만 그렇습니다'
      - '정확히 경계에 있습니다'
    answer: 0
    explain: '벅의 임계값은 $1 - D$ = 0.25이고, CCM이려면 $K > K_\mathrm{crit}$이어야 합니다.'
  - q: 'CCM 벅의 부하가 점점 가벼워집니다. 먼저 일어나는 일은 무엇입니까?'
    options:
      - '인덕터가 포화됩니다'
      - '출력 전압이 떨어집니다'
      - '인덕터 전류가 주기가 끝나기 전에 0에 닿아 DCM에 들어갑니다'
      - '인덕터 전류의 리플이 커집니다'
    answer: 2
    explain: '$R$이 커지면 $K$가 작아집니다. 리플은 부하와 무관하므로 평균 전류가 줄면 전류의 골이 0에 닿고, $K_\mathrm{crit}$ 아래에서는 주기의 일부 동안 0에 머뭅니다.'
  - q: '부스트의 임계값이 가장 큰 듀티비는 어디입니까?'
    options:
      - '$D$ = 1/2'
      - '$D$ = 1/3'
      - '$D$ = 2/3'
      - '$D$ = 1까지 계속 커집니다'
    answer: 1
    explain: '부스트의 임계값 $D(1-D)^2$은 $D$ = 1/3에서 기울기가 0이 되며, 그 값은 4/27입니다. $K$가 4/27보다 큰 부스트는 모든 듀티비에서 CCM에 머뭅니다.'
  - q: '$D$ = 0.5의 벅이 부하가 가벼워지며 DCM에 들어갑니다. $D V_g$와 비교해 출력 전압은 어떻습니까?'
    options:
      - '더 높습니다'
      - '더 낮습니다'
      - '같습니다: 두 모드 모두 변환비가 $D$입니다'
      - '0입니다'
    answer: 0
    explain: 'DCM에서는 변환비가 $K$에도 달려 있어, 부하가 가벼워질수록 $D$에서 1을 향해 올라갑니다.'
  - q: 'DCM에 막 들어간 벅의 스위칭 주파수를 두 배로 합니다. 어떻게 됩니까?'
    options:
      - '아무 일도 없습니다: 경계는 $D$에만 달려 있습니다'
      - '$K$가 두 배가 되어 CCM으로 돌아갈 수 있습니다'
      - '$K$가 절반이 되어 DCM 깊이 들어갑니다'
      - '듀티비가 두 배가 됩니다'
    answer: 1
    explain: '$2 L f_s$를 $R$로 나눈 $K$는 $f_s$와 함께 커집니다. 리플이 줄어 전류의 골이 0에서 떠오릅니다.'
