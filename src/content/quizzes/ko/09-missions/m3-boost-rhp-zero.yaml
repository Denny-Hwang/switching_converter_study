# 09-missions/m3-boost-rhp-zero 퀴즈. 수치는 연습용으로 만든 값입니다.
numbers: synthetic
questions:
  - q: '부스트의 듀티비를 계단처럼 키운 직후 출력 전압은 어떻게 됩니까?'
    options:
      - '곧바로 오릅니다'
      - '잠깐 떨어졌다가 새 값으로 오릅니다'
      - '인덕터가 포화될 때까지 그대로입니다'
      - '스위칭 주파수로 진동합니다'
    answer: 1
    explain: '인덕터 전류가 커지기 전에 다이오드가 주기의 더 짧은 부분 동안만 도통하므로, 출력으로 가는 평균 전류가 먼저 줄어듭니다. 이것이 우반평면 영점의 효과입니다.'
  - q: '$D$ = 0.5, $R$ = 40 Ω, $L$ = 200 µH인 부스트의 RHP 영점, $(1-D)^2 R / L$은 얼마입니까?'
    options:
      - '50 krad/s'
      - '200 krad/s'
      - '100 krad/s'
      - '12.5 krad/s'
    answer: 0
    explain: '0.25 × 40 Ω = 10 Ω이고, 이를 200 µH로 나누면 50 000 rad/s, 약 8 kHz입니다.'
  - q: '그 부스트의 부하 전류가 두 배가 됩니다($R$이 절반). 영점은 어떻게 됩니까?'
    options:
      - '두 배가 됩니다'
      - '절반이 됩니다'
      - '그대로입니다'
      - '좌반평면으로 옮겨 갑니다'
    answer: 1
    explain: '영점은 $R$에 비례합니다. 무거운 부하가 영점을 끌어내리므로 전부하가 가장 나쁜 경우입니다.'
  - q: '출력을 레귤레이션하는 부스트에서 가장 낮은 RHP 영점을 정하는 동작점은 어디입니까?'
    options:
      - '가장 높은 입력 전압에서의 경부하'
      - '가장 낮은 입력 전압에서의 전부하'
      - '가장 낮은 입력 전압에서의 경부하'
      - '가장 높은 입력 전압에서의 전부하'
    answer: 1
    explain: '영점은 $R$이 작을수록(무거운 부하), $D$가 클수록 낮아지며, 레귤레이션하는 부스트는 가장 낮은 입력 전압에서 가장 큰 $D$가 필요합니다.'
  - q: '보상기가 같은 위치의 극점으로 RHP 영점을 상쇄할 수 없는 이유는 무엇입니까?'
    options:
      - '그 극점이 우반평면에 있어야 하므로 불안정합니다'
      - '스위칭 주파수보다 높은 곳에는 극점을 둘 수 없습니다'
      - '영점이 실수가 아닙니다'
      - '극점이 루프를 너무 느리게 만듭니다'
    answer: 0
    explain: '$+\omega_z$의 영점을 상쇄하려면 $+\omega_z$에 극점이 필요하고, 이는 루프 안의 불안정한 극점입니다.'
