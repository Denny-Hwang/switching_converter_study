# 09-missions/m4-buck-inductor 퀴즈. 수치는 연습용으로 만든 값입니다.
numbers: synthetic
questions:
  - q: '허용 자속 밀도 $B_\mathrm{max}$를 두 배로 하고 나머지는 그대로 둡니다. 인덕터에 필요한 $K_g$는 어떻게 됩니까?'
    options:
      - '절반이 됩니다'
      - '4분의 1이 됩니다'
      - '두 배가 됩니다'
      - '그대로입니다'
    answer: 1
    explain: '필요한 $K_g$는 $B_\mathrm{max}$의 제곱에 반비례합니다.'
  - q: '동손을 절반으로 줄이려고 권선의 저항 예산을 절반으로 합니다. 필요한 $K_g$는 어떻게 됩니까?'
    options:
      - '절반이 됩니다'
      - '두 배가 됩니다'
      - '4분의 1이 됩니다'
      - '그대로입니다'
    answer: 1
    explain: '필요한 $K_g$는 허용 저항에 반비례합니다. 저항을 낮추려면 구리가 더 필요하고 창도 더 커야 합니다.'
  - q: '자성 부품 설계 도구가 최소 턴 수를 코어의 가장 작은 단면적 $A_\mathrm{min}$에서 계산하는 이유는 무엇입니까?'
    options:
      - '그곳의 자속 밀도가 가장 높아 코어가 먼저 포화되는 곳이기 때문입니다'
      - '권선이 그곳에 있기 때문입니다'
      - '공극이 그곳에 있기 때문입니다'
      - '데이터시트가 다른 면적을 주지 않기 때문입니다'
    answer: 0
    explain: '같은 자속이 모든 단면을 지나므로, 면적이 가장 작은 곳에서 자속 밀도가 가장 높습니다.'
  - q: '최소 턴 수가 17.2로 나옵니다. 몇 턴을 감습니까?'
    options:
      - '17: 턴이 적을수록 구리가 적습니다'
      - '18: 올림을 해야 자속 밀도가 $B_\mathrm{max}$ 아래에 머뭅니다'
      - '17.2: 한 턴의 일부만 감습니다'
      - '15에서 20 사이 아무 값'
    answer: 1
    explain: '같은 피크 전류에서 턴이 많을수록 자속 밀도가 낮아집니다. 내림을 하면 $B_\mathrm{max}$를 넘을 수 있습니다.'
  - q: '공극 추정은 프린징을 무시합니다. 그 추정과 비교해 실제로 인덕턴스를 주는 공극은 어떻습니까?'
    options:
      - '더 짧습니다'
      - '더 깁니다'
      - '같습니다'
      - '0입니다'
    answer: 1
    explain: '공극 주위에서 자속이 코어 면적 밖으로 퍼지므로, 실제 공극은 추정보다 자속을 더 많이 통과시키고 따라서 더 길어야 합니다.'
  - q: '리플이 작은 CCM 필터 인덕터에서 자속 흔들림 $B_\mathrm{ac}$는 피크 자속 밀도와 비교해 어떻습니까?'
    options:
      - '그 작은 일부입니다'
      - '같습니다'
      - '두 배입니다'
      - '0입니다'
    answer: 0
    explain: '자속은 전류를 따릅니다. 전류의 작은 일부인 리플만 흔들리므로 코어 손실은 작고, 피크는 직류 전류가 정합니다.'
