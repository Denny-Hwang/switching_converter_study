# 09-missions/m5-flyback-clamp 퀴즈. 수치는 연습용으로 만든 값입니다.
numbers: synthetic
questions:
  - q: '$n$ = 0.5(1:0.5)인 플라이백이 전압 강하 0.5 V인 다이오드를 거쳐 12 V를 냅니다. 반사 전압은 얼마입니까?'
    options:
      - '6.25 V'
      - '24 V'
      - '25 V'
      - '12.5 V'
    answer: 2
    explain: '1차 측은 출력 전압에 다이오드 강하를 더한 값을 $n$으로 나눈 전압을 봅니다. 12.5 V를 0.5로 나누면 25 V입니다.'
  - q: '같은 플라이백이 100 V에서 동작합니다. 누설이 없을 때 스위치가 꺼져 있는 동안 막는 전압은 얼마입니까?'
    options:
      - '100 V'
      - '125 V'
      - '75 V'
      - '112 V'
    answer: 1
    explain: '입력 전압에 반사 전압을 더한 값: 100 V + 25 V입니다.'
  - q: '스위치가 켜져 있는 동안 그 출력 다이오드가 막는 전압은 얼마입니까?'
    options:
      - '62 V'
      - '50 V'
      - '12 V'
      - '112 V'
    answer: 0
    explain: '2차 측에는 입력의 $n$배인 50 V가 걸리고, 이것이 12 V 출력과 직렬이므로 62 V입니다.'
  - q: 'RCD 클램프의 저항을 크게 하면 어떻게 됩니까?'
    options:
      - '클램프 전압이 오르고 클램프 손실이 줄어듭니다'
      - '클램프 전압이 내리고 클램프 손실이 줄어듭니다'
      - '클램프 전압이 오르고 클램프 손실이 늘어납니다'
      - '아무 일도 없습니다: 커패시터가 클램프 전압을 정합니다'
    answer: 0
    explain: '클램프 전압은 저항이 클램프가 흡수한 전력을 소산하는 곳에서 자리 잡습니다. 저항이 크면 더 높은 전압이 필요하고, 반사 전압보다 더 높은 클램프 전압은 흡수하는 에너지가 적습니다.'
  - q: '클램프 전압이 반사 전압보다 높아야 하는 이유는 무엇입니까?'
    options:
      - '그렇지 않으면 스위치가 꺼지지 않습니다'
      - '그렇지 않으면 출력 다이오드가 도통할 때마다 클램프도 도통해 출력으로 갈 에너지를 가져갑니다'
      - '그렇지 않으면 출력 다이오드가 항복합니다'
      - '그럴 필요가 없습니다: 어떤 클램프 전압도 동작합니다'
    answer: 1
    explain: '출력 다이오드가 도통하는 동안 1차 측은 반사 전압에 있습니다. 그보다 낮은 클램프는 변압기의 출력 경로와 병렬로 도통합니다.'
  - q: 'RCD 클램프를 쓰는 플라이백의 부하가 끊깁니다. 클램프 전압은 어떻게 됩니까?'
    options:
      - '그대로입니다'
      - '반사 전압으로 떨어집니다'
      - '저항이 입력 전력 전부를 소산해야 하므로 설계값보다 훨씬 높이 올라갑니다'
      - '0으로 떨어집니다'
    answer: 2
    explain: '부하가 없으면 컨버터가 받아들인 에너지가 모두 클램프로 갑니다. RCD 클램프의 전압은 저항이 이를 소산할 때까지 오르고, 출력과 스위치 전압도 함께 오릅니다.'
