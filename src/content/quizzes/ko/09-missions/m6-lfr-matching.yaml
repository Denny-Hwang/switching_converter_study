# 09-missions/m6-lfr-matching 퀴즈. 수치는 연습용으로 만든 값입니다.
numbers: synthetic
questions:
  - q: '100 Ω 뒤의 20 V 선형 전원이 줄 수 있는 최대 전력은 얼마입니까?'
    options:
      - '4 W'
      - '1 W'
      - '2 W'
      - '0.2 W'
    answer: 1
    explain: '자신의 저항과 같은 부하에 줄 때입니다: 100 Ω에 10 V, 0.1 A, 1 W. 곧 $V_\mathrm{oc}^2$을 $4 R_s$로 나눈 값입니다.'
  - q: '듀티비를 고정한 DCM 플라이백이 $L_M$ = 1 mH, $f_s$ = 50 kHz, $D$ = 0.5입니다. 입력 저항, 곧 $2 L_M f_s$를 $D^2$으로 나눈 값은 얼마입니까?'
    options:
      - '100 Ω'
      - '200 Ω'
      - '400 Ω'
      - '800 Ω'
    answer: 2
    explain: '2 × 1 mH × 50 kHz = 100 Ω이고, 이를 0.25로 나누면 400 Ω입니다.'
  - q: '그 플라이백의 듀티비가 두 배가 됩니다. 입력 저항은 어떻게 됩니까?'
    options:
      - '절반이 됩니다'
      - '4분의 1이 됩니다'
      - '두 배가 됩니다'
      - '그대로입니다'
    answer: 1
    explain: '입력 저항은 듀티비의 제곱에 반비례합니다.'
  - q: '플라이백의 입력 저항이 전원의 저항과 같습니다. 버스 전압은 얼마입니까?'
    options:
      - '개방 전압'
      - '개방 전압의 절반'
      - '개방 전압의 두 배'
      - '임계 전압'
    answer: 1
    explain: '같은 두 저항이 전원 전압을 반으로 나누고, 이때 전원은 최대 전력을 줍니다.'
  - q: '전원이 강해져 버스가 플라이백의 임계 전압을 넘으려 합니다. 어떻게 됩니까?'
    options:
      - '플라이백은 계속 저항으로 동작합니다'
      - '플라이백이 CCM에 들어가 버스를 임계 전압에 붙잡습니다: 정전압 싱크가 됩니다'
      - '스위치가 꺼집니다'
      - '입력 저항이 두 배가 됩니다'
    answer: 1
    explain: 'CCM에서는 이 듀티비에서 변환비가 입력을 고정된 출력에 묶으므로 버스가 임계 전압에 머뭅니다. 그러면 전력의 비율이 전원 진폭에 따라 달라집니다.'
  - q: '무손실 저항이 어떤 전원 진폭에서도 가용 전력의 같은 비율을 가져가는 이유는 무엇입니까?'
    options:
      - '저항이기 때문입니다: 분압비가 진폭과 무관합니다'
      - '듀티비가 진폭을 따라가기 때문입니다'
      - '스위치 전압이 일정하기 때문입니다'
      - '그렇지 않습니다: 비율은 진폭과 함께 커집니다'
    answer: 0
    explain: '저항과 전원 저항은 전압을 일정한 비율로 나누므로, 받는 전력과 가용 전력이 모두 진폭의 제곱에 비례해 함께 변합니다.'
