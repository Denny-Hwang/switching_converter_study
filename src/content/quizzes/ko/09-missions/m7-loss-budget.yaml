# 09-missions/m7-loss-budget 퀴즈. 수치는 연습용으로 만든 값입니다.
numbers: synthetic
questions:
  - q: '컨버터의 부하 전류가 절반이 됩니다. 고정된 저항의 도통 손실은 어떻게 됩니까?'
    options:
      - '절반이 됩니다'
      - '대략 4분의 1이 됩니다'
      - '그대로입니다'
      - '두 배가 됩니다'
    answer: 1
    explain: '도통 손실은 rms 전류의 제곱에 저항을 곱한 값입니다. 전류가 절반이면 손실은 4분의 1입니다(리플은 부하와 함께 줄지 않으므로 조금 더 큽니다).'
  - q: '부하가 10분의 1로 줄어도 그대로인 손실은 무엇입니까?'
    options:
      - '도통 손실'
      - '다이오드 순방향 강하 손실'
      - '게이트 구동 손실과, CCM에서의 턴온 용량성 손실'
      - '없습니다'
    answer: 2
    explain: '게이트 구동 손실은 게이트 전하, 구동 전압, $f_s$로 정해지고, 용량성 손실은 노드 커패시턴스, 턴온 때의 전압, $f_s$로 정해집니다. 둘 다 부하 전류를 따르지 않으므로 경부하에서 지배적입니다.'
  - q: '게이트 전하 20 nC를 12 V로 250 kHz에서 구동합니다. 게이트 구동 손실은 얼마입니까?'
    options:
      - '60 mW'
      - '6 mW'
      - '0.24 mW'
      - '600 mW'
    answer: 0
    explain: '20 nC × 12 V = 주기당 240 nJ이고, 여기에 250 kHz를 곱하면 60 mW입니다. 이 전력은 드라이버와 게이트 저항에서 소산됩니다.'
  - q: '스위칭 주파수가 두 배가 됩니다. 함께 두 배가 되는 손실은 무엇입니까?'
    options:
      - '도통 손실'
      - '게이트 구동 손실과 턴온 용량성 손실'
      - '코어 손실만'
      - '모든 손실'
    answer: 1
    explain: '둘 다 주기마다 한 번 잃는 에너지에 초당 주기 수를 곱한 값입니다. 코어 손실은 주파수와 리플에 따라 줄어드는 자속 흔들림에 달려 있고, 도통 손실은 전류를 따릅니다.'
  - q: '측정 시스템의 대역폭이 100 MHz입니다. 이상적인 계단에 대해 대략 어떤 상승 시간을 보여 줍니까?'
    options:
      - '35 ns'
      - '3.5 ns'
      - '0.35 ns'
      - '10 ns'
    answer: 1
    explain: '단일 극점 응답에서 상승 시간은 대략 0.35를 대역폭으로 나눈 값, 곧 3.5 ns입니다. 이보다 훨씬 빠른 에지는 시스템 자신의 상승 시간으로 보입니다.'
  - q: '전환이 이상적인 시뮬레이션으로 만든 손실 예산이 하드 스위칭 컨버터에 대해 지나치게 낙관적일 수 있는 이유는 무엇입니까?'
    options:
      - '각 전환 동안 전압과 전류가 겹치는 손실을 무시하기 때문입니다'
      - '도통 손실을 무시하기 때문입니다'
      - '게이트 구동을 두 번 세기 때문입니다'
      - '그렇지 않습니다: 시뮬레이션은 언제나 손실을 과대평가합니다'
    answer: 0
    explain: '전환이 순간적이면 스위치가 전압을 막는 동안 전류를 흘리는 일이 없으므로, 겹침 손실이 빠지고 이를 따로 추정하거나 측정해야 합니다.'
