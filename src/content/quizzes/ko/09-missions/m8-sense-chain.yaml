# 09-missions/m8-sense-chain 퀴즈. 수치는 연습용으로 만든 값입니다.
numbers: synthetic
questions:
  - q: '5 mΩ 션트에 4 A가 흐릅니다. 센스 전압, 곧 부담 전압은 얼마입니까?'
    options:
      - '20 mV'
      - '2 mV'
      - '200 mV'
      - '0.8 mV'
    answer: 0
    explain: '옴의 법칙으로 4 A × 5 mΩ = 20 mV이고, 측정 대상 회로는 이만큼을 션트 양단에서 잃습니다.'
  - q: '오프셋이 50 µV인 증폭기가 그 션트를 읽습니다. 오프셋은 얼마의 전류로 보입니까?'
    options:
      - '1 mA'
      - '10 mA'
      - '0.25 mA'
      - '100 mA'
    answer: 1
    explain: '오프셋을 션트로 나눈 값: 50 µV / 5 mΩ = 10 mA이며, 모든 전류에서 같습니다.'
  - q: '패드가 그 션트에 0.5 mΩ을 더하고, 센싱은 패드 바깥에서 합니다. 읽은 값은 몇 퍼센트 크게 나옵니까?'
    options:
      - '1 %'
      - '10 %'
      - '5 %'
      - '0.5 %'
    answer: 1
    explain: '증폭기는 션트와 패드를 함께 지나는 전류를 봅니다. 0.5를 5로 나누면 10분의 1이고, 이는 모든 전류에서 같습니다.'
  - q: '패드 오차를 없애는 것은 무엇입니까?'
    options:
      - '더 큰 이득'
      - '켈빈 연결: 센스 배선이 부하 전류의 패드가 아니라 션트 자신의 단자에서 만납니다'
      - '더 낮은 샘플링 속도'
      - '더 큰 필터 커패시터'
    answer: 1
    explain: '4단자 션트나, 2단자 션트를 위한 4패드 배치에서는 패드가 부하 전류를 흘리지만 센스 경로에는 들어 있지 않습니다.'
  - q: '션트를 열 배로 키우면 오프셋 등가 전류가 10분의 1이 됩니다. 그 대가는 무엇입니까?'
    options:
      - '없습니다'
      - '같은 전류에서 부담 전압과 손실이 열 배가 됩니다'
      - '대역폭이 10분의 1이 됩니다'
      - '오프셋이 커집니다'
    answer: 1
    explain: '센스 전압과 션트의 손실이 모두 저항에 따라 커집니다. 출력도 잘릴 수 있으므로 이득을 낮춰야 합니다.'
  - q: '전류 출력형 증폭기의 출력이 풀스케일 전류에서 4.5 V가 되는데, 5 V 전원에서 출력은 전원보다 약 1 V 아래까지만 올라갑니다. 어떻게 됩니까?'
    options:
      - '아무 일도 없습니다: 이득이 출력을 정합니다'
      - '풀스케일 전류 전에 출력이 잘립니다: 이득을 낮춥니다'
      - '오프셋이 두 배가 됩니다'
      - '션트가 과열됩니다'
    answer: 1
    explain: '이득과 상관없이 출력은 헤드룸을 넘을 수 없으므로, 이득을 낮추지 않으면 범위의 윗부분을 잃습니다.'
