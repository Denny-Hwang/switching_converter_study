# 09-missions/m9-write-a-gotcha 퀴즈. 수치는 연습용으로 만든 값입니다.
numbers: synthetic
questions:
  - q: '주의할 점 페이지의 수치는 어디서 와야 합니까?'
    options:
      - '실수가 일어난 프로젝트에서, 반올림해서'
      - '<Val>로 표시한 예제에서, 또는 같은 줄에 인용한 출처에서'
      - '기억에서'
      - '아무 웹 페이지에서'
    answer: 1
    explain: '개인정보 규칙은 출처가 있는 교과서·데이터시트 수치와 예제 값만 허용합니다. 실제 프로젝트의 수치는 반올림해도 안 됩니다.'
  - q: '독자가 보고 있는 것이 바로 이 주의할 점인지 확신하게 해 주는 섹션은 무엇입니까?'
    options:
      - '증상'
      - '원인'
      - '확인 방법'
      - '참고 자료'
    answer: 2
    explain: '같은 증상에도 원인이 여럿일 수 있습니다. 확인 방법은 이 원인을 다른 것과 구별하는 측정이나 점검을 줍니다.'
  - q: '새 참고 문헌에 아직 VERIFY 표시가 있습니다. 페이지에서 인용할 수 있습니까?'
    options:
      - '예, 제목이 맞아 보이면'
      - '아니요: DOI나 URL을 열어 확인하고 표시를 지우기 전까지 refcheck가 실패합니다'
      - '예, 한국어 페이지에서만'
      - '각주에서만'
    answer: 1
    explain: '검증되지 않은 항목은 공개 페이지에서 인용할 수 없습니다. 아무도 확인하지 않은 것을 가리키는 인용이 없도록 하기 위해서입니다.'
  - q: '한국어 페이지를 아직 쓰지 않았습니다. 사이트에는 무엇이 필요합니까?'
    options:
      - '아무것도 필요 없습니다'
      - '한국어 페이지를 보류로 표시한 docs/STATUS.md의 행'
      - '기계 번역'
      - '영어 페이지를 08-gotchas 밖으로 옮기기'
    answer: 1
    explain: 'modulelint는 STATUS가 한국어 페이지를 보류로 표시할 때만 한국어 짝이 없는 영어 페이지를 받아들입니다.'
  - q: '원인보다 증상을 먼저 쓰는 이유는 무엇입니까?'
    options:
      - '템플릿이 섹션을 알파벳 순으로 정렬하기 때문입니다'
      - '이 페이지가 필요한 독자는 아직 원인은 모르고 보이는 것만 알기 때문입니다'
      - '원인은 쓰기 어렵기 때문입니다'
      - '상관없습니다'
    answer: 1
    explain: '주의할 점은 증상으로 찾습니다. 원인을 염두에 두고 쓰면 다음 사람이 벤치에서 보는 모습과 맞지 않습니다.'
