# 00-foundations/fourier 的测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个脉冲序列以 $D = 0.3$ 在 $0$ 和 $10\,\mathrm{V}$ 之间切换。其直流分量是多少？'
    options:
      - '$0.3\,\mathrm{V}$'
      - '$3\,\mathrm{V}$'
      - '$5\,\mathrm{V}$'
      - '$7\,\mathrm{V}$'
    answer: 1
    explain: '直流分量就是平均值：脉冲高度乘以脉冲持续时间占周期的比例。'
  - q: '在 $D = 0.25$ 时，在 $0$ 和 $10\,\mathrm{V}$ 之间切换的脉冲序列的有效值是多少？'
    options:
      - '$2.5\,\mathrm{V}$'
      - '$5\,\mathrm{V}$'
      - '$7.07\,\mathrm{V}$'
      - '$10\,\mathrm{V}$'
    answer: 1
    explain: '平方的平均值为 $0.25 \times 100\,\mathrm{V^2}$，其平方根为 $5\,\mathrm{V}$，是平均值的两倍。'
  - q: '在 $D = 0.5$ 时，矩形脉冲序列缺少哪些谐波？'
    options:
      - '不缺少任何谐波'
      - '奇次谐波'
      - '偶次谐波'
      - '三次以上的所有谐波'
    answer: 2
    explain: '当 $h D$ 为整数时该次谐波为零；在 $D = 0.5$ 时，每个偶数 $h$ 都是如此。'
  - q: '除零点外，矩形脉冲序列的谐波幅值如何随谐波次数 $h$ 减小？'
    options:
      - '按 $1/h$ 减小'
      - '按 $1/h^2$ 减小'
      - '按指数规律减小'
      - '不减小'
    answer: 0
    explain: '幅值为 $2 V_\mathrm{pk} |\sin(\pi h D)|/(\pi h)$：其包络按 $1/h$ 减小。'
  - q: '在 $D = 0.5$ 时，在 $0$ 和 $12\,\mathrm{V}$ 之间切换的脉冲序列，其基波幅值是多少？'
    options:
      - '$6\,\mathrm{V}$'
      - '$7.64\,\mathrm{V}$'
      - '$12\,\mathrm{V}$'
      - '$3.82\,\mathrm{V}$'
    answer: 1
    explain: '当 $h = 1$、$D = 0.5$ 时，正弦项为 1，因此幅值为 $2 \times 12/\pi$。'
  - q: '为什么降压变换器的输出等于其开关节点电压的平均值？'
    options:
      - 'L-C 滤波器让直流分量通过，并大幅衰减各次谐波，其中最低次谐波位于开关频率处'
      - '开关节点电压没有谐波'
      - '二极管滤除了谐波'
      - '负载电阻对电压取平均'
    answer: 0
    explain: '输出保留直流分量和少量残余谐波，即纹波。'
