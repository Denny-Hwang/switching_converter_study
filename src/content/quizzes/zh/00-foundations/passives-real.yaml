# 00-foundations/passives-real 的测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '电阻为 $50\,\mathrm{m}\Omega$ 的绕组中流过有效值为 $3\,\mathrm{A}$ 的电流。其导通损耗是多少？'
    options:
      - '$0.15\,\mathrm{W}$'
      - '$0.3\,\mathrm{W}$'
      - '$0.45\,\mathrm{W}$'
      - '$1.5\,\mathrm{W}$'
    answer: 2
    explain: '损耗等于电流有效值的平方乘以电阻：$9 \times 0.05$。'
  - q: '$1\,\mathrm{mH}$ 电感具有 $10\,\mathrm{pF}$ 的寄生电容。其自谐振频率是多少？'
    options:
      - '$159\,\mathrm{kHz}$'
      - '$1.59\,\mathrm{MHz}$'
      - '$15.9\,\mathrm{MHz}$'
      - '$50\,\mathrm{kHz}$'
    answer: 1
    explain: '电感量与电容量之积为 $10^{-14}\,\mathrm{s^2}$；其平方根为 $0.1\,\mu\mathrm{s}$，而 $1/(2\pi \times 0.1\,\mu\mathrm{s})$ 约为 $1.59\,\mathrm{MHz}$。'
  - q: '高于自谐振频率时，电感表现如何？'
    options:
      - '像更大的电感'
      - '像电容'
      - '在任何频率下都像短路'
      - '像纯电阻'
    answer: 1
    explain: '高于谐振频率时，并联电容的导纳大于电感的导纳，因此阻抗呈容性。'
  - q: '降压变换器的输出电容具有 $20\,\mathrm{m}\Omega$ 的串联电阻，流过峰峰值为 $1\,\mathrm{A}$ 的纹波电流。串联电阻增加多大的纹波？'
    options:
      - '峰峰值 $2\,\mathrm{mV}$'
      - '峰峰值 $10\,\mathrm{mV}$'
      - '峰峰值 $20\,\mathrm{mV}$'
      - '峰峰值 $40\,\mathrm{mV}$'
    answer: 2
    explain: '电阻两端的电压跟随其电流变化，因此其峰峰值等于电阻乘以电流峰峰值。'
  - q: '两个电流的平均值相同：一个是恒定电流，另一个是 $D = 0.25$ 的脉冲序列。它们在同一电阻中的损耗相比如何？'
    options:
      - '相同'
      - '脉冲序列的损耗是两倍'
      - '脉冲序列的损耗是四倍'
      - '恒定电流的损耗更大'
    answer: 2
    explain: '平均值相同时，脉冲的高度是平均值的四倍，因此其有效值是平均值的两倍，而与有效值平方成正比的损耗是四倍。'
  - q: '如何用阻抗分析仪找出电感的自谐振频率？'
    options:
      - '在阻抗模最小处'
      - '在阻抗相位过零处'
      - '在电感读数最大处'
      - '在分析仪的默认测试频率处'
    answer: 1
    explain: '在并联谐振点，阻抗为实数，因此阻抗由感性变为容性时，其相位经过零。'
