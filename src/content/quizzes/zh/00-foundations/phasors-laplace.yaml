# 00-foundations/phasors-laplace 的测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '$10\,\mu\mathrm{H}$ 电感在 $1\,\mathrm{MHz}$ 下的阻抗模是多少？'
    options:
      - '$6.28\,\Omega$'
      - '$62.8\,\Omega$'
      - '$628\,\Omega$'
      - '$0.0159\,\Omega$'
    answer: 1
    explain: '阻抗模为 $2\pi f L$：$2\pi \times 10^6 \times 10^{-5}$。'
  - q: '频率加倍。电容的阻抗模如何变化？'
    options:
      - '加倍'
      - '减半'
      - '不变'
      - '降为四分之一'
    answer: 1
    explain: '电容的阻抗模与频率成反比。'
  - q: 'R-C 低通滤波器由 $10\,\mathrm{k}\Omega$ 电阻和 $1\,\mathrm{nF}$ 电容组成。其转折频率是多少？'
    options:
      - '$1.59\,\mathrm{kHz}$'
      - '$15.9\,\mathrm{kHz}$'
      - '$159\,\mathrm{kHz}$'
      - '$100\,\mathrm{kHz}$'
    answer: 1
    explain: '转折频率为 $1/(2\pi R C)$，其中 $R C$ 等于 $10\,\mu\mathrm{s}$。'
  - q: '一阶低通滤波器在其转折频率处的增益是多少？'
    options:
      - '1'
      - '$1/\sqrt{2}$，约 -3 dB'
      - '1/2，约 -6 dB'
      - '0'
    answer: 1
    explain: '在转折频率处，分母的实部与虚部相等，因此模为 $1/\sqrt{2}$。'
  - q: '对于比转折频率高一个十倍频程的正弦波，一阶低通滤波器大约使其衰减多少？'
    options:
      - '衰减 2 倍'
      - '衰减约 10 倍（-20 dB）'
      - '衰减 100 倍（-40 dB）'
      - '完全不衰减'
    answer: 1
    explain: '增益为 $1/\sqrt{1 + 100}$，约为 $0.0995$：斜率为每十倍频程 -20 dB。'
  - q: '为什么降压变换器的 L-C 滤波器能让开关节点电压的直流分量通过，却不让开关纹波通过？'
    options:
      - '电感的阻抗在直流下为零、在开关频率下很大，而电容的阻抗恰好相反'
      - '电容隔断直流'
      - '电感在任何频率下都是短路'
      - '开关节点电压没有谐波'
    answer: 0
    explain: '在直流下，电感相当于短路，电容相当于开路；在开关频率下，电感的阻抗大而电容的阻抗小，因此纹波被分压衰减。'
