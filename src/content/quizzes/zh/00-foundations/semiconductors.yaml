# 00-foundations/semiconductors 的测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '开关频率为 $200\,\mathrm{kHz}$，晶体管每次开通时都使开关节点上的 $100\,\mathrm{pF}$ 电容从 $48\,\mathrm{V}$ 放电。容性开通损耗是多少？'
    options:
      - '$11.5\,\mathrm{mW}$'
      - '$23\,\mathrm{mW}$'
      - '$46\,\mathrm{mW}$'
      - '$2.3\,\mathrm{mW}$'
    answer: 1
    explain: '储存的能量等于电容量的一半乘以电压的平方，约为 $115\,\mathrm{nJ}$，每秒损失 $2 \times 10^5$ 次。'
  - q: '总栅极电荷为 $30\,\mathrm{nC}$ 的 MOSFET 在 $100\,\mathrm{kHz}$ 下以 $12\,\mathrm{V}$ 驱动。栅极驱动功率是多少？'
    options:
      - '$3.6\,\mathrm{mW}$'
      - '$18\,\mathrm{mW}$'
      - '$36\,\mathrm{mW}$'
      - '$360\,\mathrm{mW}$'
    answer: 2
    explain: '栅极电荷乘以驱动电压即每个周期的能量 $360\,\mathrm{nJ}$，每秒消耗 $10^5$ 次。'
  - q: '开关频率加倍。容性开通损耗和栅极驱动功率如何变化？'
    options:
      - '二者都加倍'
      - '二者都不变'
      - '前者加倍，后者不变'
      - '二者都变为四倍'
    answer: 0
    explain: '二者都是每个周期损失一次的固定能量，因此都与开关频率成正比。'
  - q: '栅极驱动功率耗散在哪里？'
    options:
      - '在 MOSFET 的沟道中'
      - '在驱动器和栅极电阻中'
      - '在负载中'
      - '不耗散：栅极电荷被回收'
    answer: 1
    explain: '栅极电荷流入和流出时都经过驱动器和栅极电阻，它们把这部分能量转化为热。'
  - q: '正向压降为 $0.5\,\mathrm{V}$、斜率电阻为 $20\,\mathrm{m}\Omega$ 的二极管中流过平均值为 $2\,\mathrm{A}$、有效值为 $2.5\,\mathrm{A}$ 的电流。其导通损耗是多少？'
    options:
      - '$1\,\mathrm{W}$'
      - '$1.125\,\mathrm{W}$'
      - '$1.25\,\mathrm{W}$'
      - '$0.125\,\mathrm{W}$'
    answer: 1
    explain: '正向压降乘以平均电流得 $1\,\mathrm{W}$，斜率电阻乘以电流有效值的平方，另外贡献 $0.125\,\mathrm{W}$。'
  - q: '为什么低压变换器常用同步整流管代替输出二极管？'
    options:
      - '二极管无法阻断低电压'
      - '二极管的固定正向压降在低输出电压中占比很大，因而严重降低效率'
      - '同步整流管不需要栅极驱动'
      - '二极管在任何电压下开关都太慢'
    answer: 1
    explain: '无论负载如何，正向压降都从输出通路中占去一个固定电压；导通的晶体管上的压降只是导通电阻乘以电流。'
