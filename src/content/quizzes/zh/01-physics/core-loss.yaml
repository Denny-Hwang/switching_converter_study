# 01-physics/core-loss 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '磁芯损耗由哪两种机理构成？'
    options:
      - '磁滞与涡流'
      - '绕组电阻与集肤效应'
      - '漏感与边缘磁通'
      - '饱和与边缘磁通'
    answer: 0
    explain: '磁滞使 B-H 回线所包围的能量在每个周期中损耗掉；涡流在磁芯材料的电阻上耗散功率。'
  - q: '频率不变，磁芯中的磁通幅值减半。若 Steinmetz 指数 $\beta = 2.5$，磁芯损耗大约降为原来的几分之一？'
    options:
      - '2'
      - '2.5'
      - '5.7'
      - '32'
    answer: 2
    explain: '损耗与幅值的 $\beta$ 次方成正比，因此降为原来的 $2^{2.5}$ 分之一，约 5.7 分之一。'
  - q: '某变压器的磁通密度摆幅为 $0.2\,\mathrm{T}$（峰峰值）。代入 Steinmetz 公式的 $B_\mathrm{ac}$ 应取哪个值？'
    options:
      - '$0.05\,\mathrm{T}$'
      - '$0.1\,\mathrm{T}$'
      - '$0.2\,\mathrm{T}$'
      - '$0.4\,\mathrm{T}$'
    answer: 1
    explain: '$B_\mathrm{ac}$ 是交流峰值，即峰峰值摆幅的一半。'
  - q: '对于变换器中的矩形波形，为什么 Steinmetz 公式只能给出估计值？'
    options:
      - '其系数是在有限范围内按正弦激励拟合的'
      - '它忽略了频率'
      - '它只适用于空心电感'
      - '它给出的是绕组损耗而不是磁芯损耗'
    answer: 0
    explain: '这些系数来自正弦磁通下的测量；其他波形以及超出拟合范围的条件都会改变损耗。'
  - q: '在较高的开关频率下，限制变压器磁通摆幅的通常是什么？'
    options:
      - '饱和'
      - '磁芯损耗'
      - '绕组电容'
      - '没有限制'
    answer: 1
    explain: '使磁芯损耗保持在可接受范围内的摆幅，通常远低于饱和磁通密度。'
  - q: '某磁芯材料在工作点的损耗为 $10^5\,\mathrm{W/m^3}$。体积为 $2\,\mathrm{cm^3}$ 的磁芯损耗是多少？'
    options:
      - '$0.02\,\mathrm{W}$'
      - '$0.2\,\mathrm{W}$'
      - '$2\,\mathrm{W}$'
      - '$20\,\mathrm{W}$'
    answer: 1
    explain: '体积为 $2 \times 10^{-6}\,\mathrm{m^3}$，单位体积损耗乘以体积得 $0.2\,\mathrm{W}$。'
