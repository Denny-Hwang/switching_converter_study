# 01-physics/faraday-inductors 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '有效磁路长度为 $0.05\,\mathrm{m}$ 的无气隙磁芯上绕有 20 匝绕组，绕组电流为 $1\,\mathrm{A}$。磁芯中的磁场强度是多少？'
    options:
      - '$20\,\mathrm{A/m}$'
      - '$400\,\mathrm{A/m}$'
      - '$1000\,\mathrm{A/m}$'
      - '$4000\,\mathrm{A/m}$'
    answer: 1
    explain: '所包围的电流为 $20\,\mathrm{A}$ 匝，分布在 $0.05\,\mathrm{m}$ 长的磁路上。'
  - q: '有效截面积为 $1\,\mathrm{cm^2}$ 的磁芯上绕有 24 匝绕组，对其施加 $12\,\mathrm{V}$ 的恒定电压，持续 $10\,\mu\mathrm{s}$。磁通密度摆幅是多少？'
    options:
      - '$0.005\,\mathrm{T}$'
      - '$0.05\,\mathrm{T}$'
      - '$0.5\,\mathrm{T}$'
      - '$5\,\mathrm{T}$'
    answer: 1
    explain: '伏秒积 $120\,\mu\mathrm{Vs}$ 除以匝数与截面积之积 $24 \times 10^{-4}\,\mathrm{m^2}$。'
  - q: '占空比和电压不变，将变换器的开关频率加倍。其变压器中的磁通摆幅如何变化？'
    options:
      - '加倍'
      - '减半'
      - '不变'
      - '降为四分之一'
    answer: 1
    explain: '导通时间减半，因此每个周期的伏秒积减半，磁通摆幅也随之减半。'
  - q: '在没有直流励磁电流的变压器中，磁通摆幅由什么决定？'
    options:
      - '负载电流'
      - '施加在绕组上的伏秒积、该绕组的匝数和磁芯截面积'
      - '仅磁芯的磁导率'
      - '二次电流'
    answer: 1
    explain: '法拉第定律把磁通的变化率与绕组电压联系在一起，与负载无关。'
  - q: '在给定磁芯上将匝数加倍，绕组电流保持不变。磁场强度如何变化？'
    options:
      - '减半'
      - '不变'
      - '加倍'
      - '变为四倍'
    answer: 2
    explain: '所包围的电流，即匝数与绕组电流之积，加倍，而磁路长度不变。'
  - q: '为什么稳态下变压器绕组两端的平均电压必须为零？'
    options:
      - '为了保持输出电压恒定'
      - '任何净伏秒积都会使磁通每个周期增大，直到磁芯饱和'
      - '为了避免绕组损耗'
      - '因为二次侧是隔离的'
    answer: 1
    explain: '每个周期的磁通变化量与净伏秒积成正比；只有净伏秒积为零，磁通才能回到起始值。'
