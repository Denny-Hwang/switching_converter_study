# 01-physics/ferrites-bh 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '在相对磁导率为 1000 的线性材料中，磁场强度为 $200\,\mathrm{A/m}$。磁通密度是多少？'
    options:
      - '$0.025\,\mathrm{T}$'
      - '$0.25\,\mathrm{T}$'
      - '$2.5\,\mathrm{T}$'
      - '$0.0025\,\mathrm{T}$'
    answer: 1
    explain: '磁通密度为 $\mu_0 \mu_r H$：$4\pi \times 10^{-7} \times 1000 \times 200$，约为 $0.25\,\mathrm{T}$。'
  - q: '一个 $50\,\mu\mathrm{H}$ 的电感在有效截面积为 $0.5\,\mathrm{cm^2}$ 的磁芯上绕有 10 匝，峰值电流为 $4\,\mathrm{A}$。其峰值磁通密度是多少？'
    options:
      - '$0.04\,\mathrm{T}$'
      - '$0.2\,\mathrm{T}$'
      - '$0.4\,\mathrm{T}$'
      - '$4\,\mathrm{T}$'
    answer: 2
    explain: '磁链为 $200\,\mu\mathrm{Wb}$ 匝；除以 10 匝和 $5 \times 10^{-5}\,\mathrm{m^2}$，得到 $0.4\,\mathrm{T}$。'
  - q: '磁芯饱和时，电感的电感量如何变化？'
    options:
      - '急剧上升'
      - '急剧下降'
      - '不变'
      - '变为负值'
    answer: 1
    explain: '超过饱和点后，磁导率急剧下降并趋近真空磁导率，电感量也随之急剧下降。'
  - q: '为什么必须在峰值电流而不是平均电流下校核电感的磁通密度？'
    options:
      - '因为饱和取决于瞬时磁通密度，而瞬时磁通密度在峰值电流时最大'
      - '因为平均电流总是为零'
      - '因为磁芯损耗只取决于峰值'
      - '不必如此：按平均电流校核就够了'
    answer: 0
    explain: '只要磁通密度超过限值，即使每个周期只超过一瞬间，磁芯也会饱和。'
  - q: '铁氧体磁芯的饱和磁通密度较低，为什么仍用于较高的开关频率？'
    options:
      - '其电阻率高，涡流损耗小'
      - '它们永远不会饱和'
      - '它们没有磁滞'
      - '它们总是最便宜的选择'
    answer: 0
    explain: '涡流由变化的磁通感应产生；高电阻率可以限制涡流，频率越高，这一点越重要。'
  - q: '把一个电感改绕在绕线窗口（winding window）更大的磁芯上：电感量相同，峰值电流相同，匝数加倍。若磁芯截面积不变，峰值磁通密度如何变化？'
    options:
      - '加倍'
      - '减半'
      - '不变'
      - '变为四倍'
    answer: 1
    explain: '电感量和电流一定时，峰值磁通密度与匝数成反比。'
