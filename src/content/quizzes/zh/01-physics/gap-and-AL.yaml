# 01-physics/gap-and-AL 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '某磁芯每匝平方的电感为 $A_L = 250\,\mathrm{nH}$。要得到 $100\,\mu\mathrm{H}$，需要绕多少匝？'
    options:
      - '4'
      - '20'
      - '40'
      - '400'
    answer: 1
    explain: '匝数的平方等于电感量除以 $A_L$，即 400；其平方根为 20。'
  - q: '在给定磁芯上将匝数加倍。电感量如何变化？'
    options:
      - '加倍'
      - '变为四倍'
      - '不变'
      - '减半'
    answer: 1
    explain: '电感量等于 $A_L$ 乘以匝数的平方。'
  - q: '为什么气隙使电感量几乎与磁芯材料无关？'
    options:
      - '气隙磁阻在总磁阻中占主导，而它只取决于气隙长度和截面积'
      - '气隙提高了材料的磁导率'
      - '气隙消除了磁滞'
      - '气隙缩短了磁路'
    answer: 0
    explain: '由于相对磁导率很大，即使与很短的气隙的磁阻相比，磁芯磁阻也很小。'
  - q: '与简单公式相比，气隙周围的边缘磁通如何改变实际的 $A_L$？'
    options:
      - '使其变小'
      - '使其变大'
      - '没有影响'
      - '使其随电流变化'
    answer: 1
    explain: '边缘磁通增大了气隙的有效截面积，降低了气隙磁阻，从而提高了 $A_L$。'
  - q: '某磁芯的有效截面积为 $1\,\mathrm{cm^2}$，总气隙长度为 $1\,\mathrm{mm}$，磁芯本身的磁阻可以忽略。忽略边缘磁通时，$A_L$ 是多少？'
    options:
      - '$12.6\,\mathrm{nH}$'
      - '$126\,\mathrm{nH}$'
      - '$1.26\,\mu\mathrm{H}$'
      - '$12.6\,\mu\mathrm{H}$'
    answer: 1
    explain: '$\mu_0$ 乘以截面积再除以气隙长度：$4\pi \times 10^{-7} \times 10^{-4}/10^{-3}$。'
  - q: '在电感量和电流都相同时，带气隙磁芯与同样尺寸的无气隙磁芯相比如何？'
    options:
      - '它达到的磁通密度更低，因为获得相同的电感量需要更多匝数'
      - '它达到的磁通密度更高'
      - '它在更高的磁通密度下才饱和，因为气隙提高了材料的限值'
      - '没有差别'
    answer: 0
    explain: '峰值磁通密度等于电感量与电流之积除以匝数和截面积；气隙不改变材料的限值，但匝数增多会降低磁通密度。'
