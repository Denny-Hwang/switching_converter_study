# 01-physics/transformers-coupled 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个匝比为 1:n、$n = 0.2$ 的理想变压器，一次侧两端电压为 $50\,\mathrm{V}$。二次电压是多少？'
    options:
      - '$2.5\,\mathrm{V}$'
      - '$10\,\mathrm{V}$'
      - '$50\,\mathrm{V}$'
      - '$250\,\mathrm{V}$'
    answer: 1
    explain: '二次电压等于一次电压的 $n$ 倍。'
  - q: '同一变压器的二次侧输出 $5\,\mathrm{A}$ 电流。一次电流是多少？'
    options:
      - '$0.2\,\mathrm{A}$'
      - '$1\,\mathrm{A}$'
      - '$5\,\mathrm{A}$'
      - '$25\,\mathrm{A}$'
    answer: 1
    explain: '二次电流等于一次电流除以 $n$，因此一次电流为 $5\,\mathrm{A}$ 的 $n$ 倍。两侧的功率相同。'
  - q: '在 $n = 0.5$ 的理想变压器二次侧接一个 $10\,\Omega$ 电阻。从一次侧看进去的电阻是多少？'
    options:
      - '$2.5\,\Omega$'
      - '$5\,\Omega$'
      - '$20\,\Omega$'
      - '$40\,\Omega$'
    answer: 3
    explain: '二次侧的阻抗在一次侧表现为除以 $n^2$（此处为 $0.25$）后的值。'
  - q: '实际变压器在二次侧开路时吸取的电流，用哪个元件来建模？'
    options:
      - '漏感'
      - '励磁电感'
      - '绕组电容'
      - '负载电阻'
    answer: 1
    explain: '在磁导率有限的磁芯中建立磁通需要电流，该电流用与一次侧并联的励磁电感来建模。'
  - q: '反激变换器的耦合电感与正激变换器的变压器有何不同？'
    options:
      - '它没有二次绕组'
      - '它把能量储存在励磁电感中，之后再释放，而不是在两个绕组都导通期间直接传递能量'
      - '它不需要磁芯'
      - '它没有漏感'
    answer: 1
    explain: '在反激变换器中，一次绕组和二次绕组轮流导通；在两者之间，能量暂存在励磁电感中。'
  - q: '在本站采用的 1:n 约定中，$n$ 是什么？'
    options:
      - '一次匝数除以二次匝数'
      - '二次匝数除以一次匝数'
      - '总匝数'
      - '绕组电阻之比'
    answer: 1
    explain: '本站采用 Erickson 的约定：匝比为 1:n，$n$ 为二次匝数除以一次匝数。'
