# 02-theory/averaged-models 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '在 CCM 变换器的平均直流模型中，开关网络变成了什么？'
    options:
      - '一个等于负载电阻的电阻'
      - '一个匝比等于电压变换比的理想直流变压器'
      - '短路'
      - '一个等于电感电流的电流源'
    answer: 1
    explain: '在一个周期内平均后，开关把功率从输入无损地传递到输出，把电压乘以 $M(D)$、把电流乘以其倒数，就像一个在直流下也能工作的理想变压器。'
  - q: '在含电感绕组电阻的升压变换器中，$D$ 趋近 1 时，电压变换比如何变化？'
    options:
      - '像理想情况一样无限增大'
      - '稳定在一个恒定值'
      - '达到最大值后降向零'
      - '振荡'
    answer: 2
    explain: '理想变换比乘上了一个随 $D$ 趋近 1 而降到零的因子：电感电流增长得太快，绕组电阻上的损耗占去了全部新增的输入功率。'
  - q: '一个升压变换器工作在 $D = 0.5$，$R_L = 0.1\,\Omega$，$R = 10\,\Omega$。若只有 $R_L$ 产生损耗，其效率是多少？'
    options:
      - '约 99 %'
      - '约 96 %'
      - '约 90 %'
      - '约 80 %'
    answer: 1
    explain: '$R_L$ 要与 $(1 - D)^2 R$ 比较，即 $10\,\Omega$ 的四分之一。效率为 $1/(1 + 0.1/2.5)$，约为 0.96。'
  - q: '为什么同样的绕组电阻在高占空比下工作的升压变换器中造成更大的效率损失？'
    options:
      - '绕组发热，电阻增大'
      - '开关频率升高'
      - '它要与 $(1 - D)^2 R$ 比较，即反射到电感一侧的负载电阻，而后者随 $D$ 增大而减小'
      - '输出电压降低'
    answer: 2
    explain: '经过直流变压器，负载在电感一侧表现为 $(1 - D)^2 R$，与 $R_L$ 串联。效率就是到达这个反射电阻的功率所占的比例。'
  - q: '在 DCM 下，升降压变换器的输入端口在一个周期内平均后表现如何？'
    options:
      - '像一个电阻，但它吸收的功率被传递到输出，而不是耗散掉'
      - '像一个恒流负载'
      - '像一个恒压源'
      - '像开路'
    answer: 0
    explain: '每个周期都从零电流开始，因此平均输入电流与输入电压成正比：这是一个电阻。能量储存在电感中并传递到输出，而不是耗散掉，因此是无损电阻。'
  - q: '一个 DCM 升降压变换器的 $L_M = 50\,\mu\mathrm{H}$，$f_s = 100\,\mathrm{kHz}$，$D = 0.5$。其输入电阻是多少？'
    options:
      - '$20\,\Omega$'
      - '$40\,\Omega$'
      - '$80\,\Omega$'
      - '$160\,\Omega$'
    answer: 1
    explain: '输入电阻为 $2 L_M f_s/D^2$：$50\,\mu\mathrm{H}$ 与 $100\,\mathrm{kHz}$ 之积的两倍为 $10\,\Omega$，再除以 0.25。'
