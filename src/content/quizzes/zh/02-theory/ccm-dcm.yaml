# 02-theory/ccm-dcm 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '带二极管整流器的降压变换器为什么在轻载时进入 DCM？'
    options:
      - '轻载时开关频率降低'
      - '电感直流电流减小而纹波不变，因此电流降到零，而二极管不能让电流变为负值'
      - '占空比变得大于 0.5'
      - '输出电容完全放电'
    answer: 1
    explain: '在 CCM 下，纹波只取决于所加的电压、$L$ 和 $T_s$，与负载无关。当直流电流低于纹波峰峰值的一半时，谷值本应为负；二极管阻断反向电流，因此电流在周期的剩余时间内保持为零。'
  - q: '在 DCM 下，对电感电流必须放弃 CCM 分析中所用的哪个假设？'
    options:
      - '伏秒平衡'
      - '电荷平衡'
      - '小纹波近似'
      - '周期稳态'
    answer: 2
    explain: '在 DCM 下，纹波与电流本身一样大，因此不能用直流值代替电感电流。电路仍处于周期稳态，所以平衡条件仍然成立。'
  - q: '增大一个工作在 DCM 的开环降压变换器的负载电阻。占空比固定时，输出电压如何变化？'
    options:
      - '升高，趋向输入电压'
      - '保持为 $D V_g$'
      - '降低，趋向零'
      - '以开关频率振荡'
    answer: 0
    explain: '增大 $R$ 会使 $K$ 减小，而 $K$ 趋于零时，DCM 变换比升向 1。只有在 CCM 下，变换比才仅由 $D$ 决定。'
  - q: '一个降压变换器工作在 $D = 0.5$，测得输出为输入的 $0.7$ 倍。可以得出什么结论？'
    options:
      - '变换器工作在 CCM，电感有损耗'
      - '占空比测量有误'
      - '变换器工作在 DCM'
      - '变换器工作在 CCM 且空载'
    answer: 2
    explain: '在 CCM 下，理想降压变换器的变换比恰好为 $D$，损耗只会降低变换比。变换比高于 $D$，说明电感电流降到了零：变换器处于 DCM，此时 $M > D$。'
  - q: '在 DCM 变换器中，空闲区间内开关节点上的振铃是由什么引起的？'
    options:
      - '开关管开通时二极管的反向恢复'
      - '电感电流降到零后，电感与开关节点的电容发生谐振'
      - '输出电容与其 ESR 的谐振'
      - '控制环路的噪声'
    answer: 1
    explain: '开关管和二极管都关断时，电感与开关节点电容构成一个弱阻尼的 L-C 电路，以其谐振频率 $1/(2\pi\sqrt{L C})$ 振铃。'
  - q: '把降压变换器的二极管换成与主开关管互补驱动的晶体管。轻载时会怎样？'
    options:
      - '变换器更早进入 DCM'
      - '变换器保持在 CCM：电感电流只是在周期的一部分时间内变为负值'
      - '输出电压升向输入电压'
      - '开关频率减半'
    answer: 1
    explain: 'DCM 之所以存在，是因为二极管不能反向导通。同步整流管可以双向导通，因此电流反向而不是停止，CCM 的关系式继续成立。'
