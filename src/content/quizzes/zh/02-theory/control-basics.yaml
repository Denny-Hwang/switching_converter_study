# 02-theory/control-basics 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个 PWM 调制器使用峰值幅值为 $2\,\mathrm{V}$ 的锯齿波。控制电压为 $0.6\,\mathrm{V}$ 时，占空比是多少？'
    options:
      - '0.12'
      - '0.3'
      - '0.6'
      - '3.3'
    answer: 1
    explain: '锯齿波低于控制电压时开关管导通，因此占空比等于控制电压除以锯齿波幅值。'
  - q: '在某一频率下，一个电压模式环路的 $G_c = 5$，$G_{vd} = 12\,\mathrm{V}$，$H = 0.25$，$V_M = 1.5\,\mathrm{V}$。该频率下环路增益的幅值是多少？'
    options:
      - '2.5'
      - '10'
      - '40'
      - '60'
    answer: 1
    explain: '沿环路一周各幅值相乘，调制器贡献 $1/V_M$：5 乘以 12 再乘以 0.25，然后除以 1.5。'
  - q: '直流下测得环路增益为 19。与无反馈时相比，缓慢的输入电压扰动在输出端的影响还剩下几分之几？'
    options:
      - '19'
      - '20'
      - '1/19'
      - '1/20'
    answer: 3
    explain: '扰动被 $1 + T$ 除，即被 20 除；它到达输出端时，影响只有无反馈时的二十分之一。'
  - q: '在远高于穿越频率的频段，反馈对扰动的抑制有多大？'
    options:
      - '几乎没有抑制，因为环路增益远小于 1'
      - '抑制的倍数等于直流环路增益'
      - '抑制的程度由相位裕度决定'
      - '完全抑制'
    answer: 0
    explain: '在环路增益幅值远小于 1 的频段，$1 + T$ 接近 1，因此扰动就像没有反馈一样通过。'
  - q: '一个环路的相位裕度很小。穿越频率附近的扰动会怎样？'
    options:
      - '受到更强的抑制'
      - '不受影响'
      - '可能被放大，因为 $1 + T$ 的幅值降到 1 以下'
      - '被移到开关频率处'
    answer: 2
    explain: '在穿越频率附近，环路增益的幅值约为 1；若相位接近 $-180^\circ$，复数和 $1 + T$ 就会变小，除以它会放大扰动。'
  - q: '为什么让 PWM 锯齿波幅值随输入电压成比例变化，能使降压变换器的环路增益在整个输入电压范围内保持不变？'
    options:
      - '因为它使占空比保持不变'
      - '因为降压变换器的控制-输出增益与输入电压成正比，并被锯齿波幅值所除'
      - '因为它改变了开关频率'
      - '因为它消除了右半平面零点'
    answer: 1
    explain: '降压变换器的直流增益 $G_{d0}$ 等于 $V_g$，调制器贡献 $1/V_M$。若 $V_M$ 与 $V_g$ 成正比，二者之积以及环路增益就不再取决于 $V_g$。'
