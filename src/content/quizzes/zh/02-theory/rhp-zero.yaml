# 02-theory/rhp-zero 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '占空比刚阶跃增大时，升压变换器的输出电压会短暂下降。为什么？'
    options:
      - '电感饱和'
      - '二极管在每个周期中导通的时间已经变短，而电感电流尚未增大'
      - '输出电容向开关管放电'
      - '控制环路不稳定'
    answer: 1
    explain: '只有在二极管导通期间，能量才会到达输出。导通区间变长会立即缩短二极管导通区间，但电感电流需要时间才能增大，因此二极管电流的平均值先下降。'
  - q: '右半平面零点对伯德图有什么影响？'
    options:
      - '其幅值像极点一样下降，相位像零点一样超前'
      - '其幅值像零点一样上升，相位却像极点一样滞后'
      - '只改变幅值'
      - '只改变相位'
    answer: 1
    explain: '$1 - s/\omega_z$ 的幅值随频率的增长与 $1 + s/\omega_z$ 完全相同，但其相位趋向 $-90^\circ$ 而不是 $+90^\circ$。'
  - q: '一个升压变换器工作在 $D = 0.5$，$R = 10\,\Omega$，$L = 100\,\mu\mathrm{H}$。其 RHP 零点在哪里？'
    options:
      - '$12.5\,\mathrm{krad/s}$'
      - '$25\,\mathrm{krad/s}$'
      - '$50\,\mathrm{krad/s}$'
      - '$100\,\mathrm{krad/s}$'
    answer: 1
    explain: '零点位于 $(1 - D)^2 R/L$：$10\,\Omega$ 的四分之一除以 $100\,\mu\mathrm{H}$。'
  - q: '在什么条件下，升压变换器的 RHP 零点频率最低？'
    options:
      - '轻载和低占空比'
      - '重载和高占空比'
      - '轻载和高占空比'
      - '与工作点无关'
    answer: 1
    explain: '零点与 $(1 - D)^2 R$ 成正比：负载电阻小（重载）和占空比大（输入电压低）都会使它降低。'
  - q: '为什么补偿器不能抵消 RHP 零点？'
    options:
      - '抵消它需要一个位于右半平面的极点，而这样的极点是不稳定的'
      - '补偿器不能含有极点'
      - '该零点高于开关频率'
      - '可以用左半平面零点抵消它'
    answer: 0
    explain: '抵消就是在零点的同一位置放置一个极点。对右半平面零点而言，这个极点是不稳定的，因此只能让穿越频率保持在远低于该零点的位置。'
  - q: '在 $L$ 和 $C$ 相同时，$D = 0.5$ 的 CCM 升压变换器的二重极点频率与降压变换器相比如何？'
    options:
      - '相同'
      - '是其两倍'
      - '是其一半'
      - '是其四分之一'
    answer: 2
    explain: '升压变换器的 $\omega_0$ 为 $(1 - D)/\sqrt{LC}$，即降压变换器的值乘以 $1 - D$，因为在平均模型中电感量表现为 $L/(1 - D)^2$。'
