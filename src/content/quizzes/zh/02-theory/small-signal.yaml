# 02-theory/small-signal 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '为什么在用传递函数设计反馈环路之前，必须先把变换器的平均模型线性化？'
    options:
      - '因为占空比与电压、电流相乘，使平均模型成为非线性的'
      - '因为开关是理想的'
      - '因为电感电流是断续的'
      - '因为开关频率太高'
    answer: 0
    explain: '传递函数描述的是线性系统。占空比乘以输入电压这样的乘积是非线性的；把每个量写成直流值加小变化量，并略去变化量之间的乘积，就得到工作点附近的线性模型。'
  - q: '输入为 $24\,\mathrm{V}$ 的理想 CCM 降压变换器，其控制-输出直流增益 $G_{d0}$ 是多少？'
    options:
      - '$12\,\mathrm{V}$'
      - '$24\,\mathrm{V}$'
      - '$48\,\mathrm{V}$'
      - '取决于负载'
    answer: 1
    explain: '静态特性为 $D V_g$，它对 $D$ 的斜率是 $V_g$。该增益的单位是伏每单位占空比，在理想模型中与负载无关。'
  - q: '一个降压变换器滤波器的 $L = 100\,\mu\mathrm{H}$，$C = 100\,\mu\mathrm{F}$。$\omega_0$ 是多少？'
    options:
      - '$1\,\mathrm{krad/s}$'
      - '$10\,\mathrm{krad/s}$'
      - '$100\,\mathrm{krad/s}$'
      - '$1\,\mathrm{Mrad/s}$'
    answer: 1
    explain: '乘积 $L C$ 为 $10^{-8}\,\mathrm{s}^2$，其平方根为 $10^{-4}\,\mathrm{s}$，因此 $\omega_0$ 为 $10^{4}\,\mathrm{rad/s}$。'
  - q: '降压变换器的负载电阻加倍。其控制-输出极点的 $Q$ 如何变化？'
    options:
      - '减半'
      - '不变'
      - '加倍'
      - '变为四倍'
    answer: 2
    explain: '$Q$ 为 $R\sqrt{C/L}$，与 $R$ 成正比。负载越轻，对 L-C 谐振的阻尼越小，因此谐振峰增大。'
  - q: '在谐振角频率 $\omega_0$ 处，二阶控制-输出响应的幅值有多大？'
    options:
      - '等于直流增益'
      - '直流增益的 $Q$ 倍'
      - '直流增益除以 $Q$'
      - '零'
    answer: 1
    explain: '在 $\omega_0$ 处，分母的常数项与 $s^2$ 项相互抵消，只剩下 $j/Q$；幅值是直流增益的 $Q$ 倍，相位为 $-90^\circ$。'
  - q: '小信号模型对哪些扰动有效？'
    options:
      - '任意大小、任意频率'
      - '远小于直流值的变化量，且频率远低于开关频率'
      - '仅在开关频率处'
      - '仅在 DCM 下'
    answer: 1
    explain: '线性化要求变化量很小；平均化要求所关心的频率远低于开关频率。'
