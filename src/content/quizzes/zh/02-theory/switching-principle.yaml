# 02-theory/switching-principle 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '理想开关要么完全导通，要么完全关断。它消耗多少功率？'
    options:
      - '仅在关断期间为零'
      - '导通期间为输入电压乘以负载电流'
      - '两种状态下都为零，因为其电压或电流总有一个为零'
      - '取决于占空比'
    answer: 2
    explain: '功率等于电压乘以电流。导通的理想开关两端没有电压，关断的理想开关中没有电流，因此两种状态下乘积都为零。'
  - q: '开关节点电压在 $12\,\mathrm{V}$ 和 $0\,\mathrm{V}$ 之间交替变化，$D = 0.25$。其直流分量是多少？'
    options:
      - '$3\,\mathrm{V}$'
      - '$6\,\mathrm{V}$'
      - '$9\,\mathrm{V}$'
      - '$12\,\mathrm{V}$'
    answer: 0
    explain: '直流分量是一个周期内的平均值：高电平乘以处于高电平的时间占周期的比例，即 $12\,\mathrm{V}$ 的四分之一。'
  - q: '为什么输出 L-C 滤波器的转折频率必须远低于开关频率？'
    options:
      - '使电感电流永远不降到零'
      - '使滤波器让直流分量通过，并衰减开关谐波'
      - '使占空比与负载无关'
      - '降低开关管的导通损耗'
    answer: 1
    explain: '开关节点波形是直流分量加上位于 $f_s$ 整数倍处的谐波。转折频率远低于 $f_s$ 的低通滤波器保留直流分量，并使谐波大幅衰减。'
  - q: '小纹波近似假设了什么？'
    options:
      - '电感电流纹波为零'
      - '占空比很小'
      - '开关频率低于滤波器的转折频率'
      - '一个几乎恒定的量（例如输出电压）上的开关纹波足够小，可以用该量的直流值代替它'
    answer: 3
    explain: '在计算其他量（例如电感两端的电压）时，它用直流值代替纹波很小的波形。它绝不用于正要计算的纹波：电感电流纹波正是由这一近似使之恒定的斜率得出的。'
  - q: '一个 CCM 降压变换器以固定占空比工作。将开关频率加倍，直流输出电压如何变化？'
    options:
      - '加倍'
      - '减半'
      - '不变'
      - '降为零'
    answer: 2
    explain: '在 CCM 下，直流输出等于开关节点的直流分量 $D V_g$，与 $f_s$ 无关。将 $f_s$ 加倍，减半的是周期和电流纹波，而不是平均值。'
  - q: '输入电压远高于输出电压时，线性稳压器为什么会浪费功率？'
    options:
      - '它的开关速度太慢'
      - '它的调整管在承受输入输出电压差的同时流过全部负载电流'
      - '它的输出电容有串联电阻'
      - '它的占空比受到限制'
    answer: 1
    explain: '调整管与负载串联，因此它既流过负载电流，又承受这一电压差；两者之积以热的形式耗散掉。'
