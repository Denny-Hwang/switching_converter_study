# 02-theory/volt-second-charge-balance 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '为什么在周期稳态下，电感电压在一个周期内的平均值为零？'
    options:
      - '因为电感没有电阻'
      - '因为电感电流在每个周期结束时回到起始值，所以 $v_L$ 在一个周期内的积分为零'
      - '因为开关是理想的'
      - '因为输出电容很大'
    answer: 1
    explain: '电感电压在一个周期内的积分等于 $L$ 乘以该周期内电感电流的变化量。在周期稳态下，电流回到起始值，因此积分和平均值都为零。这不需要任何理想化假设。'
  - q: '电感在导通区间承受 $+10\,\mathrm{V}$，$D = 0.2$。稳态下它在关断区间必须承受多大的电压？'
    options:
      - '$-10\,\mathrm{V}$'
      - '$-2.5\,\mathrm{V}$'
      - '$+2.5\,\mathrm{V}$'
      - '$-40\,\mathrm{V}$'
    answer: 1
    explain: '$10\,\mathrm{V}$ 持续 $0.2\,T_s$ 所产生的正伏秒积，必须在 $0.8\,T_s$ 的关断区间内抵消，这需要大小为其四分之一、符号相反的电压。'
  - q: '哪个条件给出变换器中的直流电流，例如升压变换器的电感直流电流？'
    options:
      - '电感伏秒平衡'
      - '仅靠小纹波近似'
      - '电容电荷平衡'
      - '沿开关所在回路的基尔霍夫电压定律'
    answer: 2
    explain: '伏秒平衡联系的是电压；输出电容上的电荷平衡联系的是各区间内流入该电容的电流，因此能用负载电流确定电感直流电流。'
  - q: '一个理想 CCM 升压变换器由 $5\,\mathrm{V}$ 输入供电，工作在 $D = 0.75$。其输出电压是多少？'
    options:
      - '$6.7\,\mathrm{V}$'
      - '$15\,\mathrm{V}$'
      - '$20\,\mathrm{V}$'
      - '$3.75\,\mathrm{V}$'
    answer: 2
    explain: '升压变换比为 $1/(1 - D)$，在此占空比下为 4，因此输出是输入的四倍。'
  - q: '占空比在什么范围内时，理想 CCM 升降压变换器输出电压的绝对值大于输入电压？'
    options:
      - '$D > 0.5$'
      - '$D < 0.5$'
      - '任意 $D$'
      - '任何 $D$ 都不行：它只能降压'
    answer: 0
    explain: '变换比的绝对值为 $D/(1 - D)$，它恰好在 $D$ 大于 $1 - D$ 时超过 1，即 $D > 0.5$ 时。'
  - q: '负载阶跃期间，电感电压在一个开关周期内的平均值不为零。这说明了什么？'
    options:
      - '变换器进入了 DCM'
      - '小纹波近似不成立'
      - '电感正在饱和'
      - '电感电流在逐个周期地变化'
    answer: 3
    explain: '电感电压的平均值不为零，意味着电感电流在该周期内有净变化。伏秒平衡只在稳态下成立；在瞬态过程中，正是这种不平衡使电流变化到新值。'
