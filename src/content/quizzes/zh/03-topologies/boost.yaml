# 03-topologies/boost 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '理想 CCM 升压变换器在 $D = 0.5$ 下向 $12\,\Omega$ 负载输出 $24\,\mathrm{V}$。其电感直流电流是多少？'
    options:
      - '$1\,\mathrm{A}$'
      - '$2\,\mathrm{A}$'
      - '$4\,\mathrm{A}$'
      - '$8\,\mathrm{A}$'
    answer: 2
    explain: '负载电流为 $2\,\mathrm{A}$，而电感中流过的是输入电流，它是负载电流的 $1/(1 - D)$ 倍，此处为 2 倍。'
  - q: '升压变换器的输出电压纹波由哪个区间决定？'
    options:
      - '关断区间，此时二极管给电容充电'
      - '导通区间，此时由电容单独向负载供电'
      - '两个区间之间的死区时间'
      - '都不是：纹波只由电感电流纹波决定'
    answer: 1
    explain: '开关管导通期间，二极管关断，由电容单独提供全部负载电流，因此电容电压下降 $2\Delta v$。'
  - q: '理想升压变换器的开关管关断时必须阻断什么电压？'
    options:
      - '输入电压'
      - '输出电压'
      - '输入电压与输出电压之和'
      - '输出电压与输入电压之差'
    answer: 1
    explain: '二极管导通时，开关节点与输出相连，因此开关管阻断 $V$。'
  - q: '升压变换器的开关管一直保持关断。输出电压是多少（理想二极管）？'
    options:
      - '零'
      - '输入电压'
      - '输入电压的两倍'
      - '不确定：输出浮空'
    answer: 1
    explain: '电感和二极管仍把输入接到输出，因此稳态下输出跟随输入；开关管无法断开负载。'
  - q: '输出电压和输出功率固定，将升压变换器的输入电压减半。电感直流电流如何变化？'
    options:
      - '减半'
      - '不变'
      - '加倍'
      - '变为四倍'
    answer: 2
    explain: '电感中流过的是输入电流；输入功率等于输入电压乘以输入电流，在理想变换器中又等于输出功率。'
  - q: '纹波相同时，为什么升压变换器需要比降压变换器更大的输出电容？'
    options:
      - '其开关频率更低'
      - '其电容必须在每个导通区间内提供全部负载电流，而不是只吸收一个小的三角波纹波'
      - '其电感更大'
      - '其输出电压更高'
    answer: 1
    explain: '在降压变换器中，电感连续地向输出供电；在升压变换器中，二极管电流以脉冲形式到达，两个脉冲之间由电容单独承担负载。'
