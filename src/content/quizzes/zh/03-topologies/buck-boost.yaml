# 03-topologies/buck-boost 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '理想 CCM 升降压变换器由 $12\,\mathrm{V}$ 供电，工作在 $D = 0.75$。其输出电压的大小是多少？'
    options:
      - '$4\,\mathrm{V}$'
      - '$9\,\mathrm{V}$'
      - '$16\,\mathrm{V}$'
      - '$36\,\mathrm{V}$'
    answer: 3
    explain: '其大小为 $D V_g/(1 - D)$：在该占空比下为输入电压的三倍。'
  - q: '理想升降压变换器的输入为 $12\,\mathrm{V}$，输出为 $-24\,\mathrm{V}$。其开关管关断时必须阻断多大的电压？'
    options:
      - '$12\,\mathrm{V}$'
      - '$24\,\mathrm{V}$'
      - '$36\,\mathrm{V}$'
      - '$48\,\mathrm{V}$'
    answer: 2
    explain: '二极管导通期间，开关管处于输入与负输出之间，因此它阻断输入电压与输出电压大小之和。'
  - q: '升降压变换器的电感在哪个区间向输出输送电流？'
    options:
      - '仅在开关管导通期间'
      - '仅在二极管导通期间'
      - '两个区间都会'
      - '仅在 DCM 下'
    answer: 1
    explain: '开关管导通期间，电感与输入相连；只有二极管导通时，电感才与输出相连。'
  - q: '升降压变换器在 $D = 0.5$ 下向 $6\,\Omega$ 负载输出大小为 $12\,\mathrm{V}$ 的电压。其电感直流电流是多少？'
    options:
      - '$1\,\mathrm{A}$'
      - '$2\,\mathrm{A}$'
      - '$4\,\mathrm{A}$'
      - '$6\,\mathrm{A}$'
    answer: 2
    explain: '负载电流为 $2\,\mathrm{A}$，而它只在关断区间内输送，因此电感电流是它的 $1/(1 - D)$ 倍。'
  - q: '三种基本变换器中，哪一种的输入端和输出端电流都是脉冲式的？'
    options:
      - '降压变换器'
      - '升压变换器'
      - '升降压变换器'
      - '都不是'
    answer: 2
    explain: '降压变换器的输出电流连续，升压变换器的输入电流连续；升降压变换器只是交替地把电感接到输入和输出。'
  - q: '输入电压和输出电压大小分别相同时，为什么升降压变换器的开关应力比降压或升压变换器的高？'
    options:
      - '其开关管中没有电流'
      - '其开关管阻断的是输入电压与输出电压大小之和，而不只是其中之一'
      - '其开关频率更高'
      - '它只工作在 DCM 下'
    answer: 1
    explain: '降压变换器的开关管阻断 $V_g$，升压变换器的开关管阻断 $V$；升降压变换器的开关管处于输入与反相输出之间，因此阻断 $V_g + V$。'
