# 03-topologies/buck 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个工作于 CCM 的降压变换器向 $2.5\,\Omega$ 负载输出 $5\,\mathrm{V}$。其电感直流电流是多少？'
    options:
      - '$0.5\,\mathrm{A}$'
      - '$1\,\mathrm{A}$'
      - '$2\,\mathrm{A}$'
      - '取决于占空比'
    answer: 2
    explain: '输出电容中没有直流电流，因此电感提供全部负载电流，即输出电压除以负载电阻。'
  - q: '电感直流电流为 $2\,\mathrm{A}$，纹波峰峰值的一半 $\Delta i_L$ 为 $0.4\,\mathrm{A}$。开关管须流过的峰值电流是多少？'
    options:
      - '$2\,\mathrm{A}$'
      - '$2.2\,\mathrm{A}$'
      - '$2.4\,\mathrm{A}$'
      - '$2.8\,\mathrm{A}$'
    answer: 2
    explain: '峰值等于直流值加上纹波峰峰值的一半，而 $\Delta i_L$ 本身就是这一半。'
  - q: '将 CCM 降压变换器的开关频率加倍，$L$、$C$、占空比和负载不变。理想输出电压纹波如何变化？'
    options:
      - '减半'
      - '降为四分之一'
      - '不变'
      - '加倍'
    answer: 1
    explain: '电流纹波与 $T_s$ 成正比，电压纹波与电流纹波和 $T_s$ 之积成正比，因此电压纹波与 $T_s^2$ 成正比。'
  - q: '开关管导通期间，理想降压变换器的二极管必须阻断什么电压？'
    options:
      - '输出电压'
      - '输入电压'
      - '输入电压与输出电压之差'
      - '输入电压的两倍'
    answer: 1
    explain: '开关管导通时，开关节点处于 $V_g$，而二极管阳极接地，因此二极管阻断 $V_g$。'
  - q: '输出电容相同时，为什么降压变换器的输出纹波比升压变换器的小？'
    options:
      - '降压变换器的开关速度更快'
      - '降压变换器的输出电容流过的是连续的三角波电流，而升压变换器的电容在导通区间内必须单独向负载供电'
      - '降压变换器没有二极管'
      - '降压变换器的输出电压更低'
    answer: 1
    explain: '在降压变换器中，电感连续地向输出供电，只有小的三角波纹波流入电容。在升压变换器中，二极管电流是脉冲式的，在 $D T_s$ 期间由电容单独向负载供电。'
  - q: '降压变换器的输出电容有串联电阻，测得的输出纹波大于理想公式的预测值。为什么？'
    options:
      - '串联电阻叠加了一个纹波电压，其值等于该电阻乘以纹波电流峰峰值'
      - '串联电阻降低了开关频率'
      - '串联电阻增大了电感纹波'
      - '串联电阻使变换器进入 DCM'
    answer: 0
    explain: '纹波电流流过电容及其串联电阻；电阻上的压降叠加在容性纹波上，且可能是两者中较大的一项。'
