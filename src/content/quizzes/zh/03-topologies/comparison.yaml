# 03-topologies/comparison 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '某应用需要从在 $3\,\mathrm{V}$ 到 $9\,\mathrm{V}$ 之间变化的输入得到 $5\,\mathrm{V}$，且不要求隔离。哪一种基本变换器能单独做到？'
    options:
      - '降压变换器'
      - '升压变换器'
      - '升降压变换器（接受反相输出）'
      - '基本变换器都做不到'
    answer: 2
    explain: '输入电压低时输出必须高于输入，输入电压高时输出必须低于输入；只有升降压变换器既能升压又能降压，代价是输出反相。'
  - q: '理想 CCM 降压变换器在 $D = 0.25$ 时的开关管利用率是多少？'
    options:
      - '0.25'
      - '0.5'
      - '0.75'
      - '1'
    answer: 1
    explain: '降压变换器的利用率为 $\sqrt{D}$：开关管阻断 $V_g$，以占空比为 $D$ 的脉冲形式流过负载电流，负载功率为 $D V_g I$。'
  - q: '升降压变换器和反激变换器的利用率在哪个占空比下最大？'
    options:
      - '$D = 1/4$'
      - '$D = 1/3$'
      - '$D = 1/2$'
      - '$D = 2/3$'
    answer: 1
    explain: '利用率为 $(1 - D)\sqrt{D}$；其导数在 $1 - 3D$ 为零处等于零。'
  - q: '以下哪种变换器在 CCM 下的控制-输出传递函数中有右半平面零点？'
    options:
      - '降压变换器'
      - '正激变换器'
      - '反激变换器'
      - '都没有'
    answer: 2
    explain: '反激变换器与升压、升降压变换器一样，只在关断区间向输出传递能量；降压变换器和正激变换器在开关管导通期间经 L-C 滤波器向输出供电。'
  - q: '为什么反激变换器的开关管利用率与其匝比无关？'
    options:
      - '因为变压器不储存能量'
      - '因为在给定占空比下，无论 $n$ 为多少，开关管的峰值电压和电流有效值都相同；匝比只按比例改变输出电压和输出电流'
      - '因为反激变换器总是工作在 $D = 1/3$'
      - '因为漏感抵消了匝比的影响'
    answer: 1
    explain: '在 CCM 下，开关管阻断 $V_g + V/n$，它等于 $V_g/(1 - D)$；负载功率给定时，开关管电流也与 $n$ 无关；匝比只改变输出侧。'
  - q: '哪种变换器向输出电容提供连续电流，而从输入吸取脉冲电流？'
    options:
      - '降压变换器'
      - '升压变换器'
      - '升降压变换器'
      - '反激变换器'
    answer: 0
    explain: '降压变换器的电感位于开关节点与输出之间，因此输出端流过连续的电感电流，而输入端只在开关管导通期间流过该电流。'
