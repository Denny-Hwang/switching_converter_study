# 03-topologies/flyback 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '匝比为 1:n、$n = 0.5$ 的理想 CCM 反激变换器由 $24\,\mathrm{V}$ 供电，工作在 $D = 0.5$。其输出电压是多少？'
    options:
      - '$6\,\mathrm{V}$'
      - '$12\,\mathrm{V}$'
      - '$24\,\mathrm{V}$'
      - '$48\,\mathrm{V}$'
    answer: 1
    explain: '变换比为 $n D/(1 - D)$，即升降压变换器的变换比乘以匝比：此处为 $0.5$，因此输出是输入的一半。'
  - q: '反激变换器由 $48\,\mathrm{V}$ 供电，$n = 0.25$，输出为 $12\,\mathrm{V}$（理想二极管）。不计漏感尖峰，开关管关断时阻断的电压是多少？'
    options:
      - '$60\,\mathrm{V}$'
      - '$96\,\mathrm{V}$'
      - '$120\,\mathrm{V}$'
      - '$144\,\mathrm{V}$'
    answer: 1
    explain: '输出电压除以 $n$ 后出现在一次侧，此处为 $48\,\mathrm{V}$，并与输入电压相加。'
  - q: '在同一反激变换器中，开关管导通期间输出二极管阻断的反向电压是多少？'
    options:
      - '$12\,\mathrm{V}$'
      - '$24\,\mathrm{V}$'
      - '$48\,\mathrm{V}$'
      - '$60\,\mathrm{V}$'
    answer: 1
    explain: '二次绕组两端电压为 $n V_g$，此处为 $12\,\mathrm{V}$，二极管阻断该电压与输出电压之和。'
  - q: '用 $L_M$ 和实际负载计算 $K$ 时，反激变换器的 DCM 变换比与匝比有什么关系？'
    options:
      - '与 $n$ 成正比'
      - '与 $1/n$ 成正比'
      - '与 $n$ 无关'
      - '与 $n^2$ 成正比'
    answer: 2
    explain: '在 DCM 下，每个周期储存在 $L_M$ 中的能量无论匝比如何都会送到负载，变换比为 $D/\sqrt{K}$。'
  - q: '某反激变换器的漏感为 $2\,\mu\mathrm{H}$，在 $100\,\mathrm{kHz}$ 下每次关断 $3\,\mathrm{A}$ 的电流。耗散型钳位电路至少要耗散多少功率？'
    options:
      - '$0.09\,\mathrm{W}$'
      - '$0.45\,\mathrm{W}$'
      - '$0.9\,\mathrm{W}$'
      - '$1.8\,\mathrm{W}$'
    answer: 2
    explain: '漏感储存的能量为 $L_\mathrm{lk}$ 与电流平方之积的一半，即每次关断 $9\,\mu\mathrm{J}$，而每个周期关断一次。耗散型钳位电路把这些能量全部转化为热。'
  - q: '一个固定占空比的反激变换器由限流电源供电，为电池充电。电源电压升到某一值后不再上升。为什么？'
    options:
      - '电源达到了其限流值'
      - '在该输入电压下反激变换器进入 CCM，而输出和占空比固定时，CCM 的伏秒平衡只允许这一个输入电压'
      - '钳位电路开始导通'
      - '变压器饱和'
    answer: 1
    explain: '低于临界电压时，反激变换器工作在 DCM，表现为电阻。达到临界电压时 CCM 开始，伏秒平衡把输入电压锁定：变换器成为恒压负载。'
