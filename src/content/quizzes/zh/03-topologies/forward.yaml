# 03-topologies/forward 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '$n = 0.25$ 的理想正激变换器由 $48\,\mathrm{V}$ 供电，工作在 $D = 0.4$。其输出电压是多少？'
    options:
      - '$4.8\,\mathrm{V}$'
      - '$12\,\mathrm{V}$'
      - '$19.2\,\mathrm{V}$'
      - '$8\,\mathrm{V}$'
    answer: 0
    explain: '正激变换器相当于以 $n V_g$ 供电的降压变换器：输出为 $n D V_g$。'
  - q: '为什么正激变换器的变压器必须在每个开关周期内复位？'
    options:
      - '为了给输出电容放电'
      - '因为若不复位，励磁电流会逐周期增大，直到磁芯饱和'
      - '为了使输出极性反相'
      - '为了限制漏感'
    answer: 1
    explain: '励磁电流在开关管导通期间上升。要使励磁电感满足伏秒平衡，需要一个复位区间，在下一个周期之前使励磁电流回到零。'
  - q: '某正激变换器的一次绕组与复位绕组匝数相等（$n_r = 1$）。其最大占空比是多少？'
    options:
      - '0.25'
      - '0.5'
      - '0.67'
      - '1'
    answer: 1
    explain: '复位绕组反向施加输入电压，因此复位时间与导通时间相等，而二者必须容纳在一个周期之内。'
  - q: '该变换器由 $48\,\mathrm{V}$ 供电时，开关管在复位期间阻断多大的电压？'
    options:
      - '$48\,\mathrm{V}$'
      - '$72\,\mathrm{V}$'
      - '$96\,\mathrm{V}$'
      - '$144\,\mathrm{V}$'
    answer: 2
    explain: '复位绕组把一次侧电压钳位在 $-V_g/n_r$，开关管阻断 $V_g$ 减去该值：$n_r = 1$ 时为输入电压的两倍。'
  - q: '增加复位绕组的匝数（$n_r$ 增大）。会发生什么？'
    options:
      - '开关应力和最大占空比都升高'
      - '开关应力降低，最大占空比也降低'
      - '开关应力升高，最大占空比降低'
      - '什么都不变'
    answer: 1
    explain: '$n_r$ 增大会降低一次侧的复位电压，因此开关管阻断的电压更低；但复位所需时间随之变长，占空比上限因而降低。'
  - q: '正激变换器和反激变换器中，变压器的作用有何不同？'
    options:
      - '没有区别'
      - '正激变换器的变压器在开关管导通期间直接传递能量；反激变换器的耦合电感先储存能量，在开关管关断期间再释放'
      - '正激变换器的变压器储存能量，反激变换器的变压器不储存'
      - '只有反激变换器的变压器提供隔离'
    answer: 1
    explain: '在正激变换器中，二次侧在导通区间内导通，因此能量直接传递过去；在反激变换器中，二极管在关断区间内导通，送出储存在 $L_M$ 中的能量。'
