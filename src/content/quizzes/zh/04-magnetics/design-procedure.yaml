# 04-magnetics/design-procedure 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '磁芯几何常数 $K_g$ 综合了哪三个约束条件？'
    options:
      - '磁通限值、气隙和窗口'
      - '电感量、气隙和磁芯损耗'
      - '饱和、磁芯损耗和温度'
      - '磁通限值、窗口和绕组电阻'
    answer: 3
    explain: '从磁通密度、窗口和电阻约束条件中消去匝数和导线，剩下的就是 $K_g$；气隙在此之后选定，并决定电感量。'
  - q: '其他条件不变，将 $B_\mathrm{max}$ 从 0.2 T 提高到 0.3 T。所需的 $K_g$ 变为原来的多少倍？'
    options:
      - '0.67：减小'
      - '1.5：增大'
      - '0.44：减小'
      - '2.25：增大'
    answer: 2
    explain: '所需的 $K_g$ 与 $B_\mathrm{max}$ 的平方成反比，而 0.2/0.3 的平方为 0.44。'
  - q: '在同一电流有效值下，将允许的铜损加倍。所需的 $K_g$ 如何变化？'
    options:
      - '减半'
      - '加倍'
      - '降为四分之一'
      - '不变'
    answer: 0
    explain: '电流相同时，损耗加倍意味着允许的绕组电阻加倍，而绕组电阻以一次方出现在 $K_g$ 的分母中。'
  - q: '某磁芯的 $K_g$ 是另一个同形状磁芯的两倍。它的每个尺寸大多少？'
    options:
      - '约 26 %'
      - '约 41 %'
      - '两倍'
      - '约 15 %'
    answer: 3
    explain: '$K_g$ 与磁芯尺寸的五次方成正比，而 2 的五次方根为 1.15。'
  - q: '为什么匝数向上取整后要再次校核绕组电阻？'
    options:
      - '更多的匝分摊窗口，每匝的铜更少，绕组也更长：电阻随匝数的平方增大'
      - '向上取整使磁通密度低于 $B_\mathrm{max}$'
      - '向上取整改变了磁芯的 $K_g$'
      - '电感量不再由气隙决定'
    answer: 0
    explain: '磁芯的 $K_g$ 只保证在精确匝数下满足预算；向上取整或按更小的截面计算匝数都会增加电阻，只有 $K_g$ 留有余量才能覆盖。'
  - q: '在下列哪种元件中，最可能由磁芯损耗而不是饱和来限制磁通密度？'
    options:
      - '纹波小的滤波电感'
      - '只流过直流的电感'
      - '每个周期磁通都大幅摆动的反激变压器或 DCM 电感'
      - '工频扼流圈'
    answer: 2
    explain: '磁芯损耗来自交流磁通。纹波小的滤波电感交流磁通很少，而纹波大时，磁通每个周期都大幅摆动。'
