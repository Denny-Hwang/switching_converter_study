# 04-magnetics/leakage 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '两个绕组在另一绕组开路时分别测得 $400\,\mu\mathrm{H}$ 和 $25\,\mu\mathrm{H}$，互感为 $99\,\mu\mathrm{H}$。其耦合系数是多少？'
    options:
      - '0.25'
      - '0.99'
      - '4'
      - '0.0099'
    answer: 1
    explain: '互感除以两个电感乘积的平方根：99 除以 100。'
  - q: '二次绕组开路时，一次绕组的读数为 $1\,\mathrm{mH}$，耦合系数为 0.99。二次绕组短路时读数是多少？'
    options:
      - '$10\,\mu\mathrm{H}$'
      - '$19.9\,\mu\mathrm{H}$'
      - '$990\,\mu\mathrm{H}$'
      - '$1.99\,\mu\mathrm{H}$'
    answer: 1
    explain: '开路电感乘以 1 减去耦合系数的平方：1 mH 乘以 0.0199。'
  - q: '短路测试测量的是什么？'
    options:
      - '一次侧与二次侧漏感之和，折算到一次侧'
      - '励磁电感'
      - '仅一次侧漏感'
      - '绕组电容'
    answer: 0
    explain: '励磁电感远大于漏感，因此读数几乎等于折算到一次侧的两个漏感之和。'
  - q: '将一次绕组分成两半置于二次绕组两侧（P-S-P），漏感大致如何变化？'
    options:
      - '降到约一半'
      - '加倍'
      - '降到约四分之一'
      - '完全不变'
    answer: 2
    explain: '窗口中的峰值磁动势减半，而储能与其平方成正比。'
  - q: '将磁芯的气隙加长到原来的两倍。漏感如何变化？'
    options:
      - '减半'
      - '几乎不变：漏感由绕组的几何结构决定'
      - '加倍'
      - '消失'
    answer: 1
    explain: '气隙降低的是励磁电感；漏感由绕组之间的磁场决定，而气隙对该磁场几乎没有影响。'
  - q: '开关管关断时，反激变换器的漏感能量去了哪里？'
    options:
      - '送到输出端'
      - '进入磁芯，成为磁芯损耗'
      - '每个周期都进入钳位电路或缓冲电路'
      - '留在漏感中'
    answer: 2
    explain: '漏磁通不与二次绕组交链，因此其能量无法到达输出端；必须由钳位电路或缓冲电路吸收。'
