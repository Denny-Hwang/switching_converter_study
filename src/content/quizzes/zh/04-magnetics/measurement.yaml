# 04-magnetics/measurement 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '某绕组在 1 MHz 处谐振。LCR 测试仪在什么测试频率下读出的电感量误差在约 1 % 以内？'
    options:
      - '在 100 kHz 或更低的频率下'
      - '在 500 kHz 下'
      - '在 1 MHz 下'
      - '在任何频率下'
    answer: 0
    explain: '在自谐振频率的十分之一处，读数偏高 1 %；越接近自谐振，偏高越多。'
  - q: '在自谐振频率的 0.71 倍处，仪表读数是多少？'
    options:
      - '约为电感量的一半'
      - '就是电感量'
      - '约为电感量的两倍'
      - '约为电感量的十倍'
    answer: 2
    explain: '1 减去 0.71 的平方，其倒数为 2。'
  - q: '为什么要用四线法测量绕组的直流电阻？'
    options:
      - '它能消除绕组的电感'
      - '它测得的是交流电阻'
      - '它使绕组发热更少'
      - '表笔及其接触点的电阻不计入读数'
    answer: 3
    explain: '一对表笔通电流，另一对检测电压且几乎不通电流，因此读数中不含表笔上的压降。'
  - q: '电压脉冲如何显示磁芯饱和？'
    options:
      - '磁芯一旦饱和，电流上升得更快'
      - '电流停止上升'
      - '绕组两端电压升高'
      - '电流下降'
    answer: 0
    explain: '电流按电压除以电感的斜率上升；磁芯饱和时电感骤降，斜率变陡。'
  - q: '二次绕组短路时，一次绕组的电感读数给出的是什么？'
    options:
      - '励磁电感'
      - '折算到一次侧的漏感'
      - '绕组电容'
      - '匝比'
    answer: 1
    explain: '短路抵消了共享磁通；一次绕组仍能感受到的，是两个绕组不共享的磁通。'
  - q: '在没有直流电流的情况下测得的 LCR 测试仪读数，不能说明什么？'
    options:
      - '小电流下绕组的电感'
      - '磁芯在工作电流下是否饱和'
      - '测试频率下的串联电阻'
      - '测试频率下的电感'
    answer: 1
    explain: '其小信号达不到峰值电流下的磁通密度：应用电流脉冲检查饱和。'
  - q: '某变压器的一次侧漏感为其励磁电感的 1 %，匝比 n 为 0.25。在绕组电阻可以忽略的测试频率下从一次侧驱动，开路电压比的读数是多少？'
    options:
      - '0.2525'
      - '0.25'
      - '0.2475'
      - '0.2'
    answer: 2
    explain: '一次侧漏感与励磁电感对外加电压分压，因此电压比等于匝比除以 1.01：约偏低 1 %。'
