# 04-magnetics/snubbers-clamps 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '某节点的振铃频率为 20 MHz，在其两端并联 $150\,\mathrm{pF}$ 后为 10 MHz。节点自身的电容是多少？'
    options:
      - '$150\,\mathrm{pF}$'
      - '$50\,\mathrm{pF}$'
      - '$75\,\mathrm{pF}$'
      - '$37.5\,\mathrm{pF}$'
    answer: 1
    explain: '频率减半需要四倍的电容，因此所加的 150 pF 是节点自身电容的三倍。'
  - q: 'AN11160 如何选择 RC 缓冲电路的电阻？'
    options:
      - '尽可能小'
      - '尽可能大'
      - '使寄生电感、电阻与缓冲电容串联回路的阻尼比在 0.5 到 1 之间，再试验几个取值'
      - '等于负载电阻'
    answer: 2
    explain: '阻尼比在 0.5 到 1 之间时峰值电压最低；该范围内的最佳值通过试验找到。'
  - q: '一个 $220\,\mathrm{pF}$ 的 RC 缓冲电路在每个边沿承受 100 V 的电压摆幅，频率为 100 kHz。它增加多少损耗？'
    options:
      - '$0.22\,\mathrm{W}$'
      - '$0.11\,\mathrm{W}$'
      - '$22\,\mathrm{mW}$'
      - '$2.2\,\mathrm{W}$'
    answer: 0
    explain: '缓冲电容的充电和放电各损失 C V 平方的一半：每个周期损失 C V 平方，再乘以频率。'
  - q: '缓冲电阻的阻值如何影响缓冲电路的损耗？'
    options:
      - '电阻越大，损耗越低'
      - '没有影响：损耗由电容、电压摆幅和频率决定'
      - '电阻越小，损耗越低'
      - '损耗发生在电容中，而不在电阻中'
    answer: 1
    explain: '经电阻给电容充电，无论阻值多大，都损失 C V 平方的一半；下一个边沿再损失储存的另一半。'
  - q: 'AN11160 以多大的缓冲电容作为起点？'
    options:
      - '节点自身电容的十分之一'
      - '节点自身电容的一百倍'
      - '节点自身电容的一到两倍'
      - '与输出电容一样大'
    answer: 2
    explain: '这是一种折中：电容越大，采用最佳电阻时所能达到的峰值电压越低，但损耗也随之增大。'
  - q: '按 TVS 模型，一个击穿电压为 150 V、动态电阻为 $0.5\,\Omega$ 的 TVS 流过 10 A 电流。其钳位电压是多少？'
    options:
      - '$155\,\mathrm{V}$'
      - '$150\,\mathrm{V}$'
      - '$145\,\mathrm{V}$'
      - '$160\,\mathrm{V}$'
    answer: 0
    explain: '击穿电压加上动态电阻与电流之积：150 V 加 5 V。'
  - q: '若反激变换器钳位电路的电压设定得仅略高于反射电压，其损耗会怎样？'
    options:
      - '降到每个周期的漏感能量'
      - '远高于每个周期的漏感能量'
      - '变为零'
      - '不变'
    answer: 1
    explain: '此时漏感电流需要很长时间才能复位，在此期间钳位电路持续从变压器吸取能量。'
  - q: '在给缓冲电容充电的边沿，AN11160 认为电阻吸收的能量与电容储存的能量相同。确定电阻的额定值时，它还计入了什么？'
    options:
      - '负载功率'
      - '没有其他'
      - '振铃开始时寄生电感的能量'
      - '栅极驱动能量'
    answer: 2
    explain: '振铃开始时寄生电感中的能量也进入电阻，因此电阻的耗散可能大于缓冲电路增加的损耗。'
