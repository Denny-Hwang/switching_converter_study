# 04-magnetics/winding-loss 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '什么是邻近效应？'
    options:
      - '单根导体中电流向表面集中'
      - '相邻匝之间的电容'
      - '其他各层的磁场在某一层中感应出的涡流'
      - '绕组附近的磁芯损耗'
    answer: 2
    explain: '绕组的每一层都处于相邻各层的磁场中；该磁场感应出的涡流会增加损耗，且损耗随层数迅速增大。'
  - q: '某铜箔厚 0.3 mm，所关心频率下的集肤深度为 0.2 mm。以集肤深度计，该铜箔的厚度是多少？'
    options:
      - '1.5'
      - '0.67'
      - '0.06'
      - '3'
    answer: 0
    explain: '厚度除以集肤深度：0.3/0.2。'
  - q: '层比一个集肤深度薄时，交流电阻超出直流值的部分如何随层厚增长？'
    options:
      - '与层厚成正比'
      - '与层厚的四次方成正比'
      - '与层厚的平方成正比'
      - '不增长'
    answer: 1
    explain: 'Dowell 系数的级数中，1 之后的第一项与 $\varphi^4$ 成正比。'
  - q: '三层时，损耗在约 0.76 个集肤深度处最小。若层厚超过该值，损耗会怎样？'
    options:
      - '增大：交流电阻系数增长得比直流电阻下降得快'
      - '继续减小，因为直流电阻在下降'
      - '保持不变'
      - '降到直流损耗'
    answer: 0
    explain: '频率固定时，损耗与 $F_R/\varphi$ 成正比：超过最佳值后，$F_R$ 比 $\varphi$ 增长得快。'
  - q: '按薄层级数，损耗最小的层厚处交流电阻系数是多少？'
    options:
      - '1'
      - '2'
      - '随层数增大'
      - '4/3，与层数无关'
    answer: 3
    explain: '在最佳值处，无论层数多少，四阶项都等于三分之一。'
  - q: '变压器绕组的交错绕制如何降低邻近效应损耗？'
    options:
      - '缩短平均匝长'
      - '增大集肤深度'
      - '降低峰值磁动势，以及从零磁动势到峰值磁动势的层数'
      - '降低直流电阻'
    answer: 2
    explain: '把二次绕组置于一次绕组的两半之间，窗口中的峰值磁动势减半，决定邻近效应的层数也随之减半。'
