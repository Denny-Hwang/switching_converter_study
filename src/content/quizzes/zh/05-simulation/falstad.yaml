# 05-simulation/falstad 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: 'CircuitJS1 如何随时间逐步计算库中的电路？'
    options:
      - '像 SPICE 那样，按误差估计选取每一步的步长'
      - '以一个固定步长，即开关周期的五百分之一；只有在开启 Auto-Adjust Timestep 且不收敛时，才会把步长减半'
      - '以每次二极管关断时都会缩短的步长'
      - '每个开关周期一步'
    answer: 1
    explain: 'CircuitJS1 保持时间步长固定。只有当迭代不收敛、且 Auto-Adjust Timestep 已开启时，它才把步长减半，而库中的电路关闭了该选项；在二极管关断处，没有任何机制会缩短步长。'
  - q: '一个 100 µH 的电感用后向欧拉法计算，步长为 20 ns。其二极管关断时，电感电流已越过零点 3.7 mA，且没有其他元件承接该电流。电感两端的一步跳变有多大？'
    options:
      - '0.74 V'
      - '18.5 V'
      - '37 V'
      - '185 V'
    answer: 1
    explain: '这一步必须把电流拉回零，因此电感两端的电压为 L 与电流之积除以步长：100 µH × 3.7 mA / 20 ns 为 18.5 V。'
  - q: '为了消除这个尖峰，你把时间步长减半。尖峰会怎样？'
    options:
      - '减半'
      - '加倍'
      - '保持在同一量级，因为越过零点的电流随步长减小'
      - '消失'
    answer: 2
    explain: '电流越过零点的量约等于它在一步之内的变化量，随步长减半而减半；而对给定的电流，更短的步长使电压加倍。跳变的大小仍与二极管关断前电感两端的电压大致相当：在库中的 DCM 降压变换器中，为其输出电压的约 0.7 到 1.4 倍。'
  - q: '为使二极管关断时节点电压不会跳到远远超出电源电压的范围，库中的电路加入了什么？'
    options:
      - '更短的时间步长'
      - '每个开关管两端的体二极管'
      - '对电感采用梯形法'
      - '恰好为 1 的耦合系数'
    answer: 1
    explain: '越过零点的电流经体二极管流通，因此节点电压超出电源轨的幅度不超过一个二极管压降；在电源轨范围之内，仍可能留下持续一步的跌落。缩短步长无济于事；能无跳变地承接该电流的，是用后向欧拉法计算的节点电容。'
  - q: '在变压器上勾选 Trapezoidal Approximation 后，输出二极管导通期间，DCM 反激变换器的漏极电压每一步都在约为预期电平两倍的值与零之间交替。原因是什么？'
    options:
      - '漏感与开关管的电容发生振铃'
      - '梯形法遇到比步长快得多的模态，而它对该模态的每步放大因子接近 -1'
      - '体二极管每隔一步导通一次'
      - '输出电容的串联电阻'
    answer: 1
    explain: '漏感形成一个比步长快得多的模态。梯形法每一步都把它乘以接近 -1 的数，因此它不衰减，只翻转符号；后向欧拉法对该模态的放大因子则接近零。'
  - q: '为什么库中的变压器采用 0.99999 而不是 1 作为耦合系数？'
    options:
      - '为了对实际变压器的漏感建模'
      - 'CircuitJS1 要对绕组电感矩阵求逆，而耦合系数为 1 时该矩阵是奇异的，其对话框也只接受小于 1 的值'
      - '耦合系数为 1 会使仿真变慢'
      - '为了使漏极电压的振铃衰减'
    answer: 1
    explain: '耦合系数为 1 时，电感矩阵的行列式 L1 L2 - M^2 为零，因此该矩阵不能求逆。0.99999 留下的漏感会在关断时给漏极电压叠加一个持续一步的尖峰，因为开关管在这一步之内截断了漏感电流；在库中的步长下，该尖峰不到一伏。'
