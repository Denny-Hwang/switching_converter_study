# 05-simulation/in-browser-simulator 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '仿真器为什么能精确计算每个开关区间？'
    options:
      - '因为它采用非常小的步长'
      - '因为它在浏览器中运行 SPICE'
      - '在一个区间内，电路是带恒定电源的线性电路，因此其解是可以计算的指数函数'
      - '因为变换器中没有电容'
    answer: 2
    explain: '区间内每个开关管和二极管都处于导通或关断状态；电路矩阵的指数给出任意步长上的精确解。'
  - q: '一个电容以 10 ns 的时间常数从 0 V 向 10 V 充电。经过一个 10 ns 的精确步后，它的电压是多少？'
    options:
      - '约 6.3 V'
      - '约 3.7 V'
      - '10 V'
      - '5 V'
    answer: 0
    explain: '与 10 V 的偏差在一个时间常数内衰减为原来的 1/e：10 V × (1 - 1/e) 约为 6.3 V。'
  - q: '用前向欧拉法以 50 ns 的步长计算时间常数为 10 ns 的模态。每一步把其偏差乘以多少？'
    options:
      - '约 0.007'
      - '1'
      - '-4'
      - '-1'
    answer: 2
    explain: '1 减去步长与时间常数之比，即 1 - 5：偏差的大小每一步都变为原来的四倍，并改变符号。'
  - q: '对于不振铃而衰减的模态，前向欧拉法的步长最大为多少时才能使其不增长？'
    options:
      - '时间常数的一半'
      - '时间常数'
      - '任意步长'
      - '时间常数的两倍'
    answer: 3
    explain: '放大因子，即 1 减去步长与时间常数之比，只有在步长不超过时间常数的两倍时，其绝对值才不超过 1；振铃的模态需要更短的步长。'
  - q: '仿真器如何求得周期稳态？'
    options:
      - '用牛顿法求解这样一个周期起始状态：一个周期把它映射回其自身'
      - '从零初始状态开始仿真，直到不再有任何变化'
      - '采用平均模型'
      - '从 ngspice 中读取'
    answer: 0
    explain: '稳态是从一个周期起点到下一个周期起点的映射的不动点；牛顿法利用该映射的导数求出它。'
  - q: '对于电流始终大于零、开关管两端没有电容的降压变换器，原则上需要几次牛顿迭代？'
    options:
      - '数百次'
      - '一次，因为此时周期映射是仿射的：矩阵乘以状态，再加上一个常数'
      - '与包络时间常数的个数相同'
      - '不需要'
    answer: 1
    explain: '开关时刻和各区间的顺序都不取决于状态，而仿射方程若解唯一，牛顿法一次迭代就能解出。二极管电流降到零，或开关管两端的电容需要先完成电压摆动，都会使某个时刻取决于状态，这时就需要几次迭代。'
