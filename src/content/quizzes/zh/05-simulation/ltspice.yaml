# 05-simulation/ltspice 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '元件理想时，降压变换器的输出滤波器在 10 ohm 负载和 10 µF 电容下振铃。振铃包络的时间常数是多少？'
    options:
      - '100 µs'
      - '200 µs'
      - '31.6 µs'
      - '取决于电感'
    answer: 1
    explain: '无论电感多大，包络都以负载电阻与电容之积的两倍为时间常数衰减：2 × 10 ohm × 10 µF 为 200 µs。'
  - q: '包络时间常数为 20 个开关周期。从零初始状态开始运行，大约需要多少个周期，启动误差才只剩百分之一？'
    options:
      - '20'
      - '46'
      - '92'
      - '2000'
    answer: 2
    explain: '误差在每个包络时间常数内衰减为原来的 1/e。降到百分之一需要 ln 100，约 4.6 个时间常数，因此约为 92 个周期。'
  - q: '把启动误差从百分之一继续降到万分之一，还要多花多少？'
    options:
      - '大约与降到最初的百分之一所花的一样多'
      - '一百倍'
      - '不用再花：误差已经很小'
      - '十分之一'
    answer: 0
    explain: '每缩小十倍都花费相同的时间，即 ln 10，约 2.3 个包络时间常数，因此再缩小两个十倍与最初两个十倍所花的一样多。'
  - q: '为什么包络公式不能说明 DCM 算例需要运行多久？'
    options:
      - 'DCM 算例没有稳态'
      - 'LTspice 无法仿真 DCM'
      - '在 DCM 下电容不充电'
      - '在 DCM 下，电感不会把任何东西从一个周期带到下一个周期，因此滤波器不会发生 L-C 振铃'
    answer: 3
    explain: '电感电流每个周期都回到零，因此决定包络的 L-C 振铃不复存在；输出改为以单一时间常数在稳态附近趋于稳定。'
  - q: '库的检查在认定一次运行已稳定之前，要求满足什么条件？'
    options:
      - '输出与理想公式完全相等'
      - '时间步长不同的两次运行结果一致'
      - '输出在最后一个周期内的平均值与前一个周期的平均值相比，相差在万分之一以内'
      - '运行持续了一千个周期'
    answer: 2
    explain: '仍在稳定过程中的运行会逐周期变化，而该检查比较最后两个周期的平均值。由于缓慢的振铃每个周期变化很小，这项检查只能发现远远过短的运行，因此库还让每个算例运行许多个时间常数。'
  - q: 'DCM 反激变换器的一次运行显示漏极电压下冲到远低于零，而电路本身不可能这样。首先应检查什么？'
    options:
      - '.options 行：积分方法和容差'
      - '匝比'
      - '负载电阻'
      - '开关频率'
    answer: 0
    explain: '在默认设置下，ngspice 和 LTspice 都会在库中的 DCM 反激变换器上绘出这种下冲；采用 Gear 法并收紧容差即可消除。'
