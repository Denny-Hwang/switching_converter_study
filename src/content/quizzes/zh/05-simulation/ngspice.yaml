# 05-simulation/ngspice 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '若网表未另行指定，ngspice 采用哪种积分方法？'
    options:
      - '后向欧拉法'
      - '梯形法'
      - '前向欧拉法'
      - 'Gear 法'
    answer: 1
    explain: '手册给出的 .options method 默认值是梯形法；Gear 法需要专门指定。'
  - q: '用梯形法以 20 ns 的步长计算时间常数为 1 ns 的模态。每一步把它乘以多少？'
    options:
      - '约 0.05'
      - '约 1'
      - '约 -19'
      - '约 -0.82'
    answer: 3
    explain: '步长的一半与时间常数之比为 10，放大因子为 (1 - 10)/(1 + 10)，即 -9/11：该模态保留其大部分幅度，并改变符号。'
  - q: '这个放大因子在仿真波形中表现为什么？'
    options:
      - '在每个时间点都翻转符号的振铃'
      - '缓慢的指数衰减'
      - '一次阶跃'
      - '什么也看不到：该模态太快，显示不出来'
    answer: 0
    explain: '接近 -1 的放大因子使该模态几乎不衰减，并在每个时间点翻转其符号：这是积分方法造成的振铃，而不是电路的振铃。'
  - q: '用后向欧拉法，即 Gear 法所用后向差分公式中的第一个，以 20 ns 的步长计算同一模态。它会怎样？'
    options:
      - '在每个时间点振铃'
      - '增长'
      - '一两步之后几乎消失'
      - '保持不衰减'
    answer: 2
    explain: '放大因子为 1/(1 + 20)，约为 0.05：两步之后，该模态剩下的不到四百分之一。'
  - q: '为什么 Gear 法仿真可能错误地表现轻阻尼的 L-C 振铃？'
    options:
      - '它使振铃增长'
      - '它使振铃频率加倍'
      - '它无法仿真电感'
      - '它会使步长未能精细分辨的振荡衰减，因此振铃比在实际电路中衰减得更快'
    answer: 3
    explain: '对于无阻尼振荡，后向欧拉法的放大因子绝对值小于 1，而梯形法的恰好为 1；步长较短时，两者的差别很小。'
  - q: '在 ngspice 的默认设置下，库中的 DCM 反激变换器表现出什么？'
    options:
      - '二极管停止导通后，二次电流在相邻两步之间围绕零来回振铃，漏极电压远低于零'
      - '正确的波形'
      - '比预期更高的输出电压'
      - '没有任何结果'
    answer: 0
    explain: '二极管关断后留下的快速模态在梯形法下振铃；采用 Gear 法并将相对容差设为 1e-4 后，振铃消失。'
