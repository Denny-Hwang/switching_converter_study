# 05-simulation/python 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '本站显示的公式来自哪里？'
    options:
      - '手工输入到各页面中的 LaTeX'
      - 'equations.yaml 中的一个条目：附有符号、测试和引用的 SymPy 表达式'
      - 'TypeScript 引擎'
      - '测验文件'
    answer: 1
    explain: '生成器根据该条目生成 LaTeX 和测试向量；若已提交的文件与生成结果不同，CI 就会失败。'
  - q: '为什么 TypeScript 求值函数是手工编写的，而不是从 equations.yaml 生成的？'
    options:
      - '为了使一方的错误不会被复制到另一方：两个独立的实现必须彼此一致'
      - '因为 TypeScript 无法读取 YAML'
      - '为了让页面加载得更快'
      - '因为 SymPy 无法进行数值计算'
    answer: 0
    explain: '生成的代码即使在源文件出错的地方也会与之一致；独立的实现则必须凭自身与测试向量一致。'
  - q: '将仿真得到的电压变换比 0.495 与理想值 0.5 比较。相对差是多少？'
    options:
      - '0.5 %'
      - '0.005 %'
      - '10 %'
      - '1 %'
    answer: 3
    explain: '差值 0.005 除以参考值 0.5 得 0.01，即 1 %。'
  - q: 'binary64 的单位舍入误差约为 1.1e-16。为什么一致性检查的容差是十亿分之一，而不是单位舍入误差？'
    options:
      - '因为 JavaScript 的精度低于 Python'
      - '两个正确的计算在每次运算中的舍入不同，结果可能相差若干个单位舍入误差；十亿分之一既为此留出余地，又仍能发现真正的错误'
      - '因为公式只精确到十亿分之一'
      - '因为 YAML 无法存放更小的数'
    answer: 1
    explain: '十亿分之一是单位舍入误差的数百万倍，因此在不放大舍入误差的计算中，舍入能够通过；而错误的常数或因子造成的差异要大得多。'
  - q: '为什么参考值接近零时相对差会失效？'
    options:
      - '除以接近零的参考值，会使极小的绝对差看起来很大'
      - '因为零没有单位'
      - '因为在那里它总是为零'
      - '不会失效'
    answer: 0
    explain: '在这种情况下，应像库的检查那样，与一个尺度比较，例如该物理量在一个周期内的最大值。'
  - q: '在 Python 中，0.1 + 0.1 + 0.1 == 0.3 的计算结果是：'
    options:
      - 'True'
      - '报错'
      - 'False：其和被舍入为一个不同于 0.3 的双精度数'
      - '仅在某些计算机上为 True'
    answer: 2
    explain: '0.1 无法用二进制精确表示，三者之和经舍入后为 0.30000000000000004，是与 0.3 相邻的双精度数；应在容差范围内比较。'
