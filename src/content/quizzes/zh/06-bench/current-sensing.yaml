# 06-bench/current-sensing 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '2 milliohm 的分流电阻中流过 5 A 电流。其检测电压是多少？'
    options:
      - '2.5 mV'
      - '10 mV'
      - '100 mV'
      - '0.4 mV'
    answer: 1
    explain: '欧姆定律：5 A 乘以 2 milliohm。'
  - q: '分流电阻的负担电压（burden）是什么？'
    options:
      - '其额定功率'
      - '放大器的失调'
      - '它从被测电路中占去的电压，即其检测电压'
      - 'ADC 的误差'
    answer: 2
    explain: '检测电压既是信号，也是被测电路在分流电阻上损失的电压。'
  - q: '低侧分流电阻对负载有什么影响？'
    options:
      - '使负载的电源电压升高'
      - '没有影响：分流电阻位于接地回流路径中'
      - '使负载与地隔离'
      - '使负载的地比电源的地高出一个检测电压'
    answer: 3
    explain: '接地回流路径经过分流电阻，因此负载的地随电流变动。'
  - q: '什么情况下高侧检测更好？'
    options:
      - '最低成本最重要时'
      - '电流很小时'
      - '负载的地不允许变动时'
      - '从不：低侧检测总是更好'
    answer: 2
    explain: '高侧检测使分流电阻不在接地回流路径中，代价是放大器须工作在电源电压下。'
  - q: '在焊盘外侧检测一个 1 milliohm 的分流电阻，焊盘增加了 0.05 milliohm。读数偏差多少？'
    options:
      - '偏低 5 %'
      - '在任何电流下都偏高 5 %'
      - '偏高 0.05 %'
      - '取决于电流'
    answer: 1
    explain: '偏差为焊盘电阻与分流电阻之比，在任何电流下都相同。'
  - q: '开尔文连接（Kelvin connection）有什么作用？'
    options:
      - '降低分流电阻的阻值'
      - '抵消放大器的失调'
      - '滤除开关噪声'
      - '在分流电阻自身的端子上检测电压，使焊盘和焊点不计入读数'
    answer: 3
    explain: '单独的检测连接几乎不流过电流，因此焊盘电阻上的压降不会进入读数。'
