# 06-bench/gate-drive 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '开通时，在漏极电压下降期间，栅源电压如何变化？'
    options:
      - '以最快的速度上升'
      - '降到零'
      - '振荡'
      - '保持不变：即米勒平台'
    answer: 3
    explain: '漏极电压下降时，驱动器所能提供的全部栅极电流都用于为栅漏电容放电，因此栅极电压停留在平台上。'
  - q: '12 V 驱动器经总计 4 ohm 的电阻驱动栅极；平台电压为 4 V。开通时平台期间的栅极电流是多少？'
    options:
      - '3 A'
      - '2 A'
      - '1 A'
      - '4 A'
    answer: 1
    explain: '驱动器电压减去平台电压，即 8 V，加在 4 ohm 的栅极回路上。'
  - q: '栅漏电荷为 20 nC，平台期间的栅极电流为 2 A。漏极电压完成跳变需要多长时间？'
    options:
      - '40 ns'
      - '1 ns'
      - '10 ns'
      - '100 ns'
    answer: 2
    explain: '平台持续时间为栅漏电荷除以栅极电流：20 nC 除以 2 A。'
  - q: '栅极回路在两个边沿的电阻相同；平台电压为 3 V，驱动电压为 10 V。哪一次跳变更慢？'
    options:
      - '开通'
      - '两者用时相同'
      - '只取决于栅漏电荷'
      - '关断，因为平台电压推动的电流小于开通时剩余的 7 V 所推动的电流'
    answer: 3
    explain: '开通时由 7 V 推动栅极电流；关断时只有 3 V 的平台电压经同一电阻推动栅极电流。'
  - q: '高侧导通期间，自举电容提供 40 nC 电荷，允许跌落 0.4 V。它至少需要多大的电容？'
    options:
      - '100 nF'
      - '16 nF'
      - '10 nF'
      - '1 uF'
    answer: 0
    explain: '电荷除以允许的跌落：40 nC 除以 0.4 V。'
  - q: '自举电容过小时可能发生什么？'
    options:
      - '其电压跌落可能使驱动器的欠压锁定（UVLO）关断高侧开关管'
      - '低侧开关管无法开通'
      - '开关频率加倍'
      - '什么也不会发生：驱动器会自行稳定其电源'
    answer: 0
    explain: '高侧导通期间只有该电容为其供电；电容太小，电压就会跌落到驱动器的锁定阈值以下。'
