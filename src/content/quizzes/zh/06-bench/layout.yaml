# 06-bench/layout 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '在降压变换器中，哪个回路的电流在每个边沿都发生切换？'
    options:
      - '电感和输出电容'
      - '输出电容和负载'
      - '输入电容、开关管和二极管（或第二个开关管）'
      - '反馈分压器'
    answer: 2
    explain: '在每个边沿，开关管、二极管和输入电容的电流都阶跃变化一个电感电流，而电感电流继续流动：由这三者构成的回路就是电流发生切换的回路。'
  - q: '在 5 nH 的回路中，10 A 的电流在 10 ns 内降到零。回路产生多大的电压？'
    options:
      - '5 V'
      - '0.5 V'
      - '50 V'
      - '无论回路如何，都是每纳秒 500 mV'
    answer: 0
    explain: '回路电感乘以电流变化量再除以边沿时间：5 nH 乘以 10 A，再除以 10 ns。'
  - q: '开关管的速度提高到两倍。同一回路上的电压如何变化？'
    options:
      - '减半'
      - '不变'
      - '变为四倍'
      - '加倍'
    answer: 3
    explain: '电压等于回路电感乘以电流阶跃再除以边沿时间；边沿时间减半，电压加倍。'
  - q: '关断时，回路电感上的电压出现在哪里？'
    options:
      - '只出现在负载两端'
      - '出现在开关管两端，叠加在输入电压上'
      - '出现在输出电容两端'
      - '哪里都不出现：电感只储存能量，不产生电压'
    answer: 1
    explain: '沿回路应用基尔霍夫电压定律：电流下降期间，电感上的电压叠加在开关管两端的输入电压上。'
  - q: '降压变换器中，哪个元件必须离开关管最近？'
    options:
      - '输出电容'
      - '反馈分压器'
      - '输入电容'
      - '输出连接器'
    answer: 2
    explain: '它闭合电流发生切换的回路；该回路越短，其电感越小，每个边沿在其上产生的电压也越小。'
  - q: '为什么开关节点的铜箔面积是一个折中？'
    options:
      - '它要流过电流并为开关管散热，但其电压摆动会耦合到相邻走线上'
      - '铜很贵'
      - '面积越大，开关频率越低'
      - '开关节点不流过电流'
    answer: 0
    explain: '该节点需要铜箔来通流和散热，而其电压摆动会经杂散电容向附近走线注入电流。'
  - q: '反馈走线应如何布线？'
    options:
      - '紧挨开关节点，以缩短走线'
      - '尽量远离电感和噪声大的功率走线'
      - '从电感下方穿过'
      - '无关紧要：控制器会将其滤除'
    answer: 1
    explain: '控制器调节的是走线送来的电压；走线途中拾取的电压最终会出现在输出中。'
