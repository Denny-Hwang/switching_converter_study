# 06-bench/low-temp 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '某输出电容的 ESR 为 0.02 ohm，流入它的纹波电流峰峰值为 3 A。ESR 产生多大的纹波？'
    options:
      - '峰峰值 60 mV'
      - '峰峰值 6 mV'
      - '峰峰值 0.6 V'
      - '峰峰值 150 mV'
    answer: 0
    explain: 'ESR 乘以纹波电流峰峰值：0.02 ohm 乘以 3 A。'
  - q: '假设该电容是铝电解电容，其数据手册显示 ESR 在低温极限下升高到十倍以上。在该温度下，上述纹波会怎样？'
    options:
      - '保持 60 mV 不变'
      - '因电容变冷而减小'
      - '升高到十倍以上，超过 0.6 V'
      - '消失'
    answer: 2
    explain: 'ESR 纹波与 ESR 成正比：在室温下满足的限值，在低温下可能被超出。'
  - q: '2 类陶瓷电容的代码（如 X7R）说明了什么？'
    options:
      - '其在额定电压下的电容量'
      - '其电容量随温度的变化，而不涉及直流电压'
      - '其电容量不变'
      - '其 ESR'
    answer: 1
    explain: '该代码不隐含任何关于电压系数的信息：应在其实际工作的直流电压下检查电容量。'
  - q: '某电芯的开路电压为 3.6 V，内阻为 0.08 ohm。以 2.5 A 充电时，其端电压是多少？'
    options:
      - '3.8 V'
      - '3.6 V'
      - '3.4 V'
      - '4.2 V'
    answer: 0
    explain: '充电电流使端电压升高 2.5 A 乘以 0.08 ohm，即 0.2 V。'
  - q: '充电器把电芯的端电压维持在 4.2 V，而电芯的开路电压为 4.0 V。内阻为 0.1 ohm 时和为 0.4 ohm 时，电流各是多少？'
    options:
      - '两种情况都是 2 A'
      - '先是 0.5 A，后是 2 A'
      - '先是 2 A，后是 0.5 A'
      - '先是 42 A，后是 10.5 A'
    answer: 2
    explain: '电流等于 (4.2 V - 4.0 V) 除以电阻：在同一限压值下，电阻越大，电流越小。'
  - q: '电芯的放电电流从 1 A 阶跃到 3 A 时，其端电压从 3.70 V 降到 3.52 V。其内阻是多少？'
    options:
      - '0.18 ohm'
      - '0.06 ohm'
      - '1.17 ohm'
      - '0.09 ohm'
    answer: 3
    explain: '在 Rint 模型中，电压阶跃除以电流阶跃即为内阻：0.18 V 除以 2 A。'
  - q: '为什么不得在低于充电下限温度时给锂离子电芯充电？'
    options:
      - '其开路电压变为零'
      - '充电器的限压值不再适用'
      - '其碳负极较难接受锂离子，金属锂更容易在碳表面析出'
      - '其内阻变为零'
    answer: 2
    explain: '低温下碳负极较难接受锂离子，使金属锂更容易在其表面析出，电池的热稳定性也随之降低。'
