# 06-bench/probes 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '探头长接地线形成的回路对测得的开关沿有什么影响？'
    options:
      - '它引入电感，使瞬态看起来比实际更大'
      - '它对边沿滤波，使瞬态看起来更小'
      - '没有影响：接地线不流过电流'
      - '它只使边沿在时间上平移'
    answer: 0
    explain: '引线构成一个回路，其电感会夸大瞬态，并与探头的电容一起在每个边沿振铃。'
  - q: '50 nH 的接地线与 20 pF 的探头电容发生振铃。若把接地线缩短为原来的四分之一（电感变为四分之一），振铃频率如何变化？'
    options:
      - '升高到四倍'
      - '升高到两倍'
      - '降低到二分之一'
      - '不变：它由电容决定'
    answer: 1
    explain: '谐振频率与电感的平方根成反比：电感变为四分之一，频率加倍。'
  - q: '某单极点测量系统的带宽为 350 MHz。它显示的理想阶跃上升时间是多少？'
    options:
      - '约 0.35 ns'
      - '约 3.5 ns'
      - '瞬间上升'
      - '约 1 ns'
    answer: 3
    explain: '上升时间约为 0.35 除以带宽：0.35 除以 350 MHz。'
  - q: '为什么两台带宽相同的示波器对同一边沿可能显示不同的上升时间？'
    options:
      - '带宽与上升时间之间的常数取决于各自频率响应的形状'
      - '它们的探头颜色不同'
      - '上升时间与示波器无关'
      - '其中一台一定坏了'
    answer: 0
    explain: '带宽相同时，平坦响应和高斯响应测得的上升时间不同。'
  - q: '应如何测量输出纹波？'
    options:
      - '用手头最长的接地线，以便够得远'
      - '在电感两端测量'
      - '在输出电容处，用针尖-套筒法（tip-and-barrel method）或极短的接地测量'
      - '把探头设置为测量电流'
    answer: 2
    explain: '短接地使探头的回路以及被它夸大的瞬态都保持很小。'
  - q: '通道的带宽限制设在纹波频率附近。会发生什么？'
    options:
      - '纹波读数偏高'
      - '它衰减纹波本身，读数偏低'
      - '没有影响：带宽限制只滤除噪声'
      - '示波器停止触发'
    answer: 1
    explain: '低通滤波器会衰减其转折频率附近及以上的所有成分，纹波也不例外。'
