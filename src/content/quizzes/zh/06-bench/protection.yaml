# 06-bench/protection 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '24 V 电源经总计 0.05 ohm 的电阻接通到未充电的 470 uF 电容上，布线电感可忽略。峰值电流是多少？'
    options:
      - '24 A'
      - '11.3 A'
      - '480 A'
      - '0.2 A'
    answer: 2
    explain: '整个阶跃电压都落在串联电阻上：24 V 除以 0.05 ohm。'
  - q: '把电容换成 ESR 相同、电容量减半的电容。峰值如何变化？'
    options:
      - '不变'
      - '减半'
      - '加倍'
      - '降到零'
    answer: 0
    explain: '在 R-C 模型中，阶跃瞬间无论电容多大，其两端都没有电压：只有串联电阻限制峰值。由于时间常数减半，脉冲变短。'
  - q: '第一个脉冲（24 V、470 uF、0.05 ohm）的焦耳积分是多少？'
    options:
      - '5.41 A^2 s'
      - '1.35 A^2 s'
      - '2.71 A^2 s'
      - '0.14 A^2 s'
    answer: 2
    explain: 'V^2 C / (2 R) = 576 乘以 470e-6 再除以 0.1，即 2.71 A^2 s。'
  - q: '用线性斜坡把同一个 470 uF 电容的电压升到 24 V。要使浪涌电流为 2 A，斜坡需要多长？'
    options:
      - '2.82 ms'
      - '11.3 ms'
      - '0.564 ms'
      - '5.64 ms'
    answer: 3
    explain: '电流等于 C V 除以斜坡时间，因此斜坡时间等于 C V 除以电流：470e-6 乘以 24 再除以 2。'
  - q: '由与固定 24 V 电源串联的负载开关产生该斜坡。与阶跃相比，电容充电期间路径耗散多少能量？'
    options:
      - '不耗散：缓慢的斜坡没有损耗'
      - '相同，与电容储存的能量相等，现在大部分耗散在负载开关中'
      - '一半'
      - '两倍'
    answer: 1
    explain: '无论哪种方式，电源都输出 C V^2，电容保留 C V^2/2；斜坡降低了电流，并把损耗分散到一段时间内。'
  - q: '较高的环境温度对保险丝有什么影响？'
    options:
      - '没有影响，保险丝只取决于其电流'
      - '在更大的电流下熔断'
      - '寿命更长'
      - '工作温度更高，寿命更短'
    answer: 3
    explain: '环境温度越高，保险丝的工作温度越高，寿命越短。'
  - q: '与 12 V 电池串联的二极管保护负载免受电池反接的影响。负载平均吸取 2 A，二极管压降为 0.7 V。忽略其电阻，二极管的代价是多少？'
    options:
      - '没有代价：它只在电池反接时起作用'
      - '1.4 W，只要电路在工作就一直存在'
      - '24 W'
      - '0.35 W'
    answer: 1
    explain: '只要电池接法正确，它就流过全部负载电流：0.7 V 乘以 2 A。'
