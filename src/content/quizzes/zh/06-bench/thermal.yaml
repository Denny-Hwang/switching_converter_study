# 06-bench/thermal 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '某器件在 25 C 的空气中耗散 3 W，热量依次经过 2、1 和 12 K/W 的串联热阻（结至外壳、外壳至散热器、散热器至空气）。其结温是多少？'
    options:
      - '45 C'
      - '61 C'
      - '100 C'
      - '70 C'
    answer: 3
    explain: '各段温升相加：3 W 乘以 15 K/W 为 45 K，因此结温比 25 C 高 45 K。'
  - q: '哪项改动使该结温降低最多？'
    options:
      - '换用热阻减半的散热器'
      - '换用热阻减半的界面材料'
      - '换用结至外壳热阻减半的器件'
      - '三者效果相同'
    answer: 0
    explain: '散热器的热阻最大，在温升中所占份额也最大：将其减半可降低 18 K，其余两项分别降低 1.5 K 和 3 K。'
  - q: '数据手册中的结至环境热阻描述的是什么？'
    options:
      - '任何电路板上的结至环境路径'
      - '仅封装本身'
      - '器件测量时到空气的整条路径，包括电路板和气流'
      - '器件所需的散热器'
    answer: 2
    explain: '它是最常给出的指标，也常被误用：它只对应其测量条件。'
  - q: '某无散热器的器件耗散 1.5 W，其封装顶部温度读数为 70 C，数据手册给出的结至顶部参数为 4 K/W。结温是多少？'
    options:
      - '70 C'
      - '64 C'
      - '100 C'
      - '76 C'
    answer: 3
    explain: '顶部温度加上该参数与全部功率之积：70 C 加 6 K。'
  - q: '为什么结至顶部参数不能计入串联热路？'
    options:
      - '它不是真正的热阻：只有部分功率流经封装顶部'
      - '它总是为零'
      - '它的单位不同'
      - '它已经包含了散热器'
    answer: 0
    explain: '它把两个温度与全部功率联系起来，而大部分功率经其他路径散出。'
  - q: '为什么要按高温下的结温估算开关管的导通损耗？'
    options:
      - '温度高时电流会减小'
      - '其导通电阻随温度升高，升高倍数由数据手册的归一化曲线给出'
      - '导通损耗与温度无关'
      - '栅极电荷增大'
    answer: 1
    explain: '按室温估算的损耗偏低，而多出的损耗会使结温进一步升高。'
