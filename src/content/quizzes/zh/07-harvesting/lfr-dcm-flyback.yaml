# 07-harvesting/lfr-dcm-flyback 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个反激变换器工作在 5 kHz、占空比 0.1，须在 DCM 下呈现 20 kohm，即源内阻。它需要多大的励磁电感？'
    options:
      - '20 mH'
      - '40 mH'
      - '2 mH'
      - '200 mH'
    answer: 0
    explain: '输入电阻乘以占空比的平方，再除以开关频率的两倍：2e4 乘以 0.01 除以 1e4，即 0.02 H。'
  - q: '开关频率和电阻不变，占空比加倍到 0.2。此时需要多大的电感？'
    options:
      - '40 mH'
      - '10 mH'
      - '80 mH'
      - '20 mH'
    answer: 2
    explain: '电感随占空比的平方增大：为 20 mH 的四倍。'
  - q: '与线性源匹配的 DCM 反激变换器把输入电压保持在何处？'
    options:
      - '电源的开路电压'
      - '临界输入电压'
      - '输出电压乘以匝比'
      - '电源开路电压的一半'
    answer: 3
    explain: '其输入电阻等于源内阻，因此两者把电源电压平分。'
  - q: '电源不断增强，直到分压所得的电压将超过临界输入电压。反激变换器会怎样？'
    options:
      - '进入 CCM，CCM 把其输入保持在临界电压'
      - '保持在 DCM，输入继续升高'
      - '停止开关'
      - '输出电压随电源升高'
    answer: 0
    explain: '输出固定时，CCM 电压变换比只允许临界输入电压：母线电压被保持在该值，反激变换器成为恒压负载。'
  - q: '一个反激变换器输出 5 V，二极管压降 0.5 V，占空比 0.2，匝比 0.1，输入处在 75 V。其临界输入电压是多少？它是否工作在 DCM？'
    options:
      - '55 V, CCM'
      - '220 V, DCM'
      - '27.5 V, CCM'
      - '440 V, DCM'
    answer: 1
    explain: '5.5 V 乘以 0.8，除以（0.1 乘以 0.2），得 220 V；输入低于该值，因此反激变换器工作在 DCM。'
  - q: '在漏感尖峰之前，其开关管阻断的电压是多少？'
    options:
      - '75 V'
      - '80.5 V'
      - '130 V'
      - '550 V'
    answer: 2
    explain: '输入电压加上经匝比反射的输出电压与二极管电压之和：75 V 加上 5.5 V 除以 0.1。'
  - q: '励磁电感实际偏低 10 %。反激变换器大约损失多少可用功率？'
    options:
      - '10 %'
      - '5 %'
      - '1 %'
      - '四分之一个百分点'
    answer: 3
    explain: '输入电阻同样偏低 10 %；在提取比例的峰值处，偏离某一比例只损失约该比例平方的四分之一：4 乘以 0.9 除以 1.9 的平方，得 0.997。'
