# 07-harvesting/matching 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个 10 V、源内阻为 25 ohm 的线性源给保持在 5 V 的电池充电，电池直接与之相连。电池取得可用功率的多大比例？'
    options:
      - '一半'
      - '全部'
      - '四分之一'
      - '四分之三'
    answer: 1
    explain: '电池电压为开路电压的一半，恒定电压在此处取得全部可用功率：0.2 A 乘以 5 V 为 1 W，而可用功率为 100 除以 100，也是 1 W。'
  - q: '同一电源改为给保持在 2 V 的电池充电。电池取得多大比例？'
    options:
      - '0.2'
      - '0.8'
      - '0.64'
      - '0.36'
    answer: 2
    explain: '2 乘以 8 的四倍，除以 10 的平方：64 除以 100。电池吸取 8 V 除以 25 ohm，即 0.32 A，电压为 2 V：在可用的 1 W 中取得 0.64 W。'
  - q: '一个相当于 100 ohm 无损电阻的变换器从同一 25 ohm 电源吸取功率。它取得多大比例？'
    options:
      - '0.64'
      - '0.8'
      - '0.25'
      - '1'
    answer: 0
    explain: '25 乘以 100 的四倍，除以 125 的平方：10000 除以 15625，即 0.64。'
  - q: '电源的开路电压加倍。无损电阻取得的比例如何变化？'
    options:
      - '加倍'
      - '减半'
      - '降为四分之一'
      - '不变'
    answer: 3
    explain: '两个电阻对任何电源电压都按同一比例分压：该比例只取决于电阻。'
  - q: '10 V 电源加倍到 20 V，而电池仍为 5 V。此时电池取得多大比例？'
    options:
      - '全部'
      - '0.75'
      - '0.5'
      - '0.25'
    answer: 1
    explain: '5 乘以 15 的四倍，除以 20 的平方：300 除以 400。该比例取决于电池电压相对于电源电压的大小，因此电池电压固定时，只要电源幅值变化，该比例就随之变化。'
  - q: '哪种变换器的输入是无损电阻？'
    options:
      - 'CCM 下的降压变换器'
      - '任何占空比固定的变换器'
      - '占空比固定、工作在 DCM 的升降压变换器或反激变换器'
      - '占空比固定、工作在 CCM 的升压变换器'
    answer: 2
    explain: '在固定占空比的 DCM 下，升降压变换器或反激变换器吸取的平均输入电流与其输入电压成正比，并把功率传递出去。'
