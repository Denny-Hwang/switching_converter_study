# 07-harvesting/sece-sshi-mppt 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个压电元件的开路电压幅值为 2 V。全波整流桥在多大的直流电压下从中取得的功率最大？'
    options:
      - '2 V'
      - '4 V'
      - '1 V'
      - '0.5 V'
    answer: 2
    explain: '标准接口电路在开路电压幅值的一半处最佳。'
  - q: '该整流桥后的储能元件已充电到 2 V。此时整流桥输出多少功率？'
    options:
      - '零：在两侧电源轨之间摆动耗尽了全部电荷'
      - '其最大功率'
      - '其最大功率的一半'
      - '其最大功率的两倍'
    answer: 0
    explain: '在开路电压幅值处，元件电压每个半周期都恰好只能到达另一侧电源轨，没有电荷留给整流桥。'
  - q: 'SECE 的功率与标准接口电路的最大功率相比如何？'
    options:
      - '相同'
      - '两倍'
      - '一半'
      - '四倍'
    answer: 3
    explain: 'SECE 在每个极值处取走元件的全部能量：I_p 平方的两倍除以 pi omega C_0，为标准接口电路最大功率的四倍。'
  - q: 'SECE 接口电路后的储能元件从 2 V 充电到 4 V。收集的功率如何变化？'
    options:
      - '不变'
      - '减半'
      - '加倍'
      - '降为零'
    answer: 0
    explain: '元件从不与储能元件直接相连：变换器在每个极值处取走元件中储存的能量，并以储能元件当时的电压将其输出，因此功率与该电压无关。'
  - q: '并联 SSHI 的翻转保留一半电压。其最大功率与标准接口电路的最大功率相比如何？'
    options:
      - '两倍'
      - '四倍'
      - '十倍'
      - '相同'
    answer: 1
    explain: '2 除以 1 与翻转系数之差：2 除以 0.5。'
  - q: '对于这个 2 V 的元件，该 SSHI 接口电路在多大的直流电压下最佳？'
    options:
      - '1 V'
      - '2 V'
      - '8 V'
      - '4 V'
    answer: 3
    explain: '在开路电压幅值除以 1 与翻转系数之差处：2 V 除以 0.5。'
  - q: '某变换器把输入保持在开路电压的固定比例处，以跟踪线性源的最大功率点。这个比例是多少？'
    options:
      - '80 %'
      - '50 %'
      - '100 %'
      - '25 %'
    answer: 1
    explain: '线性源在开路电压的一半处向恒定电压输出的功率最大。'
  - q: '对于 2 V 的元件，SECE 变换器必须承受多大的电压？'
    options:
      - '2 V'
      - '1 V'
      - '4 V'
      - '8 V'
    answer: 2
    explain: '元件从零开始保持开路，每次提取之前其电压都会升到开路电压幅值的两倍。'
