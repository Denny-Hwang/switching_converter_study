# 07-harvesting/source-models 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个线性源的开路电压为 20 V，源内阻为 50 ohm。它最多能给出多少功率？'
    options:
      - '8 W'
      - '2 W'
      - '4 W'
      - '0.5 W'
    answer: 1
    explain: '开路电压的平方除以源内阻的四倍：400 除以 200 得 2 W，由 50 ohm 的负载取得。'
  - q: '该电源向哪种负载输出的功率最大？'
    options:
      - '短路，它吸取的电流最大'
      - '开路，它的电压最高'
      - '与源内阻相等的电阻，即 50 ohm'
      - '源内阻两倍的电阻'
    answer: 2
    explain: '接匹配负载时，开路电压的一半降在负载上，另一半降在源内阻上；短路或开路都完全取不到功率。'
  - q: '一个压电元件在 2000 rad/s 下输出幅值为 50 uA 的电流，与 25 nF 的夹持电容并联。其开路电压幅值是多少？'
    options:
      - '1 V'
      - '0.5 V'
      - '2 V'
      - '4 V'
    answer: 0
    explain: '不接任何电路时，全部电流都对该电容充放电：50e-6 除以（2000 乘以 25e-9），即 1 V。'
  - q: '最佳电阻从该元件取得多少功率？'
    options:
      - '25 uW'
      - '50 uW'
      - '6.25 uW'
      - '12.5 uW'
    answer: 3
    explain: '最佳电阻等于该电容的电抗，1/(2000 乘以 25e-9) = 20 kohm，它取得的功率为电流幅值的平方除以 omega C_0 的四倍：2.5e-9 除以 2e-4，即 12.5 uW。'
  - q: '振动频率加倍，电流幅值不变。最佳电阻如何变化？'
    options:
      - '加倍'
      - '减半'
      - '不变'
      - '降为四分之一'
    answer: 1
    explain: '它是夹持电容的电抗，即 omega C_0 的倒数，omega 加倍时它减半。'
  - q: '为什么示波器探头会改变高阻抗电源的读数？'
    options:
      - '其输入电阻和输入电容与电源并联，分走一部分电流'
      - '它给每个读数都加上一个直流失调'
      - '它改变振动频率'
      - '不会：探头不吸取电流'
    answer: 0
    explain: '探头本身就是负载。对于最佳电阻很大的电源，探头的输入电阻和输入电容不可忽略。'
  - q: 'Zi 等的性能优值把哪两项相乘来评价摩擦纳米发电机？'
    options:
      - '开路电压乘以短路电流'
      - '送入固定电阻的功率乘以面积'
      - '电容乘以频率'
      - '由设计决定的结构优值，乘以表面电荷密度的平方'
    answer: 3
    explain: '它评价一个周期所能输出的能量，按单位面积和单位位移计：由设计部分和材料部分组成，材料部分即表面电荷密度的平方。'
