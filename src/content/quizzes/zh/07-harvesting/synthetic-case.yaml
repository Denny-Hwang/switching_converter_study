# 07-harvesting/synthetic-case 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个电源串联 1 Mohm，其开路电压升到 500 V。它在峰值处最多能给出多少功率？'
    options:
      - '62.5 mW'
      - '125 mW'
      - '250 mW'
      - '31.3 mW'
    answer: 0
    explain: '500 V 的平方除以 1e6 ohm 的四倍：250000 除以 4e6，即 62.5 mW。'
  - q: '一个匹配的无损电阻在一个缓慢的正弦包络上始终保持 DCM，该包络的峰值即上题中的峰值。它取得的平均功率是多少？'
    options:
      - '62.5 mW'
      - '31.3 mW'
      - '15.6 mW'
      - '44.2 mW'
    answer: 1
    explain: '功率随包络的平方变化，而正弦平方的平均值是其峰值平方的一半：即 62.5 mW 的一半。'
  - q: '一个反激变换器工作在 2 kHz、占空比 0.05，须呈现 1 Mohm。它需要多大的励磁电感？'
    options:
      - '1.25 H'
      - '2.5 H'
      - '0.625 H'
      - '6.25 H'
    answer: 2
    explain: '电阻乘以占空比的平方，再除以开关频率的两倍：1e6 乘以 0.0025 除以 4000。'
  - q: '对于幅值按包络变化的电源，应在何处检查 DCM？'
    options:
      - '包络的平均值处'
      - '包络的起始处'
      - '任何地方：DCM 与电源无关'
      - '包络峰值处，此时母线电压最高'
    answer: 3
    explain: '临界输入电压是固定的；母线电压在峰值处最高，CCM 会首先在那里接管。'
  - q: '母线电容为 1 uF，源内阻和反激变换器的输入电阻均为 1 Mohm。母线的时间常数是多少？'
    options:
      - '0.5 s'
      - '1 s'
      - '2 s'
      - '0.25 s'
    answer: 0
    explain: '电容乘以两个电阻的并联值：1e-6 乘以 0.5e6 ohm。'
  - q: '反激变换器停止开关，母线上也没有其他负载。电源开路电压为 1 kV、串联 1 Mohm 时，母线电压稳定在何处？'
    options:
      - '零：1 Mohm 几乎不让电流通过'
      - '开路电压的一半'
      - '全部开路电压，即 1 kV'
      - '临界输入电压'
    answer: 2
    explain: '没有负载时，没有电流流过，源内阻上也没有压降：电容充到全部开路电压，并保持住。'
