# 09-missions/m1-derive-buck 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '稳态下，电感电压在一个开关周期内的平均值为什么为零？'
    options:
      - '因为输出电容使输出电压保持恒定'
      - '因为电感电流在每个周期结束时回到其起始值'
      - '因为开关管和二极管导通的时间相等'
      - '因为输入电压恒定'
    answer: 1
    explain: '电感电流在一个周期内的变化量，等于其平均电压乘以周期再除以电感量。逐周期重复的电流变化量为零，因此平均电压为零：这就是伏秒平衡。'
  - q: '一个 CCM 降压变换器由 48 V 供电，占空比为 0.25。其输出电压是多少？'
    options:
      - '36 V'
      - '64 V'
      - '12 V'
      - '16 V'
    answer: 2
    explain: '电压变换比等于占空比：0.25 乘以 48 V 为 12 V。'
  - q: '一个降压变换器的电感电流在 1.0 A 与 1.6 A 之间变化。按本站的约定，$\Delta i_L$ 是多少？'
    options:
      - '0.6 A'
      - '0.3 A'
      - '1.3 A'
      - '1.6 A'
    answer: 1
    explain: '纹波峰峰值为 0.6 A，$\Delta i_L$ 是它的一半，即 0.3 A，与 Erickson 相同。平均电流为 1.3 A。'
  - q: '将 CCM 降压变换器的电感量加倍，其余不变。$\Delta i_L$ 如何变化？'
    options:
      - '减半'
      - '加倍'
      - '不变'
      - '降为四分之一'
    answer: 0
    explain: '导通区间内电流的斜率等于电感电压除以电感量，因此在同样时间内的上升量减半。'
  - q: '修改 equations.yaml 中某个公式的一个测试的期望值，而不改动其表达式。结果如何？'
    options:
      - '在构建站点之前什么也不会发生'
      - '只有 TypeScript 测试失败'
      - '生成器拒绝执行，并指出该条目、该测试以及表达式给出的值'
      - 'mathlint 报告一个手工输入的公式'
    answer: 2
    explain: '加载目录时会用表达式计算每个测试，因此生成器和 pytest 都会在第一个不一致处停止，并指出其位置。'
  - q: '修改一个表达式及其期望值，使它们彼此一致。哪项检查仍能发现这一错误？'
    options:
      - '没有：测试都能通过'
      - '推导测试：sympy 推导必须复现 equations.yaml 中的表达式'
      - '隐私扫描'
      - '链接检查器'
    answer: 1
    explain: '测试值只是拿表达式与其自身核对。python/pe_core/derive/ 中的推导独立于 YAML，由 pytest 比较两者。'
