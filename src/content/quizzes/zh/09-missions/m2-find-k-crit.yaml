# 09-missions/m2-find-k-crit 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个降压变换器的 $L$ = 50 µH，$f_s$ = 200 kHz，负载为 20 ohm。$K$ 是多少？'
    options:
      - '0.5'
      - '1'
      - '2'
      - '0.25'
    answer: 1
    explain: '$K$ 等于 $2L$ 除以 $R T_s$，即 $2 L f_s$ 除以 $R$：2 乘以 50 µH 再乘以 200 kHz 得 20 ohm，再除以 20 ohm 得 1。'
  - q: '该降压变换器工作在 $D$ = 0.75。它处于 CCM 吗？'
    options:
      - '是：$K$ = 1 高于 $K_\mathrm{crit}$ = 0.25'
      - '否：$K$ = 1 低于 $K_\mathrm{crit}$ = 1.33'
      - '只有输出电容足够大时才是'
      - '恰好处于临界点'
    answer: 0
    explain: '降压变换器的临界值为 $1 - D$ = 0.25，而 CCM 要求 $K > K_\mathrm{crit}$。'
  - q: 'CCM 降压变换器的负载越来越轻。最先发生的是什么？'
    options:
      - '电感饱和'
      - '输出电压下降'
      - '电感电流在周期结束前降到零：变换器进入 DCM'
      - '电感电流纹波增大'
    answer: 2
    explain: '$R$ 越大，$K$ 越小。纹波与负载无关，因此平均电流减小时，电流的谷值会降到零；低于 $K_\mathrm{crit}$ 时，它会在周期的一部分时间内保持为零。'
  - q: '升压变换器的临界值在哪个占空比下最大？'
    options:
      - '$D$ = 1/2'
      - '$D$ = 1/3'
      - '$D$ = 2/3'
      - '一直增大到 $D$ = 1'
    answer: 1
    explain: '升压变换器的临界值 $D(1-D)^2$ 在 $D$ = 1/3 处斜率为零，此处其值为 4/27。$K$ 高于 4/27 的升压变换器在任何占空比下都保持 CCM。'
  - q: '一个 $D$ = 0.5 的降压变换器随负载减轻进入 DCM。与 $D V_g$ 相比，其输出电压如何？'
    options:
      - '更高'
      - '更低'
      - '相同：两种工作模式下变换比都是 $D$'
      - '为零'
    answer: 0
    explain: '在 DCM 下，变换比还取决于 $K$，并随负载减轻从 $D$ 向 1 升高。'
  - q: '一个降压变换器刚好处于 DCM，将其开关频率加倍。结果如何？'
    options:
      - '没有变化：临界点只取决于 $D$'
      - '$K$ 加倍，变换器可能回到 CCM'
      - '$K$ 减半，变换器更深地进入 DCM'
      - '占空比加倍'
    answer: 1
    explain: '$K$ 等于 $2 L f_s$ 除以 $R$，随 $f_s$ 增大：纹波减小，电流的谷值因此离开零。'
