# 09-missions/m3-boost-rhp-zero 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '升压变换器的占空比阶跃增大后，输出电压紧接着会怎样？'
    options:
      - '立即上升'
      - '先短暂下跌，再上升到新值'
      - '保持不变，直到电感饱和'
      - '以开关频率振荡'
    answer: 1
    explain: '在电感电流增大之前，二极管在每个周期中导通的时间变短，因此流入输出的平均电流先减小。这就是右半平面零点的作用。'
  - q: '一个升压变换器，$D$ = 0.5，$R$ = 40 ohm，$L$ = 200 µH。它的 RHP 零点 $(1-D)^2 R / L$ 是多少？'
    options:
      - '50 krad/s'
      - '200 krad/s'
      - '100 krad/s'
      - '12.5 krad/s'
    answer: 0
    explain: '0.25 乘以 40 ohm 得 10 ohm，再除以 200 µH 得 50 000 rad/s，约为 8 kHz。'
  - q: '该升压变换器的负载电流加倍（$R$ 减半）。零点如何变化？'
    options:
      - '加倍'
      - '减半'
      - '保持不变'
      - '移到左半平面'
    answer: 1
    explain: '零点与 $R$ 成正比：负载越重，零点越低，因此满载是最坏情况。'
  - q: '输出经过稳压的升压变换器，在哪个工作点上 RHP 零点最低？'
    options:
      - '最高输入电压下的轻载'
      - '最低输入电压下的满载'
      - '最低输入电压下的轻载'
      - '最高输入电压下的满载'
    answer: 1
    explain: '$R$ 越小（负载越重）、$D$ 越大，零点越低；而稳压的升压变换器在最低输入电压下需要最大的 $D$。'
  - q: '补偿器为什么不能用位于同一位置的极点抵消 RHP 零点？'
    options:
      - '该极点必须位于右半平面，而这是不稳定的'
      - '极点不能置于开关频率以上'
      - '该零点不是实数'
      - '该极点会使环路过慢'
    answer: 0
    explain: '抵消位于 $+\omega_z$ 的零点需要一个位于 $+\omega_z$ 的极点：这是环路中的一个不稳定极点。'
