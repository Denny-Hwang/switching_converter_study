# 09-missions/m4-buck-inductor 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '将允许的磁通密度 $B_\mathrm{max}$ 加倍，其余不变。电感所需的 $K_g$ 如何变化？'
    options:
      - '减半'
      - '降为四分之一'
      - '加倍'
      - '不变'
    answer: 1
    explain: '所需的 $K_g$ 与 $B_\mathrm{max}$ 的平方成反比。'
  - q: '为使铜损减半，将绕组的电阻预算减半。所需的 $K_g$ 如何变化？'
    options:
      - '减半'
      - '加倍'
      - '降为四分之一'
      - '不变'
    answer: 1
    explain: '所需的 $K_g$ 与允许的电阻成反比：电阻越小，需要的铜越多，窗口也越大。'
  - q: '磁性元件设计工具为什么按磁芯的最小截面 $A_\mathrm{min}$ 计算最少匝数？'
    options:
      - '那里的磁通密度最高，磁芯最先在那里饱和'
      - '绕组位于那里'
      - '气隙位于那里'
      - '数据手册不给出其他截面积'
    answer: 0
    explain: '同一磁通穿过每个截面，因此面积最小处磁通密度最高。'
  - q: '算出的最少匝数为 17.2。应绕多少匝？'
    options:
      - '17：匝数少，用铜少'
      - '18：向上取整使磁通密度保持在 $B_\mathrm{max}$ 以下'
      - '17.2，绕一个不完整的匝'
      - '15 到 20 之间的任意匝数'
    answer: 1
    explain: '在同一峰值电流下，匝数越多，磁通密度越低。向下取整会使其超过 $B_\mathrm{max}$。'
  - q: '气隙估算忽略了边缘磁通。与估算值相比，实际得到该电感量的气隙如何？'
    options:
      - '更短'
      - '更长'
      - '相同'
      - '为零'
    answer: 1
    explain: '在气隙周围，磁通扩散到磁芯截面之外，因此实际气隙通过的磁通比估算所假设的多，必须更长。'
  - q: '在纹波较小的 CCM 滤波电感中，磁通摆幅 $B_\mathrm{ac}$ 与峰值磁通密度相比如何？'
    options:
      - '只是其中一小部分'
      - '二者相等'
      - '是其两倍'
      - '为零'
    answer: 0
    explain: '磁通跟随电流变化。只有纹波这一占电流很小部分的分量在摆动，因此磁芯损耗很小，而峰值由直流电流决定。'
