# 09-missions/m5-flyback-clamp 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个 $n$ = 0.5（1:0.5）的反激变换器经压降为 0.5 V 的二极管输出 12 V。其反射电压是多少？'
    options:
      - '6.25 V'
      - '24 V'
      - '25 V'
      - '12.5 V'
    answer: 2
    explain: '一次侧的电压为输出电压加二极管压降，再除以 $n$：12.5 V 除以 0.5 得 25 V。'
  - q: '同一反激变换器由 100 V 供电。没有漏感时，其开关管在关断期间阻断的电压是多少？'
    options:
      - '100 V'
      - '125 V'
      - '75 V'
      - '112 V'
    answer: 1
    explain: '输入电压加反射电压：100 V 加 25 V。'
  - q: '开关管导通期间，其输出二极管阻断的电压又是多少？'
    options:
      - '62 V'
      - '50 V'
      - '12 V'
      - '112 V'
    answer: 0
    explain: '二次侧的电压为输入电压的 $n$ 倍，即 50 V，它与 12 V 的输出串联：62 V。'
  - q: '增大 RCD 钳位电路的电阻。结果如何？'
    options:
      - '钳位电压升高，钳位电路的耗散减小'
      - '钳位电压降低，钳位电路的耗散减小'
      - '钳位电压升高，钳位电路的耗散增大'
      - '没有变化：钳位电压由电容决定'
    answer: 0
    explain: '钳位电压稳定在电阻恰好耗散钳位电路所吸收功率的数值上。电阻越大，所需的电压越高；而钳位电压比反射电压高得越多，吸收的能量就越少。'
  - q: '钳位电压为什么必须高于反射电压？'
    options:
      - '否则开关管永远无法关断'
      - '否则输出二极管每次导通时钳位电路也随之导通，吸走本应送往输出的能量'
      - '否则输出二极管会击穿'
      - '不必如此：任何钳位电压都可以'
    answer: 1
    explain: '输出二极管导通期间，一次侧电压等于反射电压。低于该值的钳位电路会与变压器的输出通路并联导通。'
  - q: '带 RCD 钳位电路的反激变换器失去负载。钳位电压会怎样？'
    options:
      - '保持原值'
      - '降到反射电压'
      - '升到远高于设计值，因为此时电阻必须耗散全部输入功率'
      - '降到零'
    answer: 2
    explain: '空载时，变换器吸取的全部能量最终都进入钳位电路。RCD 钳位电路的电压不断升高，直到其电阻能耗散这些能量，输出电压和开关管电压也随之升高。'
