# 09-missions/m6-lfr-matching 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个 20 V、内阻为 100 ohm 的线性源，所能提供的最大功率是多少？'
    options:
      - '4 W'
      - '1 W'
      - '2 W'
      - '0.2 W'
    answer: 1
    explain: '接入与其内阻相等的负载时：100 ohm 两端为 10 V，电流 0.1 A，功率 1 W。即 $V_\mathrm{oc}^2$ 除以 $4 R_s$。'
  - q: '一个固定占空比的 DCM 反激变换器，$L_M$ = 1 mH，$f_s$ = 50 kHz，$D$ = 0.5。它的输入电阻，即 $2 L_M f_s$ 除以 $D^2$，是多少？'
    options:
      - '100 ohm'
      - '200 ohm'
      - '400 ohm'
      - '800 ohm'
    answer: 2
    explain: '2 乘以 1 mH 再乘以 50 kHz 得 100 ohm，再除以 0.25 得 400 ohm。'
  - q: '该反激变换器的占空比加倍。其输入电阻如何变化？'
    options:
      - '减半'
      - '降为四分之一'
      - '加倍'
      - '不变'
    answer: 1
    explain: '输入电阻与占空比的平方成反比。'
  - q: '反激变换器的输入电阻与源内阻匹配。母线电压是多少？'
    options:
      - '开路电压'
      - '开路电压的一半'
      - '开路电压的两倍'
      - '临界电压'
    answer: 1
    explain: '两个相等的电阻把电源电压对半分压，此时电源输出其最大功率。'
  - q: '电源逐渐增强，直到母线电压将要超过反激变换器的临界电压。结果如何？'
    options:
      - '反激变换器继续表现为电阻'
      - '反激变换器进入 CCM，母线电压被保持在临界电压：它成为恒压负载'
      - '开关管关断'
      - '输入电阻加倍'
    answer: 1
    explain: '在 CCM 下，电压变换比在此占空比下把输入与固定的输出联系起来，因此母线电压停留在临界电压。此时取得的功率比例取决于电源幅值。'
  - q: '为什么无损电阻在任何电源幅值下都取得可用功率的相同比例？'
    options:
      - '因为它是电阻：分压比与幅值无关'
      - '因为占空比跟随幅值变化'
      - '因为开关管电压恒定'
      - '并非如此：该比例随幅值增大'
    answer: 0
    explain: '电阻与源内阻按固定比例分压，因此取得的功率与可用功率都随幅值的平方同步变化。'
