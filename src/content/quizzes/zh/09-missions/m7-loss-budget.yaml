# 09-missions/m7-loss-budget 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '变换器的负载电流减半。固定电阻上的导通损耗如何变化？'
    options:
      - '减半'
      - '降为约四分之一'
      - '不变'
      - '加倍'
    answer: 1
    explain: '导通损耗等于电流有效值的平方乘以电阻：电流减半，损耗降为四分之一（实际略多一些，因为纹波不随负载减小）。'
  - q: '负载降为十分之一时，哪些损耗保持不变？'
    options:
      - '导通损耗'
      - '二极管正向压降损耗'
      - '栅极驱动损耗，以及 CCM 下的容性开通损耗'
      - '没有'
    answer: 2
    explain: '栅极驱动损耗取决于栅极电荷、驱动电压和 $f_s$；容性损耗取决于节点电容、开通时的电压和 $f_s$。二者都不随负载电流变化，因此在轻载时占主导。'
  - q: '栅极电荷为 20 nC，以 250 kHz 驱动到 12 V。栅极驱动损耗是多少？'
    options:
      - '60 mW'
      - '6 mW'
      - '0.24 mW'
      - '600 mW'
    answer: 0
    explain: '20 nC 乘以 12 V 得每周期 240 nJ，再乘以 250 kHz 得 60 mW，耗散在驱动器和栅极电阻中。'
  - q: '开关频率加倍。哪些损耗随之加倍？'
    options:
      - '导通损耗'
      - '栅极驱动损耗和容性开通损耗'
      - '只有磁芯损耗'
      - '全部损耗'
    answer: 1
    explain: '二者都是每个周期损失一次的能量乘以每秒的周期数。磁芯损耗取决于频率和随纹波减小的磁通摆幅，导通损耗则随电流变化。'
  - q: '一个测量系统的带宽为 100 MHz。对于理想阶跃，它显示的上升时间约为多少？'
    options:
      - '35 ns'
      - '3.5 ns'
      - '0.35 ns'
      - '10 ns'
    answer: 1
    explain: '对于单极点响应，上升时间约为 0.35 除以带宽：3.5 ns。比这快得多的边沿，显示出的是系统自身的上升时间。'
  - q: '对于硬开关变换器，由理想开关过渡仿真得到的损耗预算为什么可能过于乐观？'
    options:
      - '它忽略了每次开关过渡期间电压与电流的交叠'
      - '它忽略了导通损耗'
      - '它把栅极驱动损耗计算了两次'
      - '并非如此：仿真总是高估损耗'
    answer: 0
    explain: '开关过渡为瞬时时，开关管在阻断电压期间从不流过电流，因此交叠损耗缺失，必须另行估算或测量。'
