# 09-missions/m8-sense-chain 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '一个 5 mΩ 的分流电阻流过 4 A 电流。它产生的检测电压，即负担电压，是多少？'
    options:
      - '20 mV'
      - '2 mV'
      - '200 mV'
      - '0.8 mV'
    answer: 0
    explain: '由欧姆定律：4 A 乘以 5 mΩ 得 20 mV，被测电路在分流电阻上损失这一电压。'
  - q: '一个失调为 50 µV 的放大器读取该分流电阻。该失调相当于多大的电流？'
    options:
      - '1 mA'
      - '10 mA'
      - '0.25 mA'
      - '100 mA'
    answer: 1
    explain: '失调除以分流电阻：50 µV 除以 5 mΩ 得 10 mA，在任何电流下都相同。'
  - q: '焊盘为该分流电阻增加 0.5 mΩ，而检测点位于焊盘外侧。读数偏高的比例是多少？'
    options:
      - '1 %'
      - '10 %'
      - '5 %'
      - '0.5 %'
    answer: 1
    explain: '放大器看到的是流过分流电阻和焊盘的电流：0.5 除以 5 为十分之一，在任何电流下都如此。'
  - q: '什么能消除焊盘误差？'
    options:
      - '更大的增益'
      - '开尔文连接：检测走线接在分流电阻自身的端子上，避开负载电流的焊盘'
      - '更低的采样率'
      - '更大的滤波电容'
    answer: 1
    explain: '采用四端子分流电阻，或为两端子分流电阻采用四焊盘布局时，焊盘仍流过负载电流，但已不在检测路径中。'
  - q: '将分流电阻增大到十倍，失调等效电流降为十分之一。代价是什么？'
    options:
      - '没有代价'
      - '同一电流下负担电压和耗散功率都变为十倍'
      - '带宽降为十分之一'
      - '失调更大'
    answer: 1
    explain: '检测电压和分流电阻的损耗都随其阻值增大；输出也可能削波，因此必须降低增益。'
  - q: '电流输出型放大器在满电流时的输出为 4.5 V，其电源为 5 V，而输出只能摆动到比电源低约 1 V 处。结果如何？'
    options:
      - '没有影响：输出由增益决定'
      - '输出在达到满电流之前就削波：应降低增益'
      - '失调加倍'
      - '分流电阻过热'
    answer: 1
    explain: '无论增益多大，输出都不能越过其电压余量的限制，因此除非降低增益，否则会失去量程的上端。'
