# 09-missions/m9-write-a-gotcha 测验。数值为合成的练习值。
numbers: synthetic
questions:
  - q: '易错点页面上的数值可以来自哪里？'
    options:
      - '来自发生该错误的项目，经过舍入'
      - '来自用 <Val> 显示的合成示例，或来自同一行上引用的来源'
      - '来自记忆'
      - '来自任意网页'
    answer: 1
    explain: '隐私规则允许附有来源的教材或数据手册数值，以及合成示例的数值；来自真实项目的数值一律不允许，即使经过舍入。'
  - q: '哪一节告诉读者如何确定他们看到的正是这个易错点？'
    options:
      - '现象'
      - '原因'
      - '如何确认'
      - '参考资料'
    answer: 2
    explain: '同一现象可能有多种原因。“如何确认”给出能把这一原因与其他原因区分开的测量或检查。'
  - q: '一个新的参考文献条目仍带有 VERIFY 标记。页面可以引用它吗？'
    options:
      - '可以，只要标题看起来没错'
      - '不可以：在打开 DOI 或 URL 并核对一致、删除该标记之前，refcheck 都会失败'
      - '可以，但只能在韩文页面中'
      - '只能在脚注中'
    answer: 1
    explain: '已发布的页面不得引用未经核实的条目，以免有引用指向无人核对过的内容。'
  - q: '韩文页面尚未编写。本站需要什么？'
    options:
      - '什么都不需要'
      - 'docs/STATUS.md 中将韩文页面标为待完成的一行'
      - '机器翻译'
      - '把英文页面移出 08-gotchas'
    answer: 1
    explain: '只有当 STATUS 将韩文页面标为待完成时，modulelint 才接受没有对应韩文页面的英文页面。'
  - q: '为什么要先描述现象，再描述原因？'
    options:
      - '因为模板按字母顺序排列各节'
      - '因为需要这个页面的读者只知道自己看到了什么，还不知道原因'
      - '因为原因很难写'
      - '无关紧要'
    answer: 1
    explain: '易错点是通过现象找到的。若带着原因来写，它就与后来的人在实验台上看到的情况对不上。'
